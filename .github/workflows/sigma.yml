name: Update sigma
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permission:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run update script
        run: bash ./scripts/update.sh
