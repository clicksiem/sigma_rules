rule: SELECT * FROM logs WHERE (Description ILIKE '%7-Zip%' OR (Image ILIKE '%\\7z.exe' OR Image ILIKE '%\\7zr.exe' OR Image ILIKE '%\\7za.exe') OR (OriginalFileName IN ('7z.exe', '7za.exe'))) AND (CommandLine ILIKE '% -p%' AND CommandLine ILIKE '% x %' AND CommandLine ILIKE '% -o%')
