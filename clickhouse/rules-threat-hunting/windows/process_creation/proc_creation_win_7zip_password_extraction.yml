id: b717b8fd-6467-4d7d-b3d3-27f9a463af77
name: Password Protected Compressed File Extraction Via 7Zip
level: 3
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.collection
- attack.t1560.001
