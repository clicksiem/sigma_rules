id: dec44ca7-61ad-493c-bfd7-8819c5faa09b
name: Arbitrary Command Execution Using WSL
level: 5
size: '>0'
active: true
author:
- oscd.community, Zach Stanford @svch0st, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.stealth
- attack.t1218
- attack.t1202
- detection.threat-hunting
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\wsl.exe' OR OriginalFileName='wsl.exe') AND (CommandLine ILIKE '% -e %' OR CommandLine ILIKE '% --exec%' OR CommandLine ILIKE '% --system%' OR CommandLine ILIKE '% --shell-type %' OR CommandLine ILIKE '% /mnt/c%' OR CommandLine ILIKE '% --user root%' OR CommandLine ILIKE '% -u root%' OR CommandLine ILIKE '%--debug-shell%')) AND (NOT (ParentImage ILIKE '%\\cmd.exe' AND (CommandLine ILIKE '% -d %' AND CommandLine ILIKE '% -e kill %')))
