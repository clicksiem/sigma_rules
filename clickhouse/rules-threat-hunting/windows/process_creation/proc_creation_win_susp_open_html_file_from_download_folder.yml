id: 538c5851-8c03-4724-8ec4-623bc7aadaea
name: HTML File Opened From Download Folder
level: 3
size: '>0'
active: true
author:
- Joseph Kamau
group: windows
tags:
- attack.t1598.002
- attack.t1566.001
- attack.initial-access
- attack.reconnaissance
- detection.threat-hunting
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\brave.exe' OR Image ILIKE '%\\chrome.exe' OR Image ILIKE '%\\firefox.exe' OR Image ILIKE '%\\msedge.exe' OR Image ILIKE '%\\opera.exe' OR Image ILIKE '%\\vivaldi.exe') AND (CommandLine ILIKE '%:\\users\\%' AND CommandLine ILIKE '%\\Downloads\\%' AND CommandLine ILIKE '%.htm%')
