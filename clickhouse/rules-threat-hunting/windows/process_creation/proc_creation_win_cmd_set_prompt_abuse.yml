id: 65e4c134-ee52-4099-9e35-5e17a4b45c62
name: Potential File Override/Append Via SET Command
level: 3
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems), MahirAli Khan (in/mahiralikhan)
group: windows
tags:
- attack.execution
- detection.threat-hunting
- attack.stealth
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\cmd.exe' OR OriginalFileName='Cmd.Exe') AND (CommandLine ILIKE '%/c set /p=%' OR CommandLine ILIKE '%"set /p=%' OR CommandLine ILIKE '%>>%set /p=%')
