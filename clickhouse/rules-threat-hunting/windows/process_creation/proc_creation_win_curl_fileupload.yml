id: 00bca14a-df4e-4649-9054-3f2aa676bc04
name: Potential Data Exfiltration Via Curl.EXE
level: 5
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), Cedric MAURUGEON (Update)
group: windows
tags:
- attack.exfiltration
- attack.command-and-control
- attack.t1567
- attack.t1105
- detection.threat-hunting
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\curl.exe' OR Product='The curl executable') AND ((CommandLine ILIKE '% --form%' OR CommandLine ILIKE '% --upload-file %' OR CommandLine ILIKE '% --data %' OR CommandLine ILIKE '% --data-%') OR match(CommandLine, '\s-[FTd]\s'))) AND (NOT (CommandLine ILIKE '%://localhost%' OR CommandLine ILIKE '%://127.0.0.1%'))
