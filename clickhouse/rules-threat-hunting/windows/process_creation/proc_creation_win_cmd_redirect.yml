id: 4f4eaa9f-5ad4-410c-a4be-bc6132b0175a
name: CMD Shell Output Redirect
level: 3
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.discovery
- attack.t1082
- detection.threat-hunting
rule: SELECT * FROM logs WHERE ((OriginalFileName='Cmd.Exe' OR Image ILIKE '%\\cmd.exe') AND CommandLine ILIKE '%>%') AND (NOT (CommandLine ILIKE '%C:\\Program Files (x86)\\Internet Download Manager\\IDMMsgHost.exe%' OR CommandLine ILIKE '%chrome-extension://%' OR CommandLine ILIKE '%\\.\\pipe\\chrome.nativeMessaging%'))
