rule: SELECT * FROM logs WHERE DestinationHostname ILIKE '%azurefd.net%' AND (NOT ((Image ILIKE '%brave.exe' OR Image ILIKE '%chrome.exe' OR Image ILIKE '%chromium.exe' OR Image ILIKE '%firefox.exe' OR Image ILIKE '%msedge.exe' OR Image ILIKE '%msedgewebview2.exe' OR Image ILIKE '%opera.exe' OR Image ILIKE '%vivaldi.exe') OR Image ILIKE '%searchapp.exe' OR (DestinationHostname ILIKE '%afdxtest.z01.azurefd.net%' OR DestinationHostname ILIKE '%fp-afd.azurefd.net%' OR DestinationHostname ILIKE '%fp-afdx-bpdee4gtg6frejfd.z01.azurefd.net%' OR DestinationHostname ILIKE '%roxy.azurefd.net%' OR DestinationHostname ILIKE '%powershellinfraartifacts-gkhedzdeaghdezhr.z01.azurefd.net%' OR DestinationHostname ILIKE '%storage-explorer-publishing-feapcgfgbzc2cjek.b01.azurefd.net%' OR DestinationHostname ILIKE '%graph.azurefd.net%')))
