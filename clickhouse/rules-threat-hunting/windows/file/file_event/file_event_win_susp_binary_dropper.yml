id: 297afac9-5d02-4138-8c58-b977bac60556
name: Creation of an Executable by an Executable
level: 3
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.resource-development
- attack.t1587.001
- detection.threat-hunting
rule: SELECT * FROM logs WHERE (Image ILIKE '%.exe' AND TargetFilename ILIKE '%.exe') AND (NOT ((Image ILIKE '%:\\Windows\\System32\\msiexec.exe' OR Image ILIKE '%:\\Windows\\system32\\cleanmgr.exe' OR Image ILIKE '%:\\Windows\\explorer.exe' OR Image ILIKE '%:\\WINDOWS\\system32\\dxgiadaptercache.exe' OR Image ILIKE '%:\\WINDOWS\\system32\\Dism.exe' OR Image ILIKE '%:\\Windows\\System32\\wuauclt.exe') OR (Image ILIKE '%:\\WINDOWS\\system32\\svchost.exe' AND TargetFilename ILIKE '%:\\Windows\\SoftwareDistribution\\Download\\%') OR (Image ILIKE '%:\\Windows\\system32\\svchost.exe' AND (TargetFilename ILIKE '%:\\WUDownloadCache\\%' AND TargetFilename ILIKE '%\\WindowsUpdateBox.exe%')) OR (Image ILIKE '%:\\WINDOWS\\SoftwareDistribution\\Download\\%' AND Image ILIKE '%\\WindowsUpdateBox.Exe' AND TargetFilename ILIKE '%:\\$WINDOWS.~BT\\Sources\\%') OR (Image ILIKE '%:\\Windows\\WinSxS\\%' AND Image ILIKE '%\\TiWorker.exe') OR ((Image ILIKE '%:\\Program Files\\%' OR Image ILIKE '%:\\Program Files (x86)\\%') OR (TargetFilename ILIKE '%:\\Program Files\\%' OR TargetFilename ILIKE '%:\\Program Files (x86)\\%')) OR (Image ILIKE '%:\\ProgramData\\Microsoft\\Windows Defender\\%' OR Image ILIKE '%:\\Program Files\\Windows Defender\\%') OR TargetFilename ILIKE '%\\AppData\\Local\\Microsoft\\WindowsApps\\%' OR (Image ILIKE '%\\AppData\\Local\\Microsoft\\Teams\\Update.exe' AND (TargetFilename ILIKE '%\\AppData\\Local\\Microsoft\\Teams\\stage\\Teams.exe' OR TargetFilename ILIKE '%\\AppData\\Local\\Microsoft\\Teams\\stage\\Squirrel.exe' OR TargetFilename ILIKE '%\\AppData\\Local\\Microsoft\\SquirrelTemp\\tempb\\')) OR ((Image ILIKE '%:\\Windows\\Microsoft.NET\\Framework\\%' OR Image ILIKE '%:\\Windows\\Microsoft.NET\\Framework64\\%' OR Image ILIKE '%:\\Windows\\Microsoft.NET\\FrameworkArm\\%' OR Image ILIKE '%:\\Windows\\Microsoft.NET\\FrameworkArm64\\%') AND Image ILIKE '%\\mscorsvw.exe' AND TargetFilename ILIKE '%:\\Windows\\assembly\\NativeImages\_%') OR (Image ILIKE '%\\AppData\\Local\\%' AND Image ILIKE '%\\Microsoft VS Code\\Code.exe' AND TargetFilename ILIKE '%\\.vscode\\extensions\\%') OR (Image ILIKE '%\\AppData\\Local\\GitHubDesktop\\Update.exe' AND TargetFilename ILIKE '%\\AppData\\Local\\SquirrelTemp\\%') OR (Image ILIKE '%:\\WINDOWS\\TEMP\\%' OR TargetFilename ILIKE '%:\\WINDOWS\\TEMP\\%') OR (Image ILIKE '%\\AppData\\Local\\Temp\\%' OR TargetFilename ILIKE '%\\AppData\\Local\\Temp\\%') OR (Image ILIKE '%:\\Windows\\Microsoft.NET\\Framework%' AND Image ILIKE '%\\mscorsvw.exe' AND TargetFilename ILIKE '%:\\Windows\\assembly%'))) AND (NOT ((Image ILIKE '%\\Python27\\python.exe%' AND (TargetFilename ILIKE '%\\Python27\\Lib\\site-packages\\%' OR TargetFilename ILIKE '%\\Python27\\Scripts\\%' OR TargetFilename ILIKE '%\\AppData\\Local\\Temp\\%')) OR (Image ILIKE '%\\AppData\\Local\\SquirrelTemp\\Update.exe%' AND TargetFilename ILIKE '%\\AppData\\Local%') OR (Image ILIKE '%\\ChromeSetup.exe' AND TargetFilename ILIKE '%\\Google%')))
