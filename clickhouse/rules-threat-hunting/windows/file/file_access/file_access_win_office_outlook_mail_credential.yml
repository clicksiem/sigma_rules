id: fc3e237f-2fef-406c-b90d-b3ae7e02fa8f
name: Access To Windows Outlook Mail Files By Uncommon Applications
level: 3
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.stealth
- attack.t1070.008
- detection.threat-hunting
rule: SELECT * FROM logs WHERE (FileName ILIKE '%\\AppData\\Local\\Comms\\Unistore\\data%' OR FileName ILIKE '%\\AppData\\Local\\Comms\\UnistoreDB\\store.vol') AND (NOT (Image='System' OR (Image ILIKE 'C:\\Program Files (x86)\\%' OR Image ILIKE 'C:\\Program Files\\%' OR Image ILIKE 'C:\\Windows\\system32\\%' OR Image ILIKE 'C:\\Windows\\SysWOW64\\%'))) AND (NOT ((Image ILIKE 'C:\\ProgramData\\Microsoft\\Windows Defender\\%' AND (Image ILIKE '%\\MpCopyAccelerator.exe' OR Image ILIKE '%\\MsMpEng.exe')) OR (Image ILIKE '%\\thor64.exe' OR Image ILIKE '%\\thor.exe')))
