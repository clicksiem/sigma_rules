id: 91cb43db-302a-47e3-b3c8-7ede481e27bf
name: Access To Browser Credential Files By Uncommon Applications
level: 3
size: '>0'
active: true
author:
- frack113, X__Junior (Nextron Systems)
group: windows
tags:
- attack.t1003
- attack.credential-access
- detection.threat-hunting
rule: SELECT * FROM logs WHERE (FileName ILIKE '%\\Appdata\\Local\\Microsoft\\Windows\\WebCache\\WebCacheV01.dat' OR (FileName ILIKE '%\\cookies.sqlite' OR FileName ILIKE '%\\places.sqlite' OR FileName ILIKE '%release\\key3.db' OR FileName ILIKE '%release\\key4.db' OR FileName ILIKE '%release\\logins.json') OR (FileName ILIKE '%\\User Data\\Default\\Login Data%' OR FileName ILIKE '%\\User Data\\Local State%')) AND (NOT (Image='System' OR (Image ILIKE 'C:\\Program Files (x86)\\%' OR Image ILIKE 'C:\\Program Files\\%' OR Image ILIKE 'C:\\Windows\\system32\\%' OR Image ILIKE 'C:\\Windows\\SysWOW64\\%'))) AND (NOT ((Image ILIKE 'C:\\ProgramData\\Microsoft\\Windows Defender\\%' AND (Image ILIKE '%\\MpCopyAccelerator.exe' OR Image ILIKE '%\\MsMpEng.exe')) OR (Image ILIKE '%\\thor.exe' OR Image ILIKE '%\\thor64.exe')))
