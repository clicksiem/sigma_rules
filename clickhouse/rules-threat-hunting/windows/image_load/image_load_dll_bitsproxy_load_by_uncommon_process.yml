id: e700ff14-1bff-4d1d-9438-738dff5f0466
name: BITS Client BitsProxy DLL Loaded By Uncommon Process
level: 3
size: '>0'
active: true
author:
- UnicornOfHunt
group: windows
tags:
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1197
