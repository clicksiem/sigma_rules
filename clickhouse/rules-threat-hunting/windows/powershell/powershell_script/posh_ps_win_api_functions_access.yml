rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%Advapi32.dll%' OR ScriptBlockText ILIKE '%kernel32.dll%' OR ScriptBlockText ILIKE '%KernelBase.dll%' OR ScriptBlockText ILIKE '%ntdll.dll%' OR ScriptBlockText ILIKE '%secur32.dll%' OR ScriptBlockText ILIKE '%user32.dll%'
