id: b8af5f36-1361-4ebe-9e76-e36128d947bf
name: Use Of Remove-Item to Delete File - ScriptBlock
level: 3
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.stealth
- attack.t1070.004
- detection.threat-hunting
rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%Remove-Item -Path %' OR ScriptBlockText ILIKE '%del -Path %' OR ScriptBlockText ILIKE '%erase -Path %' OR ScriptBlockText ILIKE '%rd -Path %' OR ScriptBlockText ILIKE '%ri -Path %' OR ScriptBlockText ILIKE '%rm -Path %' OR ScriptBlockText ILIKE '%rmdir -Path %'
