rule: SELECT * FROM logs WHERE EventID=4699 AND (NOT (TaskName ILIKE '\\Microsoft\\Windows\\RemovalTools\\MRT\_ERROR\_HB' OR TaskName ILIKE '%\\Mozilla\\Firefox Default Browser Agent %'))
