id: 4b60e527-ec73-4b47-8cb3-f02ad927ca65
name: Access To Browser Credential Files By Uncommon Applications - Security
level: 3
size: '>0'
active: true
author:
- Daniel Koifman (@Koifsec), Nasreddine Bencherchali
group: windows
tags:
- attack.credential-access
- attack.t1555.003
- detection.threat-hunting
rule: SELECT * FROM logs WHERE (EventID=4663 AND ObjectType='File' AND AccessMask='0x1') AND ((ObjectName ILIKE '%\\User Data\\Default\\Login Data%' OR ObjectName ILIKE '%\\User Data\\Local State%' OR ObjectName ILIKE '%\\User Data\\Default\\Network\\Cookies%') OR (FileName ILIKE '%\\cookies.sqlite' OR FileName ILIKE '%\\places.sqlite' OR FileName ILIKE '%release\\key3.db' OR FileName ILIKE '%release\\key4.db' OR FileName ILIKE '%release\\logins.json')) AND (NOT (ProcessName='System' OR (ProcessName ILIKE 'C:\\Program Files (x86)\\%' OR ProcessName ILIKE 'C:\\Program Files\\%' OR ProcessName ILIKE 'C:\\Windows\\system32\\%' OR ProcessName ILIKE 'C:\\Windows\\SysWOW64\\%'))) AND (NOT (ProcessName ILIKE 'C:\\ProgramData\\Microsoft\\Windows Defender\\%' AND (ProcessName ILIKE '%\\MpCopyAccelerator.exe' OR ProcessName ILIKE '%\\MsMpEng.exe')))
