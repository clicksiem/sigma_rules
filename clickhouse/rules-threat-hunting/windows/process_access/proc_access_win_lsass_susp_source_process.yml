id: fa34b441-961a-42fa-a100-ecc28c886725
name: LSASS Access From Program In Potentially Suspicious Folder
level: 5
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.credential-access
- attack.t1003.001
- attack.s0002
- detection.threat-hunting
rule: SELECT * FROM logs WHERE (TargetImage ILIKE '%\\lsass.exe' AND (GrantedAccess ILIKE '%10' OR GrantedAccess ILIKE '%30' OR GrantedAccess ILIKE '%50' OR GrantedAccess ILIKE '%70' OR GrantedAccess ILIKE '%90' OR GrantedAccess ILIKE '%B0' OR GrantedAccess ILIKE '%D0' OR GrantedAccess ILIKE '%F0' OR GrantedAccess ILIKE '%18' OR GrantedAccess ILIKE '%38' OR GrantedAccess ILIKE '%58' OR GrantedAccess ILIKE '%78' OR GrantedAccess ILIKE '%98' OR GrantedAccess ILIKE '%B8' OR GrantedAccess ILIKE '%D8' OR GrantedAccess ILIKE '%F8' OR GrantedAccess ILIKE '%1A' OR GrantedAccess ILIKE '%3A' OR GrantedAccess ILIKE '%5A' OR GrantedAccess ILIKE '%7A' OR GrantedAccess ILIKE '%9A' OR GrantedAccess ILIKE '%BA' OR GrantedAccess ILIKE '%DA' OR GrantedAccess ILIKE '%FA' OR GrantedAccess ILIKE '%0x14C2' OR GrantedAccess ILIKE '%FF') AND (SourceImage ILIKE '%\\Temp\\%' OR SourceImage ILIKE '%\\Users\\Public\\%' OR SourceImage ILIKE '%\\PerfLogs\\%' OR SourceImage ILIKE '%\\AppData\\%' OR SourceImage ILIKE '%\\Temporary%')) AND (NOT (((SourceImage ILIKE '%:\\Users\\%' AND SourceImage ILIKE '%\\AppData\\Local\\%') AND (SourceImage ILIKE '%\\Microsoft VS Code\\Code.exe' OR SourceImage ILIKE '%\\software\_reporter\_tool.exe' OR SourceImage ILIKE '%\\DropboxUpdate.exe' OR SourceImage ILIKE '%\\MBAMInstallerService.exe' OR SourceImage ILIKE '%\\WebexMTA.exe' OR SourceImage ILIKE '%\\Meetings\\WebexMTAV2.exe' OR SourceImage ILIKE '%\\WebEx\\WebexHost.exe' OR SourceImage ILIKE '%\\JetBrains\\Toolbox\\bin\\jetbrains-toolbox.exe') AND GrantedAccess='0x410') OR (SourceImage ILIKE '%:\\Windows\\Temp\\%' AND SourceImage ILIKE '%.tmp\\DropboxUpdate.exe' AND (GrantedAccess IN ('0x410', '0x1410'))) OR ((SourceImage ILIKE '%:\\Users\\%' AND SourceImage ILIKE '%\\AppData\\Local\\Temp\\%') AND SourceImage ILIKE '%.tmp\\DropboxUpdate.exe' AND GrantedAccess='0x1410') OR ((SourceImage ILIKE '%:\\Program Files (x86)\\Dropbox\\%' OR SourceImage ILIKE '%:\\Program Files\\Dropbox\\%') AND SourceImage ILIKE '%\\DropboxUpdate.exe' AND GrantedAccess='0x1410') OR ((SourceImage ILIKE '%:\\Windows\\Temp\\asgard2-agent\\%' OR SourceImage ILIKE '%:\\Windows\\Temp\\asgard2-agent-sc\\%') AND (SourceImage ILIKE '%\\thor64.exe' OR SourceImage ILIKE '%\\thor.exe' OR SourceImage ILIKE '%\\aurora-agent-64.exe' OR SourceImage ILIKE '%\\aurora-agent.exe') AND (GrantedAccess IN ('0x1fffff', '0x1010', '0x101010'))) OR ((SourceImage ILIKE '%:\\Users\\%' AND SourceImage ILIKE '%\\AppData\\Local\\Temp\\%' AND SourceImage ILIKE '%\\vs\_bootstrapper\_%') AND GrantedAccess='0x1410') OR (SourceImage ILIKE '%:\\Program Files (x86)\\Google\\Temp\\%' AND SourceImage ILIKE '%.tmp\\GoogleUpdate.exe' AND (GrantedAccess IN ('0x410', '0x1410'))) OR (SourceImage ILIKE '%:\\Users\\%' AND SourceImage ILIKE '%\\AppData\\Local\\Keybase\\keybase.exe' AND GrantedAccess='0x1fffff') OR (SourceImage ILIKE '%\\AppData\\Local\\Temp\\is-%' AND SourceImage ILIKE '%.tmp\\avira\_system\_speedup.tmp' AND GrantedAccess='0x1410') OR (SourceImage ILIKE '%\\AppData\\Roaming\\ViberPC\\%' AND SourceImage ILIKE '%\\updater.exe' AND TargetImage ILIKE '%\\winlogon.exe' AND GrantedAccess='0x1fffff') OR ((SourceImage ILIKE '%:\\Program Files\\Common Files\\Adobe\\ARM\\%' OR SourceImage ILIKE '%:\\Program Files (x86)\\Common Files\\Adobe\\ARM\\%') AND SourceImage ILIKE '%\\AdobeARMHelper.exe' AND GrantedAccess='0x1410')))
