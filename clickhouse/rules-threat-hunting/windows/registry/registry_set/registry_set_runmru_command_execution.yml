id: f9d091f6-f1c7-4873-a24f-050b4a02b4dd
name: Command Executed Via Run Dialog Box - Registry
level: 3
size: '>0'
active: true
author:
- Ahmed Farouk, Nasreddine Bencherchali
group: windows
tags:
- detection.threat-hunting
- attack.execution
rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RunMRU%' AND (NOT TargetObject ILIKE '%\\MRUList') AND (NOT (Details ILIKE '%ping%' OR (Details IN ('\%appdata\%\\1', '\%localappdata\%\\1', '\%public\%\\1', '\%temp\%\\1', 'calc\\1', 'dxdiag\\1', 'explorer\\1', 'gpedit.msc\\1', 'mmc\\1', 'notepad\\1', 'regedit\\1', 'services.msc\\1', 'winver\\1'))))
