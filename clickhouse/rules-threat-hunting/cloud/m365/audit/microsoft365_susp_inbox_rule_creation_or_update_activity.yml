id: d3577be1-42c9-44a7-b56e-2e8de97349d3
name: Inbox Rules Creation Or Update Activity in O365
level: 5
size: '>0'
active: true
author:
- Marco Pedrinazzi (@pedrinazziM) (InTheCyber)
group: m365
tags:
- attack.stealth
- attack.t1564.008
- attack.exfiltration
- attack.collection
- attack.t1114.003
- detection.threat-hunting
rule: SELECT * FROM logs WHERE (Operation IN ('New-InboxRule', 'Set-InboxRule')) AND (Parameters ILIKE '%DeleteMessage%' OR Parameters ILIKE '%MarkAsRead%' OR Parameters ILIKE '%MoveToFolder%' OR Parameters ILIKE '%SubjectOrBodyContainsWords%')
