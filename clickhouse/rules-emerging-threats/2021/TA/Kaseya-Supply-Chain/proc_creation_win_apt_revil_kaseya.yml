rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%C:\\Windows\\cert.exe%' OR CommandLine ILIKE '%del /q /f c:\\kworking\\agent.crt%' OR CommandLine ILIKE '%Kaseya VSA Agent Hot-fix%' OR CommandLine ILIKE '%\\AppData\\Local\\Temp\\MsMpEng.exe%' OR CommandLine ILIKE '%rmdir /s /q \%SystemDrive\%\\inetpub\\logs%' OR CommandLine ILIKE '%del /s /q /f \%SystemDrive\%\\%.log%' OR CommandLine ILIKE '%c:\\kworking1\\agent.exe%' OR CommandLine ILIKE '%c:\\kworking1\\agent.crt%') OR (Image IN ('C:\\Windows\\MsMpEng.exe', 'C:\\Windows\\cert.exe', 'C:\\kworking\\agent.exe', 'C:\\kworking1\\agent.exe')) OR (CommandLine ILIKE '%del /s /q /f%' AND CommandLine ILIKE '%WebPages\\Errors\\webErrorLog.txt%')
