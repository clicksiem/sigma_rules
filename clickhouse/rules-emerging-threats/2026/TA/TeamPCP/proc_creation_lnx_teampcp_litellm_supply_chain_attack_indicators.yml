rule: 'SELECT * FROM logs WHERE (Image ILIKE ''%/python3%'' AND (CommandLine ILIKE ''%exec(base64.b64decode(''''aW1wb3J0%'' AND CommandLine ILIKE ''%kI2NF9TQ1JJUFQgPSAiYV%'')) OR (Image ILIKE ''%/tar'' AND (CommandLine ILIKE ''%tpcp.tar.gz%'' AND CommandLine ILIKE ''%payload.enc%'' AND CommandLine ILIKE ''%session.key.enc%'')) OR (Image ILIKE ''%/curl'' AND (CommandLine ILIKE ''%models.litellm.cloud%'' AND CommandLine ILIKE ''%X-Filename: tpcp.tar.gz%'')) OR (ParentImage ILIKE ''%/python3%'' AND (CommandLine ILIKE ''%systemctl%'' AND CommandLine ILIKE ''%--user%'' AND CommandLine ILIKE ''%sysmon%''))'
