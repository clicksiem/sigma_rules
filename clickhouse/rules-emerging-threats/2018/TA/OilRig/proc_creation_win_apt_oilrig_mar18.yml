rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%SC Scheduled Scan%' AND CommandLine ILIKE '%\\microsoft\\Taskbar\\autoit3.exe%') OR (Image ILIKE '%\\Windows\\Temp\\DB\\%' AND Image ILIKE '%.exe') OR (Image ILIKE 'C:\\Windows\\system32\\Service.exe' AND (CommandLine ILIKE '%i%' OR CommandLine ILIKE '%u%')) OR (ParentImage ILIKE '%\\local\\microsoft\\Taskbar\\autoit3.exe' AND (CommandLine ILIKE '%nslookup.exe%' AND CommandLine ILIKE '%-q=TXT%'))
