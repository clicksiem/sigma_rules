rule: 'SELECT * FROM logs WHERE ((Image ILIKE ''%\\rundll32.exe'' AND (CommandLine ILIKE ''%\%LOCALAPPDATA\%%'' OR CommandLine ILIKE ''%\\AppData\\Local\\%'')) AND (CommandLine ILIKE ''%.dat",%'' OR (CommandLine ILIKE ''%.dll #1'' OR CommandLine ILIKE ''%.dll" #1'' OR CommandLine ILIKE ''%.dll",#1''))) AND (NOT CommandLine ILIKE ''%\\AppData\\Local\\Temp\\%'')'
