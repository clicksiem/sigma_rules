id: 91048c0d-5b81-4b85-a099-c9ee4fb87979
name: Mint Sandstorm - AsperaFaspex Suspicious Process Execution
level: 10
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems), MSTIC (idea)
group: windows
tags:
- attack.execution
- detection.emerging-threats
rule: SELECT * FROM logs WHERE (ParentImage ILIKE '%aspera%' AND ParentImage ILIKE '%\\ruby%') AND (((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\powershell\_ise.exe') AND ((CommandLine ILIKE '% echo %' OR CommandLine ILIKE '%-dumpmode%' OR CommandLine ILIKE '%-ssh%' OR CommandLine ILIKE '%.dmp%' OR CommandLine ILIKE '%add-MpPreference%' OR CommandLine ILIKE '%adscredentials%' OR CommandLine ILIKE '%bitsadmin%' OR CommandLine ILIKE '%certutil%' OR CommandLine ILIKE '%csvhost.exe%' OR CommandLine ILIKE '%DownloadFile%' OR CommandLine ILIKE '%DownloadString%' OR CommandLine ILIKE '%dsquery%' OR CommandLine ILIKE '%ekern.exe%' OR CommandLine ILIKE '%FromBase64String%' OR CommandLine ILIKE '%iex %' OR CommandLine ILIKE '%iex(%' OR CommandLine ILIKE '%Invoke-Expression%' OR CommandLine ILIKE '%Invoke-WebRequest%' OR CommandLine ILIKE '%localgroup administrators%' OR CommandLine ILIKE '%o365accountconfiguration%' OR CommandLine ILIKE '%samaccountname=%' OR CommandLine ILIKE '%set-MpPreference%' OR CommandLine ILIKE '%svhost.exe%' OR CommandLine ILIKE '%System.IO.Compression%' OR CommandLine ILIKE '%System.IO.MemoryStream%' OR CommandLine ILIKE '%usoprivate%' OR CommandLine ILIKE '%usoshared%' OR CommandLine ILIKE '%whoami%') OR (match(CommandLine, '[-/–][Ee^]{1,2}[ncodema^]*\s[A-Za-z0-9+/=]{15,}') OR match(CommandLine, 'net\s+user') OR match(CommandLine, 'net\s+group') OR match(CommandLine, 'query\s+session')))) OR (CommandLine ILIKE '%lsass%' AND (CommandLine ILIKE '%procdump%' OR CommandLine ILIKE '%tasklist%' OR CommandLine ILIKE '%findstr%')) OR ((Image ILIKE '%\\wget.exe' AND CommandLine ILIKE '%http%') OR (Image ILIKE '%\\curl.exe' AND CommandLine ILIKE '%http%') OR (CommandLine ILIKE '%E:jscript%' OR CommandLine ILIKE '%e:vbscript%') OR (CommandLine ILIKE '%localgroup Administrators%' AND CommandLine ILIKE '%/add%') OR (CommandLine ILIKE '%net%' AND (CommandLine ILIKE '%user%' AND CommandLine ILIKE '%/add%')) OR ((CommandLine ILIKE '%reg add%' AND CommandLine ILIKE '%DisableAntiSpyware%' AND CommandLine ILIKE '%\\Microsoft\\Windows Defender%') OR (CommandLine ILIKE '%reg add%' AND CommandLine ILIKE '%DisableRestrictedAdmin%' AND CommandLine ILIKE '%CurrentControlSet\\Control\\Lsa%')) OR (CommandLine ILIKE '%wmic%' AND CommandLine ILIKE '%process call create%') OR (CommandLine ILIKE '%wmic%' AND CommandLine ILIKE '%delete%' AND CommandLine ILIKE '%shadowcopy%') OR (CommandLine ILIKE '%vssadmin%' AND CommandLine ILIKE '%delete%' AND CommandLine ILIKE '%shadows%') OR (CommandLine ILIKE '%wbadmin%' AND CommandLine ILIKE '%delete%' AND CommandLine ILIKE '%catalog%')))
