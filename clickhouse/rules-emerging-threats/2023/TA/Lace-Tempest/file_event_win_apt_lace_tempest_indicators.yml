rule: SELECT * FROM logs WHERE (TargetFilename ILIKE '%:\\Program Files\\SysAidServer\\tomcat\\webapps\\usersfiles\\user.exe' OR TargetFilename ILIKE '%:\\Program Files\\SysAidServer\\tomcat\\webapps\\usersfiles.war' OR TargetFilename ILIKE '%:\\Program Files\\SysAidServer\\tomcat\\webapps\\leave') OR TargetFilename ILIKE '%:\\Program Files\\SysAidServer\\tomcat\\webapps\\user.%'
