rule: SELECT * FROM logs WHERE (Image ILIKE '%:\\ProgramData\\adobe\\Adobe.exe' OR Image ILIKE '%:\\ProgramData\\oracle\\local.exe' OR Image ILIKE '%\\revshell.exe' OR Image ILIKE '%\\infopagesbackup\\ncat.exe' OR Image ILIKE '%:\\ProgramData\\comms\\comms.exe') OR (CommandLine ILIKE '%-ExecutionPolicy Bypass -File%' AND CommandLine ILIKE '%\\msf.ps1%') OR (CommandLine ILIKE '%infopagesbackup%' AND CommandLine ILIKE '%\\ncat%' AND CommandLine ILIKE '%-e cmd.exe%') OR (CommandLine ILIKE '%system.Data.SqlClient.SqlDataAdapter($cmd); [void]$da.fill%' OR CommandLine ILIKE '%-nop -w hidden -c $k=new-object%' OR CommandLine ILIKE '%[Net.CredentialCache]::DefaultCredentials;IEX %' OR CommandLine ILIKE '% -nop -w hidden -c $m=new-object net.webclient;$m%' OR CommandLine ILIKE '%-noninteractive -executionpolicy bypass whoami%' OR CommandLine ILIKE '%-noninteractive -executionpolicy bypass netstat -a%') OR CommandLine ILIKE '%L3NlcnZlcj1%'
