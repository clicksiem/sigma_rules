id: 9be34ad0-b6a7-4fbd-91cf-fc7ec1047f5f
name: UNC2452 Process Creation Patterns
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.t1059.001
- detection.emerging-threats
rule: SELECT * FROM logs WHERE ((CommandLine ILIKE '%7z.exe a -v500m -mx9 -r0 -p%' OR CommandLine ILIKE '%7z.exe a -mx9 -r0 -p%') AND (CommandLine ILIKE '%.zip%' AND CommandLine ILIKE '%.txt%')) OR ((CommandLine ILIKE '%7z.exe a -v500m -mx9 -r0 -p%' OR CommandLine ILIKE '%7z.exe a -mx9 -r0 -p%') AND (CommandLine ILIKE '%.zip%' AND CommandLine ILIKE '%.log%')) OR ((ParentCommandLine ILIKE '%wscript.exe%' AND ParentCommandLine ILIKE '%.vbs%') AND (CommandLine ILIKE '%rundll32.exe%' AND CommandLine ILIKE '%C:\\Windows%' AND CommandLine ILIKE '%.dll,Tk\_%')) OR (ParentImage ILIKE '%\\rundll32.exe' AND (ParentCommandLine ILIKE '%C:\\Windows%' AND ParentCommandLine ILIKE '%.dll%') AND CommandLine ILIKE '%cmd.exe /C %') OR (ParentImage ILIKE '%\\rundll32.exe' AND Image ILIKE '%\\dllhost.exe' AND CommandLine='')
