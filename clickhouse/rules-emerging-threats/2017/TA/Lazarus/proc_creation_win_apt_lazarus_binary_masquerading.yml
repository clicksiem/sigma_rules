rule: SELECT * FROM logs WHERE (Image ILIKE '%\\msdtc.exe' OR Image ILIKE '%\\gpsvc.exe') AND (NOT (Image ILIKE 'C:\\Windows\\System32\\%' OR Image ILIKE 'C:\\Windows\\SysWOW64\\%'))
