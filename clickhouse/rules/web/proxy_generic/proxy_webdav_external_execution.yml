id: 1ae64f96-72b6-48b3-ad3d-e71dff6c6398
name: Suspicious External WebDAV Execution
level: 8
size: '>0'
active: true
author:
- Ahmed Farouk
group: ''
tags:
- attack.initial-access
- attack.resource-development
- attack.t1584
- attack.t1566
rule: SELECT * FROM logs WHERE ((`c-useragent` ILIKE 'Microsoft-WebDAV-MiniRedir/%' AND `cs-method`='GET') AND (`c-uri` ILIKE '%.7z' OR `c-uri` ILIKE '%.bat' OR `c-uri` ILIKE '%.dat' OR `c-uri` ILIKE '%.cmd' OR `c-uri` ILIKE '%.exe' OR `c-uri` ILIKE '%.js' OR `c-uri` ILIKE '%.lnk' OR `c-uri` ILIKE '%.ps1' OR `c-uri` ILIKE '%.rar' OR `c-uri` ILIKE '%.url' OR `c-uri` ILIKE '%.vbe' OR `c-uri` ILIKE '%.vbs' OR `c-uri` ILIKE '%.zip')) AND (NOT (isIPAddressInRange(dst_ip, '127.0.0.0/8') OR isIPAddressInRange(dst_ip, '10.0.0.0/8') OR isIPAddressInRange(dst_ip, '172.16.0.0/12') OR isIPAddressInRange(dst_ip, '192.168.0.0/16') OR isIPAddressInRange(dst_ip, '169.254.0.0/16') OR isIPAddressInRange(dst_ip, '::1/128') OR isIPAddressInRange(dst_ip, 'fe80::/10') OR isIPAddressInRange(dst_ip, 'fc00::/7')))
