rule: SELECT * FROM logs WHERE `c-uri` ILIKE '%.paste.ee/r/%' OR `c-uri` ILIKE '%.pastebin.com/raw/%' OR `c-uri` ILIKE '%.hastebin.com/raw/%' OR `c-uri` ILIKE '%.ghostbin.co/paste/%/raw/%' OR `c-uri` ILIKE '%pastetext.net/%' OR `c-uri` ILIKE '%pastebin.pl/%' OR `c-uri` ILIKE '%paste.ee/%'
