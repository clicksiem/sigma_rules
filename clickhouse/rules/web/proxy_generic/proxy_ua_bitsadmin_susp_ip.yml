rule: SELECT * FROM logs WHERE `c-useragent` ILIKE 'Microsoft BITS/%' AND (`cs-host` ILIKE '%1' OR `cs-host` ILIKE '%2' OR `cs-host` ILIKE '%3' OR `cs-host` ILIKE '%4' OR `cs-host` ILIKE '%5' OR `cs-host` ILIKE '%6' OR `cs-host` ILIKE '%7' OR `cs-host` ILIKE '%8' OR `cs-host` ILIKE '%9')
