rule: SELECT * FROM logs WHERE `c-useragent` ILIKE 'Q2hyb21l%' OR `c-useragent` ILIKE 'QXBwbGVXZWJLaX%' OR `c-useragent` ILIKE 'RGFsdmlr%' OR `c-useragent` ILIKE 'TW96aWxsY%'
