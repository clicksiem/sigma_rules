rule: SELECT * FROM logs WHERE `c-useragent` ILIKE 'Microsoft BITS/%' AND (NOT (`cs-host` ILIKE '%.com' OR `cs-host` ILIKE '%.net' OR `cs-host` ILIKE '%.org' OR `cs-host` ILIKE '%.scdn.co' OR `cs-host` ILIKE '%.sfx.ms'))
