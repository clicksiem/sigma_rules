id: 705072a5-bb6f-4ced-95b6-ecfa6602090b
name: WebDav Put Request
level: 3
size: '>0'
active: true
author:
- Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
group: zeek
tags:
- attack.exfiltration
- attack.t1048.003
rule: SELECT * FROM logs WHERE (user_agent ILIKE '%WebDAV%' AND method='PUT') AND (NOT (isIPAddressInRange(id.resp_h, '10.0.0.0/8') OR isIPAddressInRange(id.resp_h, '127.0.0.0/8') OR isIPAddressInRange(id.resp_h, '172.16.0.0/12') OR isIPAddressInRange(id.resp_h, '192.168.0.0/16') OR isIPAddressInRange(id.resp_h, '169.254.0.0/16')))
