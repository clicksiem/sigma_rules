rule: SELECT * FROM logs WHERE NOT (isIPAddressInRange(id.orig_h, '::1/128') OR isIPAddressInRange(id.orig_h, '10.0.0.0/8') OR isIPAddressInRange(id.orig_h, '127.0.0.0/8') OR isIPAddressInRange(id.orig_h, '172.16.0.0/12') OR isIPAddressInRange(id.orig_h, '192.168.0.0/16') OR isIPAddressInRange(id.orig_h, '169.254.0.0/16') OR isIPAddressInRange(id.orig_h, '2620:83:8000::/48') OR isIPAddressInRange(id.orig_h, 'fc00::/7') OR isIPAddressInRange(id.orig_h, 'fe80::/10'))
