rule: SELECT * FROM logs WHERE (query ILIKE '%.burpcollaborator.net' OR query ILIKE '%.canarytokens.com' OR query ILIKE '%.ceye.io' OR query ILIKE '%.ddns.1443.eu.org' OR query ILIKE '%.ddns.bypass.eu.org' OR query ILIKE '%.ddns.xn--gg8h.eu.org' OR query ILIKE '%.digimg.store' OR query ILIKE '%.dns.su18.org' OR query ILIKE '%.dnshook.site' OR query ILIKE '%.dnslog.cn' OR query ILIKE '%.dnslog.ink' OR query ILIKE '%.instances.httpworkbench.com' OR query ILIKE '%.interact.sh' OR query ILIKE '%.log.dnslog.pp.ua' OR query ILIKE '%.log.dnslog.qzz.io' OR query ILIKE '%.log.dnslogs.dpdns.org' OR query ILIKE '%.log.javaweb.org' OR query ILIKE '%.log.nat.cloudns.ph' OR query ILIKE '%.oast.fun' OR query ILIKE '%.oast.live' OR query ILIKE '%.oast.me' OR query ILIKE '%.oast.online' OR query ILIKE '%.oast.pro' OR query ILIKE '%.oast.site' OR query ILIKE '%.oastify.com' OR query ILIKE '%.p8.lol' OR query ILIKE '%.requestbin.net') AND (NOT query ILIKE '%polling.oastify.com%')
