rule: SELECT * FROM logs WHERE `gcp.audit.method_name` ILIKE 'admissionregistration.k8s.io.v%' AND (`gcp.audit.method_name` ILIKE '%.mutatingwebhookconfigurations.%' OR `gcp.audit.method_name` ILIKE '%.validatingwebhookconfigurations.%') AND (`gcp.audit.method_name` ILIKE '%create' OR `gcp.audit.method_name` ILIKE '%patch' OR `gcp.audit.method_name` ILIKE '%replace')
