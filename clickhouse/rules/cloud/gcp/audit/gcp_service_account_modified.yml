id: 6b67c12e-5e40-47c6-b3b0-1e6b571184cc
name: Google Cloud Service Account Modified
level: 5
size: '>0'
active: true
author:
- Austin Songer @austinsonger
group: gcp
tags:
- attack.impact
rule: SELECT * FROM logs WHERE `gcp.audit.method_name` ILIKE '%.serviceAccounts.patch' OR `gcp.audit.method_name` ILIKE '%.serviceAccounts.create' OR `gcp.audit.method_name` ILIKE '%.serviceAccounts.update' OR `gcp.audit.method_name` ILIKE '%.serviceAccounts.enable' OR `gcp.audit.method_name` ILIKE '%.serviceAccounts.undelete'
