id: 980a7598-1e7f-4962-9372-2d754c930d0e
name: Google Full Network Traffic Packet Capture
level: 5
size: '>0'
active: true
author:
- Austin Songer @austinsonger
group: gcp
tags:
- attack.collection
- attack.t1074
rule: SELECT * FROM logs WHERE `gcp.audit.method_name` ILIKE 'v%.Compute.PacketMirrorings.Get' OR `gcp.audit.method_name` ILIKE 'v%.Compute.PacketMirrorings.Delete' OR `gcp.audit.method_name` ILIKE 'v%.Compute.PacketMirrorings.Insert' OR `gcp.audit.method_name` ILIKE 'v%.Compute.PacketMirrorings.Patch' OR `gcp.audit.method_name` ILIKE 'v%.Compute.PacketMirrorings.List' OR `gcp.audit.method_name` ILIKE 'v%.Compute.PacketMirrorings.aggregatedList'
