id: 2f0bae2d-bf20-4465-be86-1311addebaa3
name: Google Cloud Kubernetes Secrets Modified or Deleted
level: 5
size: '>0'
active: true
author:
- Austin Songer @austinsonger
group: gcp
tags:
- attack.credential-access
rule: SELECT * FROM logs WHERE `gcp.audit.method_name` ILIKE 'io.k8s.core.v%.secrets.create' OR `gcp.audit.method_name` ILIKE 'io.k8s.core.v%.secrets.update' OR `gcp.audit.method_name` ILIKE 'io.k8s.core.v%.secrets.patch' OR `gcp.audit.method_name` ILIKE 'io.k8s.core.v%.secrets.delete'
