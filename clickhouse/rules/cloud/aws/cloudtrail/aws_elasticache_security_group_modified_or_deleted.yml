rule: SELECT * FROM logs WHERE eventSource='elasticache.amazonaws.com' AND (eventName IN ('DeleteCacheSecurityGroup', 'AuthorizeCacheSecurityGroupIngress', 'RevokeCacheSecurityGroupIngress', 'AuthorizeCacheSecurityGroupEgress', 'RevokeCacheSecurityGroupEgress'))
