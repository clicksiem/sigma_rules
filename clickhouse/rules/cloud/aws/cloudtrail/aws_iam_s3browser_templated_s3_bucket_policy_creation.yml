id: db014773-7375-4f4e-b83b-133337c0ffee
name: AWS IAM S3Browser Templated S3 Bucket Policy Creation
level: 8
size: '>0'
active: true
author:
- daniel.bohannon@permiso.io (@danielhbohannon)
group: aws
tags:
- attack.execution
- attack.stealth
- attack.t1059.009
- attack.persistence
- attack.initial-access
- attack.privilege-escalation
- attack.t1078.004
rule: SELECT * FROM logs WHERE eventSource='iam.amazonaws.com' AND eventName='PutUserPolicy' AND userAgent ILIKE '%S3 Browser%' AND (requestParameters ILIKE '%"arn:aws:s3:::<YOUR-BUCKET-NAME>/%"%' AND requestParameters ILIKE '%"s3:GetObject"%' AND requestParameters ILIKE '%"Allow"%')
