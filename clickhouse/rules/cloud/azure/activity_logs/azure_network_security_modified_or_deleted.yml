id: d22b4df4-5a67-4859-a578-8c9a0b5af9df
name: Azure Network Security Configuration Modified or Deleted
level: 5
size: '>0'
active: true
author:
- Austin Songer @austinsonger
group: azure
tags:
- attack.impact
rule: SELECT * FROM logs WHERE operationName IN ('MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/WRITE', 'MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/DELETE', 'MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/SECURITYRULES/WRITE', 'MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/SECURITYRULES/DELETE', 'MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/JOIN/ACTION', 'MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE')
