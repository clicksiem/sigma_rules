id: d9557b75-267b-4b43-922f-a775e2d1f792
name: Azure Point-to-site VPN Modified or Deleted
level: 5
size: '>0'
active: true
author:
- Austin Songer @austinsonger
group: azure
tags:
- attack.impact
rule: SELECT * FROM logs WHERE operationName IN ('MICROSOFT.NETWORK/P2SVPNGATEWAYS/WRITE', 'MICROSOFT.NETWORK/P2SVPNGATEWAYS/DELETE', 'MICROSOFT.NETWORK/P2SVPNGATEWAYS/RESET/ACTION', 'MICROSOFT.NETWORK/P2SVPNGATEWAYS/GENERATEVPNPROFILE/ACTION', 'MICROSOFT.NETWORK/P2SVPNGATEWAYS/DISCONNECTP2SVPNCONNECTIONS/ACTION', 'MICROSOFT.NETWORK/P2SVPNGATEWAYS/PROVIDERS/MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE')
