id: 15ef3fac-f0f0-4dc4-ada0-660aa72980b3
name: Azure Virtual Network Device Modified or Deleted
level: 5
size: '>0'
active: true
author:
- Austin Songer @austinsonger
group: azure
tags:
- attack.impact
rule: SELECT * FROM logs WHERE operationName IN ('MICROSOFT.NETWORK/NETWORKINTERFACES/TAPCONFIGURATIONS/WRITE', 'MICROSOFT.NETWORK/NETWORKINTERFACES/TAPCONFIGURATIONS/DELETE', 'MICROSOFT.NETWORK/NETWORKINTERFACES/WRITE', 'MICROSOFT.NETWORK/NETWORKINTERFACES/JOIN/ACTION', 'MICROSOFT.NETWORK/NETWORKINTERFACES/DELETE', 'MICROSOFT.NETWORK/NETWORKVIRTUALAPPLIANCES/DELETE', 'MICROSOFT.NETWORK/NETWORKVIRTUALAPPLIANCES/WRITE', 'MICROSOFT.NETWORK/VIRTUALHUBS/DELETE', 'MICROSOFT.NETWORK/VIRTUALHUBS/WRITE', 'MICROSOFT.NETWORK/VIRTUALROUTERS/WRITE', 'MICROSOFT.NETWORK/VIRTUALROUTERS/DELETE')
