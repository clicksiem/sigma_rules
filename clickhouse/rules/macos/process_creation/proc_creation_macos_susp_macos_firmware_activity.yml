rule: SELECT * FROM logs WHERE Image='/usr/sbin/firmwarepasswd' AND (CommandLine ILIKE '%setpasswd%' OR CommandLine ILIKE '%full%' OR CommandLine ILIKE '%delete%' OR CommandLine ILIKE '%check%')
