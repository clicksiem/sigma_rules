id: 58800443-f9fc-4d55-ae0c-98a3966dfb97
name: System Network Discovery - macOS
level: 1
size: '>0'
active: true
author:
- remotephone, oscd.community
group: macos
tags:
- attack.discovery
- attack.t1016
rule: SELECT * FROM logs WHERE ((Image ILIKE '%/arp' OR Image ILIKE '%/ifconfig' OR Image ILIKE '%/netstat' OR Image ILIKE '%/networksetup' OR Image ILIKE '%/socketfilterfw') OR (Image='/usr/bin/defaults' AND (CommandLine ILIKE '%/Library/Preferences/com.apple.alf%' AND CommandLine ILIKE '%read%'))) AND (NOT ParentImage ILIKE '%/wifivelocityd')
