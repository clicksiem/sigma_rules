rule: SELECT * FROM logs WHERE Image ILIKE '%/jamf' AND (CommandLine ILIKE '%createAccount%' OR CommandLine ILIKE '%manage%' OR CommandLine ILIKE '%removeFramework%' OR CommandLine ILIKE '%removeMdmProfile%' OR CommandLine ILIKE '%resetPassword%' OR CommandLine ILIKE '%setComputerName%')
