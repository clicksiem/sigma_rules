rule: SELECT * FROM logs WHERE (Image='/usr/bin/file' AND match(CommandLine, '(.){200,}')) OR (Image='/bin/ls' AND CommandLine ILIKE '%-R%') OR Image='/usr/bin/find' OR Image='/usr/bin/mdfind' OR Image='/tree'
