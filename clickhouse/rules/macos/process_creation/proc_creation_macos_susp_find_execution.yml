id: 85de3a19-b675-4a51-bfc6-b11a5186c971
name: Potential Discovery Activity Using Find - MacOS
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: macos
tags:
- attack.discovery
- attack.t1083
rule: SELECT * FROM logs WHERE Image ILIKE '%/find' AND (CommandLine ILIKE '%-perm -4000%' OR CommandLine ILIKE '%-perm -2000%' OR CommandLine ILIKE '%-perm 0777%' OR CommandLine ILIKE '%-perm -222%' OR CommandLine ILIKE '%-perm -o w%' OR CommandLine ILIKE '%-perm -o x%' OR CommandLine ILIKE '%-perm -u=s%' OR CommandLine ILIKE '%-perm -g=s%')
