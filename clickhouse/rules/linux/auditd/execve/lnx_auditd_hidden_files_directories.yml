rule: SELECT * FROM logs WHERE (type='EXECVE' AND (a0 IN ('mkdir', 'nano', 'touch', 'vi', 'vim'))) AND (match(a1, '(^|\/)\.[^.\/]') OR match(a2, '(^|\/)\.[^.\/]'))
