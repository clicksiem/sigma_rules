rule: SELECT * FROM logs WHERE (type='EXECVE' AND a0='import') AND ((a1='-window' AND a2='root' AND (a3 ILIKE '%.png' OR a3 ILIKE '%.jpg' OR a3 ILIKE '%.jpeg')) OR (a1 ILIKE '%.png' OR a1 ILIKE '%.jpg' OR a1 ILIKE '%.jpeg'))
