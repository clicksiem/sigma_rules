rule: SELECT * FROM logs WHERE (type='EXECVE' AND a0='iptables' AND a1 ILIKE '%DROP%') OR (type='EXECVE' AND a0='firewall-cmd' AND a1 ILIKE '%remove%') OR (type='EXECVE' AND a0='ufw' AND a1 ILIKE '%delete%') OR (type='EXECVE' AND a0='nft' AND (a1 ILIKE '%delete%' OR a1 ILIKE '%flush%'))
