rule: SELECT * FROM logs WHERE (type='PATH' AND nametype='CREATE') AND ((name ILIKE '/usr/lib/systemd/system/%' OR name ILIKE '/etc/systemd/system/%') OR name ILIKE '%/.config/systemd/user/%')
