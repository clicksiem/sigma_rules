id: ca94a6db-8106-4737-9ed2-3e3bb826af0a
name: Password Policy Discovery - Linux
level: 3
size: '>0'
active: true
author:
- Ömer Günal, oscd.community, Pawel Mazur
group: linux
tags:
- attack.discovery
- attack.t1201
rule: SELECT * FROM logs WHERE (type='PATH' AND (name IN ('/etc/login.defs', '/etc/pam.d/auth', '/etc/pam.d/common-account', '/etc/pam.d/common-auth', '/etc/pam.d/common-password', '/etc/pam.d/system-auth', '/etc/security/pwquality.conf'))) OR (type='EXECVE' AND a0='chage' AND (a1 IN ('--list', '-l'))) OR (type='EXECVE' AND a0='passwd' AND (a1 IN ('-S', '--status')))
