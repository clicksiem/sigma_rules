rule: SELECT * FROM logs WHERE (Image ILIKE '%/who' OR Image ILIKE '%/w' OR Image ILIKE '%/last' OR Image ILIKE '%/lsof' OR Image ILIKE '%/netstat') AND (NOT (ParentCommandLine ILIKE '%/usr/bin/landscape-sysinfo%' AND Image ILIKE '%/who'))
