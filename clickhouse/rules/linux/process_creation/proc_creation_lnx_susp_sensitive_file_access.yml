id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
name: Potential Suspicious Change To Sensitive/Critical Files
level: 5
size: '>0'
active: true
author:
- '@d4ns4n_ (Wuerth-Phoenix)'
group: linux
tags:
- attack.impact
- attack.t1565.001
rule: SELECT * FROM logs WHERE (((Image ILIKE '%/cat' OR Image ILIKE '%/echo' OR Image ILIKE '%/grep' OR Image ILIKE '%/head' OR Image ILIKE '%/more' OR Image ILIKE '%/tail') AND CommandLine ILIKE '%>%') OR (Image ILIKE '%/emacs' OR Image ILIKE '%/nano' OR Image ILIKE '%/sed' OR Image ILIKE '%/vi' OR Image ILIKE '%/vim')) AND (CommandLine ILIKE '%/bin/login%' OR CommandLine ILIKE '%/bin/passwd%' OR CommandLine ILIKE '%/boot/%' OR CommandLine ILIKE '%/etc/%.conf%' OR CommandLine ILIKE '%/etc/cron.%' OR CommandLine ILIKE '%/etc/crontab%' OR CommandLine ILIKE '%/etc/hosts%' OR CommandLine ILIKE '%/etc/init.d%' OR CommandLine ILIKE '%/etc/sudoers%' OR CommandLine ILIKE '%/opt/bin/%' OR CommandLine ILIKE '%/sbin%' OR CommandLine ILIKE '%/usr/bin/%' OR CommandLine ILIKE '%/usr/local/bin/%') AND (NOT (Image ILIKE '%/bin/sed' AND (CommandLine ILIKE 'sed -i /^%' OR CommandLine ILIKE 'sed -ne s/^%') AND CommandLine ILIKE '%/etc/mdadm/mdadm.conf'))
