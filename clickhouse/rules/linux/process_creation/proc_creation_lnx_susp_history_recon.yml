rule: SELECT * FROM logs WHERE (Image ILIKE '%/cat' OR Image ILIKE '%/head' OR Image ILIKE '%/tail' OR Image ILIKE '%/more') AND ((CommandLine ILIKE '%/.bash\_history%' OR CommandLine ILIKE '%/.zsh\_history%') OR (CommandLine ILIKE '%\_history' OR CommandLine ILIKE '%.history' OR CommandLine ILIKE '%zhistory'))
