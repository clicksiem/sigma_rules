rule: SELECT * FROM logs WHERE (Image ILIKE '%/file' AND match(CommandLine, '(.){200,}')) OR (Image ILIKE '%/ls' AND CommandLine ILIKE '%-R%') OR Image ILIKE '%/find' OR Image ILIKE '%/tree' OR Image ILIKE '%/findmnt' OR Image ILIKE '%/mlocate'
