id: 55e862a8-dd9c-4651-807a-f21fcad56716
name: Python One-Liners with Base64 Decoding - Linux
level: 8
size: '>0'
active: true
author:
- Hugh Ryan (HueCodes), Swachchhanda Shrawan Poudel (Nextron Systems)
group: linux
tags:
- attack.execution
- attack.stealth
- attack.t1059.006
- attack.t1027.010
rule: SELECT * FROM logs WHERE Image ILIKE '%/python%' AND ((CommandLine ILIKE '%import%' AND CommandLine ILIKE '%base64%' AND CommandLine ILIKE '% -c%') AND (CommandLine ILIKE '%.decode%' OR CommandLine ILIKE '%b16decode%' OR CommandLine ILIKE '%b32decode%' OR CommandLine ILIKE '%b32hexdecode%' OR CommandLine ILIKE '%b64decode%' OR CommandLine ILIKE '%b85decode%' OR CommandLine ILIKE '%z85decode%'))
