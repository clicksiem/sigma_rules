id: 4b09c71e-4269-4111-9cdd-107d8867f0cc
name: Shell Execution via Flock - Linux
level: 8
size: '>0'
active: true
author:
- Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
group: linux
tags:
- attack.discovery
- attack.t1083
rule: SELECT * FROM logs WHERE (Image ILIKE '%/flock' AND CommandLine ILIKE '% -u %') AND (CommandLine ILIKE '%/bin/bash%' OR CommandLine ILIKE '%/bin/dash%' OR CommandLine ILIKE '%/bin/fish%' OR CommandLine ILIKE '%/bin/sh%' OR CommandLine ILIKE '%/bin/zsh%')
