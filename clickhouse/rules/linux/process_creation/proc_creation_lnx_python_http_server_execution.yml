rule: SELECT * FROM logs WHERE ((Image ILIKE '%/python' OR Image ILIKE '%/python2' OR Image ILIKE '%/python3') OR (Image ILIKE '%/python2.%' OR Image ILIKE '%/python3.%')) AND (CommandLine ILIKE '%http.server%' OR CommandLine ILIKE '%SimpleHTTPServer%')
