rule: SELECT * FROM logs WHERE (Image ILIKE '%/nc' OR Image ILIKE '%/ncat') AND (CommandLine ILIKE '% -c %' OR CommandLine ILIKE '% -e %') AND (CommandLine ILIKE '% ash%' OR CommandLine ILIKE '% bash%' OR CommandLine ILIKE '% bsh%' OR CommandLine ILIKE '% csh%' OR CommandLine ILIKE '% ksh%' OR CommandLine ILIKE '% pdksh%' OR CommandLine ILIKE '% sh%' OR CommandLine ILIKE '% tcsh%' OR CommandLine ILIKE '%/bin/ash%' OR CommandLine ILIKE '%/bin/bash%' OR CommandLine ILIKE '%/bin/bsh%' OR CommandLine ILIKE '%/bin/csh%' OR CommandLine ILIKE '%/bin/ksh%' OR CommandLine ILIKE '%/bin/pdksh%' OR CommandLine ILIKE '%/bin/sh%' OR CommandLine ILIKE '%/bin/tcsh%' OR CommandLine ILIKE '%/bin/zsh%' OR CommandLine ILIKE '%$IFSash%' OR CommandLine ILIKE '%$IFSbash%' OR CommandLine ILIKE '%$IFSbsh%' OR CommandLine ILIKE '%$IFScsh%' OR CommandLine ILIKE '%$IFSksh%' OR CommandLine ILIKE '%$IFSpdksh%' OR CommandLine ILIKE '%$IFSsh%' OR CommandLine ILIKE '%$IFStcsh%' OR CommandLine ILIKE '%$IFSzsh%')
