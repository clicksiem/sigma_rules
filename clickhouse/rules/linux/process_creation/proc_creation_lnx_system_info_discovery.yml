rule: SELECT * FROM logs WHERE Image ILIKE '%/uname' OR Image ILIKE '%/hostname' OR Image ILIKE '%/uptime' OR Image ILIKE '%/lspci' OR Image ILIKE '%/dmidecode' OR Image ILIKE '%/lscpu' OR Image ILIKE '%/lsmod'
