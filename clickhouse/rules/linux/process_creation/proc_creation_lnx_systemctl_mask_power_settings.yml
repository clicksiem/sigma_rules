rule: SELECT * FROM logs WHERE (Image ILIKE '%/systemctl' AND CommandLine ILIKE '% mask%') AND (CommandLine ILIKE '%suspend.target%' OR CommandLine ILIKE '%hibernate.target%' OR CommandLine ILIKE '%hybrid-sleep.target%')
