rule: SELECT * FROM logs WHERE Image ILIKE '%/nice' AND (CommandLine ILIKE '%/bin/bash' OR CommandLine ILIKE '%/bin/dash' OR CommandLine ILIKE '%/bin/fish' OR CommandLine ILIKE '%/bin/sh' OR CommandLine ILIKE '%/bin/zsh')
