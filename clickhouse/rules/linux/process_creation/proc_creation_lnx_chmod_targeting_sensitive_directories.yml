id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
name: Chmod Targeting Sensitive Directories
level: 5
size: '>0'
active: true
author:
- Christopher Peacock @SecurePeacock, SCYTHE @scythe_io
group: linux
tags:
- attack.defense-impairment
- attack.t1222.002
rule: SELECT * FROM logs WHERE (Image ILIKE '%/chmod' AND (CommandLine ILIKE '%/tmp/%' OR CommandLine ILIKE '%/.Library/%' OR CommandLine ILIKE '%/etc/%' OR CommandLine ILIKE '%/opt/%')) AND (NOT ((CommandLine ILIKE '%chmod --reference=/etc/shells%' AND ParentCommandLine ILIKE '%/update-shells') OR (CommandLine ILIKE '%/etc/%' AND (ParentCommandLine ILIKE '%/var/lib/dpkg/info/%' AND ParentCommandLine ILIKE '%.postinst configure%')) OR CommandLine ILIKE 'chmod 700 /tmp/apt-key-gpghome.%' OR CommandLine ILIKE 'chmod 755 /var/tmp/mkinitramfs%' OR CommandLine='chmod 0775 /etc/landscape/' OR CommandLine='chmod 644 /etc/apparmor.d/tunables/home.d/ubuntu'))
