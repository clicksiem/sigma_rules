rule: SELECT * FROM logs WHERE Image ILIKE '%ruby%' AND (CommandLine ILIKE '% -e%' AND CommandLine ILIKE '%rsocket%' AND CommandLine ILIKE '%TCPSocket%') AND (CommandLine ILIKE '% ash%' OR CommandLine ILIKE '% bash%' OR CommandLine ILIKE '% bsh%' OR CommandLine ILIKE '% csh%' OR CommandLine ILIKE '% ksh%' OR CommandLine ILIKE '% pdksh%' OR CommandLine ILIKE '% sh%' OR CommandLine ILIKE '% tcsh%')
