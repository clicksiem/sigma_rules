id: 738d9bcf-6999-4fdb-b4ac-3033037db8ab
name: Suspicious Reverse Shell Command Line
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: linux
tags:
- attack.execution
- attack.t1059.004
rule: SELECT * FROM logs WHERE hasToken(full_log, 'BEGIN {s = "/inet/tcp/0/') OR hasToken(full_log, 'bash -i >& /dev/tcp/') OR hasToken(full_log, 'bash -i >& /dev/udp/') OR hasToken(full_log, 'sh -i >$ /dev/udp/') OR hasToken(full_log, 'sh -i >$ /dev/tcp/') OR hasToken(full_log, '&& while read line 0<&5; do') OR hasToken(full_log, '/bin/bash -c exec 5<>/dev/tcp/') OR hasToken(full_log, '/bin/bash -c exec 5<>/dev/udp/') OR hasToken(full_log, 'nc -e /bin/sh ') OR hasToken(full_log, '/bin/sh | nc') OR hasToken(full_log, 'rm -f backpipe; mknod /tmp/backpipe p && nc ') OR hasToken(full_log, ';socket(S,PF\_INET,SOCK\_STREAM,getprotobyname("tcp"));if(connect(S,sockaddr\_in($p,inet\_aton($i))))') OR hasToken(full_log, ';STDIN->fdopen($c,r);$~->fdopen($c,w);system$\_ while<>;') OR hasToken(full_log, '/bin/sh -i <&3 >&3 2>&3') OR hasToken(full_log, 'uname -a; w; id; /bin/bash -i') OR hasToken(full_log, '$sendbyte = ([text.encoding]::ASCII).GetBytes($sendback2); $stream.Write($sendbyte,0,$sendbyte.Length); $stream.Flush()};') OR hasToken(full_log, ';os.dup2(s.fileno(),0);os.dup2(s.fileno(),1);os.dup2(s.fileno(),2);os.putenv(''HISTFILE'',''/dev/null'');') OR hasToken(full_log, '.to\_i;exec sprintf("/bin/sh -i <&\%d >&\%d 2>&\%d",f,f,f)') OR hasToken(full_log, ';while(cmd=c.gets);IO.popen(cmd,"r"){|io|c.print') OR hasToken(full_log, 'socat exec:''bash -li'',pty,stderr,setsid,sigint,sane tcp:') OR hasToken(full_log, 'rm -f /tmp/p; mknod /tmp/p p &&') OR hasToken(full_log, ' | /bin/bash | telnet ') OR hasToken(full_log, ',echo=0,raw tcp-listen:') OR hasToken(full_log, 'nc -lvvp ') OR hasToken(full_log, 'xterm -display 1')
