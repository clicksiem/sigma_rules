id: 6cc5fceb-9a71-4c23-aeeb-963abe0b279c
name: Suspicious Use of /dev/tcp
level: 5
size: '>0'
active: true
author:
- frack113
group: linux
tags:
- attack.reconnaissance
rule: SELECT * FROM logs WHERE hasToken(full_log, 'cat </dev/tcp/') OR hasToken(full_log, 'exec 3<>/dev/tcp/') OR hasToken(full_log, 'echo >/dev/tcp/') OR hasToken(full_log, 'bash -i >& /dev/tcp/') OR hasToken(full_log, 'sh -i >& /dev/udp/') OR hasToken(full_log, '0<&196;exec 196<>/dev/tcp/') OR hasToken(full_log, 'exec 5<>/dev/tcp/') OR hasToken(full_log, '(sh)0>/dev/tcp/') OR hasToken(full_log, 'bash -c ''bash -i >& /dev/tcp/') OR hasToken(full_log, 'echo -e ''#!/bin/bash\\nbash -i >& /dev/tcp/')
