id: 8a670c6d-7189-4b1c-8017-a417ca84a086
name: Suspicious SQL Error Messages
level: 8
size: '>0'
active: true
author:
- Bjoern Kimminich
group: sql
tags:
- attack.initial-access
- attack.t1190
rule: 'SELECT * FROM logs WHERE hasToken(full_log, ''quoted string not properly terminated'') OR hasToken(full_log, ''You have an error in your SQL syntax'') OR hasToken(full_log, ''Unclosed quotation mark'') OR hasToken(full_log, ''near "%": syntax error'') OR hasToken(full_log, ''SELECTs to the left and right of UNION do not have the same number of result columns'')'
