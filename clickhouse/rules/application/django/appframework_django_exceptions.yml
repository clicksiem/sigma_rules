rule: SELECT * FROM logs WHERE hasToken(full_log, 'SuspiciousOperation') OR hasToken(full_log, 'DisallowedHost') OR hasToken(full_log, 'DisallowedModelAdminLookup') OR hasToken(full_log, 'DisallowedModelAdminToField') OR hasToken(full_log, 'DisallowedRedirect') OR hasToken(full_log, 'InvalidSessionKey') OR hasToken(full_log, 'RequestDataTooBig') OR hasToken(full_log, 'SuspiciousFileOperation') OR hasToken(full_log, 'SuspiciousMultipartForm') OR hasToken(full_log, 'SuspiciousSession') OR hasToken(full_log, 'TooManyFieldsSent') OR hasToken(full_log, 'PermissionDenied')
