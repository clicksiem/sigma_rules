id: a21bcd7e-38ec-49ad-b69a-9ea17e69509e
name: DNS Server Discovery Via LDAP Query
level: 3
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.discovery
- attack.t1482
rule: SELECT * FROM logs WHERE QueryName ILIKE '\_ldap.%' AND (NOT ((Image ILIKE '%:\\Program Files\\%' OR Image ILIKE '%:\\Program Files (x86)\\%' OR Image ILIKE '%:\\Windows\\%') OR (Image ILIKE '%:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\%' AND Image ILIKE '%\\MsMpEng.exe') OR Image='<unknown process>' OR isNull(Image))) AND (NOT (Image ILIKE 'C:\\WindowsAzure\\GuestAgent%' OR (Image ILIKE '%\\chrome.exe' OR Image ILIKE '%\\firefox.exe' OR Image ILIKE '%\\opera.exe')))
