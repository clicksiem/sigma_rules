id: c74d7efc-8826-45d9-b8bb-f04fac9e4eff
name: Run Once Task Configuration in Registry
level: 5
size: '>0'
active: true
author:
- Avneet Singh @v3t0_, oscd.community
group: windows
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\Microsoft\\Active Setup\\Installed Components%' AND TargetObject ILIKE '%\\StubPath') AND (NOT ((Details ILIKE '%C:\\Program Files\\Google\\Chrome\\Application\\%' AND Details ILIKE '%\\Installer\\chrmstp.exe" --configure-user-settings --verbose-logging --system-level%') OR ((Details ILIKE '%C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\%' OR Details ILIKE '%C:\\Program Files\\Microsoft\\Edge\\Application\\%') AND Details ILIKE '%\\Installer\\setup.exe" --configure-user-settings --verbose-logging --system-level --msedge --channel=stable')))
