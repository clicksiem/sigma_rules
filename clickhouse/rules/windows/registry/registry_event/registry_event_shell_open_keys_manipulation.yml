id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
name: Shell Open Registry Keys Manipulation
level: 8
size: '>0'
active: true
author:
- Christian Burkard (Nextron Systems)
group: windows
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1548.002
- attack.t1546.001
rule: SELECT * FROM logs WHERE (EventType='SetValue' AND TargetObject ILIKE '%Classes\\ms-settings\\shell\\open\\command\\SymbolicLinkValue' AND Details ILIKE '%\\Software\\Classes\\{%') OR TargetObject ILIKE '%Classes\\ms-settings\\shell\\open\\command\\DelegateExecute' OR ((EventType='SetValue' AND (TargetObject ILIKE '%Classes\\ms-settings\\shell\\open\\command\\(Default)' OR TargetObject ILIKE '%Classes\\exefile\\shell\\open\\command\\(Default)')) AND (NOT Details='(Empty)'))
