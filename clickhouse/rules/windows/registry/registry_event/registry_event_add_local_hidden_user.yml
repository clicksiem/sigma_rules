rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\SAM\\SAM\\Domains\\Account\\Users\\Names\\%' AND TargetObject ILIKE '%$\\(Default)' AND Image ILIKE '%\\lsass.exe'
