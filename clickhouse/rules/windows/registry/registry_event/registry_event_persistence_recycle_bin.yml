rule: SELECT * FROM logs WHERE (EventType='RenameKey' AND NewName ILIKE '%\\CLSID\\{645FF040-5081-101B-9F08-00AA002F954E}\\shell\\open%') OR (EventType='SetValue' AND TargetObject ILIKE '%\\CLSID\\{645FF040-5081-101B-9F08-00AA002F954E}\\shell\\open\\command\\(Default)%')
