id: d67572a0-e2ec-45d6-b8db-c100d14b8ef2
name: NetNTLM Downgrade Attack - Registry
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), wagga, Nasreddine Bencherchali (Splunk STRT)
group: windows
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1685
- attack.t1112
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%SYSTEM\\%' AND TargetObject ILIKE '%ControlSet%' AND TargetObject ILIKE '%\\Control\\Lsa%') AND ((TargetObject ILIKE '%\\lmcompatibilitylevel' AND (Details IN ('DWORD (0x00000000)', 'DWORD (0x00000001)', 'DWORD (0x00000002)'))) OR (TargetObject ILIKE '%\\NtlmMinClientSec' AND (Details IN ('DWORD (0x00000000)', 'DWORD (0x00000010)', 'DWORD (0x00000020)', 'DWORD (0x00000030)'))) OR TargetObject ILIKE '%\\RestrictSendingNTLMTraffic')
