id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
name: Suspicious Run Key from Download
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), Swachchhanda Shrawan Poude (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\AppData\\Local\\Packages\\Microsoft.Outlook\_%' OR Image ILIKE '%\\AppData\\Local\\Microsoft\\Olk\\Attachments\\%' OR Image ILIKE '%\\Downloads\\%' OR Image ILIKE '%\\Temporary Internet Files\\Content.Outlook\\%' OR Image ILIKE '%\\Local Settings\\Temporary Internet Files\\%') AND (TargetObject ILIKE '%\\Software\\Microsoft\\Windows\\CurrentVersion\\Run%' OR TargetObject ILIKE '%\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Run%' OR TargetObject ILIKE '%\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer\\Run%')
