id: d645ef86-2396-48a1-a2b6-b629ca3f57ff
name: Windows Credential Guard Related Registry Value Deleted - Registry
level: 8
size: '>0'
active: true
author:
- Swachchhanda Shrawan Poudel (Nextron Systems)
group: windows
tags:
- attack.defense-impairment
- attack.t1685
rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\DeviceGuard\\EnableVirtualizationBasedSecurity' OR TargetObject ILIKE '%\\DeviceGuard\\LsaCfgFlags' OR TargetObject ILIKE '%\\DeviceGuard\\RequirePlatformSecurityFeatures' OR TargetObject ILIKE '%\\Lsa\\LsaCfgFlags'
