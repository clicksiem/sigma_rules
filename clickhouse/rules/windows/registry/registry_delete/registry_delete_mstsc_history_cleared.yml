id: 07bdd2f5-9c58-4f38-aec8-e101bb79ef8d
name: Terminal Server Client Connection History Cleared - Registry
level: 8
size: '>0'
active: true
author:
- Christian Burkard (Nextron Systems)
group: windows
tags:
- attack.persistence
- attack.stealth
- attack.defense-impairment
- attack.t1070
- attack.t1112
rule: SELECT * FROM logs WHERE (EventType='DeleteValue' AND TargetObject ILIKE '%\\Microsoft\\Terminal Server Client\\Default\\MRU%') OR (EventType='DeleteKey' AND TargetObject ILIKE '%\\Microsoft\\Terminal Server Client\\Servers\\%')
