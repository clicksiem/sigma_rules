id: dc5c24af-6995-49b2-86eb-a9ff62199e82
name: COM Hijacking via TreatAs
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.015
rule: SELECT * FROM logs WHERE TargetObject ILIKE '%TreatAs\\(Default)' AND (NOT ((Image ILIKE 'C:\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\%' AND Image ILIKE '%\\OfficeClickToRun.exe') OR (Image IN ('C:\\Program Files\\Microsoft Office\\root\\integration\\integrator.exe', 'C:\\Program Files (x86)\\Microsoft Office\\root\\integration\\integrator.exe')) OR Image ILIKE 'C:\\Windows\\system32\\svchost.exe' OR (Image IN ('C:\\Windows\\system32\\msiexec.exe', 'C:\\Windows\\SysWOW64\\msiexec.exe'))))
