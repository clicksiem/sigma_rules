id: a9b6c011-ab69-4ddb-bc0a-c4f21c80ec47
name: Potential Attachment Manager Settings Associations Tamper
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.defense-impairment
rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Associations\\%' AND ((TargetObject ILIKE '%\\DefaultFileTypeRisk' AND Details='DWORD (0x00006152)') OR (TargetObject ILIKE '%\\LowRiskFileTypes' AND (Details ILIKE '%.zip;%' OR Details ILIKE '%.rar;%' OR Details ILIKE '%.exe;%' OR Details ILIKE '%.bat;%' OR Details ILIKE '%.com;%' OR Details ILIKE '%.cmd;%' OR Details ILIKE '%.reg;%' OR Details ILIKE '%.msi;%' OR Details ILIKE '%.htm;%' OR Details ILIKE '%.html;%')))
