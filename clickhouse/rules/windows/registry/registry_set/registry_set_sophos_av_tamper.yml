id: 9f4662ac-17ca-43aa-8f12-5d7b989d0101
name: Tamper With Sophos AV Registry Keys
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.defense-impairment
- attack.t1685
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\Sophos Endpoint Defense\\TamperProtection\\Config\\SAVEnabled%' OR TargetObject ILIKE '%\\Sophos Endpoint Defense\\TamperProtection\\Config\\SEDEnabled%' OR TargetObject ILIKE '%\\Sophos\\SAVService\\TamperProtection\\Enabled%') AND Details='DWORD (0x00000000)'
