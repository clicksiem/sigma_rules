id: a7df0e9e-91a5-459a-a003-4cde67c2ff5d
name: Potentially Suspicious Command Executed Via Run Dialog Box - Registry
level: 8
size: '>0'
active: true
author:
- Ahmed Farouk, Nasreddine Bencherchali
group: windows
tags:
- attack.execution
- attack.t1059.001
rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RunMRU%' AND (((Details ILIKE '%powershell%' OR Details ILIKE '%pwsh%') AND (Details ILIKE '% -e %' OR Details ILIKE '% -ec %' OR Details ILIKE '% -en %' OR Details ILIKE '% -enc %' OR Details ILIKE '% -enco%' OR Details ILIKE '%ftp%' OR Details ILIKE '%Hidden%' OR Details ILIKE '%http%' OR Details ILIKE '%iex%' OR Details ILIKE '%Invoke-%')) OR (Details ILIKE '%wmic%' AND (Details ILIKE '%shadowcopy%' OR Details ILIKE '%process call create%')))
