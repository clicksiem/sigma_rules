id: 20f0ee37-5942-4e45-b7d5-c5b5db9df5cd
name: CurrentVersion Autorun Keys Modification
level: 5
size: '>0'
active: true
author:
- Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion%' AND (TargetObject ILIKE '%\\ShellServiceObjectDelayLoad%' OR TargetObject ILIKE '%\\Run\\%' OR TargetObject ILIKE '%\\RunOnce\\%' OR TargetObject ILIKE '%\\RunOnceEx\\%' OR TargetObject ILIKE '%\\RunServices\\%' OR TargetObject ILIKE '%\\RunServicesOnce\\%' OR TargetObject ILIKE '%\\Policies\\System\\Shell%' OR TargetObject ILIKE '%\\Policies\\Explorer\\Run%' OR TargetObject ILIKE '%\\Group Policy\\Scripts\\Startup%' OR TargetObject ILIKE '%\\Group Policy\\Scripts\\Shutdown%' OR TargetObject ILIKE '%\\Group Policy\\Scripts\\Logon%' OR TargetObject ILIKE '%\\Group Policy\\Scripts\\Logoff%' OR TargetObject ILIKE '%\\Explorer\\ShellServiceObjects%' OR TargetObject ILIKE '%\\Explorer\\ShellIconOverlayIdentifiers%' OR TargetObject ILIKE '%\\Explorer\\ShellExecuteHooks%' OR TargetObject ILIKE '%\\Explorer\\SharedTaskScheduler%' OR TargetObject ILIKE '%\\Explorer\\Browser Helper Objects%' OR TargetObject ILIKE '%\\Authentication\\PLAP Providers%' OR TargetObject ILIKE '%\\Authentication\\Credential Providers%' OR TargetObject ILIKE '%\\Authentication\\Credential Provider Filters%')) AND (NOT ((Details='(Empty)' OR TargetObject ILIKE '%\\NgcFirst\\ConsecutiveSwitchCount' OR (Image ILIKE '%\\AppData\\Local\\Microsoft\\OneDrive\\Update\\OneDriveSetup.exe' OR Image ILIKE '%\\AppData\\Roaming\\Spotify\\Spotify.exe' OR Image ILIKE '%\\AppData\\Local\\WebEx\\WebexHost.exe') OR (Image IN ('C:\\WINDOWS\\system32\\devicecensus.exe', 'C:\\Windows\\system32\\winsat.exe', 'C:\\Program Files\\Microsoft OneDrive\\StandaloneUpdater\\OneDriveSetup.exe', 'C:\\Program Files (x86)\\Microsoft OneDrive\\StandaloneUpdater\\OneDriveSetup.exe', 'C:\\Program Files\\Microsoft OneDrive\\Update\\OneDriveSetup.exe', 'C:\\Program Files (x86)\\Microsoft OneDrive\\Update\\OneDriveSetup.exe', 'C:\\Program Files\\Microsoft Office\\root\\integration\\Addons\\OneDriveSetup.exe', 'C:\\Program Files (x86)\\Microsoft Office\\root\\integration\\Addons\\OneDriveSetup.exe', 'C:\\Program Files\\KeePass Password Safe 2\\ShInstUtil.exe', 'C:\\Program Files\\Everything\\Everything.exe', 'C:\\Program Files (x86)\\Microsoft Office\\root\\integration\\integrator.exe', 'C:\\Program Files\\Microsoft Office\\root\\integration\\integrator.exe'))) OR isNull(Details) OR (Image ILIKE 'C:\\Windows\\system32\\LogonUI.exe' AND (TargetObject ILIKE '%\\Authentication\\Credential Providers\\{D6886603-9D2F-4EB2-B667-1971041FA96B}\\%' OR TargetObject ILIKE '%\\Authentication\\Credential Providers\\{BEC09223-B018-416D-A0AC-523971B639F5}\\%' OR TargetObject ILIKE '%\\Authentication\\Credential Providers\\{8AF662BF-65A0-4D0A-A540-A338A999D36F}\\%' OR TargetObject ILIKE '%\\Authentication\\Credential Providers\\{27FBDB57-B613-4AF2-9D7E-4FA7A66C21AD}\\%')) OR (Image ILIKE 'C:\\Program Files (x86)\\Microsoft\\EdgeUpdate\\Install\\%' OR Image ILIKE 'C:\\Program Files (x86)\\Microsoft\\EdgeWebView\\%' OR Image ILIKE 'C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe%') OR Image ILIKE 'C:\\Program Files\\Windows Defender\\MsMpEng.exe' OR (Image ILIKE '%\\Microsoft\\Teams\\current\\Teams.exe' AND Details ILIKE '%\\Microsoft\\Teams\\Update.exe --processStart %') OR (Image ILIKE 'C:\\Windows\\system32\\userinit.exe' AND Details='ctfmon.exe /n'))) AND (NOT ((Image ILIKE 'C:\\Windows\\system32\\regsvr32.exe' AND TargetObject ILIKE '%DropboxExt%' AND Details ILIKE '%A251-47B7-93E1-CDD82E34AF8B}') OR (TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\Opera Browser Assistant' AND Details ILIKE 'C:\\Program Files\\Opera\\assistant\\browser\_assistant.exe') OR (TargetObject ILIKE '%\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\Opera Stable' AND (Details IN ('C:\\Program Files\\Opera\\launcher.exe', 'C:\\Program Files (x86)\\Opera\\launcher.exe'))) OR (TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\iTunesHelper' AND Details ILIKE '"C:\\Program Files\\iTunes\\iTunesHelper.exe"') OR (TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\RunOnce\\zoommsirepair' AND Details ILIKE '"C:\\Program Files\\Zoom\\bin\\installer.exe" /repair') OR (TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\Greenshot' AND Details ILIKE 'C:\\Program Files\\Greenshot\\Greenshot.exe') OR (TargetObject ILIKE '%\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\GoogleDriveFS' AND Details ILIKE 'C:\\Program Files\\Google\\Drive File Stream\\%' AND Details ILIKE '%\\GoogleDriveFS.exe%') OR (TargetObject ILIKE '%GoogleDrive%' AND (Details IN ('{CFE8B367-77A7-41D7-9C90-75D16D7DC6B6}', '{A8E52322-8734-481D-A7E2-27B309EF8D56}', '{C973DA94-CBDF-4E77-81D1-E5B794FBD146}', '{51EF1569-67EE-4AD6-9646-E726C3FFC8A2}'))) OR ((Details ILIKE 'C:\\Windows\\system32\\cmd.exe /q /c rmdir /s /q "C:\\Users\\%' OR Details ILIKE 'C:\\Windows\\system32\\cmd.exe /q /c del /q "C:\\Users\\%') AND Details ILIKE '%\\AppData\\Local\\Microsoft\\OneDrive\\%') OR (TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\RunOnce\\{%' AND (Details ILIKE '%\\AppData\\Local\\Package Cache\\{%' AND Details ILIKE '%}\\python-%') AND Details ILIKE '%.exe" /burn.runonce') OR ((Image ILIKE 'C:\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\%' OR Image ILIKE 'C:\\Program Files (x86)\\Common Files\\Microsoft Shared\\ClickToRun\\%') AND Image ILIKE '%\\OfficeClickToRun.exe') OR (Image ILIKE '%\\Microsoft\\Teams\\current\\Teams.exe' AND Details ILIKE '%\\Microsoft\\Teams\\Update.exe --processStart%') OR ((Image ILIKE '%C:\\Program Files\\AVG\\Antivirus\\Setup\\%' OR Image ILIKE '%C:\\Program Files (x86)\\AVG\\Antivirus\\Setup\\%' OR Image ILIKE '%\\instup.exe%') AND (Details IN ('"C:\\Program Files\\AVG\\Antivirus\\AvLaunch.exe" /gui', '"C:\\Program Files (x86)\\AVG\\Antivirus\\AvLaunch.exe" /gui', '{472083B0-C522-11CF-8763-00608CC02F24}', '{472083B1-C522-11CF-8763-00608CC02F24}'))) OR ((Image ILIKE '%C:\\Program Files\\Avast Software\\Avast\\Setup\\%' OR Image ILIKE '%C:\\Program Files (x86)\\Avast Software\\Avast\\Setup\\%' OR Image ILIKE '%\\instup.exe%') AND (Details IN ('"C:\\Program Files\\Avast Software\\Avast\\AvLaunch.exe" /gui', '"C:\\Program Files (x86)\\Avast Software\\Avast\\AvLaunch.exe" /gui'))) OR ((Image IN ('C:\\Program Files\\AVG\\Antivirus\\avgToolsSvc.exe', 'C:\\Program Files (x86)\\AVG\\Antivirus\\avgToolsSvc.exe')) AND TargetObject ILIKE '%\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\StartupApproved\\Run\\%' AND Details='Binary Data') OR ((Image ILIKE '%\\aurora-agent-64.exe' OR Image ILIKE '%\\aurora-agent.exe') AND TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\Run\\aurora-dashboard' AND Details ILIKE 'C:\\Program Files\\Aurora-Agent\\tools\\aurora-dashboard.exe') OR (TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\Run\\Everything' AND Details ILIKE '%\\Everything\\Everything.exe" -startup') OR (TargetObject ILIKE '%\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\Discord' AND Details ILIKE '%\\Discord\\Update.exe --processStart Discord.exe')))
