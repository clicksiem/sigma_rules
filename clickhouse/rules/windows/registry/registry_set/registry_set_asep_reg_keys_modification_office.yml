id: baecf8fb-edbf-429f-9ade-31fc3f22b970
name: Office Autorun Keys Modification
level: 5
size: '>0'
active: true
author:
- Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
rule: SELECT * FROM logs WHERE ((TargetObject ILIKE '%\\Software\\Wow6432Node\\Microsoft\\Office%' OR TargetObject ILIKE '%\\Software\\Microsoft\\Office%') AND (TargetObject ILIKE '%\\Word\\Addins%' OR TargetObject ILIKE '%\\PowerPoint\\Addins%' OR TargetObject ILIKE '%\\Outlook\\Addins%' OR TargetObject ILIKE '%\\Onenote\\Addins%' OR TargetObject ILIKE '%\\Excel\\Addins%' OR TargetObject ILIKE '%\\Access\\Addins%' OR TargetObject ILIKE '%test\\Special\\Perf%')) AND (NOT (Details='(Empty)' OR isNull(Details) OR ((Image ILIKE 'C:\\Program Files\\Microsoft Office\\%' OR Image ILIKE 'C:\\Program Files (x86)\\Microsoft Office\\%' OR Image ILIKE 'C:\\PROGRA~2\\MICROS~2\\Office%' OR Image ILIKE 'C:\\Windows\\System32\\msiexec.exe%' OR Image ILIKE 'C:\\Windows\\SysWOW64\\msiexec.exe%' OR Image ILIKE 'C:\\Windows\\System32\\regsvr32.exe%' OR Image ILIKE 'C:\\Windows\\SysWOW64\\regsvr32.exe %') AND (TargetObject ILIKE '%\\Excel\\Addins\\AdHocReportingExcelClientLib.AdHocReportingExcelClientAddIn.1\\%' OR TargetObject ILIKE '%\\Excel\\Addins\\ExcelPlugInShell.PowerMapConnect\\%' OR TargetObject ILIKE '%\\Excel\\Addins\\NativeShim\\%' OR TargetObject ILIKE '%\\Excel\\Addins\\NativeShim.InquireConnector.1\\%' OR TargetObject ILIKE '%\\Excel\\Addins\\PowerPivotExcelClientAddIn.NativeEntry.1\\%' OR TargetObject ILIKE '%\\Outlook\\AddIns\\AccessAddin.DC\\%' OR TargetObject ILIKE '%\\Outlook\\AddIns\\ColleagueImport.ColleagueImportAddin\\%' OR TargetObject ILIKE '%\\Outlook\\AddIns\\EvernoteCC.EvernoteContactConnector\\%' OR TargetObject ILIKE '%\\Outlook\\AddIns\\EvernoteOLRD.Connect\\%' OR TargetObject ILIKE '%\\Outlook\\Addins\\OneNote.OutlookAddin%' OR TargetObject ILIKE '%\\Outlook\\Addins\\DriveFSExtensionLib.Connect\\%' OR TargetObject ILIKE '%\\Outlook\\Addins\\GoogleAppsSync.Connect\\%' OR TargetObject ILIKE '%\\Outlook\\Addins\\Microsoft.VbaAddinForOutlook.1\\%' OR TargetObject ILIKE '%\\Outlook\\Addins\\OcOffice.OcForms\\%' OR TargetObject ILIKE '%\\Outlook\\Addins\\OscAddin.Connect\\%' OR TargetObject ILIKE '%\\Outlook\\Addins\\OutlookChangeNotifier.Connect\\%' OR TargetObject ILIKE '%\\Outlook\\Addins\\UCAddin.LyncAddin.1%' OR TargetObject ILIKE '%\\Outlook\\Addins\\UCAddin.UCAddin.1%' OR TargetObject ILIKE '%\\Outlook\\Addins\\UmOutlookAddin.FormRegionAddin\\%' OR TargetObject ILIKE '%AddinTakeNotesService\\FriendlyName%')) OR ((Image ILIKE 'C:\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\%' OR Image ILIKE 'C:\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\Updates\\%') AND Image ILIKE '%\\OfficeClickToRun.exe') OR ((Image ILIKE 'C:\\Program Files\\Common Files\\Microsoft Shared\\VSTO\\%' OR Image ILIKE 'C:\\Program Files (x86)\\Microsoft Shared\\VSTO\\%') AND Image ILIKE '%\\VSTOInstaller.exe'))) AND (NOT (((Image IN ('C:\\Program Files\\AVG\\Antivirus\\RegSvr.exe', 'C:\\Program Files\\AVG\\Antivirus\\x86\\RegSvr.exe')) AND TargetObject ILIKE '%\\Microsoft\\Office\\Outlook\\Addins\\Antivirus.AsOutExt\\%') OR ((Image IN ('C:\\Program Files\\Avast Software\\Avast\\RegSvr.exe', 'C:\\Program Files\\Avast Software\\Avast\\x86\\RegSvr.exe')) AND TargetObject ILIKE '%\\Microsoft\\Office\\Outlook\\Addins\\Avast.AsOutExt\\%')))
