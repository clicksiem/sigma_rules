id: 36803969-5421-41ec-b92f-8500f79c23b0
name: Potential Persistence Via GlobalFlags
level: 8
size: '>0'
active: true
author:
- Karneades, Jonhnathan Ribeiro, Florian Roth
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.012
- car.2013-01-002
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\Microsoft\\Windows NT\\CurrentVersion\\%' AND TargetObject ILIKE '%\\Image File Execution Options\\%' AND TargetObject ILIKE '%\\GlobalFlag%') OR ((TargetObject ILIKE '%\\Microsoft\\Windows NT\\CurrentVersion\\%' AND TargetObject ILIKE '%\\SilentProcessExit\\%') AND (TargetObject ILIKE '%\\ReportingMode%' OR TargetObject ILIKE '%\\MonitorProcess%'))
