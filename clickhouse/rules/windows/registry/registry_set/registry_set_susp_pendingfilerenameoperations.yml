rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\CurrentControlSet\\Control\\Session Manager\\PendingFileRenameOperations%' AND (Image ILIKE '%\\Users\\Public\\%' OR (Image ILIKE '%\\reg.exe' OR Image ILIKE '%\\regedit.exe'))
