rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\Services\\SharedAccess\\Parameters\\FirewallPolicy\\%' AND TargetObject ILIKE '%\\EnableFirewall' AND Details='DWORD (0x00000000)'
