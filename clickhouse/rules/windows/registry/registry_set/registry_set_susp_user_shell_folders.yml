id: 9c226817-8dc9-46c2-a58d-66655aafd7dc
name: Modify User Shell Folders Startup Value
level: 8
size: '>0'
active: true
author:
- frack113, Swachchhanda Shrawan Poudel (Nextron Systems)
group: windows
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1547.001
rule: SELECT * FROM logs WHERE ((TargetObject ILIKE '%SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\User Shell Folders%' OR TargetObject ILIKE '%SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Shell Folders%') AND (TargetObject ILIKE '%\\Common Startup' OR TargetObject ILIKE '%\\Startup')) AND (NOT (isNull(Details) OR (Details ILIKE '%C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Startup%' OR Details ILIKE '%\%ProgramData\%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup%') OR (Details ILIKE '%\%USERPROFILE\%\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup%' OR Details ILIKE '%\%\%USERPROFILE\%\%\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup%') OR (Details ILIKE '%C:\\Users\\%' AND Details ILIKE '%\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup%')))
