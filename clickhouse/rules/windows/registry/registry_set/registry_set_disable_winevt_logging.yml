id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
name: Disable Windows Event Logging Via Registry
level: 8
size: '>0'
active: true
author:
- frack113, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.defense-impairment
- attack.t1685.001
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\WINEVT\\Channels\\%' AND TargetObject ILIKE '%\\Enabled' AND Details='DWORD (0x00000000)') AND (NOT (Image ILIKE 'C:\\Windows\\system32\\wevtutil.exe' OR (Image ILIKE 'C:\\Windows\\winsxs\\%' AND Image ILIKE '%\\TiWorker.exe') OR (Image ILIKE 'C:\\Windows\\System32\\svchost.exe' AND (TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\WINEVT\\Channels\\Microsoft-Windows-FileInfoMinifilter%' OR TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\WINEVT\\Channels\\Microsoft-Windows-ASN1\\%' OR TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\WINEVT\\Channels\\Microsoft-Windows-Kernel-AppCompat\\%' OR TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\WINEVT\\Channels\\Microsoft-Windows-Runtime\\Error\\%' OR TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\WINEVT\\Channels\\Microsoft-Windows-CAPI2/Operational\\%')) OR (Image ILIKE 'C:\\Windows\\servicing\\TrustedInstaller.exe' AND TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\WINEVT\\Channels\\Microsoft-Windows-Compat-Appraiser%'))) AND (NOT (Image='' OR isNull(Image)))
