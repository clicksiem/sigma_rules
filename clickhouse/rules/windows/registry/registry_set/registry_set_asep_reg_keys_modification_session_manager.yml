id: 046218bd-e0d8-4113-a3c3-895a12b2b298
name: Session Manager Autorun Keys Modification
level: 5
size: '>0'
active: true
author:
- Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
- attack.t1546.009
rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\System\\CurrentControlSet\\Control\\Session Manager%' AND (TargetObject ILIKE '%\\SetupExecute%' OR TargetObject ILIKE '%\\S0InitialCommand%' OR TargetObject ILIKE '%\\KnownDlls%' OR TargetObject ILIKE '%\\Execute%' OR TargetObject ILIKE '%\\BootExecute%' OR TargetObject ILIKE '%\\AppCertDlls%') AND (NOT Details='(Empty)')
