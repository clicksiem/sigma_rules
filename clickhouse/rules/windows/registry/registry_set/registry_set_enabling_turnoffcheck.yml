id: 7d995e63-ec83-4aa3-89d5-8a17b5c87c86
name: Scripted Diagnostics Turn Off Check Enabled - Registry
level: 5
size: '>0'
active: true
author:
- Christopher Peacock @securepeacock, SCYTHE @scythe_io
group: windows
tags:
- attack.defense-impairment
- attack.t1685
rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\Policies\\Microsoft\\Windows\\ScriptedDiagnostics\\TurnOffCheck' AND Details='DWORD (0x00000001)'
