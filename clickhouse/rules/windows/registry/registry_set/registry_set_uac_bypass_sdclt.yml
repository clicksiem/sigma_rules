rule: SELECT * FROM logs WHERE TargetObject ILIKE '%Software\\Classes\\exefile\\shell\\runas\\command\\isolatedCommand' OR (TargetObject ILIKE '%Software\\Classes\\Folder\\shell\\open\\command\\SymbolicLinkValue' AND match(Details, '-1[0-9]{3}\\Software\\Classes\\'))
