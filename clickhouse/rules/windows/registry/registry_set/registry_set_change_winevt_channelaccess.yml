id: 7d9263bd-dc47-4a58-bc92-5474abab390c
name: Change Winevt Channel Access Permission Via Registry
level: 8
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.defense-impairment
- attack.t1685.001
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\WINEVT\\Channels\\%' AND TargetObject ILIKE '%\\ChannelAccess' AND (Details ILIKE '%(A;;0x1;;;LA)%' OR Details ILIKE '%(A;;0x1;;;SY)%' OR Details ILIKE '%(A;;0x5;;;BA)%')) AND (NOT (Image ILIKE 'C:\\Windows\\servicing\\TrustedInstaller.exe' OR (Image ILIKE 'C:\\Windows\\WinSxS\\%' AND Image ILIKE '%\\TiWorker.exe')))
