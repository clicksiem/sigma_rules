rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\WINEVT\\Channels\\Microsoft-Windows-Windows Defender/Operational\\Enabled%' AND Details='DWORD (0x00000000)'
