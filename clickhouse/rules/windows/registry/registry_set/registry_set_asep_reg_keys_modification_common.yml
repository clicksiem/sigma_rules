id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
name: Common Autorun Keys Modification
level: 5
size: '>0'
active: true
author:
- Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split), wagga (name)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\SOFTWARE\\Wow6432Node\\Microsoft\\Windows CE Services\\AutoStart%' OR TargetObject ILIKE '%\\Software\\Wow6432Node\\Microsoft\\Command Processor\\Autorun%' OR TargetObject ILIKE '%\\SOFTWARE\\Wow6432Node\\Microsoft\\Active Setup\\Installed Components%' OR TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows CE Services\\AutoStartOnDisconnect%' OR TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows CE Services\\AutoStartOnConnect%' OR TargetObject ILIKE '%\\SYSTEM\\Setup\\CmdLine%' OR TargetObject ILIKE '%\\Software\\Microsoft\\Ctf\\LangBarAddin%' OR TargetObject ILIKE '%\\Software\\Microsoft\\Command Processor\\Autorun%' OR TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components%' OR TargetObject ILIKE '%\\SOFTWARE\\Classes\\Protocols\\Handler%' OR TargetObject ILIKE '%\\SOFTWARE\\Classes\\Protocols\\Filter%' OR TargetObject ILIKE '%\\SOFTWARE\\Classes\\Htmlfile\\Shell\\Open\\Command\\(Default)%' OR TargetObject ILIKE '%\\Environment\\UserInitMprLogonScript%' OR TargetObject ILIKE '%\\SOFTWARE\\Policies\\Microsoft\\Windows\\Control Panel\\Desktop\\Scrnsave.exe%' OR TargetObject ILIKE '%\\Software\\Microsoft\\Internet Explorer\\UrlSearchHooks%' OR TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Internet Explorer\\Desktop\\Components%' OR TargetObject ILIKE '%\\Software\\Classes\\Clsid\\{AB8902B4-09CA-4bb6-B78D-A8F59079A8D5}\\Inprocserver32%' OR TargetObject ILIKE '%\\Control Panel\\Desktop\\Scrnsave.exe%') AND (NOT (Details='(Empty)' OR isNull(Details) OR Image ILIKE 'C:\\Windows\\System32\\poqexec.exe')) AND (NOT (((TargetObject ILIKE '%\\Office\\ClickToRun\\REGISTRY\\MACHINE\\Software\\Classes\\PROTOCOLS\\Handler\\%' OR TargetObject ILIKE '%\\ClickToRunStore\\HKMU\\SOFTWARE\\Classes\\PROTOCOLS\\Handler\\%') OR (Details IN ('{314111c7-a502-11d2-bbca-00c04f8ec294}', '{3459B272-CC19-4448-86C9-DDC3B4B2FAD3}', '{42089D2D-912D-4018-9087-2B87803E93FB}', '{5504BE45-A83B-4808-900A-3A5C36E7F77A}', '{807583E5-5146-11D5-A672-00B0D022E945}'))) OR TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{8A69D345-D564-463c-AFF1-A69D9E530F96}%' OR TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{9459C573-B17A-45AE-9F64-1857B5D58CEE}%' OR TargetObject ILIKE '%\\Software\\Microsoft\\Active Setup\\Installed Components\\{89820200-ECBD-11cf-8B85-00AA005B4383}%' OR (Image IN ('C:\\Program Files (x86)\\Microsoft Office\\root\\integration\\integrator.exe', 'C:\\Program Files\\Microsoft Office\\root\\integration\\integrator.exe')) OR ((Image ILIKE 'C:\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\%' OR Image ILIKE 'C:\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\Updates\\%') AND Image ILIKE '%\\OfficeClickToRun.exe')))
