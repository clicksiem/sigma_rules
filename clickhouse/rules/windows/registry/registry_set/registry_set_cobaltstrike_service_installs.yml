rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\System\\CurrentControlSet\\Services%' OR (TargetObject ILIKE '%\\System\\ControlSet%' AND TargetObject ILIKE '%\\Services%')) AND ((Details ILIKE '%ADMIN$%' AND Details ILIKE '%.exe%') OR (Details ILIKE '%\%COMSPEC\%%' AND Details ILIKE '%start%' AND Details ILIKE '%powershell%'))
