id: 966315ef-c5e1-4767-ba25-fce9c8de3660
name: Suspicious Environment Variable Has Been Registered
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.persistence
- attack.stealth
rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\Environment\\%' AND ((Details IN ('powershell', 'pwsh')) OR (Details ILIKE '%\\AppData\\Local\\Temp\\%' OR Details ILIKE '%C:\\Users\\Public\\%' OR Details ILIKE '%TVqQAAMAAAAEAAAA%' OR Details ILIKE '%TVpQAAIAAAAEAA8A%' OR Details ILIKE '%TVqAAAEAAAAEABAA%' OR Details ILIKE '%TVoAAAAAAAAAAAAA%' OR Details ILIKE '%TVpTAQEAAAAEAAAA%' OR Details ILIKE '%SW52b2tlL%' OR Details ILIKE '%ludm9rZS%' OR Details ILIKE '%JbnZva2Ut%' OR Details ILIKE '%SQBuAHYAbwBrAGUALQ%' OR Details ILIKE '%kAbgB2AG8AawBlAC0A%' OR Details ILIKE '%JAG4AdgBvAGsAZQAtA%') OR (Details ILIKE 'SUVY%' OR Details ILIKE 'SQBFAF%' OR Details ILIKE 'SQBuAH%' OR Details ILIKE 'cwBhA%' OR Details ILIKE 'aWV4%' OR Details ILIKE 'aQBlA%' OR Details ILIKE 'R2V0%' OR Details ILIKE 'dmFy%' OR Details ILIKE 'dgBhA%' OR Details ILIKE 'dXNpbm%' OR Details ILIKE 'H4sIA%' OR Details ILIKE 'Y21k%' OR Details ILIKE 'cABhAH%' OR Details ILIKE 'Qzpc%' OR Details ILIKE 'Yzpc%'))
