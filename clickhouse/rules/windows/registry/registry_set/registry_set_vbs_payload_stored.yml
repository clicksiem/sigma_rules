id: 46490193-1b22-4c29-bdd6-5bf63907216f
name: VBScript Payload Stored in Registry
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%Software\\Microsoft\\Windows\\CurrentVersion%' AND (Details ILIKE '%vbscript:%' OR Details ILIKE '%jscript:%' OR Details ILIKE '%mshtml,%' OR Details ILIKE '%RunHTMLApplication%' OR Details ILIKE '%Execute(%' OR Details ILIKE '%CreateObject%' OR Details ILIKE '%window.close%')) AND (NOT (TargetObject ILIKE '%Software\\Microsoft\\Windows\\CurrentVersion\\Run%' OR (Image ILIKE '%\\msiexec.exe' AND TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Installer\\UserData\\%' AND (Details ILIKE '%\\Microsoft.NET\\Primary Interop Assemblies\\Microsoft.mshtml.dll%' OR Details ILIKE '%<\\Microsoft.mshtml,fileVersion=%' OR Details ILIKE '%\_mshtml\_dll\_%' OR Details ILIKE '%<\\Microsoft.mshtml,culture=%'))))
