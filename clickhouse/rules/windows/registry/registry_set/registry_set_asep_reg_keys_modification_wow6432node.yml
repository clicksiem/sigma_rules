id: b29aed60-ebd1-442b-9cb5-16a1d0324adb
name: Wow6432Node CurrentVersion Autorun Keys Modification
level: 5
size: '>0'
active: true
author:
- Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\SOFTWARE\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion%' AND (TargetObject ILIKE '%\\ShellServiceObjectDelayLoad%' OR TargetObject ILIKE '%\\Run\\%' OR TargetObject ILIKE '%\\RunOnce\\%' OR TargetObject ILIKE '%\\RunOnceEx\\%' OR TargetObject ILIKE '%\\RunServices\\%' OR TargetObject ILIKE '%\\RunServicesOnce\\%' OR TargetObject ILIKE '%\\Explorer\\ShellServiceObjects%' OR TargetObject ILIKE '%\\Explorer\\ShellIconOverlayIdentifiers%' OR TargetObject ILIKE '%\\Explorer\\ShellExecuteHooks%' OR TargetObject ILIKE '%\\Explorer\\SharedTaskScheduler%' OR TargetObject ILIKE '%\\Explorer\\Browser Helper Objects%')) AND (NOT (Details='(Empty)' OR isNull(Details) OR Details ILIKE '"C:\\ProgramData\\Package Cache\\{d21a4f20-968a-4b0c-bf04-a38da5f06e41}\\windowsdesktop-runtime-%' OR (Image ILIKE '%\\VC\_redist.x64.exe' AND Details ILIKE '%}\\VC\_redist.x64.exe" /burn.runonce') OR ((Image ILIKE 'C:\\ProgramData\\Package Cache%' OR Image ILIKE 'C:\\Windows\\Temp\\%') AND (Image ILIKE '%\\winsdksetup.exe%' OR Image ILIKE '%\\windowsdesktop-runtime-%' OR Image ILIKE '%\\AspNetCoreSharedFrameworkBundle-%') AND Details ILIKE '% /burn.runonce') OR (Image ILIKE 'C:\\Windows\\Installer\\MSI%' AND TargetObject ILIKE '%\\Explorer\\Browser Helper Objects%') OR (Image ILIKE 'C:\\WINDOWS\\system32\\msiexec.exe' AND TargetObject ILIKE '%\\SOFTWARE\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\Run\\%') OR (Image ILIKE '%C:\\Program Files (x86)\\Microsoft\\EdgeUpdate\\Install\\{%' AND Image ILIKE '%\\setup.exe%'))) AND (NOT ((Image ILIKE 'C:\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\OfficeClickToRun.exe' AND TargetObject ILIKE '%\\Office\\ClickToRun\\REGISTRY\\MACHINE\\Software\\Wow6432Node\\%') OR ((Image IN ('C:\\Program Files\\Microsoft Office\\root\\integration\\integrator.exe', 'C:\\Program Files (x86)\\Microsoft Office\\root\\integration\\integrator.exe')) AND TargetObject ILIKE '%\\Explorer\\Browser Helper Objects\\{31D09BA0-12F5-4CCE-BE8A-2923E76605DA}\\%') OR (Details ILIKE '%-A251-47B7-93E1-CDD82E34AF8B}' OR Details='grpconv -o' OR (Details ILIKE '%C:\\Program Files%' AND Details ILIKE '%\\Dropbox\\Client\\Dropbox.exe%' AND Details ILIKE '% /systemstartup%')) OR TargetObject ILIKE '%\\Explorer\\Browser Helper Objects\\{92EF2EAD-A7CE-4424-B0DB-499CF856608E}\\NoExplorer' OR (Image ILIKE '%\\windowsdesktop-runtime-%' AND (TargetObject ILIKE '%\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\RunOnce\\{e2d1ae32-dd1d-4ad7-a298-10e42e7840fc}' OR TargetObject ILIKE '%\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\RunOnce\\{7037b699-7382-448c-89a7-4765961d2537}') AND Details ILIKE '"C:\\ProgramData\\Package Cache\\%' AND Details ILIKE '%.exe" /burn.runonce') OR ((Image ILIKE 'C:\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\%' OR Image ILIKE 'C:\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\Updates\\%') AND Image ILIKE '%\\OfficeClickToRun.exe') OR (TargetObject ILIKE '%\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Run\\Discord' AND Details ILIKE '%Discord.exe --checkInstall') OR (Details ILIKE '%\\Avira.OE.Setup.Bundle.exe" /burn.runonce' AND Image ILIKE '%\\Avira.OE.Setup.Bundle.exe') OR (Image ILIKE '%\\instup.exe' AND TargetObject ILIKE '%\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\RunOnce\\AvRepair' AND Details ILIKE '%instup.exe" /instop:repair /wait') OR (Image ILIKE '%\\instup.exe' AND (TargetObject ILIKE '%\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Explorer\\ShellIconOverlayIdentifiers\\00avg\\(Default)' OR TargetObject ILIKE '%\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Explorer\\ShellIconOverlayIdentifiers\\00asw\\(Default)') AND (Details IN ('{472083B1-C522-11CF-8763-00608CC02F24}', '{472083B0-C522-11CF-8763-00608CC02F24}')))))
