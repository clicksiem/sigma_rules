id: cbf93e5d-ca6c-4722-8bea-e9119007c248
name: CurrentVersion NT Autorun Keys Modification
level: 5
size: '>0'
active: true
author:
- Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion%' AND (TargetObject ILIKE '%\\Winlogon\\VmApplet%' OR TargetObject ILIKE '%\\Winlogon\\Userinit%' OR TargetObject ILIKE '%\\Winlogon\\Taskman%' OR TargetObject ILIKE '%\\Winlogon\\Shell%' OR TargetObject ILIKE '%\\Winlogon\\GpExtensions%' OR TargetObject ILIKE '%\\Winlogon\\AppSetup%' OR TargetObject ILIKE '%\\Winlogon\\AlternateShells\\AvailableShells%' OR TargetObject ILIKE '%\\Windows\\IconServiceLib%' OR TargetObject ILIKE '%\\Windows\\Appinit\_Dlls%' OR TargetObject ILIKE '%\\Image File Execution Options%' OR TargetObject ILIKE '%\\Font Drivers%' OR TargetObject ILIKE '%\\Drivers32%' OR TargetObject ILIKE '%\\Windows\\Run%' OR TargetObject ILIKE '%\\Windows\\Load%')) AND (NOT (Details='(Empty)' OR isNull(Details) OR Image ILIKE 'C:\\Windows\\System32\\poqexec.exe' OR (TargetObject ILIKE '%\\Image File Execution Options\\%' AND (TargetObject ILIKE '%\\DisableExceptionChainValidation' OR TargetObject ILIKE '%\\MitigationOptions')) OR (Image ILIKE 'C:\\Windows\\system32\\svchost.exe' AND (TargetObject ILIKE '%\\Winlogon\\GPExtensions\\{827D319E-6EAC-11D2-A4EA-00C04F79F83A}\\PreviousPolicyAreas%' OR TargetObject ILIKE '%\\Winlogon\\GPExtensions\\{827D319E-6EAC-11D2-A4EA-00C04F79F83A}\\MaxNoGPOListChangesInterval%') AND (Details IN ('DWORD (0x00000001)', 'DWORD (0x00000009)', 'DWORD (0x000003c0)'))) OR (Image ILIKE 'C:\\Windows\\System32\\RuntimeBroker.exe' AND TargetObject ILIKE '%\\runtimebroker.exe\\Microsoft.Windows.ShellExperienceHost%'))) AND (NOT ((Image ILIKE 'C:\\Program Files (x86)\\Microsoft\\Temp\\%' AND Image ILIKE '%\\MicrosoftEdgeUpdate.exe') OR ((Image ILIKE 'C:\\Program Files (x86)\\Avira\\Antivirus\\avguard.exe%' OR Image ILIKE 'C:\\Program Files\\Avira\\Antivirus\\avguard.exe%') AND TargetObject ILIKE '%SOFTWARE\\WOW6432Node\\Avira\\Antivirus\\Overwrite\_Keys\\HKEY\_LOCAL\_MACHINE\\Software\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\%' AND (TargetObject ILIKE '%\\userinit\\UseAsDefault' OR TargetObject ILIKE '%\\shell\\UseAsDefault') AND (Details IN ('explorer.exe', 'C:\\Windows\\system32\\userinit.exe,'))) OR ((TargetObject ILIKE '%\\ClickToRunStore\\HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\%' OR TargetObject ILIKE '%\\ClickToRun\\REGISTRY\\MACHINE\\Software\\Microsoft\\Windows NT\\CurrentVersion\\%') OR (Image IN ('C:\\Program Files\\Microsoft Office\\root\\integration\\integrator.exe', 'C:\\Program Files (x86)\\Microsoft Office\\root\\integration\\integrator.exe'))) OR ((Image ILIKE 'C:\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\%' OR Image ILIKE 'C:\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\Updates\\%') AND Image ILIKE '%\\OfficeClickToRun.exe') OR (Image ILIKE 'C:\\Windows\\Microsoft.NET\\Framework%' AND Image ILIKE '%\\ngen.exe') OR (Image ILIKE '%\\AppData\\Local\\Microsoft\\OneDrive\\StandaloneUpdater\\OneDriveSetup.exe' AND TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\RunOnce\\Delete Cached Update Binary' AND Details ILIKE 'C:\\Windows\\system32\\cmd.exe /q /c del /q "C:\\Users\\%' AND Details ILIKE '%\\AppData\\Local\\Microsoft\\OneDrive\\Update\\OneDriveSetup.exe"')))
