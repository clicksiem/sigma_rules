rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\AppCompatFlags\\Custom\\%' AND (TargetObject ILIKE '%\\csrss.exe' OR TargetObject ILIKE '%\\dllhost.exe' OR TargetObject ILIKE '%\\explorer.exe' OR TargetObject ILIKE '%\\RuntimeBroker.exe' OR TargetObject ILIKE '%\\services.exe' OR TargetObject ILIKE '%\\sihost.exe' OR TargetObject ILIKE '%\\svchost.exe' OR TargetObject ILIKE '%\\taskhostw.exe' OR TargetObject ILIKE '%\\winlogon.exe' OR TargetObject ILIKE '%\\WmiPrvSe.exe')
