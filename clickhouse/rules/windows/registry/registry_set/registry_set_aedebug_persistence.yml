id: 092af964-4233-4373-b4ba-d86ea2890288
name: Add Debugger Entry To AeDebug For Persistence
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.persistence
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\AeDebug\\Debugger%' AND Details ILIKE '%.dll') AND (NOT Details ILIKE '"C:\\WINDOWS\\system32\\vsjitdebugger.exe" -p \%ld -e \%ld -j 0x\%p')
