id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
name: RDP Sensitive Settings Changed
level: 8
size: '>0'
active: true
author:
- Samir Bousseaden, David ANDRE, Roberto Rodriguez @Cyb3rWard0g, Nasreddine Bencherchali
group: windows
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
rule: SELECT * FROM logs WHERE (((TargetObject ILIKE '%\\Control\\Terminal Server\\%' OR TargetObject ILIKE '%\\Windows NT\\Terminal Services\\%') AND TargetObject ILIKE '%\\Shadow' AND (Details IN ('DWORD (0x00000001)', 'DWORD (0x00000002)', 'DWORD (0x00000003)', 'DWORD (0x00000004)'))) OR ((TargetObject ILIKE '%\\Control\\Terminal Server\\%' OR TargetObject ILIKE '%\\Windows NT\\Terminal Services\\%') AND (TargetObject ILIKE '%\\DisableRemoteDesktopAntiAlias' OR TargetObject ILIKE '%\\DisableSecuritySettings' OR TargetObject ILIKE '%\\fAllowUnsolicited' OR TargetObject ILIKE '%\\fAllowUnsolicitedFullControl') AND Details='DWORD (0x00000001)') OR (TargetObject ILIKE '%\\Control\\Terminal Server\\InitialProgram%' OR TargetObject ILIKE '%\\Control\\Terminal Server\\WinStations\\RDP-Tcp\\InitialProgram%' OR TargetObject ILIKE '%\\services\\TermService\\Parameters\\ServiceDll%' OR TargetObject ILIKE '%\\Terminal Server\\WinStations\\RDP-Tcp\\SecurityLayer%' OR TargetObject ILIKE '%\\Windows NT\\Terminal Services\\InitialProgram%')) AND (NOT (TargetObject ILIKE '%\\SecurityLayer' AND Details='DWORD (0x00000002)'))
