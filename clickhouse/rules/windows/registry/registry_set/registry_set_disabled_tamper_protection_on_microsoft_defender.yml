id: 93d298a1-d28f-47f1-a468-d971e7796679
name: Disable Tamper Protection on Windows Defender
level: 5
size: '>0'
active: true
author:
- Austin Songer @austinsonger
group: windows
tags:
- attack.defense-impairment
- attack.t1685
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\Microsoft\\Windows Defender\\Features\\TamperProtection%' AND Details='DWORD (0x00000000)') AND (NOT ((Image ILIKE 'C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\%' AND Image ILIKE '%\\MsMpEng.exe') OR Image ILIKE 'C:\\Program Files\\Windows Defender\\MsMpEng.exe'))
