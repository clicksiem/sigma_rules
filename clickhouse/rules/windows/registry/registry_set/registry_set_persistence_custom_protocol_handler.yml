rule: SELECT * FROM logs WHERE (TargetObject ILIKE 'HKCR\\%' AND Details ILIKE 'URL:%') AND (NOT (Details ILIKE 'URL:ms-%' OR (Image ILIKE 'C:\\Program Files (x86)%' OR Image ILIKE 'C:\\Program Files\\%' OR Image ILIKE 'C:\\Windows\\System32\\%' OR Image ILIKE 'C:\\Windows\\SysWOW64\\%')))
