rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%Classes\\ActivatableClasses\\Package\\Microsoft.%' AND TargetObject ILIKE '%\\DebugPath') OR (TargetObject ILIKE '%\\Software\\Microsoft\\Windows\\CurrentVersion\\PackagedAppXDebug\\Microsoft.%' AND TargetObject ILIKE '%\\(Default)')
