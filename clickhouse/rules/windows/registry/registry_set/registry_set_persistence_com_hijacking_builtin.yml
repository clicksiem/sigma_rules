rule: SELECT * FROM logs WHERE ((TargetObject ILIKE '%\\CLSID\\%' AND (TargetObject ILIKE '%\\InprocServer32\\(Default)' OR TargetObject ILIKE '%\\LocalServer32\\(Default)')) AND (TargetObject ILIKE '%\\{1f486a52-3cb1-48fd-8f50-b8dc300d9f9d}\\%' OR TargetObject ILIKE '%\\{2155fee3-2419-4373-b102-6843707eb41f}\\%' OR TargetObject ILIKE '%\\{4590f811-1d3a-11d0-891f-00aa004b2e24}\\%' OR TargetObject ILIKE '%\\{4de225bf-cf59-4cfc-85f7-68b90f185355}\\%' OR TargetObject ILIKE '%\\{ddc05a5a-351a-4e06-8eaf-54ec1bc2dcea}\\%' OR TargetObject ILIKE '%\\{F56F6FDD-AA9D-4618-A949-C1B91AF43B1A}\\%' OR TargetObject ILIKE '%\\{F82B4EF1-93A9-4DDE-8015-F7950A1A6E31}\\%' OR TargetObject ILIKE '%\\{7849596a-48ea-486e-8937-a2a3009f31a9}\\%' OR TargetObject ILIKE '%\\{0b91a74b-ad7c-4a9d-b563-29eef9167172}\\%' OR TargetObject ILIKE '%\\{603D3801-BD81-11d0-A3A5-00C04FD706EC}\\%' OR TargetObject ILIKE '%\\{30D49246-D217-465F-B00B-AC9DDD652EB7}\\%' OR TargetObject ILIKE '%\\{A7A63E5C-3877-4840-8727-C1EA9D7A4D50}\\%' OR TargetObject ILIKE '%\\{2227A280-3AEA-1069-A2DE-08002B30309D}\\%' OR TargetObject ILIKE '%\\{2DEA658F-54C1-4227-AF9B-260AB5FC3543}\\%' OR TargetObject ILIKE '%\\{AA509086-5Ca9-4C25-8F95-589D3C07B48A}\\%')) AND ((Details ILIKE '%:\\Perflogs\\%' OR Details ILIKE '%\\AppData\\Local\\%' OR Details ILIKE '%\\Desktop\\%' OR Details ILIKE '%\\Downloads\\%' OR Details ILIKE '%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\%' OR Details ILIKE '%\\System32\\spool\\drivers\\color\\%' OR Details ILIKE '%\\Temporary Internet%' OR Details ILIKE '%\\Users\\Public\\%' OR Details ILIKE '%\\Windows\\Temp\\%' OR Details ILIKE '%\%appdata\%%' OR Details ILIKE '%\%temp\%%' OR Details ILIKE '%\%tmp\%%') OR ((Details ILIKE '%:\\Users\\%' AND Details ILIKE '%\\Favorites\\%') OR (Details ILIKE '%:\\Users\\%' AND Details ILIKE '%\\Favourites\\%') OR (Details ILIKE '%:\\Users\\%' AND Details ILIKE '%\\Contacts\\%') OR (Details ILIKE '%:\\Users\\%' AND Details ILIKE '%\\Pictures\\%')))
