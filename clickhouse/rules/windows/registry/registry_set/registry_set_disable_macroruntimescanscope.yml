rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\SOFTWARE\\%' AND TargetObject ILIKE '%\\Microsoft\\Office\\%' AND TargetObject ILIKE '%\\Common\\Security%') AND TargetObject ILIKE '%\\MacroRuntimeScanScope' AND Details='DWORD (0x00000000)'
