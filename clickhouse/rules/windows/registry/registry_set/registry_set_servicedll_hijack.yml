id: 612e47e9-8a59-43a6-b404-f48683f45bd6
name: ServiceDll Hijack
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
rule: SELECT * FROM logs WHERE ((TargetObject ILIKE '%\\System\\%' AND TargetObject ILIKE '%ControlSet%' AND TargetObject ILIKE '%\\Services\\%') AND TargetObject ILIKE '%\\Parameters\\ServiceDll') AND (NOT (Details ILIKE 'C:\\Windows\\system32\\spool\\drivers\\x64\\3\\PrintConfig.dll' OR (Image ILIKE 'C:\\Windows\\system32\\lsass.exe' AND TargetObject ILIKE '%\\Services\\NTDS\\Parameters\\ServiceDll' AND Details ILIKE '\%\%systemroot\%\%\\system32\\ntdsa.dll') OR Image ILIKE 'C:\\Windows\\System32\\poqexec.exe')) AND (NOT (Image ILIKE '%\\regsvr32.exe' AND Details ILIKE 'C:\\Windows\\System32\\STAgent.dll'))
