id: 3fd4c8d7-8362-4557-a8e6-83b29cc0d724
name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems), Michael Haag (idea)
group: windows
tags:
- attack.stealth
rule: SELECT * FROM logs WHERE TargetObject ILIKE '%\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\\ZoneMap\\ProtocolDefaults%' AND (TargetObject ILIKE '%\\http' OR TargetObject ILIKE '%\\https') AND Details ILIKE '%DWORD (0x00000000)%'
