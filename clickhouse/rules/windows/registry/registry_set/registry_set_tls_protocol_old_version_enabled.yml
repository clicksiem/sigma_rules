rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.0\\%' OR TargetObject ILIKE '%\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.1\\%') AND TargetObject ILIKE '%\\Enabled' AND Details='DWORD (0x00000001)'
