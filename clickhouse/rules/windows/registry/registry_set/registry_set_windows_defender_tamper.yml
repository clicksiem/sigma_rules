id: 0eb46774-f1ab-4a74-8238-1155855f2263
name: Disable Windows Defender Functionalities Via Registry Keys
level: 8
size: '>0'
active: true
author:
- AlertIQ, Ján Trenčanský, frack113, Nasreddine Bencherchali, Swachchhanda Shrawan Poudel
group: windows
tags:
- attack.defense-impairment
- attack.t1685
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\SOFTWARE\\Microsoft\\Windows Defender\\%' OR TargetObject ILIKE '%\\SOFTWARE\\Policies\\Microsoft\\Windows Defender Security Center\\%' OR TargetObject ILIKE '%\\SOFTWARE\\Policies\\Microsoft\\Windows Defender\\%') AND (((TargetObject ILIKE '%\\DisableAntiSpyware' OR TargetObject ILIKE '%\\DisableAntiVirus' OR TargetObject ILIKE '%\\DisableBehaviorMonitoring' OR TargetObject ILIKE '%\\DisableBlockAtFirstSeen' OR TargetObject ILIKE '%\\DisableEnhancedNotifications' OR TargetObject ILIKE '%\\DisableIntrusionPreventionSystem' OR TargetObject ILIKE '%\\DisableIOAVProtection' OR TargetObject ILIKE '%\\DisableOnAccessProtection' OR TargetObject ILIKE '%\\DisableRealtimeMonitoring' OR TargetObject ILIKE '%\\DisableScanOnRealtimeEnable' OR TargetObject ILIKE '%\\DisableScriptScanning') AND Details='DWORD (0x00000001)') OR ((TargetObject ILIKE '%\\DisallowExploitProtectionOverride' OR TargetObject ILIKE '%\\Features\\TamperProtection' OR TargetObject ILIKE '%\\MpEngine\\MpEnablePus' OR TargetObject ILIKE '%\\PUAProtection' OR TargetObject ILIKE '%\\Signature Update\\ForceUpdateFromMU' OR TargetObject ILIKE '%\\SpyNet\\SpynetReporting' OR TargetObject ILIKE '%\\SpyNet\\SubmitSamplesConsent' OR TargetObject ILIKE '%\\Windows Defender Exploit Guard\\Controlled Folder Access\\EnableControlledFolderAccess') AND Details='DWORD (0x00000000)')) AND (NOT (Image ILIKE 'C:\\Program Files\\Symantec\\Symantec Endpoint Protection\\%' AND Image ILIKE '%\\sepWscSvc64.exe'))
