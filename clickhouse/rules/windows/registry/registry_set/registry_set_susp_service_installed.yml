id: f2485272-a156-4773-82d7-1d178bc4905b
name: Suspicious Service Installed
level: 5
size: '>0'
active: true
author:
- xknow (@xknow_infosec), xorxes (@xor_xes)
group: windows
tags:
- attack.defense-impairment
- attack.t1685
rule: SELECT * FROM logs WHERE (TargetObject IN ('HKLM\\System\\CurrentControlSet\\Services\\NalDrv\\ImagePath', 'HKLM\\System\\CurrentControlSet\\Services\\PROCEXP152\\ImagePath')) AND (NOT ((Image ILIKE '%\\procexp64.exe' OR Image ILIKE '%\\procexp.exe' OR Image ILIKE '%\\procmon64.exe' OR Image ILIKE '%\\procmon.exe' OR Image ILIKE '%\\handle.exe' OR Image ILIKE '%\\handle64.exe') AND Details ILIKE '%\\WINDOWS\\system32\\Drivers\\PROCEXP152.SYS%'))
