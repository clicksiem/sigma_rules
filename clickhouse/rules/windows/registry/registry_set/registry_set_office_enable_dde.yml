rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\Word\\Security\\AllowDDE' AND (Details IN ('DWORD (0x00000001)', 'DWORD (0x00000002)'))) OR ((TargetObject ILIKE '%\\Excel\\Security\\DisableDDEServerLaunch' OR TargetObject ILIKE '%\\Excel\\Security\\DisableDDEServerLookup') AND Details='DWORD (0x00000000)')
