id: 73921b9c-cafd-4446-b0c6-fdb0ace42bc0
name: Windows Credential Guard Disabled - Registry
level: 8
size: '>0'
active: true
author:
- Swachchhanda Shrawan Poudel (Nextron Systems)
group: windows
tags:
- attack.defense-impairment
- attack.t1685
rule: SELECT * FROM logs WHERE (TargetObject ILIKE '%\\DeviceGuard\\EnableVirtualizationBasedSecurity' OR TargetObject ILIKE '%\\DeviceGuard\\LsaCfgFlags' OR TargetObject ILIKE '%\\Lsa\\LsaCfgFlags') AND Details='DWORD (0x00000000)'
