id: 7e9cf7b6-e827-11ed-a05b-0242ac120003
name: Suspicious Non-Browser Network Communication With Google API
level: 5
size: '>0'
active: true
author:
- Gavin Knapp
group: windows
tags:
- attack.command-and-control
- attack.t1102
rule: SELECT * FROM logs WHERE (DestinationHostname ILIKE '%drive.googleapis.com%' OR DestinationHostname ILIKE '%oauth2.googleapis.com%' OR DestinationHostname ILIKE '%sheets.googleapis.com%' OR DestinationHostname ILIKE '%www.googleapis.com%') AND (NOT (isNull(Image) OR Image='')) AND (NOT (Image ILIKE '%\\brave.exe' OR (Image ILIKE '%:\\Program Files\\Google\\Chrome\\Application\\chrome.exe' OR Image ILIKE '%:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe') OR (Image ILIKE '%:\\Program Files\\Google\\Drive File Stream\\%' AND Image ILIKE '%\\GoogleDriveFS.exe') OR (Image ILIKE '%:\\Program Files\\Mozilla Firefox\\firefox.exe' OR Image ILIKE '%:\\Program Files (x86)\\Mozilla Firefox\\firefox.exe') OR (Image ILIKE '%:\\Program Files (x86)\\Internet Explorer\\iexplore.exe' OR Image ILIKE '%:\\Program Files\\Internet Explorer\\iexplore.exe') OR Image ILIKE '%\\maxthon.exe' OR (Image ILIKE '%:\\Program Files (x86)\\Microsoft\\EdgeWebView\\Application\\%' OR (Image ILIKE '%:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe' OR Image ILIKE '%:\\Program Files\\Microsoft\\Edge\\Application\\msedge.exe' OR Image ILIKE '%\\WindowsApps\\MicrosoftEdge.exe')) OR ((Image ILIKE '%:\\Program Files (x86)\\Microsoft\\EdgeCore\\%' OR Image ILIKE '%:\\Program Files\\Microsoft\\EdgeCore\\%') AND (Image ILIKE '%\\msedge.exe' OR Image ILIKE '%\\msedgewebview2.exe')) OR Image ILIKE '%\\opera.exe' OR Image ILIKE '%\\safari.exe' OR Image ILIKE '%\\seamonkey.exe' OR Image ILIKE '%\\vivaldi.exe' OR Image ILIKE '%\\whale.exe' OR Image ILIKE '%\\GoogleUpdate.exe' OR Image ILIKE '%\\outlook.exe'))
