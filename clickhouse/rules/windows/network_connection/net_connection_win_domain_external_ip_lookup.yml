id: edf3485d-dac4-4d50-90e4-b0e5813f7e60
name: Suspicious Network Connection to IP Lookup Service APIs
level: 5
size: '>0'
active: true
author:
- Janantha Marasinghe, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.discovery
- attack.t1016
rule: SELECT * FROM logs WHERE ((DestinationHostname IN ('www.ip.cn', 'l2.io')) OR (DestinationHostname ILIKE '%api.2ip.ua%' OR DestinationHostname ILIKE '%api.bigdatacloud.net%' OR DestinationHostname ILIKE '%api.ipify.org%' OR DestinationHostname ILIKE '%bot.whatismyipaddress.com%' OR DestinationHostname ILIKE '%canireachthe.net%' OR DestinationHostname ILIKE '%checkip.amazonaws.com%' OR DestinationHostname ILIKE '%checkip.dyndns.org%' OR DestinationHostname ILIKE '%curlmyip.com%' OR DestinationHostname ILIKE '%db-ip.com%' OR DestinationHostname ILIKE '%edns.ip-api.com%' OR DestinationHostname ILIKE '%eth0.me%' OR DestinationHostname ILIKE '%freegeoip.app%' OR DestinationHostname ILIKE '%geoipy.com%' OR DestinationHostname ILIKE '%getip.pro%' OR DestinationHostname ILIKE '%icanhazip.com%' OR DestinationHostname ILIKE '%ident.me%' OR DestinationHostname ILIKE '%ifconfig.io%' OR DestinationHostname ILIKE '%ifconfig.me%' OR DestinationHostname ILIKE '%ip-api.com%' OR DestinationHostname ILIKE '%ip.360.cn%' OR DestinationHostname ILIKE '%ip.anysrc.net%' OR DestinationHostname ILIKE '%ip.taobao.com%' OR DestinationHostname ILIKE '%ip.tyk.nu%' OR DestinationHostname ILIKE '%ipaddressworld.com%' OR DestinationHostname ILIKE '%ipapi.co%' OR DestinationHostname ILIKE '%ipconfig.io%' OR DestinationHostname ILIKE '%ipecho.net%' OR DestinationHostname ILIKE '%ipinfo.io%' OR DestinationHostname ILIKE '%ipip.net%' OR DestinationHostname ILIKE '%ipof.in%' OR DestinationHostname ILIKE '%ipv4.icanhazip.com%' OR DestinationHostname ILIKE '%ipv4bot.whatismyipaddress.com%' OR DestinationHostname ILIKE '%ipv6-test.com%' OR DestinationHostname ILIKE '%ipwho.is%' OR DestinationHostname ILIKE '%jsonip.com%' OR DestinationHostname ILIKE '%myexternalip.com%' OR DestinationHostname ILIKE '%seeip.org%' OR DestinationHostname ILIKE '%wgetip.com%' OR DestinationHostname ILIKE '%whatismyip.akamai.com%' OR DestinationHostname ILIKE '%whois.pconline.com.cn%' OR DestinationHostname ILIKE '%wtfismyip.com%')) AND (NOT (Image ILIKE '%\\brave.exe' OR (Image IN ('C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe', 'C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe')) OR (Image IN ('C:\\Program Files\\Mozilla Firefox\\firefox.exe', 'C:\\Program Files (x86)\\Mozilla Firefox\\firefox.exe')) OR (Image IN ('C:\\Program Files (x86)\\Internet Explorer\\iexplore.exe', 'C:\\Program Files\\Internet Explorer\\iexplore.exe')) OR Image ILIKE '%\\maxthon.exe' OR (Image ILIKE 'C:\\Program Files (x86)\\Microsoft\\EdgeWebView\\Application\\%' OR Image ILIKE '%\\WindowsApps\\MicrosoftEdge.exe' OR (Image IN ('C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe', 'C:\\Program Files\\Microsoft\\Edge\\Application\\msedge.exe'))) OR ((Image ILIKE 'C:\\Program Files (x86)\\Microsoft\\EdgeCore\\%' OR Image ILIKE 'C:\\Program Files\\Microsoft\\EdgeCore\\%') AND (Image ILIKE '%\\msedge.exe' OR Image ILIKE '%\\msedgewebview2.exe')) OR Image ILIKE '%\\opera.exe' OR Image ILIKE '%\\safari.exe' OR Image ILIKE '%\\seamonkey.exe' OR Image ILIKE '%\\vivaldi.exe' OR Image ILIKE '%\\whale.exe'))
