id: 5c80b618-0dbb-46e6-acbb-03d90bcb6d83
name: Network Connection Initiated To AzureWebsites.NET By Non-Browser Process
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.command-and-control
- attack.t1102
- attack.t1102.001
rule: SELECT * FROM logs WHERE (Initiated='true' AND DestinationHostname ILIKE '%azurewebsites.net') AND (NOT ((Image IN ('C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe', 'C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe')) OR (Image ILIKE 'C:\\Users\\%' AND Image ILIKE '%\\AppData\\Local\\Google\\Chrome\\Application\\chrome.exe') OR (Image IN ('C:\\Program Files\\Mozilla Firefox\\firefox.exe', 'C:\\Program Files (x86)\\Mozilla Firefox\\firefox.exe')) OR (Image ILIKE 'C:\\Users\\%' AND Image ILIKE '%\\AppData\\Local\\Mozilla Firefox\\firefox.exe') OR (Image IN ('C:\\Program Files (x86)\\Internet Explorer\\iexplore.exe', 'C:\\Program Files\\Internet Explorer\\iexplore.exe')) OR (Image ILIKE 'C:\\Program Files (x86)\\Microsoft\\EdgeWebView\\Application\\%' OR Image ILIKE '%\\WindowsApps\\MicrosoftEdge.exe' OR (Image IN ('C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe', 'C:\\Program Files\\Microsoft\\Edge\\Application\\msedge.exe'))) OR ((Image ILIKE 'C:\\Program Files (x86)\\Microsoft\\EdgeCore\\%' OR Image ILIKE 'C:\\Program Files\\Microsoft\\EdgeCore\\%') AND (Image ILIKE '%\\msedge.exe' OR Image ILIKE '%\\msedgewebview2.exe')) OR ((Image ILIKE '%C:\\Program Files (x86)\\Safari\\%' OR Image ILIKE '%C:\\Program Files\\Safari\\%') AND Image ILIKE '%\\safari.exe') OR ((Image ILIKE '%C:\\Program Files\\Windows Defender Advanced Threat Protection\\%' OR Image ILIKE '%C:\\Program Files\\Windows Defender\\%' OR Image ILIKE '%C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\%') AND (Image ILIKE '%\\MsMpEng.exe' OR Image ILIKE '%\\MsSense.exe')) OR (Image ILIKE '%C:\\Program Files (x86)\\PRTG Network Monitor\\PRTG Probe.exe' OR Image ILIKE '%C:\\Program Files\\PRTG Network Monitor\\PRTG Probe.exe') OR (Image ILIKE 'C:\\Program Files\\BraveSoftware\\%' AND Image ILIKE '%\\brave.exe') OR (Image ILIKE '%\\AppData\\Local\\Maxthon\\%' AND Image ILIKE '%\\maxthon.exe') OR (Image ILIKE '%\\AppData\\Local\\Programs\\Opera\\%' AND Image ILIKE '%\\opera.exe') OR ((Image ILIKE 'C:\\Program Files\\SeaMonkey\\%' OR Image ILIKE 'C:\\Program Files (x86)\\SeaMonkey\\%') AND Image ILIKE '%\\seamonkey.exe') OR (Image ILIKE '%\\AppData\\Local\\Vivaldi\\%' AND Image ILIKE '%\\vivaldi.exe') OR ((Image ILIKE 'C:\\Program Files\\Naver\\Naver Whale\\%' OR Image ILIKE 'C:\\Program Files (x86)\\Naver\\Naver Whale\\%') AND Image ILIKE '%\\whale.exe') OR ((Image ILIKE 'C:\\Program Files\\Waterfox\\%' OR Image ILIKE 'C:\\Program Files (x86)\\Waterfox\\%') AND Image ILIKE '%\\Waterfox.exe') OR ((Image ILIKE 'C:\\Program Files\\SlimBrowser\\%' OR Image ILIKE 'C:\\Program Files (x86)\\SlimBrowser\\%') AND Image ILIKE '%\\slimbrowser.exe') OR (Image ILIKE '%\\AppData\\Local\\Flock\\%' AND Image ILIKE '%\\Flock.exe') OR (Image ILIKE '%\\AppData\\Local\\Phoebe\\%' AND Image ILIKE '%\\Phoebe.exe') OR ((Image ILIKE 'C:\\Program Files\\Falkon\\%' OR Image ILIKE 'C:\\Program Files (x86)\\Falkon\\%') AND Image ILIKE '%\\falkon.exe') OR ((Image ILIKE 'C:\\Program Files (x86)\\QtWeb\\%' OR Image ILIKE 'C:\\Program Files\\QtWeb\\%') AND Image ILIKE '%\\QtWeb.exe') OR ((Image ILIKE 'C:\\Program Files (x86)\\Avant Browser\\%' OR Image ILIKE 'C:\\Program Files\\Avant Browser\\%') AND Image ILIKE '%\\avant.exe') OR (Image ILIKE '%\\AppData\\Local\\Discord\\%' AND Image ILIKE '%\\Discord.exe') OR isNull(Image) OR Image=''))
