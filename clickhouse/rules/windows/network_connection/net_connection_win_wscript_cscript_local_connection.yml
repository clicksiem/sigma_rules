id: 08249dc0-a28d-4555-8ba5-9255a198e08c
name: Local Network Connection Initiated By Script Interpreter
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.command-and-control
- attack.t1105
rule: SELECT * FROM logs WHERE Initiated='true' AND (Image ILIKE '%\\wscript.exe' OR Image ILIKE '%\\cscript.exe') AND (isIPAddressInRange(DestinationIp, '127.0.0.0/8') OR isIPAddressInRange(DestinationIp, '10.0.0.0/8') OR isIPAddressInRange(DestinationIp, '172.16.0.0/12') OR isIPAddressInRange(DestinationIp, '192.168.0.0/16') OR isIPAddressInRange(DestinationIp, '169.254.0.0/16') OR isIPAddressInRange(DestinationIp, '::1/128') OR isIPAddressInRange(DestinationIp, 'fe80::/10') OR isIPAddressInRange(DestinationIp, 'fc00::/7'))
