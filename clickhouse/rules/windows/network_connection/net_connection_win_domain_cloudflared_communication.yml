id: 7cd1dcdc-6edf-4896-86dc-d1f19ad64903
name: Network Connection Initiated To Cloudflared Tunnels Domains
level: 5
size: '>0'
active: true
author:
- Kamran Saifullah, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.exfiltration
- attack.command-and-control
