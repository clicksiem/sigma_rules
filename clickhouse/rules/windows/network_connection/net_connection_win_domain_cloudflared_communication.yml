rule: SELECT * FROM logs WHERE Initiated='true' AND (DestinationHostname ILIKE '%.v2.argotunnel.com' OR DestinationHostname ILIKE '%protocol-v2.argotunnel.com' OR DestinationHostname ILIKE '%trycloudflare.com' OR DestinationHostname ILIKE '%update.argotunnel.com')
