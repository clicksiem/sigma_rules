id: f8931561-97f5-4c46-907f-0a4a592e47a7
name: CodeIntegrity - Unmet Signing Level Requirements By File Under Validation
level: 3
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
rule: SELECT * FROM logs WHERE (EventID IN (3033, 3034)) AND (NOT (FileNameBuffer ILIKE '%\\Windows\\assembly\\GAC\\%' AND ProcessNameBuffer ILIKE '%\\mscorsvw.exe' AND ProcessNameBuffer ILIKE '%\\Windows\\Microsoft.NET\\%' AND RequestedPolicy=8)) AND (NOT ((FileNameBuffer ILIKE '%\\Program Files\\DTrace\\dtrace.dll' AND ProcessNameBuffer ILIKE '%\\Windows\\System32\\svchost.exe' AND RequestedPolicy=12) OR (FileNameBuffer ILIKE '%\\Windows\\System32\\DriverStore\\FileRepository\\%' AND FileNameBuffer ILIKE '%\\igd10iumd64.dll' AND RequestedPolicy=7) OR (FileNameBuffer ILIKE '%\\Windows\\System32\\nvspcap64.dll' AND (ProcessNameBuffer ILIKE '%\\AppData\\Local\\Keybase\\Gui\\Keybase.exe' OR ProcessNameBuffer ILIKE '%\\Microsoft\\Teams\\stage\\Teams.exe') AND RequestedPolicy=8) OR (FileNameBuffer ILIKE '%\\Program Files\\Bonjour\\mdnsNSP.dll' AND (ProcessNameBuffer ILIKE '%\\Windows\\System32\\svchost.exe' OR ProcessNameBuffer ILIKE '%\\Windows\\System32\\SIHClient.exe') AND (RequestedPolicy IN (8, 12))) OR (FileNameBuffer ILIKE '%\\Microsoft Office\\root\\vfs\\ProgramFilesCommonX64\\Microsoft Shared\\OFFICE%' AND FileNameBuffer ILIKE '%\\MSOXMLMF.DLL' AND RequestedPolicy=7) OR (ProcessNameBuffer ILIKE '%\\Program Files\\Microsoft Office\\root\\vfs\\ProgramFilesCommonX64\\Microsoft Shared\\Office%' AND FileNameBuffer ILIKE '%\\Windows\\System32\\%' AND RequestedPolicy=8) OR (FileNameBuffer ILIKE '%\\Windows\\System32\\nvspcap64.dll' AND ProcessNameBuffer ILIKE '%\\AppData\\Local\\slack\\app-%' AND ProcessNameBuffer ILIKE '%\\slack.exe' AND RequestedPolicy=8) OR ((FileNameBuffer ILIKE '%\\Mozilla Firefox\\mozavcodec.dll' OR FileNameBuffer ILIKE '%\\Mozilla Firefox\\mozavutil.dll') AND ProcessNameBuffer ILIKE '%\\Mozilla Firefox\\firefox.exe' AND RequestedPolicy=8) OR ((FileNameBuffer ILIKE '%\\Program Files\\Avast Software\\Avast\\aswAMSI.dll' OR FileNameBuffer ILIKE '%\\Program Files (x86)\\Avast Software\\Avast\\aswAMSI.dll') AND (RequestedPolicy IN (8, 12))) OR (FileNameBuffer ILIKE '%\\Program Files\\Google\\Drive File Stream\\%' AND FileNameBuffer ILIKE '%\\crashpad\_handler.exe' AND ProcessNameBuffer ILIKE '%\\Windows\\ImmersiveControlPanel\\SystemSettings.exe' AND RequestedPolicy=8) OR (FileNameBuffer ILIKE '%\\Trend Micro\\Client Server Security Agent\\perficrcperfmonmgr.dll' AND RequestedPolicy=8) OR FileNameBuffer ILIKE '%\\Program Files\\National Instruments\\Shared\\mDNS Responder\\nimdnsNSP.dll ' OR (FileNameBuffer ILIKE '%\\Program Files\\McAfee\\Endpoint Security\\Threat Prevention\\MfeAmsiProvider.dll' OR FileNameBuffer ILIKE '%\\Program Files\\McAfee\\MfeAV\\AMSIExt.dll') OR FileNameBuffer ILIKE '%\\Program Files\\ESET\\ESET Security\\eamsi.dll' OR FileNameBuffer ILIKE '%\\Program Files\\comodo\\comodo internet security\\amsiprovider\_x64.dll' OR (FileNameBuffer ILIKE '%\\Program Files\\SentinelOne\\Sentinel Agent%' OR ProcessNameBuffer ILIKE '%\\Program Files\\SentinelOne\\Sentinel Agent%') OR FileNameBuffer ILIKE '%\\National Instruments\\Shared\\mDNS Responder\\%' OR ((ProcessNameBuffer ILIKE '%\\Kaspersky Lab\\%' AND ProcessNameBuffer ILIKE '%\\avp.exe%') OR (FileNameBuffer ILIKE '%\\Kaspersky Lab\\%' AND FileNameBuffer ILIKE '%\\antimalware\_provider.dll%'))))
