id: 8289bf8c-4aca-4f5a-9db3-dc3d7afe5c10
name: Unsigned Binary Loaded From Suspicious Location
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
rule: SELECT * FROM logs WHERE (EventID IN (11, 12)) AND (ImageName ILIKE '%\\Users\\Public\\%' OR ImageName ILIKE '%\\PerfLogs\\%' OR ImageName ILIKE '%\\Desktop\\%' OR ImageName ILIKE '%\\Downloads\\%' OR ImageName ILIKE '%\\AppData\\Local\\Temp\\%' OR ImageName ILIKE '%C:\\Windows\\TEMP\\%')
