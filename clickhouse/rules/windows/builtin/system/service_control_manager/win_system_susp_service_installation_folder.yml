id: 5e993621-67d4-488a-b9ae-b420d08b96cb
name: Service Installation in Suspicious Folder
level: 5
size: '>0'
active: true
author:
- pH-T (Nextron Systems)
group: windows
tags:
- attack.persistence
- attack.privilege-escalation
- car.2013-09-005
- attack.t1543.003
rule: SELECT * FROM logs WHERE (Provider_Name='Service Control Manager' AND EventID=7045 AND (ImagePath ILIKE '%\\AppData\\%' OR ImagePath ILIKE '%\\\\127.0.0.1%' OR ImagePath ILIKE '%\\\\localhost%')) AND (NOT (ServiceName='Zoom Sharing Service' AND ImagePath ILIKE '%:\\Program Files\\Common Files\\Zoom\\Support\\CptService.exe%'))
