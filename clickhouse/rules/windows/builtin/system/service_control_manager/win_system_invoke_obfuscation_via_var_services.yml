rule: SELECT * FROM logs WHERE Provider_Name='Service Control Manager' AND EventID=7045 AND (ImagePath ILIKE '%&&set%' AND ImagePath ILIKE '%cmd%' AND ImagePath ILIKE '%/c%' AND ImagePath ILIKE '%-f%') AND (ImagePath ILIKE '%{0}%' OR ImagePath ILIKE '%{1}%' OR ImagePath ILIKE '%{2}%' OR ImagePath ILIKE '%{3}%' OR ImagePath ILIKE '%{4}%' OR ImagePath ILIKE '%{5}%')
