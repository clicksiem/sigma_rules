rule: SELECT * FROM logs WHERE (Provider_Name='Service Control Manager' AND EventID=7045) AND (match(ImagePath, '^[a-zA-Z]:\\windows\\temp\\[a-zA-Z0-9]{10}\.exe') OR (ServiceName IN ('Sliver', 'Sliver implant')))
