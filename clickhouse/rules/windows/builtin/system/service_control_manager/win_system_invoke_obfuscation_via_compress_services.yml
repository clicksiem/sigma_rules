rule: SELECT * FROM logs WHERE Provider_Name='Service Control Manager' AND EventID=7045 AND (ImagePath ILIKE '%new-object%' AND ImagePath ILIKE '%text.encoding]::ascii%' AND ImagePath ILIKE '%readtoend%') AND (ImagePath ILIKE '%:system.io.compression.deflatestream%' OR ImagePath ILIKE '%system.io.streamreader%')
