id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
name: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
level: 8
size: '>0'
active: true
author:
- Teymur Kheirkhabarov, Ecco, Florian Roth (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1134.001
- attack.t1134.002
rule: SELECT * FROM logs WHERE EventID=4697 AND (((ServiceFileName ILIKE '%/c%' AND ServiceFileName ILIKE '%echo%' AND ServiceFileName ILIKE '%\\pipe\\%') AND (ServiceFileName ILIKE '%cmd%' OR ServiceFileName ILIKE '%\%COMSPEC\%%')) OR (ServiceFileName ILIKE '%rundll32%' AND ServiceFileName ILIKE '%.dll,a%' AND ServiceFileName ILIKE '%/p:%') OR ServiceFileName ILIKE '\\\\127.0.0.1\\ADMIN$\\%')
