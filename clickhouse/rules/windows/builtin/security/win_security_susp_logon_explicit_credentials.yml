id: 941e5c45-cda7-4864-8cea-bbb7458d194a
name: Suspicious Remote Logon with Explicit Credentials
level: 5
size: '>0'
active: true
author:
- oscd.community, Teymur Kheirkhabarov @HeirhabarovT, Zach Stanford @svch0st, Tim Shelton
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.initial-access
- attack.stealth
- attack.t1078
- attack.lateral-movement
rule: SELECT * FROM logs WHERE (EventID=4648 AND (ProcessName ILIKE '%\\cmd.exe' OR ProcessName ILIKE '%\\powershell.exe' OR ProcessName ILIKE '%\\pwsh.exe' OR ProcessName ILIKE '%\\winrs.exe' OR ProcessName ILIKE '%\\wmic.exe' OR ProcessName ILIKE '%\\net.exe' OR ProcessName ILIKE '%\\net1.exe' OR ProcessName ILIKE '%\\reg.exe')) AND (NOT (TargetServerName='localhost' OR (SubjectUserName ILIKE '%$' AND TargetUserName ILIKE '%$')))
