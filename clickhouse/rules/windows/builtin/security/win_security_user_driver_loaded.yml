id: f63508a0-c809-4435-b3be-ed819394d612
name: Potential Privileged System Service Operation - SeLoadDriverPrivilege
level: 5
size: '>0'
active: true
author:
- xknow (@xknow_infosec), xorxes (@xor_xes)
group: windows
tags:
- attack.defense-impairment
- attack.t1685
rule: SELECT * FROM logs WHERE (EventID=4673 AND PrivilegeList='SeLoadDriverPrivilege' AND Service='-') AND (NOT ((ProcessName IN ('C:\\Windows\\explorer.exe', 'C:\\Windows\\HelpPane.exe', 'C:\\Windows\\ImmersiveControlPanel\\SystemSettings.exe', 'C:\\Windows\\System32\\Dism.exe', 'C:\\Windows\\System32\\fltMC.exe', 'C:\\Windows\\System32\\mmc.exe', 'C:\\Windows\\System32\\rundll32.exe', 'C:\\Windows\\System32\\RuntimeBroker.exe', 'C:\\Windows\\System32\\ShellHost.exe', 'C:\\Windows\\System32\\svchost.exe', 'C:\\Windows\\System32\\SystemSettingsBroker.exe', 'C:\\Windows\\System32\\wimserv.exe')) OR ProcessName ILIKE 'C:\\Program Files\\WindowsApps\\Microsoft%')) AND (NOT ((ProcessName ILIKE '%\\AppData\\Local\\Microsoft\\Teams\\current\\Teams.exe' OR ProcessName ILIKE '%\\Google\\Chrome\\Application\\chrome.exe' OR ProcessName ILIKE '%\\procexp.exe' OR ProcessName ILIKE '%\\procexp64.exe' OR ProcessName ILIKE '%\\procmon.exe' OR ProcessName ILIKE '%\\procmon64.exe') OR ((ProcessName ILIKE 'C:\\Program Files (x86)\\Dropbox\\%' OR ProcessName ILIKE 'C:\\Program Files\\Dropbox\\%') AND ProcessName ILIKE '%\\Dropbox.exe')))
