id: 123e4e6d-b123-48f8-b261-7214938acaf0
name: Startup/Logon Script Added to Group Policy Object
level: 5
size: '>0'
active: true
author:
- Elastic, Josh Nickels, Marius Rothenbücher
group: windows
tags:
- attack.persistence
- attack.privilege-escalation
- attack.defense-impairment
- attack.t1484.001
- attack.t1547
rule: SELECT * FROM logs WHERE (EventID IN (5136, 5145)) AND ((((AttributeLDAPDisplayName IN ('gPCMachineExtensionNames', 'gPCUserExtensionNames')) AND AttributeValue ILIKE '%42B5FAAE-6536-11D2-AE5A-0000F87571E3%') AND (AttributeValue ILIKE '%40B6664F-4972-11D1-A7CA-0000F87571E3%' OR AttributeValue ILIKE '%40B66650-4972-11D1-A7CA-0000F87571E3%')) OR (ShareName ILIKE '%\\SYSVOL' AND (RelativeTargetName ILIKE '%\\scripts.ini' OR RelativeTargetName ILIKE '%\\psscripts.ini') AND AccessList ILIKE '%\%\%4417%'))
