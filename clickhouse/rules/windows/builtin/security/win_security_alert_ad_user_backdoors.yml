rule: SELECT * FROM logs WHERE (EventID=4738 AND (NOT ((AllowedToDelegateTo IN ('', '-')) OR isNull(AllowedToDelegateTo)))) OR ((EventID=5136 AND AttributeLDAPDisplayName='msDS-AllowedToDelegateTo') OR (EventID=5136 AND ObjectClass='user' AND AttributeLDAPDisplayName='servicePrincipalName') OR (EventID=5136 AND AttributeLDAPDisplayName='msDS-AllowedToActOnBehalfOfOtherIdentity'))
