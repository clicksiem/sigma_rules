rule: SELECT * FROM logs WHERE (EventID IN (5038, 6281)) AND (NOT ((param1 ILIKE '%\\CSFalconServiceUninstallTool\_%' OR param1 ILIKE '%\\Program Files\\CrowdStrike\\%' OR param1 ILIKE '%\\System32\\drivers\\CrowdStrike\\%' OR param1 ILIKE '%\\Windows\\System32\\ScriptControl64\_%') OR param1 ILIKE '%\\Program Files\\Sophos\\%'))
