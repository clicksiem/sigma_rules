id: 91c945bc-2ad1-4799-a591-4d00198a1215
name: Suspicious Access to Sensitive File Extensions
level: 5
size: '>0'
active: true
author:
- Samir Bousseaden
group: windows
tags:
- attack.collection
- attack.t1039
rule: SELECT * FROM logs WHERE EventID=5145 AND (RelativeTargetName ILIKE '%.bak' OR RelativeTargetName ILIKE '%.dmp' OR RelativeTargetName ILIKE '%.edb' OR RelativeTargetName ILIKE '%.kirbi' OR RelativeTargetName ILIKE '%.msg' OR RelativeTargetName ILIKE '%.nsf' OR RelativeTargetName ILIKE '%.nst' OR RelativeTargetName ILIKE '%.oab' OR RelativeTargetName ILIKE '%.ost' OR RelativeTargetName ILIKE '%.pst' OR RelativeTargetName ILIKE '%.rdp')
