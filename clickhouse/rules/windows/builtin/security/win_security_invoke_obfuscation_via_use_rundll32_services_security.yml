rule: SELECT * FROM logs WHERE EventID=4697 AND (ServiceFileName ILIKE '%&&%' AND ServiceFileName ILIKE '%rundll32%' AND ServiceFileName ILIKE '%shell32.dll%' AND ServiceFileName ILIKE '%shellexec\_rundll%') AND (ServiceFileName ILIKE '%value%' OR ServiceFileName ILIKE '%invoke%' OR ServiceFileName ILIKE '%comspec%' OR ServiceFileName ILIKE '%iex%')
