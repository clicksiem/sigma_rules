rule: SELECT * FROM logs WHERE (EventID=5145 AND ShareName ILIKE '\\\\*\\IPC$' AND (RelativeTargetName ILIKE '%-stdin' OR RelativeTargetName ILIKE '%-stdout' OR RelativeTargetName ILIKE '%-stderr')) AND (NOT RelativeTargetName ILIKE 'PSEXESVC%')
