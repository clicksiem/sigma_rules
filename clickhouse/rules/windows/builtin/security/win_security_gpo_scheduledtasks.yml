- attack.lateral-movement
- attack.t1053.005
rule: SELECT * FROM logs WHERE (EventID=5136 AND (AttributeLDAPDisplayName IN ('gPCMachineExtensionNames', 'gPCUserExtensionNames')) AND (AttributeValue ILIKE '%CAB54552-DEEA-4691-817E-ED4A4D1AFC72%' OR AttributeValue ILIKE '%AADCED64-746C-4633-A97C-D61349046527%')) OR (EventID=5145 AND ShareName ILIKE '%\\SYSVOL' AND RelativeTargetName ILIKE '%ScheduledTasks.xml' AND (AccessList ILIKE '%WriteData%' OR AccessList ILIKE '%\%\%4417%'))
