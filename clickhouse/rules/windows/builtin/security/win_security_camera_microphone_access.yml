id: 8cd538a4-62d5-4e83-810b-12d41e428d6e
name: Processes Accessing the Microphone and Webcam
level: 5
size: '>0'
active: true
author:
- Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
group: windows
tags:
- attack.collection
- attack.t1123
rule: SELECT * FROM logs WHERE (EventID IN (4657, 4656, 4663)) AND (ObjectName ILIKE '%\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\CapabilityAccessManager\\ConsentStore\\microphone\\NonPackaged%' OR ObjectName ILIKE '%\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\CapabilityAccessManager\\ConsentStore\\webcam\\NonPackaged%')
