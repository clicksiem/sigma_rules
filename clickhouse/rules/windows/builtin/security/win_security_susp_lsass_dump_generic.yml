id: 4a1b6da0-d94f-4fc3-98fc-2d9cb9e5ee76
name: Potentially Suspicious AccessMask Requested From LSASS
level: 5
size: '>0'
active: true
author:
- Roberto Rodriguez, Teymur Kheirkhabarov, Dimitrios Slamaris, Mark Russinovich, Aleksey Potapov, oscd.community (update)
group: windows
tags:
- attack.credential-access
- car.2019-04-004
- attack.t1003.001
rule: SELECT * FROM logs WHERE ((EventID=4656 AND ObjectName ILIKE '%\\lsass.exe' AND (AccessMask ILIKE '%0x40%' OR AccessMask ILIKE '%0x1400%' OR AccessMask ILIKE '%0x100000%' OR AccessMask ILIKE '%0x1410%' OR AccessMask ILIKE '%0x1010%' OR AccessMask ILIKE '%0x1438%' OR AccessMask ILIKE '%0x143a%' OR AccessMask ILIKE '%0x1418%' OR AccessMask ILIKE '%0x1f0fff%' OR AccessMask ILIKE '%0x1f1fff%' OR AccessMask ILIKE '%0x1f2fff%' OR AccessMask ILIKE '%0x1f3fff%')) OR (EventID=4663 AND ObjectName ILIKE '%\\lsass.exe' AND (AccessList ILIKE '%4484%' OR AccessList ILIKE '%4416%'))) AND (NOT (((ProcessName ILIKE '%\\csrss.exe' OR ProcessName ILIKE '%\\GamingServices.exe' OR ProcessName ILIKE '%\\lsm.exe' OR ProcessName ILIKE '%\\MicrosoftEdgeUpdate.exe' OR ProcessName ILIKE '%\\minionhost.exe' OR ProcessName ILIKE '%\\MRT.exe' OR ProcessName ILIKE '%\\MsMpEng.exe' OR ProcessName ILIKE '%\\perfmon.exe' OR ProcessName ILIKE '%\\procexp.exe' OR ProcessName ILIKE '%\\procexp64.exe' OR ProcessName ILIKE '%\\svchost.exe' OR ProcessName ILIKE '%\\taskmgr.exe' OR ProcessName ILIKE '%\\thor.exe' OR ProcessName ILIKE '%\\thor64.exe' OR ProcessName ILIKE '%\\vmtoolsd.exe' OR ProcessName ILIKE '%\\VsTskMgr.exe' OR ProcessName ILIKE '%\\wininit.exe' OR ProcessName ILIKE '%\\wmiprvse.exe' OR ProcessName ILIKE '%RtkAudUService64') AND (ProcessName ILIKE '%:\\Program Files (x86)\\%' OR ProcessName ILIKE '%:\\Program Files\\%' OR ProcessName ILIKE '%:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\%' OR ProcessName ILIKE '%:\\Windows\\SysNative\\%' OR ProcessName ILIKE '%:\\Windows\\System32\\%' OR ProcessName ILIKE '%:\\Windows\\SysWow64\\%' OR ProcessName ILIKE '%:\\Windows\\Temp\\asgard2-agent\\%')) OR ProcessName ILIKE '%:\\Program Files%' OR (ProcessName ILIKE '%:\\Windows\\System32\\taskhostw.exe' OR ProcessName ILIKE '%:\\Windows\\System32\\msiexec.exe' OR ProcessName ILIKE '%:\\Windows\\CCM\\CcmExec.exe') OR (ProcessName ILIKE '%:\\Windows\\Sysmon64.exe' AND AccessList ILIKE '%\%\%4484%') OR (ProcessName ILIKE '%:\\Windows\\Temp\\asgard2-agent-sc\\aurora\\%' AND ProcessName ILIKE '%\\aurora-agent-64.exe' AND AccessList ILIKE '%\%\%4484%') OR (ProcessName ILIKE '%\\x64\\SCENARIOENGINE.EXE' AND AccessList ILIKE '%\%\%4484%') OR ((ProcessName ILIKE '%:\\Users\\%' AND ProcessName ILIKE '%\\AppData\\Local\\Temp\\is-%') AND ProcessName ILIKE '%\\avira\_system\_speedup.tmp' AND AccessList ILIKE '%\%\%4484%') OR (ProcessName ILIKE '%:\\Windows\\Temp\\%' AND ProcessName ILIKE '%\\avira\_speedup\_setup\_update.tmp' AND AccessList ILIKE '%\%\%4484%') OR (ProcessName ILIKE '%:\\Windows\\System32\\snmp.exe' AND AccessList ILIKE '%\%\%4484%') OR (ProcessName ILIKE '%:\\Windows\\SystemTemp\\%' AND ProcessName ILIKE '%\\GoogleUpdate.exe' AND AccessList ILIKE '%\%\%4484%'))) AND (NOT ((ProcessName ILIKE '%\\procmon64.exe' OR ProcessName ILIKE '%\\procmon.exe') AND AccessList ILIKE '%\%\%4484%'))
