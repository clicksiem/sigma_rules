id: 35bc7e28-ee6b-492f-ab04-da58fcf6402e
name: Windows Network Access Suspicious desktop.ini Action
level: 5
size: '>0'
active: true
author:
- Tim Shelton (HAWK.IO)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.009
rule: SELECT * FROM logs WHERE EventID=5145 AND ObjectType='File' AND RelativeTargetName ILIKE '%\\desktop.ini' AND (AccessList ILIKE '%WriteData%' OR AccessList ILIKE '%DELETE%' OR AccessList ILIKE '%WriteDAC%' OR AccessList ILIKE '%AppendData%' OR AccessList ILIKE '%AddSubdirectory%')
