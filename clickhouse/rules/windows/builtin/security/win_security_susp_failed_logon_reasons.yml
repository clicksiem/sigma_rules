rule: SELECT * FROM logs WHERE ((EventID IN (4625, 4776)) AND ((Status IN ('0xC0000072', '0xC000006F', '0xC0000070', '0xC0000413', '0xC000018C', '0xC000015B')) OR (SubStatus IN ('0xC0000072', '0xC000006F', '0xC0000070', '0xC0000413', '0xC000018C', '0xC000015B')))) AND (NOT SubjectUserSid='S-1-0-0')
