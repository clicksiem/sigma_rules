rule: SELECT * FROM logs WHERE (EventID=4697 AND match(ServiceFileName, '^%systemroot%\\[a-zA-Z]{8}\.exe$') AND match(ServiceName, '(^[a-zA-Z]{4}$)|(^[a-zA-Z]{8}$)|(^[a-zA-Z]{16}$)') AND ServiceStartType=3 AND ServiceType='0x10') AND (NOT ServiceName='PSEXESVC')
