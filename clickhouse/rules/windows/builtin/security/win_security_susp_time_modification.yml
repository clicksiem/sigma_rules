id: faa031b5-21ed-4e02-8881-2591f98d82ed
name: Unauthorized System Time Modification
level: 3
size: '>0'
active: true
author:
- '@neu5ron'
group: windows
tags:
- attack.stealth
- attack.t1070.006
rule: SELECT * FROM logs WHERE EventID=4616 AND (NOT (ProcessName ILIKE 'C:\\Windows\\System32\\svchost.exe' AND SubjectUserSid='S-1-5-19')) AND (NOT (ProcessName IN ('C:\\Program Files\\VMware\\VMware Tools\\vmtoolsd.exe', 'C:\\Program Files (x86)\\VMware\\VMware Tools\\vmtoolsd.exe', 'C:\\Windows\\System32\\VBoxService.exe', 'C:\\Windows\\System32\\oobe\\msoobe.exe')))
