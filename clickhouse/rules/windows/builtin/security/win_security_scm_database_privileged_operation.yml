rule: SELECT * FROM logs WHERE (EventID=4674 AND ObjectType ILIKE 'SC\_MANAGER OBJECT' AND ObjectName='servicesactive' AND PrivilegeList='SeTakeOwnershipPrivilege') AND (NOT (SubjectLogonId='0x3e4' AND ProcessName ILIKE '%:\\Windows\\System32\\services.exe'))
