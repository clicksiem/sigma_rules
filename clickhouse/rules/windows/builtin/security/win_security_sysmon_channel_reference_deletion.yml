id: 18beca67-ab3e-4ee3-ba7a-a46ca8d7d0cc
name: Sysmon Channel Reference Deletion
level: 8
size: '>0'
active: true
author:
- Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
group: windows
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
rule: SELECT * FROM logs WHERE (EventID=4657 AND (ObjectName ILIKE '%WINEVT\\Publishers\\{5770385f-c22a-43e0-bf4c-06f5698ffbd9}%' OR ObjectName ILIKE '%WINEVT\\Channels\\Microsoft-Windows-Sysmon/Operational%') AND ObjectValueName='Enabled' AND NewValue=0) OR (EventID=4663 AND (ObjectName ILIKE '%WINEVT\\Publishers\\{5770385f-c22a-43e0-bf4c-06f5698ffbd9}%' OR ObjectName ILIKE '%WINEVT\\Channels\\Microsoft-Windows-Sysmon/Operational%') AND AccessMask='0x10000')
