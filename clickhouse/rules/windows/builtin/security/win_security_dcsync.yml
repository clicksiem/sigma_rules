rule: SELECT * FROM logs WHERE (EventID=4662 AND (Properties ILIKE '%Replicating Directory Changes All%' OR Properties ILIKE '%1131f6ad-9c07-11d1-f79f-00c04fc2dcd2%' OR Properties ILIKE '%1131f6aa-9c07-11d1-f79f-00c04fc2dcd2%' OR Properties ILIKE '%9923a32a-3607-11d2-b9be-0000f87a36b2%' OR Properties ILIKE '%89e95b76-444d-4c62-991a-0facbeda640c%') AND AccessMask='0x100') AND (NOT (SubjectDomainName='Window Manager' OR (SubjectUserName ILIKE 'NT AUT%' OR SubjectUserName ILIKE 'MSOL\_%') OR SubjectUserName ILIKE '%$'))
