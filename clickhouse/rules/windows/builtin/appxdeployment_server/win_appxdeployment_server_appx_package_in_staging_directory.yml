rule: SELECT * FROM logs WHERE EventID=854 AND ((Path ILIKE '%:/Perflogs/%' OR Path ILIKE '%:/Users/Public/%' OR Path ILIKE '%:/Windows/Temp/%' OR Path ILIKE '%/AppdData/Local/Temp/%' OR Path ILIKE '%/Desktop/%' OR Path ILIKE '%/Downloads/%') OR (Path ILIKE '%:\\PerfLogs\\%' OR Path ILIKE '%:\\Users\\Public\\%' OR Path ILIKE '%:\\Windows\\Temp\\%' OR Path ILIKE '%\\AppdData\\Local\\Temp\\%' OR Path ILIKE '%\\Desktop\\%' OR Path ILIKE '%\\Downloads\\%'))
