rule: SELECT * FROM logs WHERE (EventID=16403 AND (LocalName ILIKE '%.bat' OR LocalName ILIKE '%.dll' OR LocalName ILIKE '%.exe' OR LocalName ILIKE '%.hta' OR LocalName ILIKE '%.ps1' OR LocalName ILIKE '%.psd1' OR LocalName ILIKE '%.sh' OR LocalName ILIKE '%.vbe' OR LocalName ILIKE '%.vbs')) AND (NOT (LocalName ILIKE '%\\AppData\\%' AND RemoteName ILIKE '%.com%'))
