rule: SELECT * FROM logs WHERE (EventID=300 AND TargetUserSid ILIKE 'S-1-5-21-%' AND (SidList ILIKE '%S-1-5-32-544%' OR SidList ILIKE '%-500}%' OR SidList ILIKE '%-518}%' OR SidList ILIKE '%-519}%')) AND (NOT (TargetUserSid ILIKE '%-500' OR TargetUserSid ILIKE '%-518' OR TargetUserSid ILIKE '%-519'))
