id: a0a278fe-2c0e-4de2-ac3c-c68b08a9ba98
name: LSASS Access Detected via Attack Surface Reduction
level: 8
size: '>0'
active: true
author:
- Markus Neis
group: windows
tags:
- attack.credential-access
- attack.t1003.001
rule: SELECT * FROM logs WHERE (EventID=1121 AND Path ILIKE '%\\lsass.exe') AND (NOT ((ProcessName ILIKE 'C:\\Windows\\Temp\\asgard2-agent\\%' AND (ProcessName ILIKE '%\\thor64.exe' OR ProcessName ILIKE '%\\thor.exe')) OR (ProcessName IN ('C:\\Windows\\System32\\atiesrxx.exe', 'C:\\Windows\\System32\\CompatTelRunner.exe', 'C:\\Windows\\System32\\msiexec.exe', 'C:\\Windows\\System32\\nvwmi64.exe', 'C:\\Windows\\System32\\svchost.exe', 'C:\\Windows\\System32\\Taskmgr.exe', 'C:\\Windows\\System32\\wbem\\WmiPrvSE.exe', 'C:\\Windows\\SysWOW64\\msiexec.exe')) OR (ProcessName ILIKE 'C:\\Windows\\System32\\DriverStore\\%' OR ProcessName ILIKE 'C:\\WINDOWS\\Installer\\%' OR ProcessName ILIKE 'C:\\Program Files\\%' OR ProcessName ILIKE 'C:\\Program Files (x86)\\%')))
