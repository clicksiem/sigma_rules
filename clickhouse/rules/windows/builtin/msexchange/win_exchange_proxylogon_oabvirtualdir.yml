id: 550d3350-bb8a-4ff3-9533-2ba533f4a1c0
name: ProxyLogon MSExchange OabVirtualDirectory
level: 10
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.t1587.001
- attack.resource-development
rule: SELECT * FROM logs WHERE (hasToken(full_log, 'OabVirtualDirectory') AND hasToken(full_log, ' -ExternalUrl ')) AND (hasToken(full_log, 'eval(request') OR hasToken(full_log, 'http://f/<script') OR hasToken(full_log, '"unsafe"};') OR hasToken(full_log, 'function Page\_Load()'))
