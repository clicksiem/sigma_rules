id: 78bc5783-81d9-4d73-ac97-59f6db4f72a8
name: Relevant Anti-Virus Signature Keywords In Application Log
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), Arnim Rupp
group: windows
tags:
- attack.resource-development
- attack.t1588
rule: SELECT * FROM logs WHERE (hasToken(full_log, 'Adfind') OR hasToken(full_log, 'ASP/BackDoor ') OR hasToken(full_log, 'ATK/') OR hasToken(full_log, 'Backdoor.ASP') OR hasToken(full_log, 'Backdoor.Cobalt') OR hasToken(full_log, 'Backdoor.JSP') OR hasToken(full_log, 'Backdoor.PHP') OR hasToken(full_log, 'Blackworm') OR hasToken(full_log, 'Brutel') OR hasToken(full_log, 'BruteR') OR hasToken(full_log, 'Chopper') OR hasToken(full_log, 'Cobalt') OR hasToken(full_log, 'COBEACON') OR hasToken(full_log, 'Cometer') OR hasToken(full_log, 'CRYPTES') OR hasToken(full_log, 'Cryptor') OR hasToken(full_log, 'Destructor') OR hasToken(full_log, 'DumpCreds') OR hasToken(full_log, 'Exploit.Script.CVE') OR hasToken(full_log, 'FastReverseProxy') OR hasToken(full_log, 'Filecoder') OR hasToken(full_log, 'GrandCrab ') OR hasToken(full_log, 'HackTool') OR hasToken(full_log, 'HKTL') OR hasToken(full_log, 'HTool-') OR hasToken(full_log, '/HTool') OR hasToken(full_log, '.HTool') OR hasToken(full_log, 'IISExchgSpawnCMD') OR hasToken(full_log, 'Impacket') OR hasToken(full_log, 'JSP/BackDoor ') OR hasToken(full_log, 'Keylogger') OR hasToken(full_log, 'Koadic') OR hasToken(full_log, 'Krypt') OR hasToken(full_log, 'Lazagne') OR hasToken(full_log, 'Metasploit') OR hasToken(full_log, 'Meterpreter') OR hasToken(full_log, 'MeteTool') OR hasToken(full_log, 'mikatz') OR hasToken(full_log, 'Mimikatz') OR hasToken(full_log, 'Mpreter') OR hasToken(full_log, 'MsfShell') OR hasToken(full_log, 'Nighthawk') OR hasToken(full_log, 'Packed.Generic.347') OR hasToken(full_log, 'PentestPowerShell') OR hasToken(full_log, 'Phobos') OR hasToken(full_log, 'PHP/BackDoor ') OR hasToken(full_log, 'Potato') OR hasToken(full_log, 'PowerSploit') OR hasToken(full_log, 'PowerSSH') OR hasToken(full_log, 'PshlSpy') OR hasToken(full_log, 'PSWTool') OR hasToken(full_log, 'PWCrack') OR hasToken(full_log, 'PWDump') OR hasToken(full_log, 'Ransom') OR hasToken(full_log, 'Rozena') OR hasToken(full_log, 'Ryzerlo') OR hasToken(full_log, 'Sbelt') OR hasToken(full_log, 'Seatbelt') OR hasToken(full_log, 'SecurityTool ') OR hasToken(full_log, 'SharpDump') OR hasToken(full_log, 'Shellcode') OR hasToken(full_log, 'Sliver') OR hasToken(full_log, 'Splinter') OR hasToken(full_log, 'Swrort') OR hasToken(full_log, 'Tescrypt') OR hasToken(full_log, 'TeslaCrypt') OR hasToken(full_log, 'TurtleLoader') OR hasToken(full_log, 'Valyria') OR hasToken(full_log, 'Webshell')) AND (NOT ((hasToken(full_log, 'anti\_ransomware\_service.exe') OR hasToken(full_log, 'Anti-Ransomware') OR hasToken(full_log, 'Crack') OR hasToken(full_log, 'cyber-protect-service.exe') OR hasToken(full_log, 'encryptor') OR hasToken(full_log, 'Keygen')) OR Level=4 OR Provider_Name='Microsoft-Windows-RestartManager'))
