rule: SELECT * FROM logs WHERE Provider_Name='MSSQLSERVER$AUDIT' AND EventID=33205 AND (Data ILIKE '%statement:TRUNCATE TABLE%' OR Data ILIKE '%statement:DROP TABLE%' OR Data ILIKE '%statement:DROP DATABASE%')
