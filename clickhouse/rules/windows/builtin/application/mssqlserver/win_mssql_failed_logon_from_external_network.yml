id: ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
name: MSSQL Server Failed Logon From External Network
level: 5
size: '>0'
active: true
author:
- j4son
group: windows
tags:
- attack.credential-access
- attack.t1110
rule: 'SELECT * FROM logs WHERE (Provider_Name ILIKE ''%MSSQL%'' AND EventID=18456) AND (NOT (Data ILIKE ''%CLIENT: 10.%'' OR Data ILIKE ''%CLIENT: 172.16.%'' OR Data ILIKE ''%CLIENT: 172.17.%'' OR Data ILIKE ''%CLIENT: 172.18.%'' OR Data ILIKE ''%CLIENT: 172.19.%'' OR Data ILIKE ''%CLIENT: 172.20.%'' OR Data ILIKE ''%CLIENT: 172.21.%'' OR Data ILIKE ''%CLIENT: 172.22.%'' OR Data ILIKE ''%CLIENT: 172.23.%'' OR Data ILIKE ''%CLIENT: 172.24.%'' OR Data ILIKE ''%CLIENT: 172.25.%'' OR Data ILIKE ''%CLIENT: 172.26.%'' OR Data ILIKE ''%CLIENT: 172.27.%'' OR Data ILIKE ''%CLIENT: 172.28.%'' OR Data ILIKE ''%CLIENT: 172.29.%'' OR Data ILIKE ''%CLIENT: 172.30.%'' OR Data ILIKE ''%CLIENT: 172.31.%'' OR Data ILIKE ''%CLIENT: 192.168.%'' OR Data ILIKE ''%CLIENT: 127.%'' OR Data ILIKE ''%CLIENT: 169.254.%'' OR Data ILIKE ''%CLIENT: <local machine>%''))'
