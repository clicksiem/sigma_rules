rule: SELECT * FROM logs WHERE Provider_Name ILIKE '%MSSQL%' AND EventID=33205 AND (Data ILIKE '%statement:ALTER SERVER AUDIT%' OR Data ILIKE '%statement:DROP SERVER AUDIT%')
