rule: SELECT * FROM logs WHERE Provider_Name ILIKE '%MSSQL%' AND EventID=33205 AND (Data ILIKE '%object\_name:sysadmin%' AND Data ILIKE '%statement:alter server role [sysadmin] add member %')
