rule: SELECT * FROM logs WHERE (Payload ILIKE '%&&%' AND Payload ILIKE '%rundll32%' AND Payload ILIKE '%shell32.dll%' AND Payload ILIKE '%shellexec\_rundll%') AND (Payload ILIKE '%value%' OR Payload ILIKE '%invoke%' OR Payload ILIKE '%comspec%' OR Payload ILIKE '%iex%')
