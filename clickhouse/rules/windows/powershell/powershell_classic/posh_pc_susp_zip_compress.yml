name: Zip A Folder With PowerShell For Staging In Temp - PowerShell
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems), frack113
group: windows
tags:
- attack.collection
- attack.t1074.001
rule: SELECT * FROM logs WHERE Data ILIKE '%Compress-Archive -Path%-DestinationPath $env:TEMP%' OR Data ILIKE '%Compress-Archive -Path%-DestinationPath%\\AppData\\Local\\Temp\\%' OR Data ILIKE '%Compress-Archive -Path%-DestinationPath%:\\Windows\\Temp\\%'
