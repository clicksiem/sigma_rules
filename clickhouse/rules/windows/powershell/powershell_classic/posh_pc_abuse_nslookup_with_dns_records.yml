rule: SELECT * FROM logs WHERE (Data ILIKE '%powershell%' AND Data ILIKE '%nslookup%' AND Data ILIKE '%[1]%') AND (Data ILIKE '%-q=txt http%' OR Data ILIKE '%-querytype=txt http%' OR Data ILIKE '%-type=txt http%')
