rule: SELECT * FROM logs WHERE (Data ILIKE '%EngineVersion=2.%' OR Data ILIKE '%EngineVersion=4.%' OR Data ILIKE '%EngineVersion=5.%') AND Data ILIKE '%HostVersion=3.%'
