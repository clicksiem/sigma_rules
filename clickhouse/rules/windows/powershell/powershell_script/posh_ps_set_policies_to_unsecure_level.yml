id: 61d0475c-173f-4844-86f7-f3eebae1c66b
name: Change PowerShell Policies to an Insecure Level - PowerShell
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.execution
- attack.t1059.001
rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%Set-ExecutionPolicy%' AND (ScriptBlockText ILIKE '%Unrestricted%' OR ScriptBlockText ILIKE '%bypass%')) AND (NOT (ScriptBlockText ILIKE '%(New-Object System.Net.WebClient).DownloadString(''https://community.chocolatey.org/install.ps1'')%' OR ScriptBlockText ILIKE '%(New-Object System.Net.WebClient).DownloadString(''https://chocolatey.org/install.ps1'')%'))
