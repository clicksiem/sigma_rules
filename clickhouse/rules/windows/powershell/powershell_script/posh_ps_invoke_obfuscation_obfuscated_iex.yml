id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
level: 8
size: '>0'
active: true
author:
- Daniel Bohannon (@Mandiant/@FireEye), oscd.community
group: windows
tags:
- attack.stealth
- attack.t1027
- attack.execution
- attack.t1059.001
rule: SELECT * FROM logs WHERE match(ScriptBlockText, '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\[') OR match(ScriptBlockText, '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\[') OR match(ScriptBlockText, '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\[') OR match(ScriptBlockText, '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}') OR match(ScriptBlockText, '\*mdr\*\W\s*\)\.Name') OR match(ScriptBlockText, '\$VerbosePreference\.ToString\(')
