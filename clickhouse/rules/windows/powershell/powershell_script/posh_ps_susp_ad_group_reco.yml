id: 88f0884b-331d-403d-a3a1-b668cf035603
name: AD Groups Or Users Enumeration Using PowerShell - ScriptBlock
level: 3
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.discovery
- attack.t1069.001
rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%get-ADPrincipalGroupMembership%' OR (ScriptBlockText ILIKE '%get-aduser%' AND ScriptBlockText ILIKE '%-f %' AND ScriptBlockText ILIKE '%-pr %' AND ScriptBlockText ILIKE '%DoesNotRequirePreAuth%')
