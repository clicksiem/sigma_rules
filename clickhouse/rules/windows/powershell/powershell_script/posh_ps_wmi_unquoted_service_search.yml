id: 09658312-bc27-4a3b-91c5-e49ab9046d1b
name: WMIC Unquoted Services Path Lookup - PowerShell
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.t1047
rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%Get-WmiObject %' OR ScriptBlockText ILIKE '%gwmi %') AND (ScriptBlockText ILIKE '% Win32\_Service %' AND ScriptBlockText ILIKE '%Name%' AND ScriptBlockText ILIKE '%DisplayName%' AND ScriptBlockText ILIKE '%PathName%' AND ScriptBlockText ILIKE '%StartMode%')
