rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%Get-Keystrokes%' OR (ScriptBlockText ILIKE '%Get-ProcAddress user32.dll GetAsyncKeyState%' AND ScriptBlockText ILIKE '%Get-ProcAddress user32.dll GetForegroundWindow%')
