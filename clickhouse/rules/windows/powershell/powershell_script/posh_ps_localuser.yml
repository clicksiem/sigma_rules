rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%Disable-LocalUser%' OR ScriptBlockText ILIKE '%Enable-LocalUser%' OR ScriptBlockText ILIKE '%Get-LocalUser%' OR ScriptBlockText ILIKE '%Set-LocalUser%' OR ScriptBlockText ILIKE '%New-LocalUser%' OR ScriptBlockText ILIKE '%Rename-LocalUser%' OR ScriptBlockText ILIKE '%Remove-LocalUser%'
