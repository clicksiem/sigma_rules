id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
name: Tamper Windows Defender - ScriptBlockLogging
level: 8
size: '>0'
active: true
author:
- frack113, elhoim, Tim Shelton (fps, alias support), Swachchhanda Shrawan Poudel, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.defense-impairment
- attack.t1685
rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%Set-MpPreference%' AND (ScriptBlockText ILIKE '%-dbaf $true%' OR ScriptBlockText ILIKE '%-dbaf 1%' OR ScriptBlockText ILIKE '%-dbm $true%' OR ScriptBlockText ILIKE '%-dbm 1%' OR ScriptBlockText ILIKE '%-dips $true%' OR ScriptBlockText ILIKE '%-dips 1%' OR ScriptBlockText ILIKE '%-DisableArchiveScanning $true%' OR ScriptBlockText ILIKE '%-DisableArchiveScanning 1%' OR ScriptBlockText ILIKE '%-DisableBehaviorMonitoring $true%' OR ScriptBlockText ILIKE '%-DisableBehaviorMonitoring 1%' OR ScriptBlockText ILIKE '%-DisableBlockAtFirstSeen $true%' OR ScriptBlockText ILIKE '%-DisableBlockAtFirstSeen 1%' OR ScriptBlockText ILIKE '%-DisableCatchupFullScan $true%' OR ScriptBlockText ILIKE '%-DisableCatchupFullScan 1%' OR ScriptBlockText ILIKE '%-DisableCatchupQuickScan $true%' OR ScriptBlockText ILIKE '%-DisableCatchupQuickScan 1%' OR ScriptBlockText ILIKE '%-DisableIntrusionPreventionSystem $true%' OR ScriptBlockText ILIKE '%-DisableIntrusionPreventionSystem 1%' OR ScriptBlockText ILIKE '%-DisableIOAVProtection $true%' OR ScriptBlockText ILIKE '%-DisableIOAVProtection 1%' OR ScriptBlockText ILIKE '%-DisableRealtimeMonitoring $true%' OR ScriptBlockText ILIKE '%-DisableRealtimeMonitoring 1%' OR ScriptBlockText ILIKE '%-DisableRemovableDriveScanning $true%' OR ScriptBlockText ILIKE '%-DisableRemovableDriveScanning 1%' OR ScriptBlockText ILIKE '%-DisableScanningMappedNetworkDrivesForFullScan $true%' OR ScriptBlockText ILIKE '%-DisableScanningMappedNetworkDrivesForFullScan 1%' OR ScriptBlockText ILIKE '%-DisableScanningNetworkFiles $true%' OR ScriptBlockText ILIKE '%-DisableScanningNetworkFiles 1%' OR ScriptBlockText ILIKE '%-DisableScriptScanning $true%' OR ScriptBlockText ILIKE '%-DisableScriptScanning 1%' OR ScriptBlockText ILIKE '%-MAPSReporting $false%' OR ScriptBlockText ILIKE '%-MAPSReporting 0%' OR ScriptBlockText ILIKE '%-drdsc $true%' OR ScriptBlockText ILIKE '%-drdsc 1%' OR ScriptBlockText ILIKE '%-drtm $true%' OR ScriptBlockText ILIKE '%-drtm 1%' OR ScriptBlockText ILIKE '%-dscrptsc $true%' OR ScriptBlockText ILIKE '%-dscrptsc 1%' OR ScriptBlockText ILIKE '%-dsmndf $true%' OR ScriptBlockText ILIKE '%-dsmndf 1%' OR ScriptBlockText ILIKE '%-dsnf $true%' OR ScriptBlockText ILIKE '%-dsnf 1%' OR ScriptBlockText ILIKE '%-dss $true%' OR ScriptBlockText ILIKE '%-dss 1%')) OR (ScriptBlockText ILIKE '%Set-MpPreference%' AND (ScriptBlockText ILIKE '%HighThreatDefaultAction Allow%' OR ScriptBlockText ILIKE '%htdefac Allow%' OR ScriptBlockText ILIKE '%LowThreatDefaultAction Allow%' OR ScriptBlockText ILIKE '%ltdefac Allow%' OR ScriptBlockText ILIKE '%ModerateThreatDefaultAction Allow%' OR ScriptBlockText ILIKE '%mtdefac Allow%' OR ScriptBlockText ILIKE '%SevereThreatDefaultAction Allow%' OR ScriptBlockText ILIKE '%stdefac Allow%'))
