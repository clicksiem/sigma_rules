id: 21f9162c-5f5d-4b01-89a8-b705bd7d10ab
name: Import PowerShell Modules From Suspicious Directories
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.t1059.001
rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%Import-Module "$Env:Temp\\%' OR ScriptBlockText ILIKE '%Import-Module ''$Env:Temp\\%' OR ScriptBlockText ILIKE '%Import-Module $Env:Temp\\%' OR ScriptBlockText ILIKE '%Import-Module "$Env:Appdata\\%' OR ScriptBlockText ILIKE '%Import-Module ''$Env:Appdata\\%' OR ScriptBlockText ILIKE '%Import-Module $Env:Appdata\\%' OR ScriptBlockText ILIKE '%Import-Module C:\\Users\\Public\\%' OR ScriptBlockText ILIKE '%ipmo "$Env:Temp\\%' OR ScriptBlockText ILIKE '%ipmo ''$Env:Temp\\%' OR ScriptBlockText ILIKE '%ipmo $Env:Temp\\%' OR ScriptBlockText ILIKE '%ipmo "$Env:Appdata\\%' OR ScriptBlockText ILIKE '%ipmo ''$Env:Appdata\\%' OR ScriptBlockText ILIKE '%ipmo $Env:Appdata\\%' OR ScriptBlockText ILIKE '%ipmo C:\\Users\\Public\\%'
