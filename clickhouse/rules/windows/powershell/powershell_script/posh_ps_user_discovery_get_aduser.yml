id: c2993223-6da8-4b1a-88ee-668b8bf315e9
name: User Discovery And Export Via Get-ADUser Cmdlet - PowerShell
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.discovery
- attack.t1033
rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%Get-ADUser %' AND ScriptBlockText ILIKE '% -Filter *%') AND (ScriptBlockText ILIKE '% > %' OR ScriptBlockText ILIKE '% | Select %' OR ScriptBlockText ILIKE '%Out-File%' OR ScriptBlockText ILIKE '%Set-Content%' OR ScriptBlockText ILIKE '%Add-Content%')
