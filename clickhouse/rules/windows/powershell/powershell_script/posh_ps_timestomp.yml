name: Powershell Timestomp
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.stealth
- attack.t1070.006
rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%.CreationTime =%' OR ScriptBlockText ILIKE '%.LastWriteTime =%' OR ScriptBlockText ILIKE '%.LastAccessTime =%' OR ScriptBlockText ILIKE '%[IO.File]::SetCreationTime%' OR ScriptBlockText ILIKE '%[IO.File]::SetLastAccessTime%' OR ScriptBlockText ILIKE '%[IO.File]::SetLastWriteTime%'
