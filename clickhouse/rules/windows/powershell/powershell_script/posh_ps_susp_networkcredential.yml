id: 1883444f-084b-419b-ac62-e0d0c5b3693f
name: Suspicious Connection to Remote Account
level: 3
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.credential-access
- attack.t1110.001
rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%System.DirectoryServices.Protocols.LdapDirectoryIdentifier%' OR ScriptBlockText ILIKE '%System.Net.NetworkCredential%' OR ScriptBlockText ILIKE '%System.DirectoryServices.Protocols.LdapConnection%'
