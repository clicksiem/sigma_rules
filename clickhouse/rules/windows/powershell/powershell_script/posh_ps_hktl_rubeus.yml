rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%asreproast %' OR ScriptBlockText ILIKE '%dump /service:krbtgt %' OR ScriptBlockText ILIKE '%dump /luid:0x%' OR ScriptBlockText ILIKE '%kerberoast %' OR ScriptBlockText ILIKE '%createnetonly /program:%' OR ScriptBlockText ILIKE '%ptt /ticket:%' OR ScriptBlockText ILIKE '%/impersonateuser:%' OR ScriptBlockText ILIKE '%renew /ticket:%' OR ScriptBlockText ILIKE '%asktgt /user:%' OR ScriptBlockText ILIKE '%harvest /interval:%' OR ScriptBlockText ILIKE '%s4u /user:%' OR ScriptBlockText ILIKE '%s4u /ticket:%' OR ScriptBlockText ILIKE '%hash /password:%' OR ScriptBlockText ILIKE '%golden /aes256:%' OR ScriptBlockText ILIKE '%silver /user:%'
