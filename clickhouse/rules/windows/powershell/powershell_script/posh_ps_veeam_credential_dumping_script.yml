id: 976d6e6f-a04b-4900-9713-0134a353e38b
name: Veeam Backup Servers Credential Dumping Script Execution
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.credential-access
rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%[Credentials]%' AND ScriptBlockText ILIKE '%[Veeam.Backup.Common.ProtectedStorage]::GetLocalString%' AND ScriptBlockText ILIKE '%Invoke-Sqlcmd%' AND ScriptBlockText ILIKE '%Veeam Backup and Replication%'
