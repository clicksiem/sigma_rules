rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%vaultcmd%' AND ScriptBlockText ILIKE '%/listcreds:%') AND (ScriptBlockText ILIKE '%Windows Credentials%' OR ScriptBlockText ILIKE '%Web Credentials%')
