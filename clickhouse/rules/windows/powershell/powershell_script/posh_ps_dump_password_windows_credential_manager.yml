id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
name: Dump Credentials from Windows Credential Manager With PowerShell
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.credential-access
- attack.t1555
rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%Get-PasswordVaultCredentials%' OR ScriptBlockText ILIKE '%Get-CredManCreds%') OR (ScriptBlockText ILIKE '%New-Object%' AND ScriptBlockText ILIKE '%Windows.Security.Credentials.PasswordVault%') OR (ScriptBlockText ILIKE '%New-Object%' AND ScriptBlockText ILIKE '%Microsoft.CSharp.CSharpCodeProvider%' AND ScriptBlockText ILIKE '%[System.Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory())%' AND ScriptBlockText ILIKE '%Collections.ArrayList%' AND ScriptBlockText ILIKE '%System.CodeDom.Compiler.CompilerParameters%')
