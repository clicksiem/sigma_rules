id: 1f49f2ab-26bc-48b3-96cc-dcffbc93eadf
name: Potential Suspicious PowerShell Keywords
level: 5
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), Perez Diego (@darkquassar), Tuan Le (NCSGroup)
group: windows
tags:
- attack.execution
- attack.t1059.001
rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%System.Reflection.Assembly.Load($%' OR ScriptBlockText ILIKE '%[System.Reflection.Assembly]::Load($%' OR ScriptBlockText ILIKE '%[Reflection.Assembly]::Load($%' OR ScriptBlockText ILIKE '%System.Reflection.AssemblyName%' OR ScriptBlockText ILIKE '%Reflection.Emit.AssemblyBuilderAccess%' OR ScriptBlockText ILIKE '%Reflection.Emit.CustomAttributeBuilder%' OR ScriptBlockText ILIKE '%Runtime.InteropServices.UnmanagedType%' OR ScriptBlockText ILIKE '%Runtime.InteropServices.DllImportAttribute%' OR ScriptBlockText ILIKE '%SuspendThread%' OR ScriptBlockText ILIKE '%rundll32%'
