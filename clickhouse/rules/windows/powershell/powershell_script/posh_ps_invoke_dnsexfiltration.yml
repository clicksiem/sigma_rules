rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%Invoke-DNSExfiltrator%' OR (ScriptBlockText ILIKE '% -i %' AND ScriptBlockText ILIKE '% -d %' AND ScriptBlockText ILIKE '% -p %' AND ScriptBlockText ILIKE '% -doh %' AND ScriptBlockText ILIKE '% -t %')
