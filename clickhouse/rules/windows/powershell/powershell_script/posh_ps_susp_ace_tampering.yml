id: 2f77047c-e6e9-4c11-b088-a3de399524cd
name: Potential Persistence Via Security Descriptors - ScriptBlock
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.persistence
- attack.privilege-escalation
- attack.defense-impairment
rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%win32\_Trustee%' AND ScriptBlockText ILIKE '%win32\_Ace%' AND ScriptBlockText ILIKE '%.AccessMask%' AND ScriptBlockText ILIKE '%.AceType%' AND ScriptBlockText ILIKE '%.SetSecurityDescriptor%') AND (ScriptBlockText ILIKE '%\\Lsa\\JD%' OR ScriptBlockText ILIKE '%\\Lsa\\Skew1%' OR ScriptBlockText ILIKE '%\\Lsa\\Data%' OR ScriptBlockText ILIKE '%\\Lsa\\GBG%')
