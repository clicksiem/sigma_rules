id: 4096a49c-7de4-4da0-a230-c66ccd56ea5a
name: Suspicious PowerShell Get Current User
level: 3
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.discovery
- attack.t1033
rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%[System.Environment]::UserName%' OR ScriptBlockText ILIKE '%$env:UserName%' OR ScriptBlockText ILIKE '%[System.Security.Principal.WindowsIdentity]::GetCurrent()%'
