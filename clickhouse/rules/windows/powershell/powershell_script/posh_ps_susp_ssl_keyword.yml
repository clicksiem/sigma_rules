rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%System.Net.Security.SslStream%' AND ScriptBlockText ILIKE '%Net.Security.RemoteCertificateValidationCallback%' AND ScriptBlockText ILIKE '%.AuthenticateAsClient%'
