rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%Get-WmiObject%' OR ScriptBlockText ILIKE '%gwmi%') AND (ScriptBlockText ILIKE '%MSAcpi\_ThermalZoneTemperature%' OR ScriptBlockText ILIKE '%Win32\_ComputerSystem%')
