id: e4f93c99-396f-47c8-bb0f-201b1fa69034
name: Potential Data Exfiltration Via Audio File
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.exfiltration
rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%[System.Math]::%' AND ScriptBlockText ILIKE '%[IO.FileMode]::%' AND ScriptBlockText ILIKE '%BinaryWriter%') AND (ScriptBlockText ILIKE '%0x52%' AND ScriptBlockText ILIKE '%0x49%' AND ScriptBlockText ILIKE '%0x46%' AND ScriptBlockText ILIKE '%0x57%' AND ScriptBlockText ILIKE '%0x41%' AND ScriptBlockText ILIKE '%0x56%' AND ScriptBlockText ILIKE '%0x45%' AND ScriptBlockText ILIKE '%0xAC%')
