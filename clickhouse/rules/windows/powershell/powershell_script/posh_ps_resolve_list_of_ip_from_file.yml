rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%Get-content %' AND ScriptBlockText ILIKE '%foreach%' AND ScriptBlockText ILIKE '%[System.Net.Dns]::GetHostEntry%' AND ScriptBlockText ILIKE '%Out-File%'
