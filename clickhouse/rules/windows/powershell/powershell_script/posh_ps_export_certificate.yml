rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%Export-PfxCertificate%' OR ScriptBlockText ILIKE '%Export-Certificate%') AND (NOT ScriptBlockText ILIKE '%CmdletsToExport = @(%')
