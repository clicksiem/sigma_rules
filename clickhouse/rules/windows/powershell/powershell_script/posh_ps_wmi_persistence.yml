rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%New-CimInstance %' AND ScriptBlockText ILIKE '%-Namespace root/subscription %' AND ScriptBlockText ILIKE '%-ClassName \_\_EventFilter %' AND ScriptBlockText ILIKE '%-Property %') OR (ScriptBlockText ILIKE '%New-CimInstance %' AND ScriptBlockText ILIKE '%-Namespace root/subscription %' AND ScriptBlockText ILIKE '%-ClassName CommandLineEventConsumer %' AND ScriptBlockText ILIKE '%-Property %')
