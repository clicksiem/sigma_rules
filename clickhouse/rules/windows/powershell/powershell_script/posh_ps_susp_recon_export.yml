rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%Get-Service %' OR ScriptBlockText ILIKE '%Get-ChildItem %' OR ScriptBlockText ILIKE '%Get-Process %') AND ScriptBlockText ILIKE '%> $env:TEMP\\%'
