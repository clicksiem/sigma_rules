rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%Get-ADUser%' AND ScriptBlockText ILIKE '%-Filter%' AND ScriptBlockText ILIKE '%useraccountcontrol%' AND ScriptBlockText ILIKE '%-band%' AND ScriptBlockText ILIKE '%4194304%'
