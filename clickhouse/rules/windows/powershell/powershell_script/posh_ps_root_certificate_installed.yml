id: 42821614-9264-4761-acfc-5772c3286f76
name: Root Certificate Installed - PowerShell
level: 5
size: '>0'
active: true
author:
- oscd.community, @redcanary, Zach Stanford @svch0st
group: windows
tags:
- attack.defense-impairment
- attack.t1553.004
rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%Move-Item%' AND ScriptBlockText ILIKE '%Cert:\\LocalMachine\\Root%') OR (ScriptBlockText ILIKE '%Import-Certificate%' AND ScriptBlockText ILIKE '%Cert:\\LocalMachine\\Root%')
