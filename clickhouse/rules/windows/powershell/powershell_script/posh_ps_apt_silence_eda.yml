rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%System.Diagnostics.Process%' AND ScriptBlockText ILIKE '%Stop-Computer%' AND ScriptBlockText ILIKE '%Restart-Computer%' AND ScriptBlockText ILIKE '%Exception in execution%' AND ScriptBlockText ILIKE '%$cmdargs%' AND ScriptBlockText ILIKE '%Close-Dnscat2Tunnel%') AND (ScriptBlockText ILIKE '%set type=$LookupType`nserver%' AND ScriptBlockText ILIKE '%$Command | nslookup 2>&1 | Out-String%' AND ScriptBlockText ILIKE '%New-RandomDNSField%' AND ScriptBlockText ILIKE '%[Convert]::ToString($SYNOptions, 16)%' AND ScriptBlockText ILIKE '%$Session.Dead = $True%' AND ScriptBlockText ILIKE '%$Session["Driver"] -eq%')
