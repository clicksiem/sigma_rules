rule: SELECT * FROM logs WHERE ScriptBlockText ILIKE '%Invoke-CimMethod %' AND ScriptBlockText ILIKE '%-ClassName %' AND ScriptBlockText ILIKE '%Win32\_Product %' AND ScriptBlockText ILIKE '%-MethodName %' AND ScriptBlockText ILIKE '%.msi%'
