rule: SELECT * FROM logs WHERE (ScriptBlockText ILIKE '%Disable-WindowsOptionalFeature%' AND ScriptBlockText ILIKE '%-Online%' AND ScriptBlockText ILIKE '%-FeatureName%') AND (ScriptBlockText ILIKE '%Windows-Defender-Gui%' OR ScriptBlockText ILIKE '%Windows-Defender-Features%' OR ScriptBlockText ILIKE '%Windows-Defender%' OR ScriptBlockText ILIKE '%Windows-Defender-ApplicationGuard%')
