id: 66d31e5f-52d6-40a4-9615-002d3789a119
name: Remote Thread Creation By Uncommon Source Image
level: 5
size: '>0'
active: true
author:
- Perez Diego (@darkquassar), oscd.community
group: windows
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1055
rule: SELECT * FROM logs WHERE (SourceImage ILIKE '%\\explorer.exe' OR SourceImage ILIKE '%\\iexplore.exe' OR SourceImage ILIKE '%\\msiexec.exe' OR SourceImage ILIKE '%\\powerpnt.exe' OR SourceImage ILIKE '%\\schtasks.exe' OR SourceImage ILIKE '%\\winlogon.exe') AND (NOT ((SourceImage ILIKE 'C:\\Windows\\System32\\winlogon.exe' AND (TargetImage IN ('C:\\Windows\\System32\\services.exe', 'C:\\Windows\\System32\\wininit.exe', 'C:\\Windows\\System32\\csrss.exe', 'C:\\Windows\\System32\\LogonUI.exe', 'C:\\Windows\\System32\\wlrmdr.exe', 'C:\\Windows\\System32\\AtBroker.exe', 'C:\\Windows\\System32\\dwm.exe', 'C:\\Windows\\System32\\fontdrvhost.exe', 'C:\\Windows\\System32\\userinit.exe'))) OR (SourceImage ILIKE 'C:\\Windows\\System32\\winlogon.exe' AND TargetParentProcessId=4) OR ((SourceImage IN ('C:\\Windows\\System32\\schtasks.exe', 'C:\\Windows\\SysWOW64\\schtasks.exe')) AND TargetImage ILIKE 'C:\\Windows\\System32\\conhost.exe') OR (SourceImage ILIKE 'C:\\Windows\\explorer.exe' AND (TargetImage ILIKE 'C:\\Program Files (x86)\\%' OR TargetImage ILIKE 'C:\\Program Files\\%' OR TargetImage ILIKE 'C:\\Windows\\System32\\%' OR TargetImage ILIKE 'C:\\Windows\\SysWOW64\\%')) OR TargetImage='System' OR (SourceImage ILIKE '%\\msiexec.exe' AND (TargetImage ILIKE '%\\AppData\\Local\\%' OR TargetImage ILIKE '%C:\\Program Files (x86)\\%' OR TargetImage ILIKE '%C:\\Program Files\\%' OR TargetImage ILIKE '%C:\\Windows\\Microsoft.NET\\Framework64\\%')) OR (SourceImage ILIKE '%\\msiexec.exe' AND (TargetImage IN ('C:\\Windows\\System32\\msiexec.exe', 'C:\\Windows\\SysWOW64\\msiexec.exe'))) OR (SourceImage ILIKE 'C:\\Program Files\\Internet Explorer\\iexplore.exe' AND (TargetImage IN ('C:\\Program Files (x86)\\Internet Explorer\\iexplore.exe', 'C:\\Windows\\System32\\rundll32.exe'))) OR (SourceImage ILIKE '%\\POWERPNT.EXE' AND (TargetImage ILIKE '%C:\\Program Files\\Microsoft Office\\%' OR TargetImage ILIKE '%C:\\Program Files (x86)\\Microsoft Office\\%')) OR isNull(TargetImage) OR TargetImage='')) AND (NOT ((SourceImage ILIKE 'C:\\Program Files\\internet explorer\\iexplore.exe' AND (SourceCommandLine ILIKE '%https://%' AND SourceCommandLine ILIKE '%.checkpoint.com/documents/%' AND SourceCommandLine ILIKE '%SmartConsole\_OLH/%' AND SourceCommandLine ILIKE '%default.htm#cshid=%')) OR (SourceImage ILIKE 'C:\\Program Files\\internet explorer\\iexplore.exe' AND (SourceParentImage ILIKE 'C:\\Program Files\\%' OR SourceParentImage ILIKE 'C:\\Program Files (x86)\\%') AND (SourceParentImage ILIKE '%\\CheckPoint\\SmartConsole\\%' AND SourceParentImage ILIKE '%\\SmartConsole.exe%')) OR (SourceImage ILIKE '%\\Microsoft Office\\%' AND SourceImage ILIKE '%\\POWERPNT.EXE' AND TargetImage ILIKE 'C:\\Windows\\System32\\csrss.exe') OR (SourceImage ILIKE 'C:\\Windows\\explorer.exe' AND TargetImage ILIKE '%\\AppData\\Local\\Microsoft\\OneDrive\\OneDrive.exe') OR (SourceImage ILIKE 'C:\\Windows\\explorer.exe' AND TargetImage ILIKE '%\\aurora-dashboard.exe') OR (SourceImage ILIKE 'C:\\Windows\\explorer.exe' AND TargetImage ILIKE '%\\OfficeSetup.exe')))
