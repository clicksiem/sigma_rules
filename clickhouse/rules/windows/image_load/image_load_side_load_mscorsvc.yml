rule: SELECT * FROM logs WHERE ImageLoaded ILIKE '%\\mscorsvc.dll' AND (NOT (ImageLoaded ILIKE 'C:\\Windows\\Microsoft.NET\\Framework\\%' OR ImageLoaded ILIKE 'C:\\Windows\\Microsoft.NET\\Framework64\\%' OR ImageLoaded ILIKE 'C:\\Windows\\Microsoft.NET\\FrameworkArm\\%' OR ImageLoaded ILIKE 'C:\\Windows\\Microsoft.NET\\FrameworkArm64\\%' OR ImageLoaded ILIKE 'C:\\Windows\\WinSxS\\%'))
