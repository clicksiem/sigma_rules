id: 333cdbe8-27bb-4246-bf82-b41a0dca4b70
name: Suspicious Volume Shadow Copy VSS_PS.dll Load
level: 8
size: '>0'
active: true
author:
- Markus Neis, @markus_neis
group: windows
tags:
- attack.impact
- attack.t1490
rule: SELECT * FROM logs WHERE ImageLoaded ILIKE '%\\vss\_ps.dll' AND (NOT ((Image ILIKE 'C:\\Windows\\%' AND (Image ILIKE '%\\clussvc.exe' OR Image ILIKE '%\\dismhost.exe' OR Image ILIKE '%\\dllhost.exe' OR Image ILIKE '%\\inetsrv\\appcmd.exe' OR Image ILIKE '%\\inetsrv\\iissetup.exe' OR Image ILIKE '%\\msiexec.exe' OR Image ILIKE '%\\rundll32.exe' OR Image ILIKE '%\\searchindexer.exe' OR Image ILIKE '%\\srtasks.exe' OR Image ILIKE '%\\svchost.exe' OR Image ILIKE '%\\System32\\SystemPropertiesAdvanced.exe' OR Image ILIKE '%\\taskhostw.exe' OR Image ILIKE '%\\thor.exe' OR Image ILIKE '%\\thor64.exe' OR Image ILIKE '%\\tiworker.exe' OR Image ILIKE '%\\vssvc.exe' OR Image ILIKE '%\\vssadmin.exe' OR Image ILIKE '%\\WmiPrvSE.exe' OR Image ILIKE '%\\wsmprovhost.exe')) OR (CommandLine ILIKE 'C:\\$WinREAgent\\Scratch\\%' AND CommandLine ILIKE '%\\dismhost.exe {%') OR isNull(Image))) AND (NOT (Image ILIKE 'C:\\Program Files\\%' OR Image ILIKE 'C:\\Program Files (x86)\\%'))
