id: f9df325d-d7bc-4a32-8a1a-2cc61dcefc63
name: Third Party Software DLL Sideloading
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems), Wietze Beukema (project and research)
group: windows
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
rule: SELECT * FROM logs WHERE (ImageLoaded ILIKE '%\\commfunc.dll' AND (NOT (ImageLoaded ILIKE '%\\AppData\\local\\Google\\Chrome\\Application\\%' OR (ImageLoaded ILIKE 'C:\\Program Files\\Lenovo\\Communications Utility\\%' OR ImageLoaded ILIKE 'C:\\Program Files (x86)\\Lenovo\\Communications Utility\\%')))) OR (ImageLoaded ILIKE '%\\tosbtkbd.dll' AND (NOT (ImageLoaded ILIKE 'C:\\Program Files\\Toshiba\\Bluetooth Toshiba Stack\\%' OR ImageLoaded ILIKE 'C:\\Program Files (x86)\\Toshiba\\Bluetooth Toshiba Stack\\%')))
