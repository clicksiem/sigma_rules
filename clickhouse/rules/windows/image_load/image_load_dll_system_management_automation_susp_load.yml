id: 092bc4b9-3d1d-43b4-a6b4-8c8acd83522f
name: PowerShell Core DLL Loaded By Non PowerShell Process
level: 5
size: '>0'
active: true
author:
- Tom Kern, oscd.community, Natalia Shornikova, Tim Shelton, Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
group: windows
tags:
- attack.t1059.001
- attack.execution
rule: SELECT * FROM logs WHERE (Description='System.Management.Automation' OR OriginalFileName='System.Management.Automation.dll' OR (ImageLoaded ILIKE '%\\System.Management.Automation.dll' OR ImageLoaded ILIKE '%\\System.Management.Automation.ni.dll')) AND (NOT ((Image IN ('C:\\Program Files\\PowerShell\\7-preview\\pwsh.exe', 'C:\\Program Files\\PowerShell\\7\\pwsh.exe', 'C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell\_ise.exe', 'C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe', 'C:\\Windows\\SysWOW64\\WindowsPowerShell\\v1.0\\powershell\_ise.exe', 'C:\\Windows\\SysWOW64\\WindowsPowerShell\\v1.0\\powershell.exe')) OR ((Image ILIKE '%C:\\Program Files\\WindowsApps\\Microsoft.PowerShellPreview%' OR Image ILIKE '%\\AppData\\Local\\Microsoft\\WindowsApps\\Microsoft.PowerShellPreview%') AND Image ILIKE '%\\pwsh.exe') OR (Image IN ('C:\\Windows\\System32\\dsac.exe', 'C:\\WINDOWS\\System32\\RemoteFXvGPUDisablement.exe', 'C:\\Windows\\System32\\runscripthelper.exe', 'C:\\WINDOWS\\System32\\sdiagnhost.exe', 'C:\\Windows\\System32\\ServerManager.exe', 'C:\\Windows\\System32\\SyncAppvPublishingServer.exe', 'C:\\Windows\\System32\\winrshost.exe', 'C:\\Windows\\System32\\wsmprovhost.exe', 'C:\\Windows\\SysWOW64\\winrshost.exe', 'C:\\Windows\\SysWOW64\\wsmprovhost.exe')) OR ((Image ILIKE 'C:\\Windows\\Microsoft.NET\\Framework\\%' OR Image ILIKE 'C:\\Windows\\Microsoft.NET\\FrameworkArm\\%' OR Image ILIKE 'C:\\Windows\\Microsoft.NET\\FrameworkArm64\\%' OR Image ILIKE 'C:\\Windows\\Microsoft.NET\\Framework64\\%') AND Image ILIKE '%\\mscorsvw.exe'))) AND (NOT (((Image ILIKE 'C:\\Program Files (x86)\\Microsoft SQL Server Management Studio%' OR Image ILIKE 'C:\\Program Files\\Microsoft SQL Server Management Studio%') AND Image ILIKE '%\\IDE\\Ssms.exe') OR ((Image ILIKE 'C:\\Program Files (x86)\\Microsoft SQL Server\\%' OR Image ILIKE 'C:\\Program Files\\Microsoft SQL Server\\%') AND Image ILIKE '%\\Tools\\Binn\\SQLPS.exe') OR Image ILIKE '%\\Citrix\\ConfigSync\\ConfigSyncRun.exe' OR (Image ILIKE 'C:\\Program Files (x86)\\Microsoft Visual Studio\\%' OR Image ILIKE 'C:\\Program Files\\Microsoft Visual Studio\\%') OR Image ILIKE 'C:\\ProgramData\\chocolatey\\choco.exe%' OR (Image ILIKE 'C:\\Windows\\Temp\\asgard2-agent\\%' AND (Image ILIKE '%\\thor64.exe' OR Image ILIKE '%\\thor.exe')) OR isNull(Image)))
