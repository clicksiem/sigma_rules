id: fef394cd-f44d-4040-9b18-95d92fe278c0
name: Potential DLL Sideloading Of DbgModel.DLL
level: 5
size: '>0'
active: true
author:
- Gary Lobermier
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
rule: SELECT * FROM logs WHERE ImageLoaded ILIKE '%\\dbgmodel.dll' AND (NOT (ImageLoaded ILIKE 'C:\\Windows\\System32\\%' OR ImageLoaded ILIKE 'C:\\Windows\\SysWOW64\\%' OR ImageLoaded ILIKE 'C:\\Windows\\WinSxS\\%')) AND (NOT (ImageLoaded ILIKE 'C:\\Program Files\\WindowsApps\\Microsoft.WinDbg\_%' OR (ImageLoaded ILIKE 'C:\\Program Files (x86)\\Windows Kits\\%' OR ImageLoaded ILIKE 'C:\\Program Files\\Windows Kits\\%')))
