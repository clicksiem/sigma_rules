id: 48bfd177-7cf2-412b-ad77-baf923489e82
name: Potentially Suspicious Volume Shadow Copy Vsstrace.dll Load
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.impact
- attack.t1490
rule: SELECT * FROM logs WHERE ImageLoaded ILIKE '%\\vsstrace.dll' AND (NOT (((Image IN ('C:\\Windows\\explorer.exe', 'C:\\Windows\\ImmersiveControlPanel\\SystemSettings.exe')) OR (Image ILIKE 'C:\\Windows\\System32\\%' OR Image ILIKE 'C:\\Windows\\SysWOW64\\%' OR Image ILIKE 'C:\\Windows\\Temp\\{%' OR Image ILIKE 'C:\\Windows\\WinSxS\\%' OR Image ILIKE 'C:\\ProgramData\\Package Cache\\{%')) OR (Image ILIKE 'C:\\Program Files\\%' OR Image ILIKE 'C:\\Program Files (x86)\\%') OR isNull(Image))) AND (NOT (Image ILIKE 'C:\\$WinREAgent\\Scratch\\%' OR (Image ILIKE '%\\temp\\is-%' AND Image ILIKE '%\\avira\_system\_speedup.tmp%')))
