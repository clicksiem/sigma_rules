rule: SELECT * FROM logs WHERE Image ILIKE '%\\coregen.exe' AND (NOT (ImageLoaded ILIKE 'C:\\Program Files (x86)\\Microsoft Silverlight\\%' OR ImageLoaded ILIKE 'C:\\Program Files\\Microsoft Silverlight\\%' OR ImageLoaded ILIKE 'C:\\Windows\\System32\\%' OR ImageLoaded ILIKE 'C:\\Windows\\SysWOW64\\%'))
