id: bb2ba6fb-95d4-4a25-89fc-30bb736c021a
name: PowerShell Core DLL Loaded Via Office Application
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.stealth
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\excel.exe' OR Image ILIKE '%\\mspub.exe' OR Image ILIKE '%\\outlook.exe' OR Image ILIKE '%\\onenote.exe' OR Image ILIKE '%\\onenoteim.exe' OR Image ILIKE '%\\powerpnt.exe' OR Image ILIKE '%\\winword.exe') AND (ImageLoaded ILIKE '%\\System.Management.Automation.Dll%' OR ImageLoaded ILIKE '%\\System.Management.Automation.ni.Dll%')
