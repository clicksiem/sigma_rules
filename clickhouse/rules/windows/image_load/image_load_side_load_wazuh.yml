rule: SELECT * FROM logs WHERE (ImageLoaded ILIKE '%\\libwazuhshared.dll' OR ImageLoaded ILIKE '%\\libwinpthread-1.dll') AND (NOT (ImageLoaded ILIKE 'C:\\Program Files\\%' OR ImageLoaded ILIKE 'C:\\Program Files (x86)\\%')) AND (NOT ((ImageLoaded ILIKE '%\\AppData\\Local\\%' OR ImageLoaded ILIKE '%\\ProgramData\\%') AND ImageLoaded ILIKE '%\\mingw64\\bin\\libwinpthread-1.dll'))
