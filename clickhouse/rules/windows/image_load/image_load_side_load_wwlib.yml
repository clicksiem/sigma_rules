rule: SELECT * FROM logs WHERE ImageLoaded ILIKE '%\\wwlib.dll' AND (NOT ((Image ILIKE 'C:\\Program Files (x86)\\Microsoft Office\\%' OR Image ILIKE 'C:\\Program Files\\Microsoft Office\\%') AND Image ILIKE '%\\winword.exe' AND (ImageLoaded ILIKE 'C:\\Program Files (x86)\\Microsoft Office\\%' OR ImageLoaded ILIKE 'C:\\Program Files\\Microsoft Office\\%')))
