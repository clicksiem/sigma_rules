rule: SELECT * FROM logs WHERE ImageLoaded ILIKE '%\\ShellDispatch.dll' AND (NOT ((ImageLoaded ILIKE '%:\\Users\\%' AND ImageLoaded ILIKE '%\\AppData\\Local\\Temp\\%') OR ImageLoaded ILIKE '%:\\Windows\\Temp\\%'))
