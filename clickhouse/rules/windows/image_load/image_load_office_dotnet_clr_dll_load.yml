id: d13c43f0-f66b-4279-8b2c-5912077c1780
name: CLR DLL Loaded Via Office Applications
level: 5
size: '>0'
active: true
author:
- Antonlovesdnb
group: windows
tags:
- attack.execution
- attack.t1204.002
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\excel.exe' OR Image ILIKE '%\\mspub.exe' OR Image ILIKE '%\\outlook.exe' OR Image ILIKE '%\\onenote.exe' OR Image ILIKE '%\\onenoteim.exe' OR Image ILIKE '%\\powerpnt.exe' OR Image ILIKE '%\\winword.exe') AND ImageLoaded ILIKE '%\\clr.dll%'
