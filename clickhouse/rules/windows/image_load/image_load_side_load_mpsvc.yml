rule: SELECT * FROM logs WHERE ImageLoaded ILIKE '%\\MpSvc.dll' AND (NOT (ImageLoaded ILIKE 'C:\\Program Files\\Windows Defender\\%' OR ImageLoaded ILIKE 'C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\%' OR ImageLoaded ILIKE 'C:\\Windows\\WinSxS\\%'))
