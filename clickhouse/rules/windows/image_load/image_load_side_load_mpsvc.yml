name: Potential DLL Sideloading Of MpSvc.DLL
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems), Wietze Beukema
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
