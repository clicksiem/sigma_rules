rule: SELECT * FROM logs WHERE ImageLoaded ILIKE '%\\appverifUI.dll' AND (NOT ((Image IN ('C:\\Windows\\SysWOW64\\appverif.exe', 'C:\\Windows\\System32\\appverif.exe')) AND (ImageLoaded ILIKE 'C:\\Windows\\System32\\%' OR ImageLoaded ILIKE 'C:\\Windows\\SysWOW64\\%' OR ImageLoaded ILIKE 'C:\\Windows\\WinSxS\\%')))
