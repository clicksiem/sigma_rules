rule: SELECT * FROM logs WHERE (ImageLoaded ILIKE '%.node' AND (Signed='false' OR SignatureStatus='Unavailable')) AND (NOT (Image ILIKE '%\\Code.exe' AND ImageLoaded ILIKE '%.vscode\\extensions\\ms-toolsai.jupyter-%' AND (ImageLoaded ILIKE '%\\electron.napi.node' OR ImageLoaded ILIKE '%\\node.napi.glibc.node')))
