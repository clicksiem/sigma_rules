id: e6ce8457-68b1-485b-9bdd-3c2b5d679aa9
name: VBA DLL Loaded Via Office Application
level: 8
size: '>0'
active: true
author:
- Antonlovesdnb
group: windows
tags:
- attack.execution
- attack.t1204.002
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\excel.exe' OR Image ILIKE '%\\mspub.exe' OR Image ILIKE '%\\onenote.exe' OR Image ILIKE '%\\onenoteim.exe' OR Image ILIKE '%\\outlook.exe' OR Image ILIKE '%\\powerpnt.exe' OR Image ILIKE '%\\winword.exe') AND (ImageLoaded ILIKE '%\\VBE7.DLL' OR ImageLoaded ILIKE '%\\VBEUI.DLL' OR ImageLoaded ILIKE '%\\VBE7INTL.DLL')
