id: 37774c23-25a1-4adb-bb6d-8bb9fd59c0f8
name: Suspicious Volume Shadow Copy Vssapi.dll Load
level: 8
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.impact
- attack.t1490
rule: SELECT * FROM logs WHERE ImageLoaded ILIKE '%\\vssapi.dll' AND (NOT (((Image IN ('C:\\Windows\\explorer.exe', 'C:\\Windows\\ImmersiveControlPanel\\SystemSettings.exe')) OR (Image ILIKE 'C:\\Windows\\System32\\%' OR Image ILIKE 'C:\\Windows\\SysWOW64\\%' OR Image ILIKE 'C:\\Windows\\Temp\\{%' OR Image ILIKE 'C:\\Windows\\WinSxS\\%')) OR (Image ILIKE 'C:\\Program Files\\%' OR Image ILIKE 'C:\\Program Files (x86)\\%') OR isNull(Image))) AND (NOT (Image ILIKE 'C:\\ProgramData\\Package Cache\\%' OR (Image ILIKE '%\\temp\\is-%' AND Image ILIKE '%\\avira\_system\_speedup.tmp%')))
