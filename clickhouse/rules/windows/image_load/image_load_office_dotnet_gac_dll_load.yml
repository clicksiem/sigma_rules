id: 90217a70-13fc-48e4-b3db-0d836c5824ac
name: GAC DLL Loaded Via Office Applications
level: 8
size: '>0'
active: true
author:
- Antonlovesdnb
group: windows
tags:
- attack.execution
- attack.t1204.002
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\excel.exe' OR Image ILIKE '%\\mspub.exe' OR Image ILIKE '%\\onenote.exe' OR Image ILIKE '%\\onenoteim.exe' OR Image ILIKE '%\\outlook.exe' OR Image ILIKE '%\\powerpnt.exe' OR Image ILIKE '%\\winword.exe') AND ImageLoaded ILIKE 'C:\\Windows\\Microsoft.NET\\assembly\\GAC\_MSIL%'
