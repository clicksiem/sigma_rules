id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
name: New Port Forwarding Rule Added Via Netsh.EXE
level: 5
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), omkar72, oscd.community, Swachchhanda Shrawan Poudel
group: windows
tags:
- attack.lateral-movement
- attack.command-and-control
- attack.t1090
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\netsh.exe' OR OriginalFileName='netsh.exe') AND ((CommandLine ILIKE '%interface%' AND CommandLine ILIKE '%portproxy%' AND CommandLine ILIKE '%add%' AND CommandLine ILIKE '%v4tov4%') OR (CommandLine ILIKE '%i %' AND CommandLine ILIKE '%p %' AND CommandLine ILIKE '%a %' AND CommandLine ILIKE '%v %') OR (CommandLine ILIKE '%connectp%' AND CommandLine ILIKE '%listena%' AND CommandLine ILIKE '%c=%'))
