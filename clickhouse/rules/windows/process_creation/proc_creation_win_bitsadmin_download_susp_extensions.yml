rule: SELECT * FROM logs WHERE (Image ILIKE '%\\bitsadmin.exe' OR OriginalFileName='bitsadmin.exe') AND (CommandLine ILIKE '% /transfer %' OR CommandLine ILIKE '% /create %' OR CommandLine ILIKE '% /addfile %') AND (CommandLine ILIKE '%.7z%' OR CommandLine ILIKE '%.asax%' OR CommandLine ILIKE '%.ashx%' OR CommandLine ILIKE '%.asmx%' OR CommandLine ILIKE '%.asp%' OR CommandLine ILIKE '%.aspx%' OR CommandLine ILIKE '%.bat%' OR CommandLine ILIKE '%.cfm%' OR CommandLine ILIKE '%.cgi%' OR CommandLine ILIKE '%.chm%' OR CommandLine ILIKE '%.cmd%' OR CommandLine ILIKE '%.dll%' OR CommandLine ILIKE '%.gif%' OR CommandLine ILIKE '%.jpeg%' OR CommandLine ILIKE '%.jpg%' OR CommandLine ILIKE '%.jsp%' OR CommandLine ILIKE '%.jspx%' OR CommandLine ILIKE '%.log%' OR CommandLine ILIKE '%.png%' OR CommandLine ILIKE '%.ps1%' OR CommandLine ILIKE '%.psm1%' OR CommandLine ILIKE '%.rar%' OR CommandLine ILIKE '%.scf%' OR CommandLine ILIKE '%.sct%' OR CommandLine ILIKE '%.txt%' OR CommandLine ILIKE '%.vbe%' OR CommandLine ILIKE '%.vbs%' OR CommandLine ILIKE '%.war%' OR CommandLine ILIKE '%.wsf%' OR CommandLine ILIKE '%.wsh%' OR CommandLine ILIKE '%.xll%' OR CommandLine ILIKE '%.zip%')
