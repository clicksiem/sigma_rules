id: 24c8392b-aa3c-46b7-a545-43f71657fe98
name: Suspicious Schtasks Schedule Types
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\schtasks.exe' OR OriginalFileName='schtasks.exe') AND (CommandLine ILIKE '% ONLOGON %' OR CommandLine ILIKE '% ONSTART %' OR CommandLine ILIKE '% ONCE %' OR CommandLine ILIKE '% ONIDLE %')) AND (NOT (CommandLine ILIKE '%NT AUT%' OR CommandLine ILIKE '% SYSTEM%' OR CommandLine ILIKE '%HIGHEST%'))
