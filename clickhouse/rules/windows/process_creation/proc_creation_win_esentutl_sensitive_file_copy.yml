rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\esentutl.exe' OR OriginalFileName ILIKE '\\esentutl.exe') AND (CommandLine ILIKE '%vss%' OR CommandLine ILIKE '% -m %' OR CommandLine ILIKE '% /m %' OR CommandLine ILIKE '% –m %' OR CommandLine ILIKE '% —m %' OR CommandLine ILIKE '% ―m %' OR CommandLine ILIKE '% -y %' OR CommandLine ILIKE '% /y %' OR CommandLine ILIKE '% –y %' OR CommandLine ILIKE '% —y %' OR CommandLine ILIKE '% ―y %')) OR (CommandLine ILIKE '%\\config\\RegBack\\sam%' OR CommandLine ILIKE '%\\config\\RegBack\\security%' OR CommandLine ILIKE '%\\config\\RegBack\\system%' OR CommandLine ILIKE '%\\config\\sam%' OR CommandLine ILIKE '%\\config\\security%' OR CommandLine ILIKE '%\\config\\system %' OR CommandLine ILIKE '%\\repair\\sam%' OR CommandLine ILIKE '%\\repair\\security%' OR CommandLine ILIKE '%\\repair\\system%' OR CommandLine ILIKE '%\\windows\\ntds\\ntds.dit%')
