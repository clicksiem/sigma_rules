id: aae1243f-d8af-40d8-ab20-33fc6d0c55bc
name: Suspicious Use of PsLogList
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.discovery
- attack.t1087
- attack.t1087.001
- attack.t1087.002
rule: SELECT * FROM logs WHERE (OriginalFileName='psloglist.exe' OR (Image ILIKE '%\\psloglist.exe' OR Image ILIKE '%\\psloglist64.exe')) AND (CommandLine ILIKE '% security%' OR CommandLine ILIKE '% application%' OR CommandLine ILIKE '% system%') AND (CommandLine ILIKE '% -d%' OR CommandLine ILIKE '% /d%' OR CommandLine ILIKE '% –d%' OR CommandLine ILIKE '% —d%' OR CommandLine ILIKE '% ―d%' OR CommandLine ILIKE '% -x%' OR CommandLine ILIKE '% /x%' OR CommandLine ILIKE '% –x%' OR CommandLine ILIKE '% —x%' OR CommandLine ILIKE '% ―x%' OR CommandLine ILIKE '% -s%' OR CommandLine ILIKE '% /s%' OR CommandLine ILIKE '% –s%' OR CommandLine ILIKE '% —s%' OR CommandLine ILIKE '% ―s%' OR CommandLine ILIKE '% -c%' OR CommandLine ILIKE '% /c%' OR CommandLine ILIKE '% –c%' OR CommandLine ILIKE '% —c%' OR CommandLine ILIKE '% ―c%' OR CommandLine ILIKE '% -g%' OR CommandLine ILIKE '% /g%' OR CommandLine ILIKE '% –g%' OR CommandLine ILIKE '% —g%' OR CommandLine ILIKE '% ―g%')
