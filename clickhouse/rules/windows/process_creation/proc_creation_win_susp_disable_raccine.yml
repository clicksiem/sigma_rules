rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%taskkill %' AND CommandLine ILIKE '%RaccineSettings.exe%') OR (CommandLine ILIKE '%reg.exe%' AND CommandLine ILIKE '%delete%' AND CommandLine ILIKE '%Raccine Tray%') OR (CommandLine ILIKE '%schtasks%' AND CommandLine ILIKE '%/DELETE%' AND CommandLine ILIKE '%Raccine Rules Updater%')
