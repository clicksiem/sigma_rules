rule: SELECT * FROM logs WHERE (OriginalFileName='diskshadow.exe' OR Image ILIKE '%\\diskshadow.exe') AND (CommandLine ILIKE '%-s %' OR CommandLine ILIKE '%/s %' OR CommandLine ILIKE '%–s %' OR CommandLine ILIKE '%—s %' OR CommandLine ILIKE '%―s %') AND (CommandLine ILIKE '%:\\Temp\\%' OR CommandLine ILIKE '%:\\Windows\\Temp\\%' OR CommandLine ILIKE '%\\AppData\\Local\\%' OR CommandLine ILIKE '%\\AppData\\Roaming\\%' OR CommandLine ILIKE '%\\ProgramData\\%' OR CommandLine ILIKE '%\\Users\\Public\\%')
