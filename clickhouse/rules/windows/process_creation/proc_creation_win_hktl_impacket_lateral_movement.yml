rule: SELECT * FROM logs WHERE ((ParentImage ILIKE '%\\wmiprvse.exe' OR ParentImage ILIKE '%\\mmc.exe' OR ParentImage ILIKE '%\\explorer.exe' OR ParentImage ILIKE '%\\services.exe') AND (CommandLine ILIKE '%cmd.exe%' AND CommandLine ILIKE '%/Q%' AND CommandLine ILIKE '%/c%' AND CommandLine ILIKE '%\\\\127.0.0.1\\%' AND CommandLine ILIKE '%&1%')) OR ((ParentCommandLine ILIKE '%svchost.exe -k netsvcs%' OR ParentCommandLine ILIKE '%taskeng.exe%') AND (CommandLine ILIKE '%cmd.exe%' AND CommandLine ILIKE '%/C%' AND CommandLine ILIKE '%Windows\\Temp\\%' AND CommandLine ILIKE '%&1%'))
