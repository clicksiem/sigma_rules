rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%accepteula%' AND CommandLine ILIKE '% -u %' AND CommandLine ILIKE '% -p %' AND CommandLine ILIKE '% \\\\%') AND (NOT (CommandLine ILIKE '%\\\\localhost%' OR CommandLine ILIKE '%\\\\127.%'))
