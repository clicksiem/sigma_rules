id: 587254ee-a24b-4335-b3cd-065c0f1f4baa
name: Remote File Download Via Findstr.EXE
level: 5
size: '>0'
active: true
author:
- Furkan CALISKAN, @caliskanfurkan_, @oscd_initiative, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.credential-access
- attack.command-and-control
- attack.stealth
- attack.t1218
- attack.t1564.004
- attack.t1552.001
- attack.t1105
rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%findstr%' OR Image ILIKE '%findstr.exe' OR OriginalFileName='FINDSTR.EXE') AND ((CommandLine ILIKE '% -v %' OR CommandLine ILIKE '% /v %' OR CommandLine ILIKE '% –v %' OR CommandLine ILIKE '% —v %' OR CommandLine ILIKE '% ―v %') AND (CommandLine ILIKE '% -l %' OR CommandLine ILIKE '% /l %' OR CommandLine ILIKE '% –l %' OR CommandLine ILIKE '% —l %' OR CommandLine ILIKE '% ―l %') AND CommandLine ILIKE '%\\\\%')
