id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
name: Suspicious Eventlog Clearing or Configuration Change Activity
level: 8
size: '>0'
active: true
author:
- Ecco, Daniil Yugoslavskiy, oscd.community, D3F7A5105, Swachchhanda Shrawan Poudel (Nextron Systems)
group: windows
tags:
- attack.defense-impairment
- attack.t1685.005
- attack.t1685.001
- car.2016-04-002
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\wevtutil.exe' OR OriginalFileName='wevtutil.exe') AND (CommandLine ILIKE '%clear-log %' OR CommandLine ILIKE '% cl %' OR CommandLine ILIKE '%set-log %' OR CommandLine ILIKE '% sl %' OR CommandLine ILIKE '%lfn:%')) OR ((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\powershell\_ise.exe' OR Image ILIKE '%\\pwsh.exe') AND ((CommandLine ILIKE '%Clear-EventLog %' OR CommandLine ILIKE '%Remove-EventLog %' OR CommandLine ILIKE '%Limit-EventLog %' OR CommandLine ILIKE '%Clear-WinEvent %') OR (CommandLine ILIKE '%Eventing.Reader.EventLogSession%' AND CommandLine ILIKE '%ClearLog%') OR (CommandLine ILIKE '%Diagnostics.EventLog%' AND CommandLine ILIKE '%Clear%'))) OR (((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\powershell\_ise.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\wmic.exe') AND CommandLine ILIKE '%ClearEventLog%') AND (NOT ((ParentImage IN ('C:\\Windows\\SysWOW64\\msiexec.exe', 'C:\\Windows\\System32\\msiexec.exe')) AND CommandLine ILIKE '% sl %')))
