id: 17f0c0a8-8bd5-4ee0-8c5f-a342c0199f35
name: Suspicious File Download From IP Via Wget.EXE
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\wget.exe' OR OriginalFileName='wget.exe') AND match(CommandLine, '://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}') AND CommandLine ILIKE '%http%' AND (match(CommandLine, '\s-O\s') OR CommandLine ILIKE '%--output-document%') AND (CommandLine ILIKE '%.ps1' OR CommandLine ILIKE '%.ps1''' OR CommandLine ILIKE '%.ps1"' OR CommandLine ILIKE '%.dat' OR CommandLine ILIKE '%.dat''' OR CommandLine ILIKE '%.dat"' OR CommandLine ILIKE '%.msi' OR CommandLine ILIKE '%.msi''' OR CommandLine ILIKE '%.msi"' OR CommandLine ILIKE '%.bat' OR CommandLine ILIKE '%.bat''' OR CommandLine ILIKE '%.bat"' OR CommandLine ILIKE '%.exe' OR CommandLine ILIKE '%.exe''' OR CommandLine ILIKE '%.exe"' OR CommandLine ILIKE '%.vbs' OR CommandLine ILIKE '%.vbs''' OR CommandLine ILIKE '%.vbs"' OR CommandLine ILIKE '%.vbe' OR CommandLine ILIKE '%.vbe''' OR CommandLine ILIKE '%.vbe"' OR CommandLine ILIKE '%.hta' OR CommandLine ILIKE '%.hta''' OR CommandLine ILIKE '%.hta"' OR CommandLine ILIKE '%.dll' OR CommandLine ILIKE '%.dll''' OR CommandLine ILIKE '%.dll"' OR CommandLine ILIKE '%.psm1' OR CommandLine ILIKE '%.psm1''' OR CommandLine ILIKE '%.psm1"')
