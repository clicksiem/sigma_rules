id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
name: Msiexec Quiet Installation
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.stealth
- attack.t1218.007
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\msiexec.exe' OR OriginalFileName='msiexec.exe') AND (CommandLine ILIKE '%-i%' OR CommandLine ILIKE '%/i%' OR CommandLine ILIKE '%–i%' OR CommandLine ILIKE '%—i%' OR CommandLine ILIKE '%―i%' OR CommandLine ILIKE '%-package%' OR CommandLine ILIKE '%/package%' OR CommandLine ILIKE '%–package%' OR CommandLine ILIKE '%—package%' OR CommandLine ILIKE '%―package%' OR CommandLine ILIKE '%-a%' OR CommandLine ILIKE '%/a%' OR CommandLine ILIKE '%–a%' OR CommandLine ILIKE '%—a%' OR CommandLine ILIKE '%―a%' OR CommandLine ILIKE '%-j%' OR CommandLine ILIKE '%/j%' OR CommandLine ILIKE '%–j%' OR CommandLine ILIKE '%—j%' OR CommandLine ILIKE '%―j%') AND (CommandLine ILIKE '%-q%' OR CommandLine ILIKE '%/q%' OR CommandLine ILIKE '%–q%' OR CommandLine ILIKE '%—q%' OR CommandLine ILIKE '%―q%')) AND (NOT ((ParentImage ILIKE 'C:\\Users\\%' AND ParentImage ILIKE '%\\AppData\\Local\\Temp\\%') OR ParentImage ILIKE 'C:\\Windows\\Temp\\%' OR (ParentImage ILIKE 'C:\\Windows\\CCM\\Ccm32BitLauncher.exe' AND (IntegrityLevel IN ('System', 'S-1-16-16384')))))
