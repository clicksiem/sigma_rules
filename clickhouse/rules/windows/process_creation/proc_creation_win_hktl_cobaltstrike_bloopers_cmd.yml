rule: SELECT * FROM logs WHERE (OriginalFileName='Cmd.Exe' OR Image ILIKE '%\\cmd.exe') AND ((CommandLine ILIKE 'cmd %' OR CommandLine ILIKE 'cmd.exe%' OR CommandLine ILIKE 'c:\\windows\\system32\\cmd.exe%') AND (CommandLine ILIKE '%psinject%' OR CommandLine ILIKE '%spawnas%' OR CommandLine ILIKE '%make\_token%' OR CommandLine ILIKE '%remote-exec%' OR CommandLine ILIKE '%rev2self%' OR CommandLine ILIKE '%dcsync%' OR CommandLine ILIKE '%logonpasswords%' OR CommandLine ILIKE '%execute-assembly%' OR CommandLine ILIKE '%getsystem%'))
