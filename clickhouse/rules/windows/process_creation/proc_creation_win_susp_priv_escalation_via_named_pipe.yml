name: Privilege Escalation via Named Pipe Impersonation
level: 8
size: '>0'
active: true
author:
- Tim Rauch, Elastic (idea)
group: windows
tags:
- attack.lateral-movement
- attack.t1021
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\powershell.exe') OR (OriginalFileName IN ('Cmd.Exe', 'PowerShell.EXE'))) AND (CommandLine ILIKE '%echo%' AND CommandLine ILIKE '%>%' AND CommandLine ILIKE '%\\\\.\\pipe\\%')
