rule: SELECT * FROM logs WHERE (Image ILIKE '%\\RegAsm.exe' OR OriginalFileName='RegAsm.exe') AND (CommandLine ILIKE '%RegAsm' OR CommandLine ILIKE '%RegAsm.exe' OR CommandLine ILIKE '%RegAsm.exe"' OR CommandLine ILIKE '%RegAsm.exe''')
