id: c4eeeeae-89f4-43a7-8b48-8d1bdfa66c78
name: Scheduled Task Executing Encoded Payload from Registry
level: 8
size: '>0'
active: true
author:
- pH-T (Nextron Systems), @Kostastsale, TheDFIRReport, X__Junior (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
- attack.t1059.001
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\schtasks.exe' OR OriginalFileName='schtasks.exe') AND CommandLine ILIKE '%/Create%' AND (CommandLine ILIKE '%FromBase64String%' OR CommandLine ILIKE '%encodedcommand%') AND (CommandLine ILIKE '%Get-ItemProperty%' OR CommandLine ILIKE '% gp %') AND (CommandLine ILIKE '%HKCU:%' OR CommandLine ILIKE '%HKLM:%' OR CommandLine ILIKE '%registry::%' OR CommandLine ILIKE '%HKEY\_%')
