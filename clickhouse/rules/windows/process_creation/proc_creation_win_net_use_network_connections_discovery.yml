rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\net.exe' OR Image ILIKE '%\\net1.exe') OR (OriginalFileName IN ('net.exe', 'net1.exe'))) AND ((CommandLine ILIKE '% use' OR CommandLine ILIKE '% sessions') OR (CommandLine ILIKE '% use %' OR CommandLine ILIKE '% sessions %'))
