id: 42b1a5b8-353f-4f10-b256-39de4467faff
name: Harvesting Of Wifi Credentials Via Netsh.EXE
level: 5
size: '>0'
active: true
author:
- Andreas Hunkeler (@Karneades), oscd.community
group: windows
tags:
- attack.discovery
- attack.credential-access
- attack.t1040
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\netsh.exe' OR OriginalFileName='netsh.exe') AND (CommandLine ILIKE '%wlan%' AND CommandLine ILIKE '% s%' AND CommandLine ILIKE '% p%' AND CommandLine ILIKE '% k%' AND CommandLine ILIKE '%=clear%')
