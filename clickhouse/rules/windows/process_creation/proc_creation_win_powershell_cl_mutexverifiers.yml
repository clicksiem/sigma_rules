rule: SELECT * FROM logs WHERE ((ParentImage ILIKE '%\\powershell.exe' OR ParentImage ILIKE '%\\pwsh.exe') AND Image ILIKE '%\\powershell.exe' AND CommandLine ILIKE '% -nologo -windowstyle minimized -file %') AND (CommandLine ILIKE '%\\AppData\\Local\\Temp\\%' OR CommandLine ILIKE '%\\Windows\\Temp\\%')
