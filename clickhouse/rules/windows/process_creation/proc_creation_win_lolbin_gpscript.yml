rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\gpscript.exe' OR OriginalFileName='GPSCRIPT.EXE') AND (CommandLine ILIKE '% /logon%' OR CommandLine ILIKE '% /startup%')) AND (NOT ParentCommandLine ILIKE 'C:\\windows\\system32\\svchost.exe -k netsvcs -p -s gpsvc')
