rule: SELECT * FROM logs WHERE (Image ILIKE '%\\msdt.exe' AND CommandLine ILIKE '%\\WINDOWS\\diagnostics\\index\\PCWDiagnostic.xml%' AND (CommandLine ILIKE '% -af %' OR CommandLine ILIKE '% /af %' OR CommandLine ILIKE '% –af %' OR CommandLine ILIKE '% —af %' OR CommandLine ILIKE '% ―af %')) AND (NOT ParentImage ILIKE '%\\pcwrun.exe')
