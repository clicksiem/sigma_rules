rule: SELECT * FROM logs WHERE (Image ILIKE '%\\msiexec.exe' AND (CommandLine ILIKE '% -Y%' OR CommandLine ILIKE '% /Y%' OR CommandLine ILIKE '% –Y%' OR CommandLine ILIKE '% —Y%' OR CommandLine ILIKE '% ―Y%')) AND (NOT (CommandLine ILIKE '%\\MsiExec.exe" /Y "C:\\Program Files\\%' OR CommandLine ILIKE '%\\MsiExec.exe" /Y "C:\\Program Files (x86)\\%' OR CommandLine ILIKE '%\\MsiExec.exe" /Y "C:\\Windows\\System32\\%' OR CommandLine ILIKE '%\\MsiExec.exe" /Y "C:\\Windows\\SysWOW64\\%'))
