id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
name: Suspicious New Service Creation
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\sc.exe' AND (CommandLine ILIKE '%create%' AND CommandLine ILIKE '%binPath=%')) OR (CommandLine ILIKE '%New-Service%' AND CommandLine ILIKE '%-BinaryPathName%')) AND (CommandLine ILIKE '%powershell%' OR CommandLine ILIKE '%mshta%' OR CommandLine ILIKE '%wscript%' OR CommandLine ILIKE '%cscript%' OR CommandLine ILIKE '%svchost%' OR CommandLine ILIKE '%dllhost%' OR CommandLine ILIKE '%cmd %' OR CommandLine ILIKE '%cmd.exe /c%' OR CommandLine ILIKE '%cmd.exe /k%' OR CommandLine ILIKE '%cmd.exe /r%' OR CommandLine ILIKE '%rundll32%' OR CommandLine ILIKE '%C:\\Users\\Public%' OR CommandLine ILIKE '%\\Downloads\\%' OR CommandLine ILIKE '%\\Desktop\\%' OR CommandLine ILIKE '%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\%' OR CommandLine ILIKE '%C:\\Windows\\TEMP\\%' OR CommandLine ILIKE '%\\AppData\\Local\\Temp%')
