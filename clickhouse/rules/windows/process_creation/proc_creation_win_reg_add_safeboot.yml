rule: SELECT * FROM logs WHERE (Image ILIKE '%\\reg.exe' OR OriginalFileName='reg.exe') AND CommandLine ILIKE '%\\SYSTEM\\CurrentControlSet\\Control\\SafeBoot%' AND (CommandLine ILIKE '% copy %' OR CommandLine ILIKE '% add %')
