id: cdf05894-89e7-4ead-b2b0-0a5f97a90f2f
name: Potential Encoded PowerShell Patterns In CommandLine
level: 3
size: '>0'
active: true
author:
- Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton
group: windows
tags:
- attack.stealth
- attack.t1027
- attack.execution
- attack.t1059.001
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe') OR (OriginalFileName IN ('PowerShell.EXE', 'pwsh.dll'))) AND (((CommandLine ILIKE '%ToInt%' OR CommandLine ILIKE '%ToDecimal%' OR CommandLine ILIKE '%ToByte%' OR CommandLine ILIKE '%ToUint%' OR CommandLine ILIKE '%ToSingle%' OR CommandLine ILIKE '%ToSByte%') AND (CommandLine ILIKE '%ToChar%' OR CommandLine ILIKE '%ToString%' OR CommandLine ILIKE '%String%')) OR ((CommandLine ILIKE '%char%' AND CommandLine ILIKE '%join%') OR (CommandLine ILIKE '%split%' AND CommandLine ILIKE '%join%')))
