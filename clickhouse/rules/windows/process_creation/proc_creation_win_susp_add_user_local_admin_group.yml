rule: SELECT * FROM logs WHERE ((CommandLine ILIKE '%localgroup %' AND CommandLine ILIKE '% /add%') OR (CommandLine ILIKE '%Add-LocalGroupMember %' AND CommandLine ILIKE '% -Group %')) AND (CommandLine ILIKE '% administrators %' OR CommandLine ILIKE '% administrateur%')
