id: 811f459f-9231-45d4-959a-0266c6311987
name: Suspicious Child Process Of BgInfo.EXE
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.stealth
- attack.t1059.005
- attack.t1218
- attack.t1202
rule: SELECT * FROM logs WHERE (ParentImage ILIKE '%\\bginfo.exe' OR ParentImage ILIKE '%\\bginfo64.exe') AND ((Image ILIKE '%\\calc.exe' OR Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\cscript.exe' OR Image ILIKE '%\\mshta.exe' OR Image ILIKE '%\\notepad.exe' OR Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\wscript.exe') OR (Image ILIKE '%\\AppData\\Local\\%' OR Image ILIKE '%\\AppData\\Roaming\\%' OR Image ILIKE '%:\\Users\\Public\\%' OR Image ILIKE '%:\\Temp\\%' OR Image ILIKE '%:\\Windows\\Temp\\%' OR Image ILIKE '%:\\PerfLogs\\%'))
