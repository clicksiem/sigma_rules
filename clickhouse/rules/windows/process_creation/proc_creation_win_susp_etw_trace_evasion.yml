group: windows
tags:
- attack.stealth
- attack.defense-impairment
- attack.t1070
- attack.t1685
- car.2016-04-002
rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%cl%' AND CommandLine ILIKE '%/Trace%') OR (CommandLine ILIKE '%clear-log%' AND CommandLine ILIKE '%/Trace%') OR (CommandLine ILIKE '%sl%' AND CommandLine ILIKE '%/e:false%') OR (CommandLine ILIKE '%set-log%' AND CommandLine ILIKE '%/e:false%') OR (CommandLine ILIKE '%logman%' AND CommandLine ILIKE '%update%' AND CommandLine ILIKE '%trace%' AND CommandLine ILIKE '%--p%' AND CommandLine ILIKE '%-ets%') OR CommandLine ILIKE '%Remove-EtwTraceProvider%' OR (CommandLine ILIKE '%Set-EtwTraceProvider%' AND CommandLine ILIKE '%0x11%')
