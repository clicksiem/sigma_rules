rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\wbadmin.exe' OR OriginalFileName='WBADMIN.EXE') AND (CommandLine ILIKE '%delete %' AND CommandLine ILIKE '%backup%')) AND (NOT CommandLine ILIKE '%keepVersions:0%')
