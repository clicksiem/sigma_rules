rule: SELECT * FROM logs WHERE (isNull(OriginalFileName) AND CommandLine ILIKE '%.exe tunnel') OR (CommandLine ILIKE '%.exe tunnel%' AND CommandLine ILIKE '%--accept-server-license-terms%') OR (ParentCommandLine ILIKE '% tunnel' AND Image ILIKE '%\\cmd.exe' AND (CommandLine ILIKE '%/d /c %' AND CommandLine ILIKE '%\\servers\\Stable-%' AND CommandLine ILIKE '%code-server.cmd%'))
