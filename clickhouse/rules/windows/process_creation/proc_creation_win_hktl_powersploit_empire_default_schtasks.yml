rule: SELECT * FROM logs WHERE (ParentImage ILIKE '%\\powershell.exe' OR ParentImage ILIKE '%\\pwsh.exe') AND Image ILIKE '%\\schtasks.exe' AND (CommandLine ILIKE '%/Create%' AND CommandLine ILIKE '%powershell.exe -NonI%' AND CommandLine ILIKE '%/TN Updater /TR%') AND (CommandLine ILIKE '%/SC ONLOGON%' OR CommandLine ILIKE '%/SC DAILY /ST%' OR CommandLine ILIKE '%/SC ONIDLE%' OR CommandLine ILIKE '%/SC HOURLY%')
