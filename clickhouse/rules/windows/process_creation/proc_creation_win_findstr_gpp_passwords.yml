id: 91a2c315-9ee6-4052-a853-6f6a8238f90d
name: Findstr GPP Passwords
level: 8
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.credential-access
- attack.t1552.006
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\find.exe' OR Image ILIKE '%\\findstr.exe') OR (OriginalFileName IN ('FIND.EXE', 'FINDSTR.EXE'))) AND (CommandLine ILIKE '%cpassword%' AND CommandLine ILIKE '%\\sysvol\\%' AND CommandLine ILIKE '%.xml%')
