id: 7b582f1a-b318-4c6a-bf4e-66fe49bf55a5
name: Remote Access Tool - ScreenConnect Potential Suspicious Remote Command Execution
level: 5
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), @Kostastsale
group: windows
tags:
- attack.command-and-control
- attack.t1219.002
rule: SELECT * FROM logs WHERE (ParentCommandLine ILIKE '%:\\Windows\\TEMP\\ScreenConnect\\%' AND ParentCommandLine ILIKE '%run.cmd%') AND (Image ILIKE '%\\bitsadmin.exe' OR Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\curl.exe' OR Image ILIKE '%\\dllhost.exe' OR Image ILIKE '%\\net.exe' OR Image ILIKE '%\\nltest.exe' OR Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\rundll32.exe' OR Image ILIKE '%\\wevtutil.exe')
