rule: SELECT * FROM logs WHERE Image ILIKE '%\\dnscmd.exe' AND (CommandLine ILIKE '%/enumrecords%' OR CommandLine ILIKE '%/enumzones%' OR CommandLine ILIKE '%/ZonePrint%' OR CommandLine ILIKE '%/info%')
