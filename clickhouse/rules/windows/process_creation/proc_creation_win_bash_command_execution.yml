rule: SELECT * FROM logs WHERE ((Image ILIKE '%:\\Windows\\System32\\bash.exe' OR Image ILIKE '%:\\Windows\\SysWOW64\\bash.exe') OR OriginalFileName='Bash.exe') AND CommandLine ILIKE '% -c %'
