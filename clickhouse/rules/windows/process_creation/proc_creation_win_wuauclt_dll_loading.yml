id: af77cf95-c469-471c-b6a0-946c685c4798
name: Proxy Execution Via Wuauclt.EXE
level: 8
size: '>0'
active: true
author:
- Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), Florian Roth (Nextron Systems), Sreeman, FPT.EagleEye Team
group: windows
tags:
- attack.stealth
- attack.t1218
- attack.execution
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\wuauclt.exe' OR OriginalFileName='wuauclt.exe') AND (CommandLine ILIKE '%UpdateDeploymentProvider%' AND CommandLine ILIKE '%RunHandlerComServer%')) AND (NOT (CommandLine ILIKE '% /UpdateDeploymentProvider UpdateDeploymentProvider.dll %' OR CommandLine ILIKE '% wuaueng.dll %' OR (CommandLine ILIKE '%:\\Windows\\UUS\\Packages\\Preview\\amd64\\updatedeploy.dll /ClassId%' OR CommandLine ILIKE '%:\\Windows\\UUS\\amd64\\UpdateDeploy.dll /ClassId%') OR (CommandLine ILIKE '%:\\Windows\\WinSxS\\%' AND CommandLine ILIKE '%\\UpdateDeploy.dll /ClassId %')))
