id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
name: Suspicious Curl.EXE Download
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.command-and-control
- attack.t1105
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\curl.exe' OR Product='The curl executable') AND ((CommandLine ILIKE '%\%AppData\%%' OR CommandLine ILIKE '%\%Public\%%' OR CommandLine ILIKE '%\%Temp\%%' OR CommandLine ILIKE '%\%tmp\%%' OR CommandLine ILIKE '%\\AppData\\%' OR CommandLine ILIKE '%\\Desktop\\%' OR CommandLine ILIKE '%\\Temp\\%' OR CommandLine ILIKE '%\\Users\\Public\\%' OR CommandLine ILIKE '%C:\\PerfLogs\\%' OR CommandLine ILIKE '%C:\\ProgramData\\%' OR CommandLine ILIKE '%C:\\Windows\\Temp\\%') OR (CommandLine ILIKE '%.dll' OR CommandLine ILIKE '%.gif' OR CommandLine ILIKE '%.jpeg' OR CommandLine ILIKE '%.jpg' OR CommandLine ILIKE '%.png' OR CommandLine ILIKE '%.temp' OR CommandLine ILIKE '%.tmp' OR CommandLine ILIKE '%.txt' OR CommandLine ILIKE '%.vbe' OR CommandLine ILIKE '%.vbs')) AND (NOT (ParentImage ILIKE 'C:\\Program Files\\Git\\usr\\bin\\sh.exe' AND Image ILIKE 'C:\\Program Files\\Git\\mingw64\\bin\\curl.exe' AND (CommandLine ILIKE '%--silent --show-error --output %' AND CommandLine ILIKE '%gfw-httpget-%' AND CommandLine ILIKE '%AppData%')))
