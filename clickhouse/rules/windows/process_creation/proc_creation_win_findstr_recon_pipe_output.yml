id: ccb5742c-c248-4982-8c5c-5571b9275ad3
name: Recon Command Output Piped To Findstr.EXE
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems), frack113
group: windows
tags:
- attack.discovery
- attack.t1057
rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%ipconfig%|%find%' OR CommandLine ILIKE '%net%|%find%' OR CommandLine ILIKE '%netstat%|%find%' OR CommandLine ILIKE '%ping%|%find%' OR CommandLine ILIKE '%systeminfo%|%find%' OR CommandLine ILIKE '%tasklist%|%find%' OR CommandLine ILIKE '%whoami%|%find%') AND (NOT (CommandLine ILIKE '%cmd.exe /c TASKLIST /V |%' AND CommandLine ILIKE '%FIND /I%' AND CommandLine ILIKE '%\\xampp\\%' AND CommandLine ILIKE '%\\catalina\_start.bat%'))
