id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
name: Potential Browser Data Stealing
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.credential-access
- attack.t1555.003
rule: SELECT * FROM logs WHERE ((CommandLine ILIKE '%copy-item%' OR CommandLine ILIKE '%copy %' OR CommandLine ILIKE '%cpi %' OR CommandLine ILIKE '% cp %' OR CommandLine ILIKE '%move %' OR CommandLine ILIKE '%move-item%' OR CommandLine ILIKE '% mi %' OR CommandLine ILIKE '% mv %') OR (Image ILIKE '%\\esentutl.exe' OR Image ILIKE '%\\xcopy.exe' OR Image ILIKE '%\\robocopy.exe') OR (OriginalFileName IN ('esentutl.exe', 'XCOPY.EXE', 'robocopy.exe'))) AND (CommandLine ILIKE '%\\Amigo\\User Data%' OR CommandLine ILIKE '%\\BraveSoftware\\Brave-Browser\\User Data%' OR CommandLine ILIKE '%\\CentBrowser\\User Data%' OR CommandLine ILIKE '%\\Chromium\\User Data%' OR CommandLine ILIKE '%\\CocCoc\\Browser\\User Data%' OR CommandLine ILIKE '%\\Comodo\\Dragon\\User Data%' OR CommandLine ILIKE '%\\Elements Browser\\User Data%' OR CommandLine ILIKE '%\\Epic Privacy Browser\\User Data%' OR CommandLine ILIKE '%\\Google\\Chrome Beta\\User Data%' OR CommandLine ILIKE '%\\Google\\Chrome SxS\\User Data%' OR CommandLine ILIKE '%\\Google\\Chrome\\User Data\\%' OR CommandLine ILIKE '%\\Kometa\\User Data%' OR CommandLine ILIKE '%\\Maxthon5\\Users%' OR CommandLine ILIKE '%\\Microsoft\\Edge\\User Data%' OR CommandLine ILIKE '%\\Mozilla\\Firefox\\Profiles%' OR CommandLine ILIKE '%\\Nichrome\\User Data%' OR CommandLine ILIKE '%\\Opera Software\\Opera GX Stable\\%' OR CommandLine ILIKE '%\\Opera Software\\Opera Neon\\User Data%' OR CommandLine ILIKE '%\\Opera Software\\Opera Stable\\%' OR CommandLine ILIKE '%\\Orbitum\\User Data%' OR CommandLine ILIKE '%\\QIP Surf\\User Data%' OR CommandLine ILIKE '%\\Sputnik\\User Data%' OR CommandLine ILIKE '%\\Torch\\User Data%' OR CommandLine ILIKE '%\\uCozMedia\\Uran\\User Data%' OR CommandLine ILIKE '%\\Vivaldi\\User Data%')
