id: 3c05e90d-7eba-4324-9972-5d7f711a60a8
name: UAC Bypass Tools Using ComputerDefaults
level: 8
size: '>0'
active: true
author:
- Christian Burkard (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.t1548.002
rule: SELECT * FROM logs WHERE ((IntegrityLevel IN ('High', 'System', 'S-1-16-16384', 'S-1-16-12288')) AND Image ILIKE 'C:\\Windows\\System32\\ComputerDefaults.exe') AND (NOT (ParentImage ILIKE '%:\\Windows\\System32%' OR ParentImage ILIKE '%:\\Program Files%'))
