rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\ADExp.exe' OR Image ILIKE '%\\ADExplorer.exe' OR Image ILIKE '%\\ADExplorer64.exe' OR Image ILIKE '%\\ADExplorer64a.exe') OR OriginalFileName='AdExp' OR Description='Active Directory Editor' OR Product='Sysinternals ADExplorer') AND CommandLine ILIKE '%snapshot%'
