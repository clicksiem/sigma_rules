rule: SELECT * FROM logs WHERE ParentImage ILIKE 'C:\\WINDOWS\\System32\\svchost.exe' AND (ParentCommandLine ILIKE '%-k netsvcs%' AND ParentCommandLine ILIKE '%-s Schedule%') AND (CommandLine ILIKE '% -windowstyle hidden' OR CommandLine ILIKE '% -w hidden' OR CommandLine ILIKE '% -ep bypass' OR CommandLine ILIKE '% -noni')
