id: 7a74da6b-ea76-47db-92cc-874ad90df734
name: Suspicious MSDT Parent Process
level: 8
size: '>0'
active: true
author:
- Nextron Systems
group: windows
tags:
- attack.stealth
- attack.t1036
- attack.t1218
rule: SELECT * FROM logs WHERE (ParentImage ILIKE '%\\cmd.exe' OR ParentImage ILIKE '%\\cscript.exe' OR ParentImage ILIKE '%\\mshta.exe' OR ParentImage ILIKE '%\\powershell.exe' OR ParentImage ILIKE '%\\pwsh.exe' OR ParentImage ILIKE '%\\regsvr32.exe' OR ParentImage ILIKE '%\\rundll32.exe' OR ParentImage ILIKE '%\\schtasks.exe' OR ParentImage ILIKE '%\\wmic.exe' OR ParentImage ILIKE '%\\wscript.exe' OR ParentImage ILIKE '%\\wsl.exe') AND (Image ILIKE '%\\msdt.exe' OR OriginalFileName='msdt.exe')
