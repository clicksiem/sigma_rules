id: 2d3cdeec-c0db-45b4-aa86-082f7eb75701
name: Microsoft IIS Service Account Password Dumped
level: 8
size: '>0'
active: true
author:
- Tim Rauch, Janantha Marasinghe, Elastic (original idea)
group: windows
tags:
- attack.credential-access
- attack.t1003
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\appcmd.exe' OR OriginalFileName='appcmd.exe') AND CommandLine ILIKE '%list %') AND ((CommandLine ILIKE '% /config%' OR CommandLine ILIKE '% /xml%' OR CommandLine ILIKE '% -config%' OR CommandLine ILIKE '% -xml%') OR ((CommandLine ILIKE '% /@t%' OR CommandLine ILIKE '% /text%' OR CommandLine ILIKE '% /show%' OR CommandLine ILIKE '% -@t%' OR CommandLine ILIKE '% -text%' OR CommandLine ILIKE '% -show%') AND (CommandLine ILIKE '%:*%' OR CommandLine ILIKE '%password%')))
