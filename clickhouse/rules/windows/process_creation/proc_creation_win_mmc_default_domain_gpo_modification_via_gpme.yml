rule: SELECT * FROM logs WHERE (Image ILIKE '%\\mmc.exe' OR OriginalFileName='MMC.exe') AND (CommandLine ILIKE '%gpme.msc%' AND CommandLine ILIKE '%gpobject:%') AND (CommandLine ILIKE '%31B2F340-016D-11D2-945F-00C04FB984F9%' OR CommandLine ILIKE '%6AC1786C-016F-11D2-945F-00C04FB984F9%')
