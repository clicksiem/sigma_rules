id: 1e53dd56-8d83-4eb4-a43e-b790a05510aa
name: Always Install Elevated MSI Spawned Cmd And Powershell
level: 5
size: '>0'
active: true
author:
- Teymur Kheirkhabarov (idea), Mangatas Tondang (rule), oscd.community
group: windows
tags:
- attack.privilege-escalation
- attack.t1548.002
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe') OR (OriginalFileName IN ('Cmd.Exe', 'PowerShell.EXE', 'pwsh.dll'))) AND ((ParentImage ILIKE '%\\Windows\\Installer\\%' AND ParentImage ILIKE '%msi%') AND ParentImage ILIKE '%tmp')
