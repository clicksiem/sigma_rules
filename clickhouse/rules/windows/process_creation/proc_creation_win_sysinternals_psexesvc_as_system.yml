id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
name: PsExec Service Child Process Execution as LOCAL SYSTEM
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.execution
rule: SELECT * FROM logs WHERE ParentImage ILIKE 'C:\\Windows\\PSEXESVC.exe' AND (User ILIKE '%AUTHORI%' OR User ILIKE '%AUTORI%')
