rule: SELECT * FROM logs WHERE (((Image ILIKE '%\\net.exe' OR Image ILIKE '%\\net1.exe') OR (OriginalFileName IN ('net.exe', 'net1.exe'))) AND (CommandLine ILIKE '% use %' AND CommandLine ILIKE '%:%\\%' AND CommandLine ILIKE '%/USER:% %')) AND (NOT CommandLine ILIKE '% ')
