rule: SELECT * FROM logs WHERE (OriginalFileName IN ('Cmd.Exe', 'CONHOST.EXE', '7z.exe', '7za.exe', 'WinRAR.exe', 'wevtutil.exe', 'net.exe', 'net1.exe', 'netsh.exe', 'InstallUtil.exe')) AND (NOT (Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\conhost.exe' OR Image ILIKE '%\\7z.exe' OR Image ILIKE '%\\7za.exe' OR Image ILIKE '%\\WinRAR.exe' OR Image ILIKE '%\\wevtutil.exe' OR Image ILIKE '%\\net.exe' OR Image ILIKE '%\\net1.exe' OR Image ILIKE '%\\netsh.exe' OR Image ILIKE '%\\InstallUtil.exe'))
