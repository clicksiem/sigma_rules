rule: SELECT * FROM logs WHERE Image ILIKE '%\\runonce.exe' AND ParentImage ILIKE '%\\rundll32.exe' AND (ParentCommandLine ILIKE '%setupapi.dll%' AND ParentCommandLine ILIKE '%InstallHinfSection%')
