rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%/generic:Microsoft\_Windows\_Shell\_ZipFolder:filename=%' AND CommandLine ILIKE '%.zip%' AND CommandLine ILIKE '%/pass:%' AND CommandLine ILIKE '%/user:%') OR (CommandLine ILIKE '%/delete%' AND CommandLine ILIKE '%Microsoft\_Windows\_Shell\_ZipFolder:filename=%' AND CommandLine ILIKE '%.zip%')
