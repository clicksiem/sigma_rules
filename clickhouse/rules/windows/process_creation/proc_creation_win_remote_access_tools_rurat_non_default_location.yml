rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\rutserv.exe' OR Image ILIKE '%\\rfusclient.exe') OR Product='Remote Utilities') AND (NOT (Image ILIKE 'C:\\Program Files\\Remote Utilities%' OR Image ILIKE 'C:\\Program Files (x86)\\Remote Utilities%'))
