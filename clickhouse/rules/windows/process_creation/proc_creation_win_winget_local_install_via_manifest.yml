rule: SELECT * FROM logs WHERE (Image ILIKE '%\\winget.exe' OR OriginalFileName='winget.exe') AND (CommandLine ILIKE '%install%' OR CommandLine ILIKE '% add %') AND (CommandLine ILIKE '%-m %' OR CommandLine ILIKE '%--manifest%')
