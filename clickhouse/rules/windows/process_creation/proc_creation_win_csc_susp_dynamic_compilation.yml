name: Dynamic .NET Compilation Via Csc.EXE
level: 5
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), X__Junior (Nextron Systems)
group: windows
tags:
- attack.stealth
- attack.t1027.004
rule: SELECT * FROM logs WHERE Image ILIKE '%\\csc.exe' AND ((CommandLine ILIKE '%:\\Perflogs\\%' OR CommandLine ILIKE '%:\\Users\\Public\\%' OR CommandLine ILIKE '%\\AppData\\Local\\Temp\\%' OR CommandLine ILIKE '%\\Temporary Internet%' OR CommandLine ILIKE '%\\Windows\\Temp\\%') OR ((CommandLine ILIKE '%:\\Users\\%' AND CommandLine ILIKE '%\\Favorites\\%') OR (CommandLine ILIKE '%:\\Users\\%' AND CommandLine ILIKE '%\\Favourites\\%') OR (CommandLine ILIKE '%:\\Users\\%' AND CommandLine ILIKE '%\\Contacts\\%') OR (CommandLine ILIKE '%:\\Users\\%' AND CommandLine ILIKE '%\\Pictures\\%')) OR match(CommandLine, '(?:[Pp]rogram[Dd]ata|%(?:[Ll]ocal)?[Aa]pp[Dd]ata%|\\[Aa]pp[Dd]ata\\(?:[Ll]ocal(?:[Ll]ow)?|[Rr]oaming))\\[^\\]{1,256}$')) AND (NOT ((ParentImage ILIKE 'C:\\Program Files (x86)\\%' OR ParentImage ILIKE 'C:\\Program Files\\%') OR ParentImage ILIKE 'C:\\Windows\\System32\\sdiagnhost.exe' OR ParentImage ILIKE 'C:\\Windows\\System32\\inetsrv\\w3wp.exe')) AND (NOT ((ParentImage IN ('C:\\ProgramData\\chocolatey\\choco.exe', 'C:\\ProgramData\\chocolatey\\tools\\shimgen.exe')) OR ParentCommandLine ILIKE '%\\ProgramData\\Microsoft\\Windows Defender Advanced Threat Protection%' OR (ParentCommandLine ILIKE '%JwB7ACIAZgBhAGkAbABlAGQAIgA6AHQAcgB1AGUALAAiAG0AcwBnACIAOgAiAEEAbgBzAGkAYgBsAGUAIAByAGUAcQB1AGkAcgBlAHMAIABQAG8AdwBlAHIAUwBoAGUAbABsACAAdgAzAC4AMAAgAG8AcgAgAG4AZQB3AGUAcgAiAH0AJw%' OR ParentCommandLine ILIKE '%cAewAiAGYAYQBpAGwAZQBkACIAOgB0AHIAdQBlACwAIgBtAHMAZwAiADoAIgBBAG4AcwBpAGIAbABlACAAcgBlAHEAdQBpAHIAZQBzACAAUABvAHcAZQByAFMAaABlAGwAbAAgAHYAMwAuADAAIABvAHIAIABuAGUAdwBlAHIAIgB9ACcA%' OR ParentCommandLine ILIKE '%nAHsAIgBmAGEAaQBsAGUAZAAiADoAdAByAHUAZQAsACIAbQBzAGcAIgA6ACIAQQBuAHMAaQBiAGwAZQAgAHIAZQBxAHUAaQByAGUAcwAgAFAAbwB3AGUAcgBTAGgAZQBsAGwAIAB2ADMALgAwACAAbwByACAAbgBlAHcAZQByACIAfQAnA%')))
