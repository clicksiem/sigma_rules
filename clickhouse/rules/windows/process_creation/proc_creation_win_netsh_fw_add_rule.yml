id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
name: New Firewall Rule Added Via Netsh.EXE
level: 5
size: '>0'
active: true
author:
- Markus Neis, Sander Wiebing
group: windows
tags:
- attack.defense-impairment
- attack.t1686.003
- attack.s0246
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\netsh.exe' OR OriginalFileName='netsh.exe') AND (CommandLine ILIKE '% firewall %' AND CommandLine ILIKE '% add %')) AND (NOT (CommandLine ILIKE '%advfirewall firewall add rule name=Dropbox dir=in action=allow "program=_:\\Program Files (x86)\\Dropbox\\Client\\Dropbox.exe" enable=yes profile=Any%' OR CommandLine ILIKE '%advfirewall firewall add rule name=Dropbox dir=in action=allow "program=_:\\Program Files\\Dropbox\\Client\\Dropbox.exe" enable=yes profile=Any%'))
