rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\WMIC.exe' OR OriginalFileName='wmic.exe') AND (CommandLine ILIKE '%-node:%' OR CommandLine ILIKE '%/node:%' OR CommandLine ILIKE '%–node:%' OR CommandLine ILIKE '%—node:%' OR CommandLine ILIKE '%―node:%')) AND (NOT (CommandLine ILIKE '%localhost%' OR CommandLine ILIKE '%127.0.0.1%'))
