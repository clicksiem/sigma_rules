id: de587dce-915e-4218-aac4-835ca6af6f70
name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
level: 5
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
rule: SELECT * FROM logs WHERE Image ILIKE '%\\reg.exe' AND (CommandLine ILIKE '%reg%' AND CommandLine ILIKE '% add %') AND (CommandLine ILIKE '%Software\\Microsoft\\Windows\\CurrentVersion\\Run%' OR CommandLine ILIKE '%\\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Run%' OR CommandLine ILIKE '%\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer\\Run%')
