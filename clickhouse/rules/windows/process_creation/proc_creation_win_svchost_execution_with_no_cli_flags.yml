rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%svchost.exe' AND Image ILIKE '%\\svchost.exe') AND (NOT ((ParentImage ILIKE '%\\rpcnet.exe' OR ParentImage ILIKE '%\\rpcnetp.exe') OR isNull(CommandLine)))
