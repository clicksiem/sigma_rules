id: 584bca0f-3608-4402-80fd-4075ff6072e3
name: Potential CommandLine Obfuscation Using Unicode Characters From Suspicious Image
level: 8
size: '>0'
active: true
author:
- frack113, Florian Roth (Nextron Systems), Josh Nickels
group: windows
tags:
- attack.stealth
- attack.t1027
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\cscript.exe' OR Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\powershell\_ise.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\wscript.exe') AND (OriginalFileName IN ('Cmd.EXE', 'cscript.exe', 'PowerShell.EXE', 'PowerShell\_ISE.EXE', 'pwsh.dll', 'wscript.exe'))) AND (CommandLine ILIKE '%ˣ%' OR CommandLine ILIKE '%˪%' OR CommandLine ILIKE '%ˢ%' OR CommandLine ILIKE '%∕%' OR CommandLine ILIKE '%⁄%' OR CommandLine ILIKE '%―%' OR CommandLine ILIKE '%—%' OR CommandLine ILIKE '% %' OR CommandLine ILIKE '%¯%' OR CommandLine ILIKE '%®%' OR CommandLine ILIKE '%¶%' OR CommandLine ILIKE '%⠀%')
