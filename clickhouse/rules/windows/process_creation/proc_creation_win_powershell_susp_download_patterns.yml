name: Suspicious PowerShell Download and Execute Pattern
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.t1059.001
rule: SELECT * FROM logs WHERE CommandLine ILIKE '%IEX ((New-Object Net.WebClient).DownloadString%' OR CommandLine ILIKE '%IEX (New-Object Net.WebClient).DownloadString%' OR CommandLine ILIKE '%IEX((New-Object Net.WebClient).DownloadString%' OR CommandLine ILIKE '%IEX(New-Object Net.WebClient).DownloadString%' OR CommandLine ILIKE '% -command (New-Object System.Net.WebClient).DownloadFile(%' OR CommandLine ILIKE '% -c (New-Object System.Net.WebClient).DownloadFile(%'
