rule: SELECT * FROM logs WHERE ParentImage ILIKE '%\\explorer.exe' AND (Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\cscript.exe' OR Image ILIKE '%\\mshta.exe' OR Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\wscript.exe') AND CommandLine ILIKE '%\\DavWWWRoot\\%'
