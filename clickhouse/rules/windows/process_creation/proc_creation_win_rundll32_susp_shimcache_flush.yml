rule: SELECT * FROM logs WHERE ((CommandLine ILIKE '%rundll32%' AND CommandLine ILIKE '%apphelp.dll%') AND (CommandLine ILIKE '%ShimFlushCache%' OR CommandLine ILIKE '%#250%')) OR ((CommandLine ILIKE '%rundll32%' AND CommandLine ILIKE '%kernel32.dll%') AND (CommandLine ILIKE '%BaseFlushAppcompatCache%' OR CommandLine ILIKE '%#46%'))
