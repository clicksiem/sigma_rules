rule: SELECT * FROM logs WHERE ((OriginalFileName IN ('PingCastleReporting.exe', 'PingCastleCloud.exe', 'PingCastle.exe')) OR (CommandLine ILIKE '%--scanner aclcheck%' OR CommandLine ILIKE '%--scanner antivirus%' OR CommandLine ILIKE '%--scanner computerversion%' OR CommandLine ILIKE '%--scanner foreignusers%' OR CommandLine ILIKE '%--scanner laps\_bitlocker%' OR CommandLine ILIKE '%--scanner localadmin%' OR CommandLine ILIKE '%--scanner nullsession%' OR CommandLine ILIKE '%--scanner nullsession-trust%' OR CommandLine ILIKE '%--scanner oxidbindings%' OR CommandLine ILIKE '%--scanner remote%' OR CommandLine ILIKE '%--scanner share%' OR CommandLine ILIKE '%--scanner smb%' OR CommandLine ILIKE '%--scanner smb3querynetwork%' OR CommandLine ILIKE '%--scanner spooler%' OR CommandLine ILIKE '%--scanner startup%' OR CommandLine ILIKE '%--scanner zerologon%') OR CommandLine ILIKE '%--no-enum-limit%' OR (CommandLine ILIKE '%--healthcheck%' AND CommandLine ILIKE '%--level Full%') OR (CommandLine ILIKE '%--healthcheck%' AND CommandLine ILIKE '%--server %')) AND (NOT (Image ILIKE '%\\PingCastleReporting.exe' OR Image ILIKE '%\\PingCastleCloud.exe' OR Image ILIKE '%\\PingCastle.exe'))
