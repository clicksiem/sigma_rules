id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
name: Rundll32 Execution With Uncommon DLL Extension
level: 5
size: '>0'
active: true
author:
- Tim Shelton, Florian Roth (Nextron Systems), Yassine Oukessou
group: windows
tags:
- attack.stealth
- attack.t1218.011
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\rundll32.exe' OR OriginalFileName='RUNDLL32.EXE') AND (NOT (isNull(CommandLine) OR CommandLine='' OR ((CommandLine ILIKE '%.cpl %' OR CommandLine ILIKE '%.cpl,%' OR CommandLine ILIKE '%.cpl"%' OR CommandLine ILIKE '%.cpl''%' OR CommandLine ILIKE '%.dll %' OR CommandLine ILIKE '%.dll,%' OR CommandLine ILIKE '%.dll"%' OR CommandLine ILIKE '%.dll''%' OR CommandLine ILIKE '%.inf %' OR CommandLine ILIKE '%.inf,%' OR CommandLine ILIKE '%.inf"%' OR CommandLine ILIKE '%.inf''%') OR (CommandLine ILIKE '%.cpl' OR CommandLine ILIKE '%.dll' OR CommandLine ILIKE '%.inf')) OR CommandLine ILIKE '% -localserver %' OR (ParentImage ILIKE '%\\msiexec.exe' AND (CommandLine ILIKE '%:\\Windows\\Installer\\%' AND CommandLine ILIKE '%.tmp%' AND CommandLine ILIKE '%zzzzInvokeManagedCustomActionOutOfProc%')))) AND (NOT (ParentCommandLine ILIKE '%:\\Users\\%' AND ParentCommandLine ILIKE '%\\AppData\\Local\\Microsoft\\EdgeUpdate\\Install\\{%' AND ParentCommandLine ILIKE '%\\EDGEMITMP\_%' AND ParentCommandLine ILIKE '%.tmp\\setup.exe%' AND ParentCommandLine ILIKE '%--install-archive=%' AND ParentCommandLine ILIKE '%--previous-version=%' AND ParentCommandLine ILIKE '%--msedgewebview --verbose-logging --do-not-launch-msedge --user-level%'))
