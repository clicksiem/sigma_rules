id: 771d1eb5-9587-4568-95fb-9ec44153a012
name: PUA - NSudo Execution
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), Nasreddine Bencherchali
group: windows
tags:
- attack.execution
- attack.t1569.002
- attack.s0029
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\NSudo.exe' OR Image ILIKE '%\\NSudoLC.exe' OR Image ILIKE '%\\NSudoLG.exe') OR (OriginalFileName IN ('NSudo.exe', 'NSudoLC.exe', 'NSudoLG.exe'))) AND (CommandLine ILIKE '%-U:S %' OR CommandLine ILIKE '%-U:T %' OR CommandLine ILIKE '%-U:E %' OR CommandLine ILIKE '%-P:E %' OR CommandLine ILIKE '%-M:S %' OR CommandLine ILIKE '%-M:H %' OR CommandLine ILIKE '%-U=S %' OR CommandLine ILIKE '%-U=T %' OR CommandLine ILIKE '%-U=E %' OR CommandLine ILIKE '%-P=E %' OR CommandLine ILIKE '%-M=S %' OR CommandLine ILIKE '%-M=H %' OR CommandLine ILIKE '%-ShowWindowMode:Hide%')
