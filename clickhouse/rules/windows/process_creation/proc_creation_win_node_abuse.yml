rule: SELECT * FROM logs WHERE (Image ILIKE '%\\node.exe' AND (CommandLine ILIKE '% -e %' OR CommandLine ILIKE '% --eval %')) AND (CommandLine ILIKE '%.exec(%' AND CommandLine ILIKE '%net.socket%' AND CommandLine ILIKE '%.connect%' AND CommandLine ILIKE '%child\_process%')
