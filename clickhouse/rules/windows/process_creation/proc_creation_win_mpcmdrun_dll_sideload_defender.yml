id: 7002aa10-b8d4-47ae-b5ba-51ab07e228b9
name: Potential Mpclient.DLL Sideloading Via Defender Binaries
level: 8
size: '>0'
active: true
author:
- Bhabesh Raj
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\MpCmdRun.exe' OR Image ILIKE '%\\NisSrv.exe') AND (NOT (Image ILIKE 'C:\\Program Files (x86)\\Windows Defender\\%' OR Image ILIKE 'C:\\Program Files\\Microsoft Security Client\\%' OR Image ILIKE 'C:\\Program Files\\Windows Defender\\%' OR Image ILIKE 'C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\%' OR Image ILIKE 'C:\\Windows\\WinSxS\\%'))
