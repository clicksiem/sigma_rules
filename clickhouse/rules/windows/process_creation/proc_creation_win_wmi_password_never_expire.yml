id: 7864a175-3654-4824-9f0d-f0da18ab27c0
name: Password Set to Never Expire via WMI
level: 5
size: '>0'
active: true
author:
- Daniel Koifman (KoifSec)
group: windows
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1047
- attack.t1098
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\wmic.exe' OR OriginalFileName='wmic.exe') AND (CommandLine ILIKE '%useraccount%' AND CommandLine ILIKE '% set %' AND CommandLine ILIKE '%passwordexpires%' AND CommandLine ILIKE '%false%')
