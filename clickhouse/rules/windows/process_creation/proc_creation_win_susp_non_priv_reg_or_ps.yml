id: 8f02c935-effe-45b3-8fc9-ef8696a9e41d
name: Non-privileged Usage of Reg or Powershell
level: 8
size: '>0'
active: true
author:
- Teymur Kheirkhabarov (idea), Ryan Plas (rule), oscd.community
group: windows
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
rule: SELECT * FROM logs WHERE ((CommandLine ILIKE '%reg %' AND CommandLine ILIKE '%add%') OR (CommandLine ILIKE '%powershell%' OR CommandLine ILIKE '%set-itemproperty%' OR CommandLine ILIKE '% sp %' OR CommandLine ILIKE '%new-itemproperty%')) AND ((IntegrityLevel IN ('Medium', 'S-1-16-8192')) AND (CommandLine ILIKE '%ControlSet%' AND CommandLine ILIKE '%Services%') AND (CommandLine ILIKE '%ImagePath%' OR CommandLine ILIKE '%FailureCommand%' OR CommandLine ILIKE '%ServiceDLL%'))
