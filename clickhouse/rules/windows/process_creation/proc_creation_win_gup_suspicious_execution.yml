id: 0a4f6091-223b-41f6-8743-f322ec84930b
name: Suspicious GUP Usage
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
rule: SELECT * FROM logs WHERE Image ILIKE '%\\GUP.exe' AND (NOT ((Image ILIKE '%\\Program Files\\Notepad++\\updater\\GUP.exe' OR Image ILIKE '%\\Program Files (x86)\\Notepad++\\updater\\GUP.exe') OR (Image ILIKE '%\\Users\\%' AND (Image ILIKE '%\\AppData\\Local\\Notepad++\\updater\\GUP.exe' OR Image ILIKE '%\\AppData\\Roaming\\Notepad++\\updater\\GUP.exe'))))
