id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
level: 8
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.discovery
- attack.t1087.002
rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%lockoutduration%' OR CommandLine ILIKE '%lockoutthreshold%' OR CommandLine ILIKE '%lockoutobservationwindow%' OR CommandLine ILIKE '%maxpwdage%' OR CommandLine ILIKE '%minpwdage%' OR CommandLine ILIKE '%minpwdlength%' OR CommandLine ILIKE '%pwdhistorylength%' OR CommandLine ILIKE '%pwdproperties%') OR CommandLine ILIKE '%-sc admincountdmp%' OR CommandLine ILIKE '%-sc exchaddresses%'
