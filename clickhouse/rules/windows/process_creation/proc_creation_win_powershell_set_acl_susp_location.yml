id: 0944e002-e3f6-4eb5-bf69-3a3067b53d73
name: PowerShell Set-Acl On Windows Folder
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.stealth
rule: SELECT * FROM logs WHERE ((OriginalFileName IN ('PowerShell.EXE', 'pwsh.dll')) OR (Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe')) AND (CommandLine ILIKE '%Set-Acl %' AND CommandLine ILIKE '%-AclObject %') AND (CommandLine ILIKE '%-Path "C:\\Windows%' OR CommandLine ILIKE '%-Path ''C:\\Windows%' OR CommandLine ILIKE '%-Path \%windir\%%' OR CommandLine ILIKE '%-Path $env:windir%') AND (CommandLine ILIKE '%FullControl%' OR CommandLine ILIKE '%Allow%')
