rule: SELECT * FROM logs WHERE (Image ILIKE '%\\ie4uinit.exe' OR OriginalFileName='IE4UINIT.EXE') AND (NOT ((CurrentDirectory IN ('c:\\windows\\system32\\', 'c:\\windows\\sysWOW64\\')) OR isNull(CurrentDirectory)))
