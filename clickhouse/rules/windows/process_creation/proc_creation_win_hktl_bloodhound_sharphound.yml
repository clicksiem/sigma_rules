rule: SELECT * FROM logs WHERE (Product ILIKE '%SharpHound%' OR Description ILIKE '%SharpHound%' OR (Company ILIKE '%SpecterOps%' OR Company ILIKE '%evil corp%') OR (Image ILIKE '%\\Bloodhound.exe%' OR Image ILIKE '%\\SharpHound.exe%')) OR (CommandLine ILIKE '% -CollectionMethod All %' OR CommandLine ILIKE '% --CollectionMethods Session %' OR CommandLine ILIKE '% --Loop --Loopduration %' OR CommandLine ILIKE '% --PortScanTimeout %' OR CommandLine ILIKE '%.exe -c All -d %' OR CommandLine ILIKE '%Invoke-Bloodhound%' OR CommandLine ILIKE '%Get-BloodHoundData%') OR (CommandLine ILIKE '% -JsonFolder %' AND CommandLine ILIKE '% -ZipFileName %') OR (CommandLine ILIKE '% DCOnly %' AND CommandLine ILIKE '% --NoSaveCache %')
