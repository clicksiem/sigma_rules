rule: SELECT * FROM logs WHERE (Image ILIKE '%\\dsacls.exe' OR OriginalFileName='DSACLS.EXE') AND CommandLine ILIKE '% /G %' AND (CommandLine ILIKE '%GR%' OR CommandLine ILIKE '%GE%' OR CommandLine ILIKE '%GW%' OR CommandLine ILIKE '%GA%' OR CommandLine ILIKE '%WP%' OR CommandLine ILIKE '%WD%')
