id: 4b991083-3d0e-44ce-8fc4-b254025d8d4b
name: Unusual Parent Process For Cmd.EXE
level: 5
size: '>0'
active: true
author:
- Tim Rauch, Elastic (idea)
group: windows
tags:
- attack.execution
- attack.t1059
rule: SELECT * FROM logs WHERE Image ILIKE '%\\cmd.exe' AND (ParentImage ILIKE '%\\csrss.exe' OR ParentImage ILIKE '%\\ctfmon.exe' OR ParentImage ILIKE '%\\dllhost.exe' OR ParentImage ILIKE '%\\epad.exe' OR ParentImage ILIKE '%\\FlashPlayerUpdateService.exe' OR ParentImage ILIKE '%\\GoogleUpdate.exe' OR ParentImage ILIKE '%\\jucheck.exe' OR ParentImage ILIKE '%\\jusched.exe' OR ParentImage ILIKE '%\\LogonUI.exe' OR ParentImage ILIKE '%\\lsass.exe' OR ParentImage ILIKE '%\\regsvr32.exe' OR ParentImage ILIKE '%\\SearchIndexer.exe' OR ParentImage ILIKE '%\\SearchProtocolHost.exe' OR ParentImage ILIKE '%\\SIHClient.exe' OR ParentImage ILIKE '%\\sihost.exe' OR ParentImage ILIKE '%\\slui.exe' OR ParentImage ILIKE '%\\spoolsv.exe' OR ParentImage ILIKE '%\\sppsvc.exe' OR ParentImage ILIKE '%\\taskhostw.exe' OR ParentImage ILIKE '%\\unsecapp.exe' OR ParentImage ILIKE '%\\WerFault.exe' OR ParentImage ILIKE '%\\wermgr.exe' OR ParentImage ILIKE '%\\wlanext.exe' OR ParentImage ILIKE '%\\WUDFHost.exe')
