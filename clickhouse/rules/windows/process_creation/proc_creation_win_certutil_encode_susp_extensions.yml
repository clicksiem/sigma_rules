rule: SELECT * FROM logs WHERE (Image ILIKE '%\\certutil.exe' OR OriginalFileName='CertUtil.exe') AND (CommandLine ILIKE '%-encode%' OR CommandLine ILIKE '%/encode%' OR CommandLine ILIKE '%–encode%' OR CommandLine ILIKE '%—encode%' OR CommandLine ILIKE '%―encode%') AND (CommandLine ILIKE '%.acl%' OR CommandLine ILIKE '%.bat%' OR CommandLine ILIKE '%.doc%' OR CommandLine ILIKE '%.gif%' OR CommandLine ILIKE '%.jpeg%' OR CommandLine ILIKE '%.jpg%' OR CommandLine ILIKE '%.mp3%' OR CommandLine ILIKE '%.pdf%' OR CommandLine ILIKE '%.png%' OR CommandLine ILIKE '%.ppt%' OR CommandLine ILIKE '%.tmp%' OR CommandLine ILIKE '%.xls%' OR CommandLine ILIKE '%.xml%')
