rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\Werfault.exe' OR OriginalFileName='WerFault.exe') AND ((ParentUser ILIKE '%AUTHORI%' OR ParentUser ILIKE '%AUTORI%') AND (User ILIKE '%AUTHORI%' OR User ILIKE '%AUTORI%') AND (CommandLine ILIKE '% -u -p %' AND CommandLine ILIKE '% -ip %' AND CommandLine ILIKE '% -s %'))) AND (NOT ParentImage ILIKE 'C:\\Windows\\System32\\lsass.exe')
