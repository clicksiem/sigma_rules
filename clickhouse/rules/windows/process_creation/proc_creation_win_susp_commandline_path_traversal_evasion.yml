rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\Windows\\%' AND (CommandLine ILIKE '%\\..\\Windows\\%' OR CommandLine ILIKE '%\\..\\System32\\%' OR CommandLine ILIKE '%\\..\\..\\%')) OR CommandLine ILIKE '%.exe\\..\\%') AND (NOT (CommandLine ILIKE '%\\Google\\Drive\\googledrivesync.exe\\..\\%' OR CommandLine ILIKE '%\\Citrix\\Virtual Smart Card\\Citrix.Authentication.VirtualSmartcard.Launcher.exe\\..\\%'))
