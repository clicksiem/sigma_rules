id: ee218c12-627a-4d27-9e30-d6fb2fe22ed2
name: Powershell Inline Execution From A File
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.execution
- attack.t1059.001
rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%iex %' OR CommandLine ILIKE '%Invoke-Expression %' OR CommandLine ILIKE '%Invoke-Command %' OR CommandLine ILIKE '%icm %') AND (CommandLine ILIKE '%cat %' OR CommandLine ILIKE '%get-content %' OR CommandLine ILIKE '%type %') AND CommandLine ILIKE '% -raw%'
