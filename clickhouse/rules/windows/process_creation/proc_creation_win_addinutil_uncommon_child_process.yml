rule: SELECT * FROM logs WHERE ParentImage ILIKE '%\\addinutil.exe' AND (NOT (Image ILIKE '%:\\Windows\\System32\\conhost.exe' OR Image ILIKE '%:\\Windows\\System32\\werfault.exe' OR Image ILIKE '%:\\Windows\\SysWOW64\\werfault.exe'))
