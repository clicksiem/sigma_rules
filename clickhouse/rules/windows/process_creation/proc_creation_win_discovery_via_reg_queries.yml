rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\reg.exe' AND CommandLine ILIKE '%query%' AND (CommandLine ILIKE '%-v%' OR CommandLine ILIKE '%/v%' OR CommandLine ILIKE '%–v%' OR CommandLine ILIKE '%—v%' OR CommandLine ILIKE '%―v%')) OR ((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe') AND (CommandLine ILIKE '%Get-ItemPropertyValue%' OR CommandLine ILIKE '%gpv%'))) AND (CommandLine ILIKE '%\\SOFTWARE\\Microsoft\\Windows Defender%' OR CommandLine ILIKE '%\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion%' OR CommandLine ILIKE '%\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall%' OR CommandLine ILIKE '%\\SYSTEM\\CurrentControlSet\\Control\\TimeZoneInformation%' OR CommandLine ILIKE '%\\SYSTEM\\CurrentControlSet\\Services%')
