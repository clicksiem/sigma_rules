id: 9465ddf4-f9e4-4ebd-8d98-702df3a93239
name: IIS Native-Code Module Command Line Installation
level: 5
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.persistence
- attack.t1505.003
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\appcmd.exe' OR OriginalFileName='appcmd.exe') AND ((CommandLine ILIKE '%install%' AND CommandLine ILIKE '%module%') AND (CommandLine ILIKE '%-name:%' OR CommandLine ILIKE '%/name:%' OR CommandLine ILIKE '%–name:%' OR CommandLine ILIKE '%—name:%' OR CommandLine ILIKE '%―name:%'))) AND (NOT ParentImage ILIKE 'C:\\Windows\\System32\\inetsrv\\iissetup.exe')
