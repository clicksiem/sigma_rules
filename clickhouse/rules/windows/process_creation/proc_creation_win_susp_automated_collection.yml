rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%.doc%' OR CommandLine ILIKE '%.docx%' OR CommandLine ILIKE '%.xls%' OR CommandLine ILIKE '%.xlsx%' OR CommandLine ILIKE '%.ppt%' OR CommandLine ILIKE '%.pptx%' OR CommandLine ILIKE '%.rtf%' OR CommandLine ILIKE '%.pdf%' OR CommandLine ILIKE '%.txt%') AND ((CommandLine ILIKE '%dir %' AND CommandLine ILIKE '% /b %' AND CommandLine ILIKE '% /s %') OR (OriginalFileName='FINDSTR.EXE' AND (CommandLine ILIKE '% /e %' OR CommandLine ILIKE '% /si %')))
