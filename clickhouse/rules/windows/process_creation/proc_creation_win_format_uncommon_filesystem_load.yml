id: 9fb6b26e-7f9e-4517-a48b-8cac4a1b6c60
name: Uncommon FileSystem Load Attempt By Format.com
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.stealth
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\format.com' AND CommandLine ILIKE '%/fs:%') AND (NOT (CommandLine ILIKE '%/fs:exFAT%' OR CommandLine ILIKE '%/fs:FAT%' OR CommandLine ILIKE '%/fs:NTFS%' OR CommandLine ILIKE '%/fs:ReFS%' OR CommandLine ILIKE '%/fs:UDF%'))
