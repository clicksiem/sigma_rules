id: 5a3164f2-b373-4152-93cf-090b13c12d27
name: Potentially Suspicious Child Process Of VsCode
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.stealth
- attack.t1218
- attack.t1202
rule: SELECT * FROM logs WHERE ParentImage ILIKE '%\\code.exe' AND ((Image ILIKE '%\\calc.exe' OR Image ILIKE '%\\regsvr32.exe' OR Image ILIKE '%\\rundll32.exe' OR Image ILIKE '%\\cscript.exe' OR Image ILIKE '%\\wscript.exe') OR ((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\cmd.exe') AND (CommandLine ILIKE '%Invoke-Expressions%' OR CommandLine ILIKE '%IEX%' OR CommandLine ILIKE '%Invoke-Command%' OR CommandLine ILIKE '%ICM%' OR CommandLine ILIKE '%DownloadString%' OR CommandLine ILIKE '%rundll32%' OR CommandLine ILIKE '%regsvr32%' OR CommandLine ILIKE '%wscript%' OR CommandLine ILIKE '%cscript%')) OR (Image ILIKE '%:\\Users\\Public\\%' OR Image ILIKE '%:\\Windows\\Temp\\%' OR Image ILIKE '%:\\Temp\\%'))
