rule: SELECT * FROM logs WHERE ((CommandLine ILIKE '%-Sta%' AND CommandLine ILIKE '%-Nop%' AND CommandLine ILIKE '%-Window%' AND CommandLine ILIKE '%Hidden%') AND (CommandLine ILIKE '%-Command%' OR CommandLine ILIKE '%-EncodedCommand%')) OR (CommandLine ILIKE '%sv o (New-Object IO.MemorySteam);sv d %' OR CommandLine ILIKE '%mshta file.hta%' OR CommandLine ILIKE '%GruntHTTP%' OR CommandLine ILIKE '%-EncodedCommand cwB2ACAAbwAgA%')
