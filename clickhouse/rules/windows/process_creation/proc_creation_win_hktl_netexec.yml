rule: SELECT * FROM logs WHERE Image ILIKE '%\\nxc.exe' AND (CommandLine ILIKE '% ftp %' OR CommandLine ILIKE '% ldap %' OR CommandLine ILIKE '% mssql %' OR CommandLine ILIKE '% nfs %' OR CommandLine ILIKE '% rdp %' OR CommandLine ILIKE '% smb %' OR CommandLine ILIKE '% ssh %' OR CommandLine ILIKE '% vnc %' OR CommandLine ILIKE '% winrm %' OR CommandLine ILIKE '% wmi %')
