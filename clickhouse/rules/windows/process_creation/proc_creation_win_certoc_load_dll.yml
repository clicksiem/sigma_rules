rule: SELECT * FROM logs WHERE (Image ILIKE '%\\certoc.exe' OR OriginalFileName='CertOC.exe') AND (CommandLine ILIKE '% -LoadDLL %' OR CommandLine ILIKE '% /LoadDLL %' OR CommandLine ILIKE '% –LoadDLL %' OR CommandLine ILIKE '% —LoadDLL %' OR CommandLine ILIKE '% ―LoadDLL %')
