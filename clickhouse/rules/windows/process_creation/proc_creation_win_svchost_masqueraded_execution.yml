rule: SELECT * FROM logs WHERE Image ILIKE '%\\svchost.exe' AND (NOT ((Image IN ('C:\\Windows\\System32\\svchost.exe', 'C:\\Windows\\SysWOW64\\svchost.exe')) OR OriginalFileName='svchost.exe'))
