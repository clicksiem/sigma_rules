id: 258fc8ce-8352-443a-9120-8a11e4857fa5
name: Potential Arbitrary Command Execution Using Msdt.EXE
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.stealth
- attack.t1202
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\msdt.exe' OR OriginalFileName='msdt.exe') AND (CommandLine ILIKE '%IT\_BrowseForFile=%' OR (CommandLine ILIKE '% PCWDiagnostic%' AND (CommandLine ILIKE '% -af %' OR CommandLine ILIKE '% /af %' OR CommandLine ILIKE '% –af %' OR CommandLine ILIKE '% —af %' OR CommandLine ILIKE '% ―af %')))
