rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%&&set%' AND CommandLine ILIKE '%cmd%' AND CommandLine ILIKE '%/c%' AND CommandLine ILIKE '%-f%') AND (CommandLine ILIKE '%{0}%' OR CommandLine ILIKE '%{1}%' OR CommandLine ILIKE '%{2}%' OR CommandLine ILIKE '%{3}%' OR CommandLine ILIKE '%{4}%' OR CommandLine ILIKE '%{5}%')
