id: ac175779-025a-4f12-98b0-acdaeb77ea85
name: PowerShell Script Run in AppData
level: 5
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community
group: windows
tags:
- attack.execution
- attack.t1059.001
rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%powershell.exe%' OR CommandLine ILIKE '%\\powershell%' OR CommandLine ILIKE '%\\pwsh%' OR CommandLine ILIKE '%pwsh.exe%') AND ((CommandLine ILIKE '%/c %' AND CommandLine ILIKE '%\\AppData\\%') AND (CommandLine ILIKE '%Local\\%' OR CommandLine ILIKE '%Roaming\\%'))
