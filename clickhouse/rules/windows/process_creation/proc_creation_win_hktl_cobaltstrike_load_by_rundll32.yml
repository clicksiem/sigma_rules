rule: SELECT * FROM logs WHERE (Image ILIKE '%\\rundll32.exe' OR OriginalFileName='RUNDLL32.EXE' OR (CommandLine ILIKE '%rundll32.exe%' OR CommandLine ILIKE '%rundll32 %')) AND (CommandLine ILIKE '%.dll%' AND (CommandLine ILIKE '% StartW' OR CommandLine ILIKE '%,StartW'))
