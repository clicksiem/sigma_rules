rule: SELECT * FROM logs WHERE (Image ILIKE '%\\VSDiagnostics.exe' OR OriginalFileName='VSDiagnostics.exe') AND CommandLine ILIKE '%start%' AND (CommandLine ILIKE '% /launch:%' OR CommandLine ILIKE '% -launch:%')
