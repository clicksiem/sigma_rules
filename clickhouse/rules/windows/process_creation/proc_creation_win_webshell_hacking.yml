rule: SELECT * FROM logs WHERE ((ParentImage ILIKE '%\\caddy.exe' OR ParentImage ILIKE '%\\httpd.exe' OR ParentImage ILIKE '%\\nginx.exe' OR ParentImage ILIKE '%\\php-cgi.exe' OR ParentImage ILIKE '%\\w3wp.exe' OR ParentImage ILIKE '%\\ws\_tomcatservice.exe') OR ((ParentImage ILIKE '%\\java.exe' OR ParentImage ILIKE '%\\javaw.exe') AND (ParentImage ILIKE '%-tomcat-%' OR ParentImage ILIKE '%\\tomcat%')) OR ((ParentImage ILIKE '%\\java.exe' OR ParentImage ILIKE '%\\javaw.exe') AND (CommandLine ILIKE '%catalina.jar%' OR CommandLine ILIKE '%CATALINA\_HOME%'))) AND ((CommandLine ILIKE '%rundll32%' AND CommandLine ILIKE '%comsvcs%') OR (CommandLine ILIKE '% -hp%' AND CommandLine ILIKE '% a %' AND CommandLine ILIKE '% -m%') OR (CommandLine ILIKE '%net%' AND CommandLine ILIKE '% user %' AND CommandLine ILIKE '% /add%') OR (CommandLine ILIKE '%net%' AND CommandLine ILIKE '% localgroup %' AND CommandLine ILIKE '% administrators %' AND CommandLine ILIKE '%/add%') OR (Image ILIKE '%\\ntdsutil.exe' OR Image ILIKE '%\\ldifde.exe' OR Image ILIKE '%\\adfind.exe' OR Image ILIKE '%\\procdump.exe' OR Image ILIKE '%\\Nanodump.exe' OR Image ILIKE '%\\vssadmin.exe' OR Image ILIKE '%\\fsutil.exe') OR (CommandLine ILIKE '% -decode %' OR CommandLine ILIKE '% -NoP %' OR CommandLine ILIKE '% -W Hidden %' OR CommandLine ILIKE '% /decode %' OR CommandLine ILIKE '% /ticket:%' OR CommandLine ILIKE '% sekurlsa%' OR CommandLine ILIKE '%.dmp full%' OR CommandLine ILIKE '%.downloadfile(%' OR CommandLine ILIKE '%.downloadstring(%' OR CommandLine ILIKE '%FromBase64String%' OR CommandLine ILIKE '%process call create%' OR CommandLine ILIKE '%reg save %' OR CommandLine ILIKE '%whoami /priv%'))
