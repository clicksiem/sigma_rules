id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
name: Deletion of Volume Shadow Copies via WMI with PowerShell
level: 8
size: '>0'
active: true
author:
- Tim Rauch, Elastic (idea)
group: windows
tags:
- attack.impact
- attack.t1490
rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%Get-WmiObject%' OR CommandLine ILIKE '%gwmi%' OR CommandLine ILIKE '%Get-CimInstance%' OR CommandLine ILIKE '%gcim%') AND CommandLine ILIKE '%Win32\_ShadowCopy%' AND (CommandLine ILIKE '%.Delete()%' OR CommandLine ILIKE '%Remove-WmiObject%' OR CommandLine ILIKE '%rwmi%' OR CommandLine ILIKE '%Remove-CimInstance%' OR CommandLine ILIKE '%rcim%')
