rule: SELECT * FROM logs WHERE (Image ILIKE '%\\WMIC.exe' OR OriginalFileName='wmic.exe') AND ((CommandLine ILIKE '% volumename%' OR CommandLine ILIKE '% logicaldisk%') OR (CommandLine ILIKE '%path%' AND CommandLine ILIKE '%win32\_logicaldisk%') OR (CommandLine ILIKE '% volume%' AND CommandLine ILIKE '% list %'))
