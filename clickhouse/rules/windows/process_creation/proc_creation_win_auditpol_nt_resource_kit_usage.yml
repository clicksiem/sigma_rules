name: Audit Policy Tampering Via NT Resource Kit Auditpol
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.defense-impairment
- attack.t1685.001
rule: SELECT * FROM logs WHERE CommandLine ILIKE '%/logon:none%' OR CommandLine ILIKE '%/system:none%' OR CommandLine ILIKE '%/sam:none%' OR CommandLine ILIKE '%/privilege:none%' OR CommandLine ILIKE '%/object:none%' OR CommandLine ILIKE '%/process:none%' OR CommandLine ILIKE '%/policy:none%'
