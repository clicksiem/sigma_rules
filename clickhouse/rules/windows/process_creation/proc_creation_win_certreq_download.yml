id: 4480827a-9799-4232-b2c4-ccc6c4e9e12b
name: Suspicious CertReq Command to Download
level: 8
size: '>0'
active: true
author:
- Christian Burkard (Nextron Systems)
group: windows
tags:
- attack.command-and-control
- attack.t1105
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\certreq.exe' OR OriginalFileName='CertReq.exe') AND (CommandLine ILIKE '%-Post%' OR CommandLine ILIKE '%/Post%' OR CommandLine ILIKE '%–Post%' OR CommandLine ILIKE '%—Post%' OR CommandLine ILIKE '%―Post%') AND (CommandLine ILIKE '%-config%' OR CommandLine ILIKE '%/config%' OR CommandLine ILIKE '%–config%' OR CommandLine ILIKE '%—config%' OR CommandLine ILIKE '%―config%') AND CommandLine ILIKE '%http%'
