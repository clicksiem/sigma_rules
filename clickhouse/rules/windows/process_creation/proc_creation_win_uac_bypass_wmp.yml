id: 0058b9e5-bcd7-40d4-9205-95ca5a16d7b2
name: UAC Bypass Using Windows Media Player - Process
level: 8
size: '>0'
active: true
author:
- Christian Burkard (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.t1548.002
rule: SELECT * FROM logs WHERE (Image ILIKE 'C:\\Program Files\\Windows Media Player\\osk.exe' OR (Image ILIKE 'C:\\Windows\\System32\\cmd.exe' AND ParentCommandLine ILIKE '"C:\\Windows\\system32\\mmc.exe" "C:\\Windows\\system32\\eventvwr.msc" /s')) AND (IntegrityLevel IN ('High', 'System', 'S-1-16-16384', 'S-1-16-12288'))
