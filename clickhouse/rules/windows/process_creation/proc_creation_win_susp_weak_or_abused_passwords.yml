id: 91edcfb1-2529-4ac2-9ecc-7617f895c7e4
name: Weak or Abused Passwords In CLI
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.stealth
rule: SELECT * FROM logs WHERE CommandLine ILIKE '%123456789%' OR CommandLine ILIKE '%123123qwE%' OR CommandLine ILIKE '%Asd123.aaaa%' OR CommandLine ILIKE '%Decryptme%' OR CommandLine ILIKE '%P@ssw0rd!%' OR CommandLine ILIKE '%Pass8080%' OR CommandLine ILIKE '%password123%' OR CommandLine ILIKE '%test@202%'
