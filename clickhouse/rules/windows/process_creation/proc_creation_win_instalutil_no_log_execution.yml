id: d042284c-a296-4988-9be5-f424fadcc28c
name: Suspicious Execution of InstallUtil Without Log
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.stealth
rule: SELECT * FROM logs WHERE Image ILIKE '%\\InstallUtil.exe' AND Image ILIKE '%Microsoft.NET\\Framework%' AND (CommandLine ILIKE '%/logfile= %' AND CommandLine ILIKE '%/LogToConsole=false%')
