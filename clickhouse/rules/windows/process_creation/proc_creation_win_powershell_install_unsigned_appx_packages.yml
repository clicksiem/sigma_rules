id: 37651c2a-42cd-4a69-ae0d-22a4349aa04a
name: Unsigned AppX Installation Attempt Using Add-AppxPackage
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.persistence
- attack.stealth
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe') OR (OriginalFileName IN ('PowerShell.EXE', 'pwsh.dll'))) AND (CommandLine ILIKE '%Add-AppPackage %' OR CommandLine ILIKE '%Add-AppxPackage %') AND CommandLine ILIKE '% -AllowUnsigned%'
