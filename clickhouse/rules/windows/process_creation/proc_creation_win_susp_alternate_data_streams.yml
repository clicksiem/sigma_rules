group: windows
tags:
- attack.stealth
- attack.t1564.004
rule: SELECT * FROM logs WHERE CommandLine ILIKE '%txt:%' AND ((CommandLine ILIKE '%type %' AND CommandLine ILIKE '% > %') OR (CommandLine ILIKE '%makecab %' AND CommandLine ILIKE '%.cab%') OR (CommandLine ILIKE '%reg %' AND CommandLine ILIKE '% export %') OR (CommandLine ILIKE '%regedit %' AND CommandLine ILIKE '% /E %') OR (CommandLine ILIKE '%esentutl %' AND CommandLine ILIKE '% /y %' AND CommandLine ILIKE '% /d %' AND CommandLine ILIKE '% /o %'))
