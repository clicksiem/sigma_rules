rule: SELECT * FROM logs WHERE (Image ILIKE '%python.exe' OR Image ILIKE '%python3.exe' OR Image ILIKE '%python2.exe') AND ((CommandLine ILIKE '%import pty%' AND CommandLine ILIKE '%.spawn(%') OR CommandLine ILIKE '%from pty import spawn%')
