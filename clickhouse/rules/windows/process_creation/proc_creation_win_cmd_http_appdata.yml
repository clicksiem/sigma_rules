id: 1ac8666b-046f-4201-8aba-1951aaec03a3
name: Command Line Execution with Suspicious URL and AppData Strings
level: 5
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community
group: windows
tags:
- attack.execution
- attack.command-and-control
