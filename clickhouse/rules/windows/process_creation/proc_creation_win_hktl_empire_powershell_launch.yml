rule: SELECT * FROM logs WHERE CommandLine ILIKE '% -NoP -sta -NonI -W Hidden -Enc %' OR CommandLine ILIKE '% -noP -sta -w 1 -enc %' OR CommandLine ILIKE '% -NoP -NonI -W Hidden -enc %' OR CommandLine ILIKE '% -noP -sta -w 1 -enc%' OR CommandLine ILIKE '% -enc  SQB%' OR CommandLine ILIKE '% -nop -exec bypass -EncodedCommand %'
