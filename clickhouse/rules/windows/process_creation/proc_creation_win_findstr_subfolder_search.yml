id: 04936b66-3915-43ad-a8e5-809eadfd1141
name: Insensitive Subfolder Search Via Findstr.EXE
level: 3
size: '>0'
active: true
author:
- Furkan CALISKAN, @caliskanfurkan_, @oscd_initiative, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.credential-access
- attack.command-and-control
- attack.stealth
- attack.t1218
- attack.t1564.004
- attack.t1552.001
- attack.t1105
rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%findstr%' OR Image ILIKE '%findstr.exe' OR OriginalFileName='FINDSTR.EXE') AND ((CommandLine ILIKE '% -s %' OR CommandLine ILIKE '% /s %' OR CommandLine ILIKE '% –s %' OR CommandLine ILIKE '% —s %' OR CommandLine ILIKE '% ―s %') AND (CommandLine ILIKE '% -i %' OR CommandLine ILIKE '% /i %' OR CommandLine ILIKE '% –i %' OR CommandLine ILIKE '% —i %' OR CommandLine ILIKE '% ―i %'))
