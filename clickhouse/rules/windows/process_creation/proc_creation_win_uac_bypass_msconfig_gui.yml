rule: SELECT * FROM logs WHERE (IntegrityLevel IN ('High', 'System', 'S-1-16-16384', 'S-1-16-12288')) AND ParentImage ILIKE '%\\AppData\\Local\\Temp\\pkgmgr.exe' AND CommandLine ILIKE '"C:\\Windows\\system32\\msconfig.exe" -5'
