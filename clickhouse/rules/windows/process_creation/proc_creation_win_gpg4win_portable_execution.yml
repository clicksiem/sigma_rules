rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\gpg.exe' OR Image ILIKE '%\\gpg2.exe') OR OriginalFileName='gpg.exe' OR Description='GnuPG’s OpenPGP tool') AND (NOT (Image ILIKE '%:\\Program Files (x86)\\GNU\\GnuPG\\bin\\%' OR Image ILIKE '%:\\Program Files (x86)\\GnuPG VS-Desktop\\%' OR Image ILIKE '%:\\Program Files (x86)\\GnuPG\\bin\\%' OR Image ILIKE '%:\\Program Files (x86)\\Gpg4win\\bin\\%'))
