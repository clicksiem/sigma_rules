- attack.t1134.002
rule: SELECT * FROM logs WHERE ParentImage ILIKE '%\\services.exe' AND (((CommandLine ILIKE '%/c%' AND CommandLine ILIKE '%echo%' AND CommandLine ILIKE '%\\pipe\\%') AND (CommandLine ILIKE '%cmd%' OR CommandLine ILIKE '%\%COMSPEC\%%')) OR (CommandLine ILIKE '%rundll32%' AND CommandLine ILIKE '%.dll,a%' AND CommandLine ILIKE '%/p:%')) AND (NOT CommandLine ILIKE '%MpCmdRun%')
