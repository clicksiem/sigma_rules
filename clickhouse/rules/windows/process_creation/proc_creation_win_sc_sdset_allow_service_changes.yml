rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\sc.exe' OR OriginalFileName='sc.exe') AND (CommandLine ILIKE '%sdset%' AND CommandLine ILIKE '%A;%') AND (CommandLine ILIKE '%;IU%' OR CommandLine ILIKE '%;SU%' OR CommandLine ILIKE '%;BA%' OR CommandLine ILIKE '%;SY%' OR CommandLine ILIKE '%;WD%')) AND (NOT ParentImage ILIKE 'C:\\Hexnode\\Hexnode Agent\\Current\\HexnodeAgent.exe')
