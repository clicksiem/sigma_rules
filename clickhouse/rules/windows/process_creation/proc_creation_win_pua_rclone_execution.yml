id: e37db05d-d1f9-49c8-b464-cee1a4b11638
name: PUA - Rclone Execution
level: 8
size: '>0'
active: true
author:
- Bhabesh Raj, Sittikorn S, Aaron Greetham (@beardofbinary) - NCC Group
group: windows
tags:
- attack.exfiltration
- attack.t1567.002
rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%--config %' AND CommandLine ILIKE '%--no-check-certificate %' AND CommandLine ILIKE '% copy %') OR ((Image ILIKE '%\\rclone.exe' OR Description='Rsync for cloud storage') AND (CommandLine ILIKE '%pass%' OR CommandLine ILIKE '%user%' OR CommandLine ILIKE '%copy%' OR CommandLine ILIKE '%sync%' OR CommandLine ILIKE '%config%' OR CommandLine ILIKE '%lsd%' OR CommandLine ILIKE '%remote%' OR CommandLine ILIKE '%ls%' OR CommandLine ILIKE '%mega%' OR CommandLine ILIKE '%pcloud%' OR CommandLine ILIKE '%ftp%' OR CommandLine ILIKE '%ignore-existing%' OR CommandLine ILIKE '%auto-confirm%' OR CommandLine ILIKE '%transfers%' OR CommandLine ILIKE '%multi-thread-streams%' OR CommandLine ILIKE '%no-check-certificate %'))
