rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\kdu.exe' OR Image ILIKE '%\\hamakaze.exe') OR OriginalFileName='hamakaze.exe') AND (CommandLine ILIKE '%-map %' OR CommandLine ILIKE '%-prv %' OR CommandLine ILIKE '%-dse %' OR CommandLine ILIKE '%-ps %')
