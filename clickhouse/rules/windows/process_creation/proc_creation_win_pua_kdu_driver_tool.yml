id: e76ca062-4de0-4d79-8d90-160a0d335eca
name: PUA - Kernel Driver Utility (KDU) Execution
level: 8
size: '>0'
active: true
author:
- Matt Anderson, Dray Agha, Anna Pham (Huntress)
group: windows
tags:
- attack.persistence
- attack.privilege-escalation
