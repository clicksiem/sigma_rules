rule: SELECT * FROM logs WHERE (Image ILIKE '%\\createdump.exe' OR OriginalFileName ILIKE 'FX\_VER\_INTERNALNAME\_STR') AND (CommandLine ILIKE '% -u %' OR CommandLine ILIKE '% --full %' OR CommandLine ILIKE '% -f %' OR CommandLine ILIKE '% --name %' OR CommandLine ILIKE '%.dmp %')
