rule: SELECT * FROM logs WHERE (Image ILIKE '%\\WMIC.exe' OR OriginalFileName='wmic.exe') AND ((CommandLine ILIKE '% service %' AND CommandLine ILIKE '%ChangeStartMode%') AND (CommandLine ILIKE '%Manual%' OR CommandLine ILIKE '%Disabled%'))
