rule: SELECT * FROM logs WHERE (Image ILIKE '%\\sc.exe' AND (CommandLine ILIKE '%create%' AND CommandLine ILIKE '%binPath%')) AND (NOT ((ParentImage ILIKE 'C:\\Program Files (x86)\\Dropbox\\Client\\%' OR ParentImage ILIKE 'C:\\Program Files\\Dropbox\\Client\\%') AND ParentImage ILIKE '%\\Dropbox.exe'))
