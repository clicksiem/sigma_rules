rule: SELECT * FROM logs WHERE (Image ILIKE '%\\schtasks.exe' OR OriginalFileName='schtasks.exe') AND (CommandLine ILIKE '%-delete%' OR CommandLine ILIKE '%/delete%' OR CommandLine ILIKE '%–delete%' OR CommandLine ILIKE '%—delete%' OR CommandLine ILIKE '%―delete%') AND (CommandLine ILIKE '%\\Windows\\BitLocker%' OR CommandLine ILIKE '%\\Windows\\ExploitGuard%' OR CommandLine ILIKE '%\\Windows\\SystemRestore\\SR%' OR CommandLine ILIKE '%\\Windows\\UpdateOrchestrator\\%' OR CommandLine ILIKE '%\\Windows\\Windows Defender\\%' OR CommandLine ILIKE '%\\Windows\\WindowsBackup\\%' OR CommandLine ILIKE '%\\Windows\\WindowsUpdate\\%')
