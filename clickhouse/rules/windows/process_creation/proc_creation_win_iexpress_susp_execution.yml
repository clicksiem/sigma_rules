rule: SELECT * FROM logs WHERE (Image ILIKE '%\\iexpress.exe' OR OriginalFileName='IEXPRESS.exe') AND (CommandLine ILIKE '% -n %' OR CommandLine ILIKE '% /n %' OR CommandLine ILIKE '% –n %' OR CommandLine ILIKE '% —n %' OR CommandLine ILIKE '% ―n %') AND (CommandLine ILIKE '%:\\ProgramData\\%' OR CommandLine ILIKE '%:\\Temp\\%' OR CommandLine ILIKE '%:\\Windows\\System32\\Tasks\\%' OR CommandLine ILIKE '%:\\Windows\\Tasks\\%' OR CommandLine ILIKE '%:\\Windows\\Temp\\%' OR CommandLine ILIKE '%\\AppData\\Local\\Temp\\%')
