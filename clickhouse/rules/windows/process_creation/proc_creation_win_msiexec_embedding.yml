id: 4a2a2c3e-209f-4d01-b513-4155a540b469
name: Suspicious MsiExec Embedding Parent
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.stealth
- attack.t1218.007
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\cmd.exe') AND (ParentCommandLine ILIKE '%MsiExec.exe%' AND ParentCommandLine ILIKE '%-Embedding %')) AND (NOT ((Image ILIKE '%:\\Windows\\System32\\cmd.exe' AND CommandLine ILIKE '%C:\\Program Files\\SplunkUniversalForwarder\\bin\\%') OR (CommandLine ILIKE '%\\DismFoDInstall.cmd%' OR (ParentCommandLine ILIKE '%\\MsiExec.exe -Embedding %' AND ParentCommandLine ILIKE '%Global\\MSI0000%'))))
