rule: SELECT * FROM logs WHERE (CommandLine ILIKE '% -name IEHarden %' AND CommandLine ILIKE '% -value 0 %') OR (CommandLine ILIKE '% -name DEPOff %' AND CommandLine ILIKE '% -value 1 %') OR (CommandLine ILIKE '% -name DisableFirstRunCustomize %' AND CommandLine ILIKE '% -value 2 %')
