rule: SELECT * FROM logs WHERE (ParentImage ILIKE '%\\explorer.exe' AND (Image ILIKE '%\\rundll32.exe' OR OriginalFileName='RUNDLL32.EXE')) AND (NOT (CommandLine ILIKE '% C:\\Windows\\System32\\%' OR CommandLine ILIKE '% -localserver 22d8c27b-47a1-48d1-ad08-7da7abd79617'))
