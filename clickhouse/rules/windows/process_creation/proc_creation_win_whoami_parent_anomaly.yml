id: 8de1cbe8-d6f5-496d-8237-5f44a721c7a0
name: Whoami.EXE Execution Anomaly
level: 5
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.discovery
- attack.t1033
- car.2016-03-001
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\whoami.exe' OR OriginalFileName='whoami.exe') AND (NOT ((ParentImage ILIKE '%\\cmd.exe' OR ParentImage ILIKE '%\\powershell\_ise.exe' OR ParentImage ILIKE '%\\powershell.exe' OR ParentImage ILIKE '%\\pwsh.exe') OR isNull(ParentImage) OR (ParentImage IN ('', '-')))) AND (NOT ParentImage ILIKE '%:\\Program Files\\Microsoft Monitoring Agent\\Agent\\MonitoringHost.exe')
