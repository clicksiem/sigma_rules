id: dff1e1cc-d3fd-47c8-bfc2-aeb878a754c0
name: Shell Process Spawned by Java.EXE
level: 5
size: '>0'
active: true
author:
- Andreas Hunkeler (@Karneades), Nasreddine Bencherchali
group: windows
tags:
- attack.initial-access
- attack.persistence
- attack.privilege-escalation
rule: SELECT * FROM logs WHERE (ParentImage ILIKE '%\\java.exe' AND (Image ILIKE '%\\bash.exe' OR Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe')) AND (NOT (ParentImage ILIKE '%build%' AND CommandLine ILIKE '%build%'))
