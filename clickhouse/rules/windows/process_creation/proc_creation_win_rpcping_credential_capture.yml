id: 93671f99-04eb-4ab4-a161-70d446a84003
name: Capture Credentials with Rpcping.exe
level: 5
size: '>0'
active: true
author:
- Julia Fomina, oscd.community
group: windows
tags:
- attack.credential-access
- attack.t1003
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\RpcPing.exe' OR OriginalFileName ILIKE '\\RpcPing.exe') AND (CommandLine ILIKE '%-s%' OR CommandLine ILIKE '%/s%' OR CommandLine ILIKE '%–s%' OR CommandLine ILIKE '%—s%' OR CommandLine ILIKE '%―s%')) AND (((CommandLine ILIKE '%-u%' OR CommandLine ILIKE '%/u%' OR CommandLine ILIKE '%–u%' OR CommandLine ILIKE '%—u%' OR CommandLine ILIKE '%―u%') AND CommandLine ILIKE '%NTLM%') OR ((CommandLine ILIKE '%-t%' OR CommandLine ILIKE '%/t%' OR CommandLine ILIKE '%–t%' OR CommandLine ILIKE '%—t%' OR CommandLine ILIKE '%―t%') AND CommandLine ILIKE '%ncacn\_np%'))
