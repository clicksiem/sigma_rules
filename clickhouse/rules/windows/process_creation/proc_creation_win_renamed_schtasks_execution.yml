rule: SELECT * FROM logs WHERE (((CommandLine ILIKE '% -create %' OR CommandLine ILIKE '% /create %' OR CommandLine ILIKE '% –create %' OR CommandLine ILIKE '% —create %' OR CommandLine ILIKE '% ―create %' OR CommandLine ILIKE '% -delete %' OR CommandLine ILIKE '% /delete %' OR CommandLine ILIKE '% –delete %' OR CommandLine ILIKE '% —delete %' OR CommandLine ILIKE '% ―delete %' OR CommandLine ILIKE '% -query %' OR CommandLine ILIKE '% /query %' OR CommandLine ILIKE '% –query %' OR CommandLine ILIKE '% —query %' OR CommandLine ILIKE '% ―query %' OR CommandLine ILIKE '% -change %' OR CommandLine ILIKE '% /change %' OR CommandLine ILIKE '% –change %' OR CommandLine ILIKE '% —change %' OR CommandLine ILIKE '% ―change %' OR CommandLine ILIKE '% -run %' OR CommandLine ILIKE '% /run %' OR CommandLine ILIKE '% –run %' OR CommandLine ILIKE '% —run %' OR CommandLine ILIKE '% ―run %' OR CommandLine ILIKE '% -end %' OR CommandLine ILIKE '% /end %' OR CommandLine ILIKE '% –end %' OR CommandLine ILIKE '% —end %' OR CommandLine ILIKE '% ―end %') AND (CommandLine ILIKE '% -tn %' OR CommandLine ILIKE '% /tn %' OR CommandLine ILIKE '% –tn %' OR CommandLine ILIKE '% —tn %' OR CommandLine ILIKE '% ―tn %' OR CommandLine ILIKE '% -tr %' OR CommandLine ILIKE '% /tr %' OR CommandLine ILIKE '% –tr %' OR CommandLine ILIKE '% —tr %' OR CommandLine ILIKE '% ―tr %' OR CommandLine ILIKE '% -sc %' OR CommandLine ILIKE '% /sc %' OR CommandLine ILIKE '% –sc %' OR CommandLine ILIKE '% —sc %' OR CommandLine ILIKE '% ―sc %' OR CommandLine ILIKE '% -st %' OR CommandLine ILIKE '% /st %' OR CommandLine ILIKE '% –st %' OR CommandLine ILIKE '% —st %' OR CommandLine ILIKE '% ―st %' OR CommandLine ILIKE '% -ru %' OR CommandLine ILIKE '% /ru %' OR CommandLine ILIKE '% –ru %' OR CommandLine ILIKE '% —ru %' OR CommandLine ILIKE '% ―ru %' OR CommandLine ILIKE '% -fo %' OR CommandLine ILIKE '% /fo %' OR CommandLine ILIKE '% –fo %' OR CommandLine ILIKE '% —fo %' OR CommandLine ILIKE '% ―fo %')) AND (NOT CommandLine ILIKE '%schtasks%')) OR (OriginalFileName='schtasks.exe' AND (NOT Image ILIKE '%\\schtasks.exe'))
