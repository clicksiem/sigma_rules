rule: SELECT * FROM logs WHERE (OriginalFileName='wmic.exe' OR Image ILIKE '%\\WMIC.exe') AND ((CommandLine ILIKE '% service %' AND CommandLine ILIKE '% call %') AND (CommandLine ILIKE '%stopservice%' OR CommandLine ILIKE '%startservice%'))
