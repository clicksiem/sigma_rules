rule: SELECT * FROM logs WHERE ParentImage ILIKE '%\\cmd.exe' AND (ParentCommandLine ILIKE '% -c %' OR ParentCommandLine ILIKE '% /c %' OR ParentCommandLine ILIKE '% –c %' OR ParentCommandLine ILIKE '% —c %' OR ParentCommandLine ILIKE '% ―c %' OR ParentCommandLine ILIKE '% -r %' OR ParentCommandLine ILIKE '% /r %' OR ParentCommandLine ILIKE '% –r %' OR ParentCommandLine ILIKE '% —r %' OR ParentCommandLine ILIKE '% ―r %' OR ParentCommandLine ILIKE '% -k %' OR ParentCommandLine ILIKE '% /k %' OR ParentCommandLine ILIKE '% –k %' OR ParentCommandLine ILIKE '% —k %' OR ParentCommandLine ILIKE '% ―k %') AND Image ILIKE '%\\chcp.com' AND (CommandLine ILIKE '%chcp' OR CommandLine ILIKE '%chcp ' OR CommandLine ILIKE '%chcp  ')
