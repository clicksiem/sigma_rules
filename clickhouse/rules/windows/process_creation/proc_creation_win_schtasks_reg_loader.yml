id: 86588b36-c6d3-465f-9cee-8f9093e07798
name: Scheduled Task Executing Payload from Registry
level: 5
size: '>0'
active: true
author:
- X__Junior (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
- attack.t1059.001
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\schtasks.exe' OR OriginalFileName='schtasks.exe') AND CommandLine ILIKE '%/Create%' AND (CommandLine ILIKE '%Get-ItemProperty%' OR CommandLine ILIKE '% gp %') AND (CommandLine ILIKE '%HKCU:%' OR CommandLine ILIKE '%HKLM:%' OR CommandLine ILIKE '%registry::%' OR CommandLine ILIKE '%HKEY\_%')) AND (NOT (CommandLine ILIKE '%FromBase64String%' OR CommandLine ILIKE '%encodedcommand%'))
