id: 8518ed3d-f7c9-4601-a26c-f361a4256a0c
name: Suspicious Download From File-Sharing Website Via Bitsadmin
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1197
- attack.s0190
- attack.t1036.003
- attack.command-and-control
