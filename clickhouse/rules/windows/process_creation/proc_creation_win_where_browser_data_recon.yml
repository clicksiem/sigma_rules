rule: SELECT * FROM logs WHERE (Image ILIKE '%\\where.exe' OR OriginalFileName='where.exe') AND (CommandLine ILIKE '%places.sqlite%' OR CommandLine ILIKE '%cookies.sqlite%' OR CommandLine ILIKE '%formhistory.sqlite%' OR CommandLine ILIKE '%logins.json%' OR CommandLine ILIKE '%key4.db%' OR CommandLine ILIKE '%key3.db%' OR CommandLine ILIKE '%sessionstore.jsonlz4%' OR CommandLine ILIKE '%History%' OR CommandLine ILIKE '%Bookmarks%' OR CommandLine ILIKE '%Cookies%' OR CommandLine ILIKE '%Login Data%')
