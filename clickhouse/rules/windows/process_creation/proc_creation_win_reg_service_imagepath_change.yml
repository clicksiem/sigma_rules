id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
name: Changing Existing Service ImagePath Value Via Reg.EXE
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
