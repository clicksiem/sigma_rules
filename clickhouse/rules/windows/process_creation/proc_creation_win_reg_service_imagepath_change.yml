rule: SELECT * FROM logs WHERE (Image ILIKE '%\\reg.exe' AND (CommandLine ILIKE '%add %' AND CommandLine ILIKE '%SYSTEM\\CurrentControlSet\\Services\\%' AND CommandLine ILIKE '% ImagePath %')) AND (CommandLine ILIKE '% -d %' OR CommandLine ILIKE '% /d %' OR CommandLine ILIKE '% –d %' OR CommandLine ILIKE '% —d %' OR CommandLine ILIKE '% ―d %')
