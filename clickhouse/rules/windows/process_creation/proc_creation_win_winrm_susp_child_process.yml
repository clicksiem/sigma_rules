id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
name: Suspicious Processes Spawned by WinRM
level: 8
size: '>0'
active: true
author:
- Andreas Hunkeler (@Karneades), Markus Neis
group: windows
tags:
- attack.t1190
- attack.initial-access
- attack.persistence
- attack.privilege-escalation
rule: SELECT * FROM logs WHERE ParentImage ILIKE '%\\wsmprovhost.exe' AND (Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\sh.exe' OR Image ILIKE '%\\bash.exe' OR Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\wsl.exe' OR Image ILIKE '%\\schtasks.exe' OR Image ILIKE '%\\certutil.exe' OR Image ILIKE '%\\whoami.exe' OR Image ILIKE '%\\bitsadmin.exe')
