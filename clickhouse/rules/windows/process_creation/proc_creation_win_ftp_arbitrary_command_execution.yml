rule: SELECT * FROM logs WHERE ParentImage ILIKE '%\\ftp.exe' OR ((Image ILIKE '%\\ftp.exe' OR OriginalFileName='ftp.exe') AND (CommandLine ILIKE '%-s:%' OR CommandLine ILIKE '%/s:%' OR CommandLine ILIKE '%–s:%' OR CommandLine ILIKE '%—s:%' OR CommandLine ILIKE '%―s:%'))
