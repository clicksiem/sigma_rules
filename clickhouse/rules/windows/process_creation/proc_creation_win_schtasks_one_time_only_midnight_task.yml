id: 970823b7-273b-460a-8afc-3a6811998529
name: Uncommon One Time Only Scheduled Task At 00:00
level: 8
size: '>0'
active: true
author:
- pH-T (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.t1053.005
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\schtasks.exe%' OR OriginalFileName='schtasks.exe') AND (CommandLine ILIKE '%wscript%' OR CommandLine ILIKE '%vbscript%' OR CommandLine ILIKE '%cscript%' OR CommandLine ILIKE '%wmic %' OR CommandLine ILIKE '%wmic.exe%' OR CommandLine ILIKE '%regsvr32.exe%' OR CommandLine ILIKE '%powershell%' OR CommandLine ILIKE '%\\AppData\\%') AND (CommandLine ILIKE '%once%' AND CommandLine ILIKE '%00:00%')
