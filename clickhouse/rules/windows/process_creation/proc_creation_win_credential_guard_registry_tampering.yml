id: c17d47b7-dcd6-4109-87eb-d1817bd4cbc9
name: Windows Credential Guard Registry Tampering Via CommandLine
level: 8
size: '>0'
active: true
author:
- Swachchhanda Shrawan Poudel (Nextron Systems)
group: windows
tags:
- attack.defense-impairment
- attack.t1685
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\reg.exe') OR (OriginalFileName IN ('PowerShell.EXE', 'pwsh.dll', 'reg.exe'))) AND (CommandLine ILIKE '%add %' OR CommandLine ILIKE '%New-ItemProperty %' OR CommandLine ILIKE '%Set-ItemProperty %' OR CommandLine ILIKE '%si %' OR CommandLine ILIKE '%delete %' OR CommandLine ILIKE '%del %' OR CommandLine ILIKE '%Remove-ItemProperty %' OR CommandLine ILIKE '%rp %') AND (CommandLine ILIKE '%\\Control\\DeviceGuard%' OR CommandLine ILIKE '%\\Control\\LSA%' OR CommandLine ILIKE '%Software\\Policies\\Microsoft\\Windows\\DeviceGuard%') AND (CommandLine ILIKE '%EnableVirtualizationBasedSecurity%' OR CommandLine ILIKE '%RequirePlatformSecurityFeatures%' OR CommandLine ILIKE '%LsaCfgFlags%')
