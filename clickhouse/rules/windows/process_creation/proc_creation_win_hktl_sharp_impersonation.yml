id: f89b08d0-77ad-4728-817b-9b16c5a69c7a
name: HackTool - SharpImpersonation Execution
level: 8
size: '>0'
active: true
author:
- Sai Prashanth Pulisetti @pulisettis, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1134.001
- attack.t1134.003
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\SharpImpersonation.exe' OR OriginalFileName='SharpImpersonation.exe') OR ((CommandLine ILIKE '% user:%' AND CommandLine ILIKE '% binary:%') OR (CommandLine ILIKE '% user:%' AND CommandLine ILIKE '% shellcode:%') OR (CommandLine ILIKE '% technique:CreateProcessAsUserW%' OR CommandLine ILIKE '% technique:ImpersonateLoggedOnuser%'))
