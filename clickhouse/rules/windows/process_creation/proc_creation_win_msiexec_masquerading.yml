rule: SELECT * FROM logs WHERE (Image ILIKE '%\\msiexec.exe' OR OriginalFileName ILIKE '\\msiexec.exe') AND (NOT (Image ILIKE 'C:\\Windows\\System32\\%' OR Image ILIKE 'C:\\Windows\\SysWOW64\\%' OR Image ILIKE 'C:\\Windows\\WinSxS\\%'))
