id: be344333-921d-4c4d-8bb8-e584cf584780
name: Potentially Suspicious Event Viewer Child Process
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.t1548.002
- car.2019-04-001
rule: SELECT * FROM logs WHERE ParentImage ILIKE '%\\eventvwr.exe' AND (NOT (Image ILIKE '%:\\Windows\\System32\\mmc.exe' OR Image ILIKE '%:\\Windows\\System32\\WerFault.exe' OR Image ILIKE '%:\\Windows\\SysWOW64\\WerFault.exe'))
