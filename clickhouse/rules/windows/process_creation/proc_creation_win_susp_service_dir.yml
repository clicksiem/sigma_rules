id: 883faa95-175a-4e22-8181-e5761aeb373c
name: Suspicious Service Binary Directory
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.stealth
- attack.t1202
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\Users\\Public\\%' OR Image ILIKE '%\\$Recycle.bin%' OR Image ILIKE '%\\Users\\All Users\\%' OR Image ILIKE '%\\Users\\Default\\%' OR Image ILIKE '%\\Users\\Contacts\\%' OR Image ILIKE '%\\Users\\Searches\\%' OR Image ILIKE '%C:\\Perflogs\\%' OR Image ILIKE '%\\config\\systemprofile\\%' OR Image ILIKE '%\\Windows\\Fonts\\%' OR Image ILIKE '%\\Windows\\IME\\%' OR Image ILIKE '%\\Windows\\addins\\%') AND (ParentImage ILIKE '%\\services.exe' OR ParentImage ILIKE '%\\svchost.exe')
