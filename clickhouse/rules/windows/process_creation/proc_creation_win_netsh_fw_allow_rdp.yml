id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
name: RDP Connection Allowed Via Netsh.EXE
level: 8
size: '>0'
active: true
author:
- Sander Wiebing
group: windows
tags:
- attack.defense-impairment
- attack.t1686.003
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\netsh.exe' OR OriginalFileName='netsh.exe') AND ((CommandLine ILIKE '%firewall %' AND CommandLine ILIKE '%add %' AND CommandLine ILIKE '%tcp %' AND CommandLine ILIKE '%3389%') AND (CommandLine ILIKE '%portopening%' OR CommandLine ILIKE '%allow%'))
