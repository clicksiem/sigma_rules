id: 0e0255bf-2548-47b8-9582-c0955c9283f5
name: Suspicious Reg Add BitLocker
level: 8
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.impact
- attack.t1486
rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%REG%' AND CommandLine ILIKE '%ADD%' AND CommandLine ILIKE '%\\SOFTWARE\\Policies\\Microsoft\\FVE%' AND CommandLine ILIKE '%/v%' AND CommandLine ILIKE '%/f%') AND (CommandLine ILIKE '%EnableBDEWithNoTPM%' OR CommandLine ILIKE '%UseAdvancedStartup%' OR CommandLine ILIKE '%UseTPM%' OR CommandLine ILIKE '%UseTPMKey%' OR CommandLine ILIKE '%UseTPMKeyPIN%' OR CommandLine ILIKE '%RecoveryKeyMessageSource%' OR CommandLine ILIKE '%UseTPMPIN%' OR CommandLine ILIKE '%RecoveryKeyMessage%')
