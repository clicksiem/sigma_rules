id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
name: LOLBIN Execution From Abnormal Drive
level: 5
size: '>0'
active: true
author:
- Christopher Peacock '@securepeacock', SCYTHE '@scythe_io', Angelo Violetti - SEC Consult '@angelo_violetti', Aaron Herman
group: windows
tags:
- attack.stealth
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\calc.exe' OR Image ILIKE '%\\certutil.exe' OR Image ILIKE '%\\cmstp.exe' OR Image ILIKE '%\\cscript.exe' OR Image ILIKE '%\\installutil.exe' OR Image ILIKE '%\\mshta.exe' OR Image ILIKE '%\\regsvr32.exe' OR Image ILIKE '%\\rundll32.exe' OR Image ILIKE '%\\wscript.exe') OR (OriginalFileName IN ('CALC.EXE', 'CertUtil.exe', 'CMSTP.EXE', 'cscript.exe', 'installutil.exe', 'MSHTA.EXE', 'REGSVR32.EXE', 'RUNDLL32.EXE', 'wscript.exe'))) AND (NOT (CurrentDirectory ILIKE '%C:\\%' OR CurrentDirectory='' OR isNull(CurrentDirectory)))
