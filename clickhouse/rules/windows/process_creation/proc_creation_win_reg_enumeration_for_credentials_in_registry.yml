id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
name: Enumeration for Credentials in Registry
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.credential-access
- attack.t1552.002
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\reg.exe' AND (CommandLine ILIKE '% query %' AND CommandLine ILIKE '%/t %' AND CommandLine ILIKE '%REG\_SZ%' AND CommandLine ILIKE '%/s%')) AND ((CommandLine ILIKE '%/f %' AND CommandLine ILIKE '%HKLM%') OR (CommandLine ILIKE '%/f %' AND CommandLine ILIKE '%HKCU%') OR CommandLine ILIKE '%HKCU\\Software\\SimonTatham\\PuTTY\\Sessions%')
