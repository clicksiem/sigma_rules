rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%extrac32.exe%' OR Image ILIKE '%\\extrac32.exe' OR OriginalFileName='extrac32.exe') AND CommandLine ILIKE '%.cab%' AND (CommandLine ILIKE '%/C%' OR CommandLine ILIKE '%/Y%' OR CommandLine ILIKE '% \\\\%')
