rule: SELECT * FROM logs WHERE Image ILIKE '%\\npc.exe' OR (CommandLine ILIKE '% -server=%' AND CommandLine ILIKE '% -vkey=%' AND CommandLine ILIKE '% -password=%') OR CommandLine ILIKE '% -config=npc%' OR (Hashes ILIKE '%MD5=AE8ACF66BFE3A44148964048B826D005%' OR Hashes ILIKE '%SHA1=CEA49E9B9B67F3A13AD0BE1C2655293EA3C18181%' OR Hashes ILIKE '%SHA256=5A456283392FFCEEEACA3D3426C306EB470304637520D72FED1CC1FEBBBD6856%')
