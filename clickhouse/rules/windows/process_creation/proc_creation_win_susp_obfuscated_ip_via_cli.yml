id: 56d19cb4-6414-4769-9644-1ed35ffbb148
name: Obfuscated IP Via CLI
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems), X__Junior (Nextron Systems)
group: windows
tags:
- attack.discovery
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\ping.exe' OR Image ILIKE '%\\arp.exe') AND ((CommandLine ILIKE '% 0x%' OR CommandLine ILIKE '%//0x%' OR CommandLine ILIKE '%.0x%' OR CommandLine ILIKE '%.00x%') OR (CommandLine ILIKE '%http://\%%' AND CommandLine ILIKE '%\%2e%') OR (match(CommandLine, 'https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}') OR match(CommandLine, 'https?://[0-9]{1,3}\.0[0-9]{3,7}') OR match(CommandLine, 'https?://0[0-9]{3,11}') OR match(CommandLine, 'https?://(?:0[0-9]{1,11}\.){3}0[0-9]{1,11}') OR match(CommandLine, 'https?://0[0-9]{1,11}') OR match(CommandLine, ' [0-7]{7,13}'))) AND (NOT match(CommandLine, 'https?://(?:(?:25[0-5]|(?:2[0-4]|1\d|[1-9])?\d)(?:\.|\b)){4}'))
