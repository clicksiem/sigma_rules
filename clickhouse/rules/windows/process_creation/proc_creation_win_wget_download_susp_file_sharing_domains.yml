id: a0d7e4d2-bede-4141-8896-bc6e237e977c
name: Suspicious File Download From File Sharing Domain Via Wget.EXE
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\wget.exe' OR OriginalFileName='wget.exe') AND (CommandLine ILIKE '%.githubusercontent.com%' OR CommandLine ILIKE '%anonfiles.com%' OR CommandLine ILIKE '%cdn.discordapp.com%' OR CommandLine ILIKE '%ddns.net%' OR CommandLine ILIKE '%dl.dropboxusercontent.com%' OR CommandLine ILIKE '%ghostbin.co%' OR CommandLine ILIKE '%github.com%' OR CommandLine ILIKE '%glitch.me%' OR CommandLine ILIKE '%gofile.io%' OR CommandLine ILIKE '%hastebin.com%' OR CommandLine ILIKE '%mediafire.com%' OR CommandLine ILIKE '%mega.nz%' OR CommandLine ILIKE '%onrender.com%' OR CommandLine ILIKE '%pages.dev%' OR CommandLine ILIKE '%paste.ee%' OR CommandLine ILIKE '%pastebin.com%' OR CommandLine ILIKE '%pastebin.pl%' OR CommandLine ILIKE '%pastetext.net%' OR CommandLine ILIKE '%pixeldrain.com%' OR CommandLine ILIKE '%privatlab.com%' OR CommandLine ILIKE '%privatlab.net%' OR CommandLine ILIKE '%send.exploit.in%' OR CommandLine ILIKE '%sendspace.com%' OR CommandLine ILIKE '%storage.googleapis.com%' OR CommandLine ILIKE '%storjshare.io%' OR CommandLine ILIKE '%supabase.co%' OR CommandLine ILIKE '%temp.sh%' OR CommandLine ILIKE '%transfer.sh%' OR CommandLine ILIKE '%trycloudflare.com%' OR CommandLine ILIKE '%ufile.io%' OR CommandLine ILIKE '%w3spaces.com%' OR CommandLine ILIKE '%workers.dev%') AND CommandLine ILIKE '%http%' AND (match(CommandLine, '\s-O\s') OR CommandLine ILIKE '%--output-document%') AND (CommandLine ILIKE '%.ps1' OR CommandLine ILIKE '%.ps1''' OR CommandLine ILIKE '%.ps1"' OR CommandLine ILIKE '%.dat' OR CommandLine ILIKE '%.dat''' OR CommandLine ILIKE '%.dat"' OR CommandLine ILIKE '%.msi' OR CommandLine ILIKE '%.msi''' OR CommandLine ILIKE '%.msi"' OR CommandLine ILIKE '%.bat' OR CommandLine ILIKE '%.bat''' OR CommandLine ILIKE '%.bat"' OR CommandLine ILIKE '%.exe' OR CommandLine ILIKE '%.exe''' OR CommandLine ILIKE '%.exe"' OR CommandLine ILIKE '%.vbs' OR CommandLine ILIKE '%.vbs''' OR CommandLine ILIKE '%.vbs"' OR CommandLine ILIKE '%.vbe' OR CommandLine ILIKE '%.vbe''' OR CommandLine ILIKE '%.vbe"' OR CommandLine ILIKE '%.hta' OR CommandLine ILIKE '%.hta''' OR CommandLine ILIKE '%.hta"' OR CommandLine ILIKE '%.dll' OR CommandLine ILIKE '%.dll''' OR CommandLine ILIKE '%.dll"' OR CommandLine ILIKE '%.psm1' OR CommandLine ILIKE '%.psm1''' OR CommandLine ILIKE '%.psm1"')
