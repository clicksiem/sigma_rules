id: f11f2808-adb4-46c0-802a-8660db50fa99
name: ImagingDevices Unusual Parent/Child Processes
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.stealth
rule: SELECT * FROM logs WHERE ((ParentImage ILIKE '%\\WmiPrvSE.exe' OR ParentImage ILIKE '%\\svchost.exe' OR ParentImage ILIKE '%\\dllhost.exe') AND Image ILIKE '%\\ImagingDevices.exe') OR ParentImage ILIKE '%\\ImagingDevices.exe'
