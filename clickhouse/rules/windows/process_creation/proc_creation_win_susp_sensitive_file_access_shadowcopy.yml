name: Sensitive File Access Via Volume Shadow Copy Backup
level: 8
size: '>0'
active: true
author:
- Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems)
group: windows
tags:
- attack.impact
- attack.t1490
rule: SELECT * FROM logs WHERE CommandLine ILIKE '%\\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy%' AND (CommandLine ILIKE '%\\NTDS.dit%' OR CommandLine ILIKE '%\\SYSTEM%' OR CommandLine ILIKE '%\\SECURITY%')
