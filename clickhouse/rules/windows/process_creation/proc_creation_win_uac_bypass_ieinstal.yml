rule: SELECT * FROM logs WHERE (IntegrityLevel IN ('High', 'System', 'S-1-16-16384', 'S-1-16-12288')) AND ParentImage ILIKE '%\\ieinstal.exe' AND Image ILIKE '%\\AppData\\Local\\Temp\\%' AND Image ILIKE '%consent.exe'
