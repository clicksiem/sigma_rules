group: windows
tags:
- attack.collection
- attack.t1113
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\reg.exe' OR OriginalFileName='reg.exe') AND (CommandLine ILIKE '%Microsoft\\Windows\\WindowsAI%' AND CommandLine ILIKE '%DisableAIDataAnalysis%') AND ((CommandLine ILIKE '%add%' OR CommandLine ILIKE '%0%') OR CommandLine ILIKE '%delete%')
