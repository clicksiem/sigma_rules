id: b7e2a8d4-74bb-4b78-adc9-3f92af2d4829
name: Reg Add Suspicious Paths
level: 8
size: '>0'
active: true
author:
- frack113, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
- attack.t1685
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\reg.exe' OR OriginalFileName='reg.exe') AND (CommandLine ILIKE '%\\AppDataLow\\Software\\Microsoft\\%' OR CommandLine ILIKE '%\\Policies\\Microsoft\\Windows\\OOBE%' OR CommandLine ILIKE '%\\Policies\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon%' OR CommandLine ILIKE '%\\SOFTWARE\\Microsoft\\Windows NT\\Currentversion\\Winlogon%' OR CommandLine ILIKE '%\\CurrentControlSet\\Control\\SecurityProviders\\WDigest%' OR CommandLine ILIKE '%\\Microsoft\\Windows Defender\\%')
