rule: SELECT * FROM logs WHERE CommandLine ILIKE '%WindowsAudioDevice-Powershell-Cmdlet%' OR CommandLine ILIKE '%Toggle-AudioDevice%' OR CommandLine ILIKE '%Get-AudioDevice %' OR CommandLine ILIKE '%Set-AudioDevice %' OR CommandLine ILIKE '%Write-AudioDevice %'
