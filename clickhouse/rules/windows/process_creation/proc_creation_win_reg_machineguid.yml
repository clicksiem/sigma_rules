rule: SELECT * FROM logs WHERE Image ILIKE '%\\reg.exe' AND (CommandLine ILIKE '%SOFTWARE\\Microsoft\\Cryptography%' AND CommandLine ILIKE '%/v %' AND CommandLine ILIKE '%MachineGuid%')
