rule: SELECT * FROM logs WHERE CommandLine ILIKE '%TVqQAAMAAAAEAAAA%' OR CommandLine ILIKE '%TVpQAAIAAAAEAA8A%' OR CommandLine ILIKE '%TVqAAAEAAAAEABAA%' OR CommandLine ILIKE '%TVoAAAAAAAAAAAAA%' OR CommandLine ILIKE '%TVpTAQEAAAAEAAAA%'
