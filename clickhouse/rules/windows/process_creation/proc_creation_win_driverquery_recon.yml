id: 9fc3072c-dc8f-4bf7-b231-18950000fadd
name: Potential Recon Activity Using DriverQuery.EXE
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.discovery
rule: SELECT * FROM logs WHERE (Image ILIKE '%driverquery.exe' OR OriginalFileName='drvqry.exe') AND ((ParentImage ILIKE '%\\cscript.exe' OR ParentImage ILIKE '%\\mshta.exe' OR ParentImage ILIKE '%\\regsvr32.exe' OR ParentImage ILIKE '%\\rundll32.exe' OR ParentImage ILIKE '%\\wscript.exe') OR (ParentImage ILIKE '%\\AppData\\Local\\%' OR ParentImage ILIKE '%\\Users\\Public\\%' OR ParentImage ILIKE '%\\Windows\\Temp\\%'))
