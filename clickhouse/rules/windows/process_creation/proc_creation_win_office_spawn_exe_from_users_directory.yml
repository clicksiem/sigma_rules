id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
name: Suspicious Binary In User Directory Spawned From Office Application
level: 8
size: '>0'
active: true
author:
- Jason Lynch
group: windows
tags:
- attack.execution
- attack.t1204.002
- attack.g0046
- car.2013-05-002
rule: SELECT * FROM logs WHERE ((ParentImage ILIKE '%\\WINWORD.EXE' OR ParentImage ILIKE '%\\EXCEL.EXE' OR ParentImage ILIKE '%\\POWERPNT.exe' OR ParentImage ILIKE '%\\MSPUB.exe' OR ParentImage ILIKE '%\\VISIO.exe' OR ParentImage ILIKE '%\\MSACCESS.exe' OR ParentImage ILIKE '%\\EQNEDT32.exe') AND Image ILIKE 'C:\\users\\%' AND Image ILIKE '%.exe') AND (NOT Image ILIKE '%\\Teams.exe')
