rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\wscript.exe' OR OriginalFileName='wscript.exe') AND CommandLine ILIKE '%manage-bde.wsf%') OR (((ParentImage ILIKE '%\\cscript.exe' OR ParentImage ILIKE '%\\wscript.exe') AND ParentCommandLine ILIKE '%manage-bde.wsf%') AND (NOT Image ILIKE '%\\cmd.exe'))
