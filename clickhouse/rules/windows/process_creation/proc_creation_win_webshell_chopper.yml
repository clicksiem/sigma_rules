rule: SELECT * FROM logs WHERE (Image ILIKE '%\\w3wp.exe' OR ParentImage ILIKE '%\\w3wp.exe') AND (CommandLine ILIKE '%&ipconfig&echo%' OR CommandLine ILIKE '%&quser&echo%' OR CommandLine ILIKE '%&whoami&echo%' OR CommandLine ILIKE '%&c:&echo%' OR CommandLine ILIKE '%&cd&echo%' OR CommandLine ILIKE '%&dir&echo%' OR CommandLine ILIKE '%&echo [E]%' OR CommandLine ILIKE '%&echo [S]%')
