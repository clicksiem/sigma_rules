id: e593cf51-88db-4ee1-b920-37e89012a3c9
name: Potentially Suspicious Rundll32 Activity
level: 5
size: '>0'
active: true
author:
- juju4, Jonhnathan Ribeiro, oscd.community, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.stealth
- attack.t1218.011
rule: SELECT * FROM logs WHERE ((CommandLine ILIKE '%javascript:%' AND CommandLine ILIKE '%.RegisterXLL%') OR (CommandLine ILIKE '%url.dll%' AND CommandLine ILIKE '%OpenURL%') OR (CommandLine ILIKE '%url.dll%' AND CommandLine ILIKE '%OpenURLA%') OR (CommandLine ILIKE '%url.dll%' AND CommandLine ILIKE '%FileProtocolHandler%') OR (CommandLine ILIKE '%zipfldr.dll%' AND CommandLine ILIKE '%RouteTheCall%') OR (CommandLine ILIKE '%shell32.dll%' AND CommandLine ILIKE '%Control\_RunDLL%') OR (CommandLine ILIKE '%shell32.dll%' AND CommandLine ILIKE '%ShellExec\_RunDLL%') OR (CommandLine ILIKE '%mshtml.dll%' AND CommandLine ILIKE '%PrintHTML%') OR (CommandLine ILIKE '%advpack.dll%' AND CommandLine ILIKE '%LaunchINFSection%') OR (CommandLine ILIKE '%advpack.dll%' AND CommandLine ILIKE '%RegisterOCX%') OR (CommandLine ILIKE '%ieadvpack.dll%' AND CommandLine ILIKE '%LaunchINFSection%') OR (CommandLine ILIKE '%ieadvpack.dll%' AND CommandLine ILIKE '%RegisterOCX%') OR (CommandLine ILIKE '%ieframe.dll%' AND CommandLine ILIKE '%OpenURL%') OR (CommandLine ILIKE '%shdocvw.dll%' AND CommandLine ILIKE '%OpenURL%') OR (CommandLine ILIKE '%syssetup.dll%' AND CommandLine ILIKE '%SetupInfObjectInstallAction%') OR (CommandLine ILIKE '%setupapi.dll%' AND CommandLine ILIKE '%InstallHinfSection%') OR (CommandLine ILIKE '%pcwutl.dll%' AND CommandLine ILIKE '%LaunchApplication%') OR (CommandLine ILIKE '%dfshim.dll%' AND CommandLine ILIKE '%ShOpenVerbApplication%') OR (CommandLine ILIKE '%dfshim.dll%' AND CommandLine ILIKE '%ShOpenVerbShortcut%') OR (CommandLine ILIKE '%scrobj.dll%' AND CommandLine ILIKE '%GenerateTypeLib%' AND CommandLine ILIKE '%http%') OR (CommandLine ILIKE '%shimgvw.dll%' AND CommandLine ILIKE '%ImageView\_Fullscreen%' AND CommandLine ILIKE '%http%') OR (CommandLine ILIKE '%comsvcs.dll%' AND CommandLine ILIKE '%MiniDump%')) AND (NOT (CommandLine ILIKE '%shell32.dll,Control\_RunDLL desk.cpl,screensaver,@screensaver%' OR (ParentImage ILIKE 'C:\\Windows\\System32\\control.exe' AND ParentCommandLine ILIKE '%.cpl%' AND (CommandLine ILIKE '%Shell32.dll%' AND CommandLine ILIKE '%Control\_RunDLL%' AND CommandLine ILIKE '%.cpl%')) OR (ParentImage ILIKE 'C:\\Windows\\System32\\control.exe' AND CommandLine ILIKE '"C:\\Windows\\system32\\rundll32.exe" Shell32.dll,Control\_RunDLL "C:\\Windows\\System32\\%' AND CommandLine ILIKE '%.cpl",')))
