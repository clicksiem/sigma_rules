id: 6225c53a-a96e-4235-b28f-8d7997cd96eb
name: Hypervisor-protected Code Integrity (HVCI) Related Registry Tampering Via CommandLine
level: 8
size: '>0'
active: true
author:
- Swachchhanda Shrawan Poudel (Nextron Systems)
group: windows
tags:
- attack.defense-impairment
- attack.t1685
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\reg.exe') OR (OriginalFileName IN ('PowerShell.EXE', 'pwsh.dll', 'reg.exe'))) AND (CommandLine ILIKE '%add %' OR CommandLine ILIKE '%New-ItemProperty %' OR CommandLine ILIKE '%Set-ItemProperty %' OR CommandLine ILIKE '%si %') AND CommandLine ILIKE '%\\DeviceGuard%' AND (CommandLine ILIKE '%EnableVirtualizationBasedSecurity%' OR CommandLine ILIKE '%HypervisorEnforcedCodeIntegrity%')
