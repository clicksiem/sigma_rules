id: 396f6630-f3ac-44e3-bfc8-1b161bc00c4e
name: Suspicious Child Process Of Wermgr.EXE
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1055
- attack.t1036
rule: SELECT * FROM logs WHERE (ParentImage ILIKE '%\\wermgr.exe' AND (Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\cscript.exe' OR Image ILIKE '%\\ipconfig.exe' OR Image ILIKE '%\\mshta.exe' OR Image ILIKE '%\\net.exe' OR Image ILIKE '%\\net1.exe' OR Image ILIKE '%\\netstat.exe' OR Image ILIKE '%\\nslookup.exe' OR Image ILIKE '%\\powershell\_ise.exe' OR Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\regsvr32.exe' OR Image ILIKE '%\\rundll32.exe' OR Image ILIKE '%\\systeminfo.exe' OR Image ILIKE '%\\whoami.exe' OR Image ILIKE '%\\wscript.exe')) AND (NOT (Image ILIKE '%\\rundll32.exe' AND (CommandLine ILIKE '%C:\\Windows\\system32\\WerConCpl.dll%' AND CommandLine ILIKE '%LaunchErcApp %') AND (CommandLine ILIKE '%-queuereporting%' OR CommandLine ILIKE '%-responsepester%')))
