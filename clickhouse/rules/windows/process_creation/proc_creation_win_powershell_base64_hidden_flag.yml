rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe') OR (OriginalFileName IN ('PowerShell.EXE', 'pwsh.dll'))) AND CommandLine ILIKE '% hidden %' AND (CommandLine ILIKE '%AGkAdABzAGEAZABtAGkAbgAgAC8AdAByAGEAbgBzAGYAZQByA%' OR CommandLine ILIKE '%aXRzYWRtaW4gL3RyYW5zZmVy%' OR CommandLine ILIKE '%IAaQB0AHMAYQBkAG0AaQBuACAALwB0AHIAYQBuAHMAZgBlAHIA%' OR CommandLine ILIKE '%JpdHNhZG1pbiAvdHJhbnNmZX%' OR CommandLine ILIKE '%YgBpAHQAcwBhAGQAbQBpAG4AIAAvAHQAcgBhAG4AcwBmAGUAcg%' OR CommandLine ILIKE '%Yml0c2FkbWluIC90cmFuc2Zlc%' OR CommandLine ILIKE '%AGMAaAB1AG4AawBfAHMAaQB6AGUA%' OR CommandLine ILIKE '%JABjAGgAdQBuAGsAXwBzAGkAegBlA%' OR CommandLine ILIKE '%JGNodW5rX3Npem%' OR CommandLine ILIKE '%QAYwBoAHUAbgBrAF8AcwBpAHoAZQ%' OR CommandLine ILIKE '%RjaHVua19zaXpl%' OR CommandLine ILIKE '%Y2h1bmtfc2l6Z%' OR CommandLine ILIKE '%AE8ALgBDAG8AbQBwAHIAZQBzAHMAaQBvAG4A%' OR CommandLine ILIKE '%kATwAuAEMAbwBtAHAAcgBlAHMAcwBpAG8Abg%' OR CommandLine ILIKE '%lPLkNvbXByZXNzaW9u%' OR CommandLine ILIKE '%SQBPAC4AQwBvAG0AcAByAGUAcwBzAGkAbwBuA%' OR CommandLine ILIKE '%SU8uQ29tcHJlc3Npb2%' OR CommandLine ILIKE '%Ty5Db21wcmVzc2lvb%' OR CommandLine ILIKE '%AE8ALgBNAGUAbQBvAHIAeQBTAHQAcgBlAGEAbQ%' OR CommandLine ILIKE '%kATwAuAE0AZQBtAG8AcgB5AFMAdAByAGUAYQBtA%' OR CommandLine ILIKE '%lPLk1lbW9yeVN0cmVhb%' OR CommandLine ILIKE '%SQBPAC4ATQBlAG0AbwByAHkAUwB0AHIAZQBhAG0A%' OR CommandLine ILIKE '%SU8uTWVtb3J5U3RyZWFt%' OR CommandLine ILIKE '%Ty5NZW1vcnlTdHJlYW%' OR CommandLine ILIKE '%4ARwBlAHQAQwBoAHUAbgBrA%' OR CommandLine ILIKE '%5HZXRDaHVua%' OR CommandLine ILIKE '%AEcAZQB0AEMAaAB1AG4Aaw%' OR CommandLine ILIKE '%LgBHAGUAdABDAGgAdQBuAGsA%' OR CommandLine ILIKE '%LkdldENodW5r%' OR CommandLine ILIKE '%R2V0Q2h1bm%' OR CommandLine ILIKE '%AEgAUgBFAEEARABfAEkATgBGAE8ANgA0A%' OR CommandLine ILIKE '%QASABSAEUAQQBEAF8ASQBOAEYATwA2ADQA%' OR CommandLine ILIKE '%RIUkVBRF9JTkZPNj%' OR CommandLine ILIKE '%SFJFQURfSU5GTzY0%' OR CommandLine ILIKE '%VABIAFIARQBBAEQAXwB