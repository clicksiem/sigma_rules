rule: SELECT * FROM logs WHERE (ParentImage ILIKE '%\\servers\\Stable-%' AND ParentImage ILIKE '%\\server\\node.exe' AND ParentCommandLine ILIKE '%.vscode-server%') AND (((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe') AND CommandLine ILIKE '%\\terminal\\browser\\media\\shellIntegration.ps1%') OR (Image ILIKE '%\\wsl.exe' OR Image ILIKE '%\\bash.exe'))
