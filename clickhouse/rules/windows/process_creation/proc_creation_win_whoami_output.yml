rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\whoami.exe' OR OriginalFileName='whoami.exe') AND (CommandLine ILIKE '% /FO CSV%' OR CommandLine ILIKE '% -FO CSV%')) OR CommandLine ILIKE '%whoami%>%'
