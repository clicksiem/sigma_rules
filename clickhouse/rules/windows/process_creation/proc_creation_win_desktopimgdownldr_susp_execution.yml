rule: SELECT * FROM logs WHERE (CommandLine ILIKE '% /lockscreenurl:%' AND (NOT (CommandLine ILIKE '%.jpg%' OR CommandLine ILIKE '%.jpeg%' OR CommandLine ILIKE '%.png%'))) OR (CommandLine ILIKE '%reg delete%' AND CommandLine ILIKE '%\\PersonalizationCSP%')
