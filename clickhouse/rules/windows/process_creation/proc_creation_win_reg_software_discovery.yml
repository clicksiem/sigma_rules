rule: SELECT * FROM logs WHERE Image ILIKE '%\\reg.exe' AND (CommandLine ILIKE '%query%' AND CommandLine ILIKE '%\\software\\%' AND CommandLine ILIKE '%/v%' AND CommandLine ILIKE '%svcversion%')
