rule: SELECT * FROM logs WHERE (ParentImage ILIKE '%\\cmd.exe' AND ParentCommandLine ILIKE '%.bat') AND ((Image ILIKE '%\\xcopy.exe' AND (CommandLine ILIKE '%powershell.exe%' AND CommandLine ILIKE '%.bat.exe%')) OR (Image ILIKE '%\\xcopy.exe' AND (CommandLine ILIKE '%pwsh.exe%' AND CommandLine ILIKE '%.bat.exe%')) OR (Image ILIKE '%\\attrib.exe' AND (CommandLine ILIKE '%+s%' AND CommandLine ILIKE '%+h%' AND CommandLine ILIKE '%.bat.exe%')))
