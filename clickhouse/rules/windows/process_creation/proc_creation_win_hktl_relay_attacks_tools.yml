rule: SELECT * FROM logs WHERE ((Image ILIKE '%PetitPotam%' OR Image ILIKE '%RottenPotato%' OR Image ILIKE '%HotPotato%' OR Image ILIKE '%JuicyPotato%' OR Image ILIKE '%\\just\_dce\_%' OR Image ILIKE '%Juicy Potato%' OR Image ILIKE '%\\temp\\rot.exe%' OR Image ILIKE '%\\Potato.exe%' OR Image ILIKE '%\\SpoolSample.exe%' OR Image ILIKE '%\\Responder.exe%' OR Image ILIKE '%\\smbrelayx%' OR Image ILIKE '%\\ntlmrelayx%' OR Image ILIKE '%\\LocalPotato%') OR (CommandLine ILIKE '%Invoke-Tater%' OR CommandLine ILIKE '% smbrelay%' OR CommandLine ILIKE '% ntlmrelay%' OR CommandLine ILIKE '%cme smb %' OR CommandLine ILIKE '% /ntlm:NTLMhash %' OR CommandLine ILIKE '%Invoke-PetitPotam%' OR CommandLine ILIKE '%.exe -t % -p %') OR (CommandLine ILIKE '%.exe -c "{%' AND CommandLine ILIKE '%}" -z')) AND (NOT (Image ILIKE '%HotPotatoes6%' OR Image ILIKE '%HotPotatoes7%' OR Image ILIKE '%HotPotatoes %'))
