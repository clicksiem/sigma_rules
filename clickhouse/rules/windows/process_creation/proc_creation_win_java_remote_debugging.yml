rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%transport=dt\_socket,address=%' AND (CommandLine ILIKE '%jre1.%' OR CommandLine ILIKE '%jdk1.%')) AND (NOT (CommandLine ILIKE '%address=127.0.0.1%' OR CommandLine ILIKE '%address=localhost%'))
