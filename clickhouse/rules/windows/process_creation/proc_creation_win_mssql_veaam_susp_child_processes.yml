id: d55b793d-f847-4eea-b59a-5ab09908ac90
name: Suspicious Child Process Of Veeam Dabatase
level: 10
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.initial-access
- attack.persistence
- attack.privilege-escalation
rule: SELECT * FROM logs WHERE (ParentImage ILIKE '%\\sqlservr.exe' AND ParentCommandLine ILIKE '%VEEAMSQL%') AND (((Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\wsl.exe' OR Image ILIKE '%\\wt.exe') AND (CommandLine ILIKE '%-ex %' OR CommandLine ILIKE '%bypass%' OR CommandLine ILIKE '%cscript%' OR CommandLine ILIKE '%DownloadString%' OR CommandLine ILIKE '%http://%' OR CommandLine ILIKE '%https://%' OR CommandLine ILIKE '%mshta%' OR CommandLine ILIKE '%regsvr32%' OR CommandLine ILIKE '%rundll32%' OR CommandLine ILIKE '%wscript%' OR CommandLine ILIKE '%copy %')) OR (Image ILIKE '%\\net.exe' OR Image ILIKE '%\\net1.exe' OR Image ILIKE '%\\netstat.exe' OR Image ILIKE '%\\nltest.exe' OR Image ILIKE '%\\ping.exe' OR Image ILIKE '%\\tasklist.exe' OR Image ILIKE '%\\whoami.exe'))
