id: b1f73849-6329-4069-bc8f-78a604bb8b23
name: Remote Access Tool - ScreenConnect Remote Command Execution
level: 3
size: '>0'
active: true
author:
- Ali Alwashali
group: windows
tags:
- attack.execution
- attack.t1059.003
rule: SELECT * FROM logs WHERE ParentImage ILIKE '%\\ScreenConnect.ClientService.exe' AND (Image ILIKE '%\\cmd.exe' OR OriginalFileName='Cmd.Exe') AND CommandLine ILIKE '%\\TEMP\\ScreenConnect\\%'
