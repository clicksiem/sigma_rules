id: 4f2cd9b6-4a17-440f-bb2a-687abb65993a
name: Uncommon AddinUtil.EXE CommandLine Execution
level: 5
size: '>0'
active: true
author:
- Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
group: windows
tags:
- attack.stealth
- attack.t1218
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\addinutil.exe' OR OriginalFileName='AddInUtil.exe') AND (CommandLine ILIKE '%-AddInRoot:%' OR CommandLine ILIKE '%-PipelineRoot:%')) AND (NOT (CommandLine ILIKE '%-AddInRoot:"C:\\Program Files (x86)\\Common Files\\Microsoft Shared\\VSTA%' OR CommandLine ILIKE '%-AddInRoot:C:\\Program Files (x86)\\Common Files\\Microsoft Shared\\VSTA%' OR CommandLine ILIKE '%-PipelineRoot:"C:\\Program Files (x86)\\Common Files\\Microsoft Shared\\VSTA%' OR CommandLine ILIKE '%-PipelineRoot:C:\\Program Files (x86)\\Common Files\\Microsoft Shared\\VSTA%'))
