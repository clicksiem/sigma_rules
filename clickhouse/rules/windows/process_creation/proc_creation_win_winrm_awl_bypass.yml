rule: SELECT * FROM logs WHERE CommandLine ILIKE '%winrm%' AND ((CommandLine ILIKE '%format:pretty%' OR CommandLine ILIKE '%format:"pretty"%' OR CommandLine ILIKE '%format:"text"%' OR CommandLine ILIKE '%format:text%') AND (NOT (Image ILIKE 'C:\\Windows\\System32\\%' OR Image ILIKE 'C:\\Windows\\SysWOW64\\%')))
