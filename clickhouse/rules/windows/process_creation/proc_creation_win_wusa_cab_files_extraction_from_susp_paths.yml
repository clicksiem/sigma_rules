rule: SELECT * FROM logs WHERE (Image ILIKE '%\\wusa.exe' AND CommandLine ILIKE '%/extract:%') AND (CommandLine ILIKE '%:\\PerfLogs\\%' OR CommandLine ILIKE '%:\\Users\\Public\\%' OR CommandLine ILIKE '%:\\Windows\\Temp\\%' OR CommandLine ILIKE '%\\Appdata\\Local\\Temp\\%')
