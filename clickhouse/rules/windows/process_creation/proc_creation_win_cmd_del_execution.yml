rule: SELECT * FROM logs WHERE (Image ILIKE '%\\cmd.exe' OR OriginalFileName='Cmd.Exe') AND (CommandLine ILIKE '%del %' OR CommandLine ILIKE '%erase %') AND (CommandLine ILIKE '% -f%' OR CommandLine ILIKE '% /f%' OR CommandLine ILIKE '% –f%' OR CommandLine ILIKE '% —f%' OR CommandLine ILIKE '% ―f%' OR CommandLine ILIKE '% -s%' OR CommandLine ILIKE '% /s%' OR CommandLine ILIKE '% –s%' OR CommandLine ILIKE '% —s%' OR CommandLine ILIKE '% ―s%' OR CommandLine ILIKE '% -q%' OR CommandLine ILIKE '% /q%' OR CommandLine ILIKE '% –q%' OR CommandLine ILIKE '% —q%' OR CommandLine ILIKE '% ―q%')
