id: 395907ee-96e5-4666-af2e-2ca91688e151
name: Wab Execution From Non Default Location
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.stealth
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\wab.exe' OR Image ILIKE '%\\wabmig.exe') AND (NOT (Image ILIKE 'C:\\Windows\\WinSxS\\%' OR Image ILIKE 'C:\\Program Files\\Windows Mail\\%' OR Image ILIKE 'C:\\Program Files (x86)\\Windows Mail\\%'))
