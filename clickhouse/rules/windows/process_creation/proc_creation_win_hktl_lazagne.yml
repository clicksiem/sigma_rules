rule: SELECT * FROM logs WHERE (Image ILIKE '%\\lazagne.exe' OR ((Image ILIKE '%:\\PerfLogs\\%' OR Image ILIKE '%:\\ProgramData\\%' OR Image ILIKE '%:\\Temp\\%' OR Image ILIKE '%:\\Tmp\\%' OR Image ILIKE '%:\\Users\\Public\\%' OR Image ILIKE '%:\\Windows\\Temp\\%' OR Image ILIKE '%\\$Recycle.bin%' OR Image ILIKE '%\\AppData\\%' OR Image ILIKE '%\\Desktop\\%' OR Image ILIKE '%\\Downloads\\%' OR Image ILIKE '%\\Favorites\\%' OR Image ILIKE '%\\Links\\%' OR Image ILIKE '%\\Music\\%' OR Image ILIKE '%\\Photos\\%' OR Image ILIKE '%\\Pictures\\%' OR Image ILIKE '%\\Saved Games\\%' OR Image ILIKE '%\\Searches\\%' OR Image ILIKE '%\\Users\\Contacts\\%' OR Image ILIKE '%\\Users\\Default\\%' OR Image ILIKE '%\\Users\\Searches\\%' OR Image ILIKE '%\\Videos\\%' OR Image ILIKE '%\\Windows\\addins\\%' OR Image ILIKE '%\\Windows\\Fonts\\%' OR Image ILIKE '%\\Windows\\IME\\%') AND (CommandLine ILIKE '%.exe all' OR CommandLine ILIKE '%.exe browsers' OR CommandLine ILIKE '%.exe chats' OR CommandLine ILIKE '%.exe databases' OR CommandLine ILIKE '%.exe games' OR CommandLine ILIKE '%.exe git' OR CommandLine ILIKE '%.exe mails' OR CommandLine ILIKE '%.exe maven' OR CommandLine ILIKE '%.exe memory' OR CommandLine ILIKE '%.exe multimedia' OR CommandLine ILIKE '%.exe sysadmin' OR CommandLine ILIKE '%.exe unused' OR CommandLine ILIKE '%.exe wifi' OR CommandLine ILIKE '%.exe windows'))) OR ((CommandLine ILIKE '% all %' OR CommandLine ILIKE '% browsers %' OR CommandLine ILIKE '% chats %' OR CommandLine ILIKE '% databases %' OR CommandLine ILIKE '% games %' OR CommandLine ILIKE '% mails %' OR CommandLine ILIKE '% maven %' OR CommandLine ILIKE '% memory %' OR CommandLine ILIKE '% multimedia %' OR CommandLine ILIKE '% php %' OR CommandLine ILIKE '% svn %' OR CommandLine ILIKE '% sysadmin %' OR CommandLine ILIKE '% unused %' OR CommandLine ILIKE '% wifi %') AND (CommandLine ILIKE '%-1Password%' OR CommandLine ILIKE '%-apachedirectorystudio%' OR CommandLine ILIKE '%-autologon%' OR CommandLine ILIKE '%-ChromiumBased%' OR CommandLine ILIKE '%-coreftp%' OR CommandLine ILIKE '%-credfiles%' OR CommandLine ILIKE '%-credman%' OR CommandLine ILIKE '%-cyberduck%' OR CommandLine ILIKE '%-dbvis%' OR CommandLine ILIKE '%-EyeCon%' OR CommandLine ILIKE '%-filezilla%' OR CommandLine ILIKE '%-filezillaserver%' OR CommandLine ILIKE '%-ftpnavigator%' OR CommandLine ILIKE '%-galconfusion%' OR CommandLine ILIKE '%-gitforwindows%' OR CommandLine ILIKE '%-hashdump%' OR CommandLine ILIKE '%-iisapppool%' OR CommandLine ILIKE '%-IISCentralCertP%' OR CommandLine ILIKE '%-kalypsomedia%' OR CommandLine ILIKE '%-keepass%' OR CommandLine ILIKE '%-keepassconfig%' OR CommandLine ILIKE '%-lsa\_secrets%' OR CommandLine ILIKE '%-mavenrepositories%' OR CommandLine ILIKE '%-memory\_dump%' OR CommandLine ILIKE '%-Mozilla%' OR CommandLine ILIKE '%-mRemoteNG%' OR CommandLine ILIKE '%-mscache%' OR CommandLine ILIKE '%-opensshforwindows%' OR CommandLine ILIKE '%-openvpn%' OR CommandLine ILIKE '%-outlook%' OR CommandLine ILIKE '%-pidgin%' OR CommandLine ILIKE '%-postgresql%' OR CommandLine ILIKE '%-psi-im%' OR CommandLine ILIKE '%-puttycm%' OR CommandLine ILIKE '%-pypykatz%' OR CommandLine ILIKE '%-Rclone%' OR CommandLine ILIKE '%-rdpmanager%' OR CommandLine ILIKE '%-robomongo%' OR CommandLine ILIKE '%-roguestale%' OR CommandLine ILIKE '%-skype%' OR CommandLine ILIKE '%-SQLDeveloper%' OR CommandLine ILIKE '%-squirrel%' OR CommandLine ILIKE '%-tortoise%' OR CommandLine ILIKE '%-turba%' OR CommandLine ILIKE '%-UCBrowser%' OR CommandLine ILIKE '%-unattended%' OR CommandLine ILIKE '%-vault%' OR CommandLine ILIKE '%-vaultfiles%' OR CommandLine ILIKE '%-vnc%' OR CommandLine ILIKE '%-winscp%'))
