rule: SELECT * FROM logs WHERE (Image ILIKE '%\\rundll32.exe' OR OriginalFileName='RUNDLL32.EXE') AND (CommandLine ILIKE '%keymgr%' AND CommandLine ILIKE '%KRShowKeyMgr%')
