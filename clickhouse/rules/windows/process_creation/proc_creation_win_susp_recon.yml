id: aa2efee7-34dd-446e-8a37-40790a66efd7
name: Recon Information for Export with Command Prompt
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.collection
- attack.t1119
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\tree.com' OR Image ILIKE '%\\WMIC.exe' OR Image ILIKE '%\\doskey.exe' OR Image ILIKE '%\\sc.exe') OR (OriginalFileName IN ('wmic.exe', 'DOSKEY.EXE', 'sc.exe'))) AND (ParentCommandLine ILIKE '% > \%TEMP\%\\%' OR ParentCommandLine ILIKE '% > \%TMP\%\\%')
