rule: SELECT * FROM logs WHERE ParentImage ILIKE '%\\WmiPrvSe.exe' AND (NOT ((LogonId IN ('0x3e7', 'null')) OR (User ILIKE '%AUTHORI%' OR User ILIKE '%AUTORI%') OR Image ILIKE '%\\WmiPrvSE.exe' OR Image ILIKE '%\\WerFault.exe' OR isNull(LogonId)))
