rule: SELECT * FROM logs WHERE (Description='PAExec Application' OR OriginalFileName='PAExec.exe' OR Product ILIKE '%PAExec%' OR (Hashes ILIKE '%IMPHASH=11D40A7B7876288F919AB819CC2D9802%' OR Hashes ILIKE '%IMPHASH=6444f8a34e99b8f7d9647de66aabe516%' OR Hashes ILIKE '%IMPHASH=dfd6aa3f7b2b1035b76b718f1ddc689f%' OR Hashes ILIKE '%IMPHASH=1a6cca4d5460b1710a12dea39e4a592c%')) AND (NOT (Image ILIKE '%\\paexec.exe' OR Image ILIKE 'C:\\Windows\\PAExec-%'))
