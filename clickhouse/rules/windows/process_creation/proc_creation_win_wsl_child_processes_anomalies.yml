id: 2267fe65-0681-42ad-9a6d-46553d3f3480
name: WSL Child Process Anomaly
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.stealth
- attack.t1218
- attack.t1202
rule: SELECT * FROM logs WHERE (ParentImage ILIKE '%\\wsl.exe' OR ParentImage ILIKE '%\\wslhost.exe') AND ((Image ILIKE '%\\calc.exe' OR Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\cscript.exe' OR Image ILIKE '%\\mshta.exe' OR Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\regsvr32.exe' OR Image ILIKE '%\\rundll32.exe' OR Image ILIKE '%\\wscript.exe') OR (Image ILIKE '%\\AppData\\Local\\Temp\\%' OR Image ILIKE '%C:\\Users\\Public\\%' OR Image ILIKE '%C:\\Windows\\Temp\\%' OR Image ILIKE '%C:\\Temp\\%' OR Image ILIKE '%\\Downloads\\%' OR Image ILIKE '%\\Desktop\\%'))
