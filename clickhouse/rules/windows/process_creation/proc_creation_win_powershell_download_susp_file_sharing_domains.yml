id: b6e04788-29e1-4557-bb14-77f761848ab8
name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.execution
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe') OR (OriginalFileName IN ('PowerShell.EXE', 'pwsh.dll'))) AND (CommandLine ILIKE '%anonfiles.com%' OR CommandLine ILIKE '%cdn.discordapp.com%' OR CommandLine ILIKE '%ddns.net%' OR CommandLine ILIKE '%dl.dropboxusercontent.com%' OR CommandLine ILIKE '%ghostbin.co%' OR CommandLine ILIKE '%glitch.me%' OR CommandLine ILIKE '%gofile.io%' OR CommandLine ILIKE '%hastebin.com%' OR CommandLine ILIKE '%mediafire.com%' OR CommandLine ILIKE '%mega.nz%' OR CommandLine ILIKE '%onrender.com%' OR CommandLine ILIKE '%pages.dev%' OR CommandLine ILIKE '%paste.ee%' OR CommandLine ILIKE '%pastebin.com%' OR CommandLine ILIKE '%pastebin.pl%' OR CommandLine ILIKE '%pastetext.net%' OR CommandLine ILIKE '%pixeldrain.com%' OR CommandLine ILIKE '%privatlab.com%' OR CommandLine ILIKE '%privatlab.net%' OR CommandLine ILIKE '%send.exploit.in%' OR CommandLine ILIKE '%sendspace.com%' OR CommandLine ILIKE '%storage.googleapis.com%' OR CommandLine ILIKE '%storjshare.io%' OR CommandLine ILIKE '%supabase.co%' OR CommandLine ILIKE '%temp.sh%' OR CommandLine ILIKE '%transfer.sh%' OR CommandLine ILIKE '%trycloudflare.com%' OR CommandLine ILIKE '%ufile.io%' OR CommandLine ILIKE '%w3spaces.com%' OR CommandLine ILIKE '%workers.dev%') AND (CommandLine ILIKE '%.DownloadString(%' OR CommandLine ILIKE '%.DownloadFile(%' OR CommandLine ILIKE '%Invoke-WebRequest %' OR CommandLine ILIKE '%iwr %' OR CommandLine ILIKE '%wget %')
