rule: SELECT * FROM logs WHERE ParentImage ILIKE 'C:\\Windows\\System32\\OpenSSH\\sshd.exe' OR ((Image ILIKE '%\\ssh.exe' OR Product='OpenSSH for Windows' OR (Hashes ILIKE '%IMPHASH=55b4964d29aad5438b9e950052dbbbc0%' OR Hashes ILIKE '%IMPHASH=334d66c33503ccbf647c15b47c27eef4%' OR Hashes ILIKE '%IMPHASH=27b0da080ef92afb37983d30d839141e%' OR Hashes ILIKE '%IMPHASH=977eb4c263d384e47daa0712d34713ab%' OR Hashes ILIKE '%IMPHASH=3eaadce9ae43d5a918bb082065815c3b%' OR Hashes ILIKE '%IMPHASH=980fe6cf0d996ab1eedf877222e722aa%' OR Hashes ILIKE '%IMPHASH=5f959422308ac3d721010d66647e100e%' OR Hashes ILIKE '%IMPHASH=a49aaa3d03d1cd9c8dc7fca60f7f480b%' OR Hashes ILIKE '%IMPHASH=dd335f759b6d5d6a8382b71dd9d65791%')) AND (CommandLine ILIKE '%ProxyCommand=%' OR (CommandLine ILIKE '%PermitLocalCommand=yes%' AND CommandLine ILIKE '% LocalCommand%')))
