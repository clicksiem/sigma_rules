rule: SELECT * FROM logs WHERE (Image ILIKE '%\\dtrace.exe' AND CommandLine ILIKE '%lkd(0)%') OR (CommandLine ILIKE '%syscall:::return%' AND CommandLine ILIKE '%lkd(%')
