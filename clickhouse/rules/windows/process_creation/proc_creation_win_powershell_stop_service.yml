id: c49c5062-0966-4170-9efd-9968c913a6cf
name: Stop Windows Service Via PowerShell Stop-Service
level: 3
size: '>0'
active: true
author:
- Jakob Weinzettl, oscd.community, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.impact
- attack.t1489
rule: SELECT * FROM logs WHERE ((OriginalFileName IN ('PowerShell.EXE', 'pwsh.dll')) OR (Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe')) AND CommandLine ILIKE '%Stop-Service %'
