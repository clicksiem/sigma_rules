rule: SELECT * FROM logs WHERE (CommandLine ILIKE '%-i%' OR CommandLine ILIKE '%/install%' OR CommandLine ILIKE '%-a%' OR CommandLine ILIKE '%/add-driver%' OR CommandLine ILIKE '%.inf%') AND Image ILIKE '%\\pnputil.exe'
