rule: SELECT * FROM logs WHERE (Image ILIKE '%\\crackmapexec.exe' OR CommandLine ILIKE '% -M pe\_inject %' OR (CommandLine ILIKE '% --local-auth%' AND CommandLine ILIKE '% -u %' AND CommandLine ILIKE '% -x %') OR (CommandLine ILIKE '% --local-auth%' AND CommandLine ILIKE '% -u %' AND CommandLine ILIKE '% -p %' AND CommandLine ILIKE '% -H ''NTHASH''%') OR (CommandLine ILIKE '% mssql %' AND CommandLine ILIKE '% -u %' AND CommandLine ILIKE '% -p %' AND CommandLine ILIKE '% -M %' AND CommandLine ILIKE '% -d %') OR (CommandLine ILIKE '% smb %' AND CommandLine ILIKE '% -u %' AND CommandLine ILIKE '% -H %' AND CommandLine ILIKE '% -M %' AND CommandLine ILIKE '% -o %') OR (CommandLine ILIKE '% smb %' AND CommandLine ILIKE '% -u %' AND CommandLine ILIKE '% -p %' AND CommandLine ILIKE '% --local-auth%')) OR ((CommandLine ILIKE '% --local-auth%' AND CommandLine ILIKE '% -u %' AND CommandLine ILIKE '% -p %') AND (CommandLine ILIKE '% 10.%' AND CommandLine ILIKE '% 192.168.%' AND CommandLine ILIKE '%/24 %'))
