id: 7f5d1c9a-3e83-48df-95a7-2b98aae6c13c
name: Potential Provlaunch.EXE Binary Proxy Execution Abuse
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel
group: windows
tags:
- attack.stealth
- attack.t1218
rule: SELECT * FROM logs WHERE ParentImage ILIKE '%\\provlaunch.exe' AND (NOT ((Image ILIKE '%\\calc.exe' OR Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\cscript.exe' OR Image ILIKE '%\\mshta.exe' OR Image ILIKE '%\\notepad.exe' OR Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\regsvr32.exe' OR Image ILIKE '%\\rundll32.exe' OR Image ILIKE '%\\wscript.exe') OR (Image ILIKE '%:\\PerfLogs\\%' OR Image ILIKE '%:\\Temp\\%' OR Image ILIKE '%:\\Users\\Public\\%' OR Image ILIKE '%\\AppData\\Temp\\%' OR Image ILIKE '%\\Windows\\System32\\Tasks\\%' OR Image ILIKE '%\\Windows\\Tasks\\%' OR Image ILIKE '%\\Windows\\Temp\\%')))
