id: 407aecb1-e762-4acf-8c7b-d087bcff3bb6
name: Credential Manager Access By Uncommon Applications
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.t1003
- attack.credential-access
rule: SELECT * FROM logs WHERE (FileName ILIKE '%\\AppData\\Local\\Microsoft\\Credentials\\%' OR FileName ILIKE '%\\AppData\\Roaming\\Microsoft\\Credentials\\%' OR FileName ILIKE '%\\AppData\\Local\\Microsoft\\Vault\\%' OR FileName ILIKE '%\\ProgramData\\Microsoft\\Vault\\%') AND (NOT (Image ILIKE 'C:\\Program Files\\%' OR Image ILIKE 'C:\\Program Files (x86)\\%' OR Image ILIKE 'C:\\Windows\\system32\\%' OR Image ILIKE 'C:\\Windows\\SysWOW64\\%'))
