id: fabb0e80-030c-4e3e-a104-d09676991ac3
name: Suspicious File Created in Outlook Temporary Directory
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems)
group: windows
tags:
- attack.initial-access
- attack.t1566.001
rule: SELECT * FROM logs WHERE (TargetFilename ILIKE '%.cpl' OR TargetFilename ILIKE '%.hta' OR TargetFilename ILIKE '%.iso' OR TargetFilename ILIKE '%.rdp' OR TargetFilename ILIKE '%.svg' OR TargetFilename ILIKE '%.vba' OR TargetFilename ILIKE '%.vbe' OR TargetFilename ILIKE '%.vbs') AND ((TargetFilename ILIKE '%\\AppData\\Local\\Packages\\Microsoft.Outlook\_%' OR TargetFilename ILIKE '%\\AppData\\Local\\Microsoft\\Olk\\Attachments\\%') OR (TargetFilename ILIKE '%\\AppData\\Local\\Microsoft\\Windows\\%' AND TargetFilename ILIKE '%\\Content.Outlook\\%'))
