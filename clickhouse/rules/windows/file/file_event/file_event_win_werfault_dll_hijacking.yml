id: 28a452f3-786c-4fd8-b8f2-bddbe9d616d1
name: Creation of WerFault.exe/Wer.dll in Unusual Folder
level: 5
size: '>0'
active: true
author:
- frack113
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
rule: SELECT * FROM logs WHERE (TargetFilename ILIKE '%\\WerFault.exe' OR TargetFilename ILIKE '%\\wer.dll') AND (NOT (TargetFilename ILIKE 'C:\\Windows\\SoftwareDistribution\\%' OR TargetFilename ILIKE 'C:\\Windows\\System32\\%' OR TargetFilename ILIKE 'C:\\Windows\\SysWOW64\\%' OR TargetFilename ILIKE 'C:\\Windows\\WinSxS\\%' OR TargetFilename ILIKE 'C:\\Windows\\UUS\\arm64\\%'))
