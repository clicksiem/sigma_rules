rule: SELECT * FROM logs WHERE Image ILIKE 'C:\\Program Files\\Internet Explorer\\IEInstal.exe' AND TargetFilename ILIKE 'C:\\Users\\%' AND TargetFilename ILIKE '%\\AppData\\Local\\Temp\\%' AND TargetFilename ILIKE '%consent.exe'
