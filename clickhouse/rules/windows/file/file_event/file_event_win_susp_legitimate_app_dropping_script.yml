id: 7d604714-e071-49ff-8726-edeb95a70679
name: Legitimate Application Dropped Script
level: 8
size: '>0'
active: true
author:
- frack113, Florian Roth (Nextron Systems)
group: windows
tags:
- attack.stealth
- attack.t1218
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\eqnedt32.exe' OR Image ILIKE '%\\wordpad.exe' OR Image ILIKE '%\\wordview.exe' OR Image ILIKE '%\\certutil.exe' OR Image ILIKE '%\\certoc.exe' OR Image ILIKE '%\\CertReq.exe' OR Image ILIKE '%\\Desktopimgdownldr.exe' OR Image ILIKE '%\\esentutl.exe' OR Image ILIKE '%\\mshta.exe' OR Image ILIKE '%\\AcroRd32.exe' OR Image ILIKE '%\\RdrCEF.exe' OR Image ILIKE '%\\hh.exe' OR Image ILIKE '%\\finger.exe') AND (TargetFilename ILIKE '%.ps1' OR TargetFilename ILIKE '%.bat' OR TargetFilename ILIKE '%.vbs' OR TargetFilename ILIKE '%.scf' OR TargetFilename ILIKE '%.wsf' OR TargetFilename ILIKE '%.wsh')
