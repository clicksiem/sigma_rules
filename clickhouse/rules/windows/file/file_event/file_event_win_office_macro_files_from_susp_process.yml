id: b1c50487-1967-4315-a026-6491686d860e
name: Office Macro File Creation From Suspicious Process
level: 8
size: '>0'
active: true
author:
- frack113, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.initial-access
- attack.t1566.001
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\cscript.exe' OR Image ILIKE '%\\mshta.exe' OR Image ILIKE '%\\regsvr32.exe' OR Image ILIKE '%\\rundll32.exe' OR Image ILIKE '%\\wscript.exe') OR (ParentImage ILIKE '%\\cscript.exe' OR ParentImage ILIKE '%\\mshta.exe' OR ParentImage ILIKE '%\\regsvr32.exe' OR ParentImage ILIKE '%\\rundll32.exe' OR ParentImage ILIKE '%\\wscript.exe')) AND (TargetFilename ILIKE '%.docm' OR TargetFilename ILIKE '%.dotm' OR TargetFilename ILIKE '%.xlsm' OR TargetFilename ILIKE '%.xltm' OR TargetFilename ILIKE '%.potm' OR TargetFilename ILIKE '%.pptm')
