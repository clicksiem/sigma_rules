rule: SELECT * FROM logs WHERE (Image ILIKE '%\\svchost.exe' AND TargetFilename ILIKE '%\\Personalization\\LockScreenImage\\%') AND (NOT TargetFilename ILIKE '%C:\\Windows\\%') AND (NOT (TargetFilename ILIKE '%.jpg%' OR TargetFilename ILIKE '%.jpeg%' OR TargetFilename ILIKE '%.png%'))
