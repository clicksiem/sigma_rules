id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
name: Potential SAM Database Dump
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.credential-access
- attack.t1003.002
rule: SELECT * FROM logs WHERE (TargetFilename ILIKE '%\\Temp\\sam' OR TargetFilename ILIKE '%\\sam.sav' OR TargetFilename ILIKE '%\\Intel\\sam' OR TargetFilename ILIKE '%\\sam.hive' OR TargetFilename ILIKE '%\\Perflogs\\sam' OR TargetFilename ILIKE '%\\ProgramData\\sam' OR TargetFilename ILIKE '%\\Users\\Public\\sam' OR TargetFilename ILIKE '%\\AppData\\Local\\sam' OR TargetFilename ILIKE '%\\AppData\\Roaming\\sam' OR TargetFilename ILIKE '%\_ShadowSteal.zip' OR TargetFilename ILIKE '%\\Documents\\SAM.export' OR TargetFilename ILIKE '%:\\sam') OR (TargetFilename ILIKE '%\\hive\_sam\_%' OR TargetFilename ILIKE '%\\sam.save%' OR TargetFilename ILIKE '%\\sam.export%' OR TargetFilename ILIKE '%\\~reg\_sam.save%' OR TargetFilename ILIKE '%\\sam\_backup%' OR TargetFilename ILIKE '%\\sam.bck%' OR TargetFilename ILIKE '%\\sam.backup%')
