id: 91174a41-dc8f-401b-be89-7bfc140612a0
name: Office Macro File Creation
level: 3
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.initial-access
- attack.t1566.001
rule: SELECT * FROM logs WHERE (TargetFilename ILIKE '%.docm' OR TargetFilename ILIKE '%.dotm' OR TargetFilename ILIKE '%.xlsm' OR TargetFilename ILIKE '%.xltm' OR TargetFilename ILIKE '%.potm' OR TargetFilename ILIKE '%.pptm') AND (NOT ((Image ILIKE 'C:\\Program Files\\Microsoft Office\\%' OR Image ILIKE 'C:\\Program Files (x86)\\Microsoft Office\\%') AND (Image ILIKE '%\\WINWORD.EXE' OR Image ILIKE '%\\EXCEL.EXE' OR Image ILIKE '%\\POWERPNT.EXE') AND TargetFilename ILIKE '%\\~$%'))
