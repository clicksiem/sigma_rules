id: fccfb43e-09a7-4bd2-8b37-a5a7df33386d
name: .RDP File Created By Uncommon Application
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.stealth
rule: SELECT * FROM logs WHERE TargetFilename ILIKE '%.rdp' AND (Image ILIKE '%\\brave.exe' OR Image ILIKE '%\\CCleaner Browser\\Application\\CCleanerBrowser.exe' OR Image ILIKE '%\\chromium.exe' OR Image ILIKE '%\\firefox.exe' OR Image ILIKE '%\\Google\\Chrome\\Application\\chrome.exe' OR Image ILIKE '%\\iexplore.exe' OR Image ILIKE '%\\microsoftedge.exe' OR Image ILIKE '%\\msedge.exe' OR Image ILIKE '%\\Opera.exe' OR Image ILIKE '%\\Vivaldi.exe' OR Image ILIKE '%\\Whale.exe' OR Image ILIKE '%\\olk.exe' OR Image ILIKE '%\\Outlook.exe' OR Image ILIKE '%\\RuntimeBroker.exe' OR Image ILIKE '%\\Thunderbird.exe' OR Image ILIKE '%\\Discord.exe' OR Image ILIKE '%\\Keybase.exe' OR Image ILIKE '%\\msteams.exe' OR Image ILIKE '%\\Slack.exe' OR Image ILIKE '%\\teams.exe')
