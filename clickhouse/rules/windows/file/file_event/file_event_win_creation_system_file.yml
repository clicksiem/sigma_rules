id: d5866ddf-ce8f-4aea-b28e-d96485a20d3d
name: Files With System Process Name In Unsuspected Locations
level: 5
size: '>0'
active: true
author:
- Sander Wiebing, Tim Shelton, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.stealth
- attack.t1036.005
rule: SELECT * FROM logs WHERE (TargetFilename ILIKE '%\\AtBroker.exe' OR TargetFilename ILIKE '%\\audiodg.exe' OR TargetFilename ILIKE '%\\backgroundTaskHost.exe' OR TargetFilename ILIKE '%\\bcdedit.exe' OR TargetFilename ILIKE '%\\bitsadmin.exe' OR TargetFilename ILIKE '%\\cmdl32.exe' OR TargetFilename ILIKE '%\\cmstp.exe' OR TargetFilename ILIKE '%\\conhost.exe' OR TargetFilename ILIKE '%\\csrss.exe' OR TargetFilename ILIKE '%\\dasHost.exe' OR TargetFilename ILIKE '%\\dfrgui.exe' OR TargetFilename ILIKE '%\\dllhost.exe' OR TargetFilename ILIKE '%\\dwm.exe' OR TargetFilename ILIKE '%\\eventcreate.exe' OR TargetFilename ILIKE '%\\eventvwr.exe' OR TargetFilename ILIKE '%\\explorer.exe' OR TargetFilename ILIKE '%\\extrac32.exe' OR TargetFilename ILIKE '%\\fontdrvhost.exe' OR TargetFilename ILIKE '%\\fsquirt.exe' OR TargetFilename ILIKE '%\\ipconfig.exe' OR TargetFilename ILIKE '%\\iscsicli.exe' OR TargetFilename ILIKE '%\\iscsicpl.exe' OR TargetFilename ILIKE '%\\logman.exe' OR TargetFilename ILIKE '%\\LogonUI.exe' OR TargetFilename ILIKE '%\\LsaIso.exe' OR TargetFilename ILIKE '%\\lsass.exe' OR TargetFilename ILIKE '%\\lsm.exe' OR TargetFilename ILIKE '%\\msiexec.exe' OR TargetFilename ILIKE '%\\msinfo32.exe' OR TargetFilename ILIKE '%\\mstsc.exe' OR TargetFilename ILIKE '%\\nbtstat.exe' OR TargetFilename ILIKE '%\\odbcconf.exe' OR TargetFilename ILIKE '%\\powershell.exe' OR TargetFilename ILIKE '%\\pwsh.exe' OR TargetFilename ILIKE '%\\regini.exe' OR TargetFilename ILIKE '%\\regsvr32.exe' OR TargetFilename ILIKE '%\\rundll32.exe' OR TargetFilename ILIKE '%\\RuntimeBroker.exe' OR TargetFilename ILIKE '%\\schtasks.exe' OR TargetFilename ILIKE '%\\SearchFilterHost.exe' OR TargetFilename ILIKE '%\\SearchIndexer.exe' OR TargetFilename ILIKE '%\\SearchProtocolHost.exe' OR TargetFilename ILIKE '%\\SecurityHealthService.exe' OR TargetFilename ILIKE '%\\SecurityHealthSystray.exe' OR TargetFilename ILIKE '%\\services.exe' OR TargetFilename ILIKE '%\\ShellAppRuntime.exe' OR TargetFilename ILIKE '%\\sihost.exe' OR TargetFilename ILIKE '%\\smartscreen.exe' OR TargetFilename ILIKE '%\\smss.exe' OR TargetFilename ILIKE '%\\spoolsv.exe' OR TargetFilename ILIKE '%\\svchost.exe' OR TargetFilename ILIKE '%\\SystemSettingsBroker.exe' OR TargetFilename ILIKE '%\\taskhost.exe' OR TargetFilename ILIKE '%\\taskhostw.exe' OR TargetFilename ILIKE '%\\Taskmgr.exe' OR TargetFilename ILIKE '%\\TiWorker.exe' OR TargetFilename ILIKE '%\\vssadmin.exe' OR TargetFilename ILIKE '%\\w32tm.exe' OR TargetFilename ILIKE '%\\WerFault.exe' OR TargetFilename ILIKE '%\\WerFaultSecure.exe' OR TargetFilename ILIKE '%\\wermgr.exe' OR TargetFilename ILIKE '%\\wevtutil.exe' OR TargetFilename ILIKE '%\\wininit.exe' OR TargetFilename ILIKE '%\\winlogon.exe' OR TargetFilename ILIKE '%\\winrshost.exe' OR TargetFilename ILIKE '%\\WinRTNetMUAHostServer.exe' OR TargetFilename ILIKE '%\\wlanext.exe' OR TargetFilename ILIKE '%\\wlrmdr.exe' OR TargetFilename ILIKE '%\\WmiPrvSE.exe' OR TargetFilename ILIKE '%\\wslhost.exe' OR TargetFilename ILIKE '%\\WSReset.exe' OR TargetFilename ILIKE '%\\WUDFHost.exe' OR TargetFilename ILIKE '%\\WWAHost.exe') AND (NOT ((TargetFilename ILIKE '%C:\\$WINDOWS.~BT\\%' OR TargetFilename ILIKE '%C:\\$WinREAgent\\%' OR TargetFilename ILIKE '%C:\\Windows\\SoftwareDistribution\\%' OR TargetFilename ILIKE '%C:\\Windows\\System32\\%' OR TargetFilename ILIKE '%C:\\Windows\\SysWOW64\\%' OR TargetFilename ILIKE '%C:\\Windows\\WinSxS\\%' OR TargetFilename ILIKE '%C:\\Windows\\uus\\%') OR ((Image ILIKE '%\\TiWorker.exe' OR Image ILIKE '%\\wuaucltcore.exe') AND TargetFilename ILIKE 'C:\\Windows\\Temp\\%') OR ((Image ILIKE '%C:\\Windows\\system32\\svchost.exe' OR Image ILIKE '%C:\\Windows\\SysWOW64\\svchost.exe') AND (TargetFilename ILIKE '%C:\\Program Files\\WindowsApps\\%' OR TargetFilename ILIKE '%C:\\Program Files (x86)\\WindowsApps\\%' OR TargetFilename ILIKE '%\\AppData\\Local\\Microsoft\\WindowsApps\\%')) OR (Image IN ('C:\\Windows\\System32\\wuauclt.exe', 'C:\\Windows\\SysWOW64\\wuauclt.exe', 'C:\\Windows\\UUS\\arm64\\wuaucltcore.exe')) OR TargetFilename ILIKE '%C:\\Windows\\explorer.exe' OR ((Image ILIKE '%C:\\WINDOWS\\system32\\msiexec.exe' OR Image ILIKE '%C:\\WINDOWS\\SysWOW64\\msiexec.exe') AND (TargetFilename ILIKE 'C:\\Program Files\\PowerShell\\7\\pwsh.exe%' OR TargetFilename ILIKE 'C:\\Program Files\\PowerShell\\7-preview\\pwsh.exe%' OR TargetFilename ILIKE 'C:\\Program Files\\WindowsApps\\Microsoft.PowerShellPreview\\%')) OR (TargetFilename ILIKE '%C:\\Windows\\System32\\SecurityHealth\\%' AND TargetFilename ILIKE '%\\SecurityHealthSystray.exe' AND Image ILIKE '%\\SecurityHealthSetup.exe')))
