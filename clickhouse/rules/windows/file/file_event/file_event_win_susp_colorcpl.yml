rule: SELECT * FROM logs WHERE Image ILIKE '%\\colorcpl.exe' AND (NOT (TargetFilename ILIKE '%.icm' OR TargetFilename ILIKE '%.gmmp' OR TargetFilename ILIKE '%.cdmp' OR TargetFilename ILIKE '%.camp'))
