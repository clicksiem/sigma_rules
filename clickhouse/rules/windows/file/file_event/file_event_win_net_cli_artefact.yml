id: e0b06658-7d1d-4cd3-bf15-03467507ff7c
name: Suspicious DotNET CLR Usage Log Artifact
level: 8
size: '>0'
active: true
author:
- frack113, omkar72, oscd.community, Wojciech Lesicki
group: windows
tags:
- attack.stealth
- attack.t1218
rule: SELECT * FROM logs WHERE (TargetFilename ILIKE '%\\UsageLogs\\cmstp.exe.log' OR TargetFilename ILIKE '%\\UsageLogs\\cscript.exe.log' OR TargetFilename ILIKE '%\\UsageLogs\\mshta.exe.log' OR TargetFilename ILIKE '%\\UsageLogs\\msxsl.exe.log' OR TargetFilename ILIKE '%\\UsageLogs\\regsvr32.exe.log' OR TargetFilename ILIKE '%\\UsageLogs\\rundll32.exe.log' OR TargetFilename ILIKE '%\\UsageLogs\\svchost.exe.log' OR TargetFilename ILIKE '%\\UsageLogs\\wscript.exe.log' OR TargetFilename ILIKE '%\\UsageLogs\\wmic.exe.log') AND (NOT (ParentImage ILIKE '%\\MsiExec.exe' AND ParentCommandLine ILIKE '% -Embedding%' AND Image ILIKE '%\\rundll32.exe' AND (CommandLine ILIKE '%Temp%' AND CommandLine ILIKE '%zzzzInvokeManagedCustomActionOutOfProc%')))
