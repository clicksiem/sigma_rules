rule: SELECT * FROM logs WHERE TargetFilename ILIKE '%.evtx' AND (NOT (TargetFilename ILIKE 'C:\\Windows\\System32\\winevt\\Logs\\%' OR (TargetFilename ILIKE 'C:\\ProgramData\\Microsoft\\Windows\\Containers\\BaseImages\\%' AND TargetFilename ILIKE '%\\Windows\\System32\\winevt\\Logs\\')))
