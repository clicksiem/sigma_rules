id: 9b64de98-9db3-4033-bd7a-f51430105f00
name: Windows Terminal Profile Settings Modification By Uncommon Process
level: 5
size: '>0'
active: true
author:
- frack113, Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.privilege-escalation
- attack.persistence
