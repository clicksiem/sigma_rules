rule: SELECT * FROM logs WHERE (TargetFilename ILIKE '%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup%' AND TargetFilename ILIKE '%.lnk.{0AFACED1-E828-11D1-9187-B532F1E9575D}%') AND Image ILIKE '%\\explorer.exe'
