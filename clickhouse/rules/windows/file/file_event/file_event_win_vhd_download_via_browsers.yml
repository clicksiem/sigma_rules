id: 8468111a-ef07-4654-903b-b863a80bbc95
name: VHD Image Download Via Browser
level: 5
size: '>0'
active: true
author:
- frack113, Christopher Peacock '@securepeacock', SCYTHE '@scythe_io'
group: windows
tags:
- attack.resource-development
- attack.t1587.001
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\brave.exe' OR Image ILIKE '%\\chrome.exe' OR Image ILIKE '%\\firefox.exe' OR Image ILIKE '%\\iexplore.exe' OR Image ILIKE '%\\maxthon.exe' OR Image ILIKE '%\\MicrosoftEdge.exe' OR Image ILIKE '%\\msedge.exe' OR Image ILIKE '%\\msedgewebview2.exe' OR Image ILIKE '%\\opera.exe' OR Image ILIKE '%\\safari.exe' OR Image ILIKE '%\\seamonkey.exe' OR Image ILIKE '%\\vivaldi.exe' OR Image ILIKE '%\\whale.exe') AND TargetFilename ILIKE '%.vhd%'
