id: 654fcc6d-840d-4844-9b07-2c3300e54a26
name: Legitimate Application Dropped Archive
level: 8
size: '>0'
active: true
author:
- frack113, Florian Roth
group: windows
tags:
- attack.stealth
- attack.t1218
rule: SELECT * FROM logs WHERE (Image ILIKE '%\\winword.exe' OR Image ILIKE '%\\excel.exe' OR Image ILIKE '%\\powerpnt.exe' OR Image ILIKE '%\\msaccess.exe' OR Image ILIKE '%\\mspub.exe' OR Image ILIKE '%\\eqnedt32.exe' OR Image ILIKE '%\\visio.exe' OR Image ILIKE '%\\wordpad.exe' OR Image ILIKE '%\\wordview.exe' OR Image ILIKE '%\\certutil.exe' OR Image ILIKE '%\\certoc.exe' OR Image ILIKE '%\\CertReq.exe' OR Image ILIKE '%\\Desktopimgdownldr.exe' OR Image ILIKE '%\\esentutl.exe' OR Image ILIKE '%\\finger.exe' OR Image ILIKE '%\\notepad.exe' OR Image ILIKE '%\\AcroRd32.exe' OR Image ILIKE '%\\RdrCEF.exe' OR Image ILIKE '%\\mshta.exe' OR Image ILIKE '%\\hh.exe') AND (TargetFilename ILIKE '%.zip' OR TargetFilename ILIKE '%.rar' OR TargetFilename ILIKE '%.7z' OR TargetFilename ILIKE '%.diagcab' OR TargetFilename ILIKE '%.appx')
