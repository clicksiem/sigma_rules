id: 736ffa74-5f6f-44ca-94ef-1c0df4f51d2a
name: HackTool - CrackMapExec File Indicators
level: 8
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.credential-access
- attack.t1003.001
rule: SELECT * FROM logs WHERE TargetFilename ILIKE 'C:\\Windows\\Temp\\%' AND ((TargetFilename ILIKE '%\\temp.ps1' OR TargetFilename ILIKE '%\\msol.ps1') OR (match(TargetFilename, '\\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.txt$') OR match(TargetFilename, '\\[a-zA-Z]{8}\.tmp$')))
