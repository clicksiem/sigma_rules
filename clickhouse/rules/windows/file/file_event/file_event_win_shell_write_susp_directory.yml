id: 1277f594-a7d1-4f28-a2d3-73af5cbeab43
name: Windows Shell/Scripting Application File Write to Suspicious Folder
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.execution
- attack.t1059
rule: SELECT * FROM logs WHERE ((Image ILIKE '%\\bash.exe' OR Image ILIKE '%\\cmd.exe' OR Image ILIKE '%\\cscript.exe' OR Image ILIKE '%\\msbuild.exe' OR Image ILIKE '%\\powershell.exe' OR Image ILIKE '%\\pwsh.exe' OR Image ILIKE '%\\sh.exe' OR Image ILIKE '%\\wscript.exe') AND (TargetFilename ILIKE 'C:\\PerfLogs\\%' OR TargetFilename ILIKE 'C:\\Users\\Public\\%')) OR ((Image ILIKE '%\\certutil.exe' OR Image ILIKE '%\\forfiles.exe' OR Image ILIKE '%\\mshta.exe' OR Image ILIKE '%\\schtasks.exe' OR Image ILIKE '%\\scriptrunner.exe' OR Image ILIKE '%\\wmic.exe') AND (TargetFilename ILIKE '%C:\\PerfLogs\\%' OR TargetFilename ILIKE '%C:\\Users\\Public\\%' OR TargetFilename ILIKE '%C:\\Windows\\Temp\\%'))
