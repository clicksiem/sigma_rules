id: 1027d292-dd87-4a1a-8701-2abe04d7783c
name: PSScriptPolicyTest Creation By Uncommon Process
level: 5
size: '>0'
active: true
author:
- Nasreddine Bencherchali (Nextron Systems)
group: windows
tags:
- attack.stealth
rule: SELECT * FROM logs WHERE TargetFilename ILIKE '%\_\_PSScriptPolicyTest\_%' AND (NOT ((Image IN ('C:\\Program Files\\PowerShell\\7-preview\\pwsh.exe', 'C:\\Program Files\\PowerShell\\7\\pwsh.exe', 'C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell\_ise.exe', 'C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe', 'C:\\Windows\\SysWOW64\\WindowsPowerShell\\v1.0\\powershell\_ise.exe', 'C:\\Windows\\SysWOW64\\WindowsPowerShell\\v1.0\\powershell.exe')) OR ((Image ILIKE '%C:\\Program Files\\WindowsApps\\Microsoft.PowerShellPreview%' OR Image ILIKE '%\\AppData\\Local\\Microsoft\\WindowsApps\\Microsoft.PowerShellPreview%') AND Image ILIKE '%\\pwsh.exe') OR (Image IN ('C:\\Windows\\System32\\dsac.exe', 'C:\\Windows\\System32\\sdiagnhost.exe', 'C:\\Windows\\System32\\ServerManager.exe', 'C:\\Windows\\System32\\wsmprovhost.exe', 'C:\\Windows\\SysWOW64\\sdiagnhost.exe'))))
