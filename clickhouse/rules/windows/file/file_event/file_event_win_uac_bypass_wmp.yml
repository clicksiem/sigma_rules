rule: SELECT * FROM logs WHERE (TargetFilename ILIKE 'C:\\Users\\%' AND TargetFilename ILIKE '%\\AppData\\Local\\Temp\\OskSupport.dll') OR (Image ILIKE 'C:\\Windows\\system32\\DllHost.exe' AND TargetFilename ILIKE 'C:\\Program Files\\Windows Media Player\\osk.exe')
