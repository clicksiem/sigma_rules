rule: SELECT * FROM logs WHERE (TargetFilename ILIKE '%\\hive\_sam\_%' OR TargetFilename ILIKE '%\\SAM-2021-%' OR TargetFilename ILIKE '%\\SAM-2022-%' OR TargetFilename ILIKE '%\\SAM-2023-%' OR TargetFilename ILIKE '%\\SAM-haxx%' OR TargetFilename ILIKE '%\\Sam.save%') OR TargetFilename ILIKE 'C:\\windows\\temp\\sam'
