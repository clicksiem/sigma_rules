rule: SELECT * FROM logs WHERE (TargetFilename ILIKE '%\\Tomcat%' AND TargetFilename ILIKE '%\\logs\\%') AND (TargetFilename ILIKE '%catalina.%' OR TargetFilename ILIKE '%\_access\_log.%' OR TargetFilename ILIKE '%localhost.%')
