id: a18dd26b-6450-46de-8c91-9659150cf088
name: Potentially Suspicious GrantedAccess Flags On LSASS
level: 5
size: '>0'
active: true
author:
- Florian Roth, Roberto Rodriguez, Dimitrios Slamaris, Mark Russinovich, Thomas Patzke, Teymur Kheirkhabarov, Sherif Eldeeb, James Dickenson, Aleksey Potapov, oscd.community
group: windows
tags:
- attack.credential-access
- attack.t1003.001
- attack.s0002
rule: SELECT * FROM logs WHERE (TargetImage ILIKE '%\\lsass.exe' AND ((GrantedAccess ILIKE '%30' OR GrantedAccess ILIKE '%50' OR GrantedAccess ILIKE '%70' OR GrantedAccess ILIKE '%90' OR GrantedAccess ILIKE '%B0' OR GrantedAccess ILIKE '%D0' OR GrantedAccess ILIKE '%F0' OR GrantedAccess ILIKE '%18' OR GrantedAccess ILIKE '%38' OR GrantedAccess ILIKE '%58' OR GrantedAccess ILIKE '%78' OR GrantedAccess ILIKE '%98' OR GrantedAccess ILIKE '%B8' OR GrantedAccess ILIKE '%D8' OR GrantedAccess ILIKE '%F8' OR GrantedAccess ILIKE '%1A' OR GrantedAccess ILIKE '%3A' OR GrantedAccess ILIKE '%5A' OR GrantedAccess ILIKE '%7A' OR GrantedAccess ILIKE '%9A' OR GrantedAccess ILIKE '%BA' OR GrantedAccess ILIKE '%DA' OR GrantedAccess ILIKE '%FA' OR GrantedAccess ILIKE '%0x14C2') OR (GrantedAccess ILIKE '0x100000%' OR GrantedAccess ILIKE '0x1418%' OR GrantedAccess ILIKE '0x1438%' OR GrantedAccess ILIKE '0x143a%' OR GrantedAccess ILIKE '0x1f0fff%' OR GrantedAccess ILIKE '0x1f1fff%' OR GrantedAccess ILIKE '0x1f2fff%' OR GrantedAccess ILIKE '0x1f3fff%' OR GrantedAccess ILIKE '0x40%'))) AND (NOT ((SourceImage ILIKE '%:\\Program Files (x86)\\%' OR SourceImage ILIKE '%:\\Program Files\\%' OR SourceImage ILIKE '%:\\Windows\\System32\\%' OR SourceImage ILIKE '%:\\Windows\\SysWOW64\\%') OR (SourceImage ILIKE '%:\\ProgramData\\Microsoft\\Windows Defender\\%' AND SourceImage ILIKE '%\\MsMpEng.exe') OR ((CallTrace ILIKE '%|_:\\ProgramData\\Microsoft\\Windows Defender\\Definition Updates\\{%' AND CallTrace ILIKE '%}\\mpengine.dll+%') AND GrantedAccess='0x1418') OR (CallTrace ILIKE '%|c:\\program files\\windows defender\\mprtp.dll%' OR CallTrace ILIKE '%|c:\\program files\\windows defender\\MpClient.dll%') OR (SourceImage ILIKE '%\\explorer.exe' AND GrantedAccess='0x401'))) AND (NOT (SourceImage ILIKE '%:\\ProgramData\\MALWAREBYTES\\MBAMSERVICE\\ctlrupdate\\mbupdatr.exe' OR SourceImage ILIKE '%\\AppData\\Local\\Programs\\Microsoft VS Code\\Code.exe' OR (SourceImage ILIKE '%:\\ProgramData\\VMware\\VMware Tools\\%' AND SourceImage ILIKE '%\\vmtoolsd.exe') OR ((SourceImage ILIKE '%\\PROCEXP64.EXE' OR SourceImage ILIKE '%\\PROCEXP.EXE') AND GrantedAccess='0x40') OR (SourceImage ILIKE '%\\MBAMInstallerService.exe' AND GrantedAccess='0x40') OR ((SourceImage ILIKE '%\\aurora-agent-64.exe' OR SourceImage ILIKE '%\\aurora-agent.exe' OR SourceImage ILIKE '%\\thor.exe' OR SourceImage ILIKE '%\\thor64.exe') AND GrantedAccess='0x40') OR ((SourceImage ILIKE '%\\handle.exe' OR SourceImage ILIKE '%\\handle64.exe') AND GrantedAccess='0x40') OR (SourceImage ILIKE '%\\AppData\\Local\\WebEx\\WebexHost.exe' AND GrantedAccess='0x401') OR SourceImage ILIKE '%\\SteamLibrary\\steamapps\\%'))
