id: d29ada0f-af45-4f27-8f32-f7b77c3dbc4e
name: HackTool - SysmonEnte Execution
level: 8
size: '>0'
active: true
author:
- Florian Roth (Nextron Systems)
group: windows
tags:
- attack.defense-impairment
- attack.t1685.001
rule: SELECT * FROM logs WHERE (((TargetImage ILIKE '%:\\Windows\\Sysmon.exe%' OR TargetImage ILIKE '%:\\Windows\\Sysmon64.exe%') AND GrantedAccess='0x1400') AND (NOT ((SourceImage ILIKE '%:\\Program Files (x86)\\%' OR SourceImage ILIKE '%:\\Program Files\\%' OR SourceImage ILIKE '%:\\Windows\\System32\\%' OR SourceImage ILIKE '%:\\Windows\\SysWOW64\\%') OR (SourceImage ILIKE '%:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\%' AND SourceImage ILIKE '%\\MsMpEng.exe')))) OR CallTrace='Ente'
