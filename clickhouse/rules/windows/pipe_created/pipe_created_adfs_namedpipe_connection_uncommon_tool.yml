id: 1ea13e8c-03ea-409b-877d-ce5c3d2c1cb3
name: ADFS Database Named Pipe Connection By Uncommon Tool
level: 5
size: '>0'
active: true
author:
- Roberto Rodriguez @Cyb3rWard0g
group: windows
tags:
- attack.collection
- attack.t1005
rule: SELECT * FROM logs WHERE PipeName ILIKE '\\MICROSOFT##WID\\tsql\\query' AND (NOT (Image ILIKE '%:\\Windows\\System32\\mmc.exe' OR Image ILIKE '%:\\Windows\\system32\\svchost.exe' OR Image ILIKE '%:\\Windows\\System32\\wsmprovhost.exe' OR Image ILIKE '%:\\Windows\\SysWOW64\\mmc.exe' OR Image ILIKE '%:\\Windows\\SysWOW64\\wsmprovhost.exe' OR Image ILIKE '%:\\Windows\\WID\\Binn\\sqlwriter.exe' OR Image ILIKE '%\\AzureADConnect.exe' OR Image ILIKE '%\\Microsoft.Identity.Health.Adfs.PshSurrogate.exe' OR Image ILIKE '%\\Microsoft.IdentityServer.ServiceHost.exe' OR Image ILIKE '%\\Microsoft.Tri.Sensor.exe' OR Image ILIKE '%\\sqlservr.exe' OR Image ILIKE '%\\tssdis.exe'))
